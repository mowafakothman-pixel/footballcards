<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  color: #ccc;
}

.search {
  padding: 20px;
  background: white;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 600px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.sell {
  background: #111;
  color: white;
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 25px;
}

.sell h2 {
  margin-top: 0;
}

.sell input {
  width: 100%;
  max-width: 500px;
  margin: 5px;
  padding: 12px;
  border: none;
  border-radius: 9px;
}

.sell button {
  border: none;
  background: white;
  color: #111;
  padding: 12px 20px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.section {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.card-image {
  width: 100%;
  height: 200px;
  border-radius: 14px;
  background: #f1f1f1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 12px;
}

.card h3 {
  margin-bottom: 6px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 10px 0;
}

.info {
  color: #666;
}

.card button {
  width: 100%;
  margin-top: 8px;
  border: none;
  padding: 11px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
  background: #111;
  color: white;
}

.card button.secondary {
  background: #f1f1f1;
  color: #111;
}

.card button.green {
  background: #16803c;
  color: white;
}

.card button.red {
  background: #c62828;
  color: white;
}

.request-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
}

.request-card {
  background: #f8f8f8;
  border-radius: 14px;
  padding: 14px;
  border: 1px solid #ddd;
}

.request-card img {
  width: 100%;
  height: 150px;
  object-fit: contain;
  background: white;
  border-radius: 10px;
}

.status {
  font-weight: bold;
  margin: 10px 0;
}

.status.pending {
  color: #d17b00;
}

.status.accepted {
  color: #16803c;
}

.status.rejected {
  color: #c62828;
}

.empty {
  color: #777;
  padding: 10px 0;
}

.user-box {
  text-align: center;
  margin-bottom: 20px;
}

.user-box input {
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 9px;
}

.user-box button {
  padding: 11px 16px;
  border: none;
  border-radius: 9px;
  background: #111;
  color: white;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="user-box">
  <p>👤 Dein Benutzername</p>
  <input id="username" type="text" placeholder="Benutzername">
  <button onclick="saveUsername()">Speichern</button>
  <p id="welcome"></p>
</div>

<div class="search">
  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Suche nach Spieler oder Verein..."
  >
</div>

<div class="container">

  <div class="sell">
    <h2>🎟️ Karte verkaufen</h2>
    <p>Stelle deine Fußballkarte schnell und einfach ein.</p>

    <form id="sellForm">
      <input id="player" type="text" placeholder="Spieler" required>
      <input id="club" type="text" placeholder="Verein" required>
      <input
        id="price"
        type="number"
        placeholder="Preis in €"
        min="0"
        step="0.01"
        required
      >
      <input id="image" type="file" accept="image/*" required>
      <br>
      <button type="submit">Karte einstellen</button>
    </form>
  </div>

  <div class="section">
    <h2>🔥 Aktuelle Karten</h2>
    <div class="cards" id="cards"></div>
  </div>

  <div class="section">
    <h2 id="favoriteTitle">❤️ Favoriten (0)</h2>
    <div class="cards" id="favoriteCards"></div>
  </div>

  <div class="section">
    <h2>🃏 Meine Karten</h2>
    <div class="cards" id="myCards"></div>
  </div>

  <div class="section">
    <h2 id="requestTitle">📩 Meine Kaufanfragen (0)</h2>
    <div class="request-grid" id="purchaseRequests"></div>
  </div>

  <div class="section">
    <h2 id="sellerRequestTitle">📥 Anfragen für meine Karten (0)</h2>
    <div class="request-grid" id="sellerRequests"></div>
  </div>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

const sellForm = document.getElementById("sellForm");
const searchInput = document.getElementById("searchInput");
const cards = document.getElementById("cards");
const myCards = document.getElementById("myCards");
const favoriteCards = document.getElementById("favoriteCards");
const purchaseRequests = document.getElementById("purchaseRequests");
const sellerRequests = document.getElementById("sellerRequests");

function getCards() {
  return JSON.parse(localStorage.getItem("footballCards")) || [];
}

function getFavorites() {
  return JSON.parse(localStorage.getItem("favoriteCards")) || [];
}

function getRequests() {
  return JSON.parse(localStorage.getItem("purchaseRequests")) || [];
}

function getUsername() {
  return localStorage.getItem("pixelUsername") || "";
}

function saveUsername() {
  const username = document.getElementById("username").value.trim();

  if (!username) {
    alert("Bitte gib einen Benutzernamen ein.");
    return;
  }

  localStorage.setItem("pixelUsername", username);
  updateUsername();
  alert("Benutzername gespeichert!");
}

function updateUsername() {
  const username = getUsername();

  document.getElementById("username").value = username;

  if (username) {
    document.getElementById("welcome").textContent =
      "👋 Willkommen, " + username + "!";
  }
}

function createCard(card) {

  const item = document.createElement("div");
  item.className = "card";

  const favorites = getFavorites();

  const isFavorite = favorites.some(fav =>
    fav.id === card.id
  );

  const requests = getRequests();

  const activeRequest = requests.find(request =>
    request.cardId === card.id &&
    request.status !== "rejected"
  );

  let buyButton = "";

  if (activeRequest) {

    if (activeRequest.status === "accepted") {
      buyButton = `
        <button class="secondary" disabled>
          ✅ Kauf angenommen
        </button>
      `;
    } else {
      buyButton = `
        <button class="secondary" disabled>
          🕐 Anfrage gesendet
        </button>
      `;
    }

  } else {

    buyButton = `
      <button onclick="buyCard('${card.id}')">
        🛒 Kaufen
      </button>
    `;
  }

  item.innerHTML = `
    <div class="card-image">
      <img src="${card.image}" alt="${card.player}">
    </div>

    <h3>${card.player}</h3>

    <p class="info">${card.club}</p>

    <p class="price">${card.price} €</p>

    <button onclick="showCard('${card.id}')">
      👀 Karte ansehen
    </button>

    ${buyButton}

    <button
      class="secondary"
      onclick="toggleFavorite('${card.id}')"
    >
      ${isFavorite ? "❤️ Favorisiert" : "♡ Favorit"}
    </button>
  `;

  cards.appendChild(item);
}

function loadCards() {

  cards.innerHTML = "";

  const savedCards = getCards();

  const searchText =
    searchInput.value.toLowerCase().trim();

  const filteredCards = savedCards.filter(card =>
    card.player.toLowerCase().includes(searchText) ||
    card.club.toLowerCase().includes(searchText)
  );

  if (filteredCards.length === 0) {
    cards.innerHTML =
      "<p class='empty'>Keine Karten gefunden.</p>";
    return;
  }

  filteredCards.forEach(card => {
    createCard(card);
  });
}

function loadMyCards() {

  myCards.innerHTML = "";

  const savedCards = getCards();

  if (savedCards.length === 0) {
    myCards.innerHTML =
      "<p class='empty'>Noch keine eigenen Karten eingestellt.</p>";
    return;
  }

  savedCards.forEach(card => {

    const item = document.createElement("div");
    item.className = "card";

    item.innerHTML = `
      <div class="card-image">
        <img src="${card.image}" alt="${card.player}">
      </div>

      <h3>${card.player}</h3>

      <p class="info">${card.club}</p>

      <p class="price">${card.price} €</p>

      <button
        class="red"
        onclick="deleteCard('${card.id}')"
      >
        🗑️ Karte löschen
      </button>
    `;

    myCards.appendChild(item);
  });
}

function loadFavorites() {

  const favorites = getFavorites();

  document.getElementById("favoriteTitle").textContent =
    "❤️ Favoriten (" + favorites.length + ")";

  favoriteCards.innerHTML = "";

  if (favorites.length === 0) {
    favoriteCards.innerHTML =
      "<p class='empty'>Noch keine Favoriten gespeichert.</p>";
    return;
  }

  favorites.forEach(favorite => {

    const item = document.createElement("div");
    item.className = "card";

    item.innerHTML = `
      <div class="card-image">
        <img src="${favorite.image}" alt="${favorite.player}">
      </div>

      <h3>${favorite.player}</h3>

      <p class="info">${favorite.club}</p>

      <p class="price">${favorite.price} €</p>

      <button onclick="showCard('${favorite.id}')">
        👀 Karte ansehen
      </button>

      <button
        class="secondary"
        onclick="toggleFavorite('${favorite.id}')"
      >
        ❤️ Entfernen
      </button>
    `;

    favoriteCards.appendChild(item);
  });
}

sellForm.addEventListener("submit", function(event) {

  event.preventDefault();

  const player =
    document.getElementById("player").value.trim();

  const club =
    document.getElementById("club").value.trim();

  const price =
    document.getElementById("price").value;

  const image =
    document.getElementById("image").files[0];

  if (!image) {
    alert("Bitte wähle ein Foto aus!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {

    const img = new Image();

    img.onload = function() {

      const canvas =
        document.createElement("canvas");

      const maxSize = 700;

      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {

        height =
          height * (maxSize / width);

        width = maxSize;

      } else if (height > maxSize) {

        width =
          width * (maxSize / height);

        height = maxSize;
      }

      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      const imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.6
        );

      const savedCards = getCards();

      const newCard = {

        id:
          Date.now().toString() +
          Math.random().toString(36).substring(2),

        player: player,
        club: club,
        price: price,
        image: imageData
      };

      savedCards.unshift(newCard);

      try {

        localStorage.setItem(
          "footballCards",
          JSON.stringify(savedCards)
        );

      } catch(error) {

        alert(
          "Der Speicher ist voll. Bitte lösche zuerst eine Karte."
        );

        return;
      }

      sellForm.reset();

      loadCards();
      loadMyCards();

      alert(
        "🎉 Deine Karte wurde eingestellt!"
      );
    };

    img.src = reader.result;
  };

  reader.readAsDataURL(image);
});

function deleteCard(cardId) {

  if (!confirm("Möchtest du diese Karte wirklich löschen?")) {
    return;
  }

  let savedCards = getCards();

  savedCards =
    savedCards.filter(card =>
      card.id !== cardId
    );

  localStorage.setItem(
    "footballCards",
    JSON.stringify(savedCards)
  );

  let favorites = getFavorites();

  favorites =
    favorites.filter(favorite =>
      favorite.id !== cardId
    );

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(favorites)
  );

  loadCards();
  loadMyCards();
  loadFavorites();
}

function toggleFavorite(cardId) {

  const savedCards = getCards();

  const card =
    savedCards.find(card =>
      card.id === cardId
    );

  if (!card) {
    return;
  }

  let favorites = getFavorites();

  const existingIndex =
    favorites.findIndex(favorite =>
      favorite.id === cardId
    );

  if (existingIndex !== -1) {

    favorites.splice(existingIndex, 1);

    alert("Aus Favoriten entfernt!");

  } else {

    favorites.push(card);

    alert("❤️ Zu Favoriten hinzugefügt!");
  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(favorites)
  );

  loadFavorites();
  loadCards();
}

function buyCard(cardId) {

  const savedCards = getCards();

  const card =
    savedCards.find(card =>
      card.id === cardId
    );

  if (!card) {
    alert("Diese Karte wurde nicht gefunden.");
    return;
  }

  const requests = getRequests();

  const existingRequest =
    requests.find(request =>
      request.cardId === cardId &&
      request.status !== "rejected"
    );

  if (existingRequest) {

    if (existingRequest.status === "accepted") {

      alert(
        "Diese Karte wurde bereits angenommen!"
      );

    } else {

      alert(
        "🕐 Du hast diese Karte bereits angefragt!"
      );
    }

    return;
  }

  const confirmBuy = confirm(
    "Möchtest du diese Karte kaufen?\n\n" +
    card.player +
    " – " +
    card.club +
    "\nPreis: " +
    card.price +
    " €"
  );

  if (!confirmBuy) {
    return;
  }

  const username =
    getUsername() || "Unbekannter Käufer";

  requests.push({

    id:
      Date.now().toString() +
      Math.random().toString(36).substring(2),

    cardId: card.id,

    player: card.player,
    club: card.club,
    price: card.price,
    image: card.image,

    buyer: username,

    status: "pending"
  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadPurchaseRequests();
  loadSellerRequests();
  loadCards();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );
}

function loadPurchaseRequests() {

  const requests = getRequests();

  document.getElementById("requestTitle").textContent =
    "📩 Meine Kaufanfragen (" +
    requests.length +
    ")";

  purchaseRequests.innerHTML = "";

  if (requests.length === 0) {

    purchaseRequests.innerHTML =
      "<p class='empty'>Noch keine Kaufanfragen gesendet.</p>";

    return;
  }

  requests.forEach(request => {

    const item =
      document.createElement("div");

    item.className = "request-card";

    let statusText = "";
    let statusClass = "";

    if (request.status === "pending") {

      statusText = "🕐 Offen";
      statusClass = "pending";

    } else if (request.status === "accepted") {

      statusText = "✅ Angenommen";
      statusClass = "accepted";

    } else {

      statusText = "❌ Abgelehnt";
      statusClass = "rejected";
    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>${request.player}</h3>

      <p class="info">
        ${request.club}
      </p>

      <p class="price">
        ${request.price} €
      </p>

      <p class="status ${statusClass}">
        ${statusText}
      </p>

      ${
        request.status === "pending"
          ? "<p>Die Anfrage wartet auf eine Antwort.</p>"
          : ""
      }

      ${
        request.status === "accepted"
          ? "<p>🎉 Der Verkäufer hat deine Anfrage angenommen!</p>"
          : ""
      }

      ${
        request.status === "rejected"
          ? "<p>Die Anfrage wurde abgelehnt. Du kannst erneut anfragen.</p>"
          : ""
      }
    `;

    purchaseRequests.appendChild(item);
  });
}

function loadSellerRequests() {

  const requests = getRequests();

  const cards = getCards();

  const myCardIds =
    cards.map(card => card.id);

  const incomingRequests =
    requests.filter(request =>
      myCardIds.includes(request.cardId)
    );

  document.getElementById(
    "sellerRequestTitle"
  ).textContent =
    "📥 Anfragen für meine Karten (" +
    incomingRequests.length +
    ")";

  sellerRequests.innerHTML = "";

  if (incomingRequests.length === 0) {

    sellerRequests.innerHTML =
      "<p class='empty'>Noch keine Anfragen für deine Karten.</p>";

    return;
  }

  incomingRequests.forEach(request => {

    const item =
      document.createElement("div");

    item.className = "request-card";

    let statusText = "";
    let statusClass = "";

    if (request.status === "pending") {

      statusText = "🕐 Offen";
      statusClass = "pending";

    } else if (request.status === "accepted") {

      statusText = "✅ Angenommen";
      statusClass = "accepted";

    } else {

      statusText = "❌ Abgelehnt";
      statusClass = "rejected";
    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>${request.player}</h3>

      <p class="info">
        ${request.club}
      </p>

      <p class="price">
        ${request.price} €
      </p>

      <p>
        👤 Käufer: ${request.buyer}
      </p>

      <p class="status ${statusClass}">
        ${statusText}
      </p>

      ${
        request.status === "pending"
        ? `
          <button
            class="green"
            onclick="acceptRequest('${request.id}')"
          >
            ✅ Annehmen
          </button>

          <button
            class="red"
            onclick="rejectRequest('${request.id}')"
          >
            ❌ Ablehnen
          </button>
        `
        : ""
      }

    `;

    sellerRequests.appendChild(item);
  });
}

function acceptRequest(requestId) {

  const requests = getRequests();

  const request =
    requests.find(item =>
      item.id === requestId
    );

  if (!request) {
    return;
  }

  request.status = "accepted";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadPurchaseRequests();
  loadSellerRequests();
  loadCards();

  alert(
    "✅ Kaufanfrage wurde angenommen!"
  );
}

function rejectRequest(requestId) {

  const requests = getRequests();

  const request =
    requests.find(item =>
      item.id === requestId
    );

  if (!request) {
    return;
  }

  if (
    !confirm(
      "Möchtest du diese Anfrage wirklich ablehnen?"
    )
  ) {
    return;
  }

  request.status = "rejected";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadPurchaseRequests();
  loadSellerRequests();
  loadCards();

  alert(
    "❌ Kaufanfrage wurde abgelehnt."
  );
}

function showCard(cardId) {

  const savedCards = getCards();

  const card =
    savedCards.find(item =>
      item.id === cardId
    );

  if (!card) {
    return;
  }

  const overlay =
    document.createElement("div");

  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background =
    "rgba(0,0,0,0.7)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "9999";
  overlay.style.padding = "20px";

  overlay.innerHTML = `

    <div style="
      background:white;
      padding:20px;
      border-radius:18px;
      width:100%;
      max-width:400px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        alt="${card.player}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:12px;
        "
      >

      <h2>${card.player}</h2>

      <p>${card.club}</p>

      <p style="
        font-size:24px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <button
        id="closeCard"
        style="
          border:none;
          background:#111;
          color:white;
          padding:12px 22px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>
  `;

  document.body.appendChild(overlay);

  document.getElementById(
    "closeCard"
  ).onclick = function() {

    overlay.remove();
  };
}

searchInput.addEventListener(
  "input",
  function() {
    loadCards();
  }
);

updateUsername();
loadCards();
loadMyCards();
loadFavorites();
loadPurchaseRequests();
loadSellerRequests();

</script>

</body>
</html>
