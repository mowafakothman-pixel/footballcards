<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{margin:0;font-size:28px}
header p{margin:6px 0;color:#ccc}

.profile{
  background:white;
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid #ddd;
}

.profile input{
  padding:10px;
  border:1px solid #ddd;
  border-radius:9px;
}

.profile button{
  border:none;
  background:#111;
  color:white;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
}

.search{
  padding:20px;
  background:white;
  text-align:center;
}

.search input{
  width:90%;
  max-width:600px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.sell{
  background:#111;
  color:white;
  padding:18px;
  border-radius:14px;
  text-align:center;
  margin-bottom:20px;
}

.sell input{
  padding:11px;
  margin:4px;
  border-radius:8px;
  border:none;
}

.sell button{
  border:none;
  background:white;
  color:#111;
  padding:11px 18px;
  border-radius:9px;
  font-weight:bold;
}

.nav{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.nav button{
  border:none;
  background:white;
  padding:14px 8px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.nav button.active{
  background:#111;
  color:white;
}

.page{display:none}
.page.active{display:block}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.card{
  background:white;
  border-radius:18px;
  padding:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.card-image{
  width:100%;
  height:200px;
  border-radius:14px;
  background:#f1f1f1;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}

.info{color:#666}

.card button{
  width:100%;
  margin-top:8px;
  border:none;
  padding:11px;
  border-radius:9px;
  background:#111;
  color:white;
  font-weight:bold;
}

.card button.gray{
  background:#eee;
  color:#111;
}

.card button.green,
.request button.green{
  background:#16803c;
  color:white;
}

.card button.red,
.request button.red{
  background:#c62828;
  color:white;
}

.request{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.request img{
  width:80px;
  height:80px;
  object-fit:contain;
  border-radius:10px;
  background:#f1f1f1;
  float:left;
  margin-right:14px;
}

.request::after{
  content:"";
  display:block;
  clear:both;
}

.request button{
  border:none;
  padding:10px 15px;
  border-radius:9px;
  font-weight:bold;
  margin:5px 6px 0 0;
}

.pending{color:#d17b00;font-weight:bold}
.accepted{color:#16803c;font-weight:bold}
.rejected{color:#c62828;font-weight:bold}
.empty{color:#777}

.profile-card{
  background:white;
  padding:20px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.profile-name{
  font-size:25px;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:600px){
  .nav{grid-template-columns:repeat(2,1fr)}

  .sell input{
    width:100%;
    margin:5px 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="profile">

  <strong id="welcome">
    👤 Kein Benutzer
  </strong>

  <input
    id="usernameInput"
    type="text"
    maxlength="20"
    placeholder="Benutzername"
  >

  <button onclick="saveUsername()">
    Profil speichern
  </button>

</div>

<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Suche nach Spieler oder Verein..."
  >

</div>

<div class="container">

<div class="sell">

<h2>🎟️ Karte verkaufen</h2>

<p>
Stelle deine Fußballkarte schnell und einfach ein.
</p>

<form id="sellForm">

<input
id="player"
type="text"
placeholder="Spieler"
required
>

<input
id="club"
type="text"
placeholder="Verein"
required
>

<input
id="price"
type="number"
placeholder="Preis in €"
min="0"
step="0.01"
required
>

<input
id="image"
type="file"
accept="image/*"
required
>

<button type="submit">
Karte einstellen
</button>

</form>

</div>

<div class="nav">

<button
id="navCards"
class="active"
onclick="showPage('cardsPage','navCards')"
>
🔥 Karten
</button>

<button
id="navFavorites"
onclick="showPage('favoritesPage','navFavorites')"
>
❤️ Favoriten
</button>

<button
id="navMine"
onclick="showPage('minePage','navMine')"
>
🃏 Meine Karten
</button>

<button
id="navRequests"
onclick="showPage('requestsPage','navRequests')"
>
📩 Anfragen
</button>

</div>

<div id="cardsPage" class="page active">

<h2>🔥 Aktuelle Karten</h2>

<div id="cards" class="cards"></div>

</div>

<div id="favoritesPage" class="page">

<h2 id="favoriteTitle">
❤️ Favoriten (0)
</h2>

<div id="favoriteCards" class="cards"></div>

</div>

<div id="minePage" class="page">

<h2>🃏 Meine Karten</h2>

<div id="myCards" class="cards"></div>

</div>

<div id="requestsPage" class="page">

<h2 id="requestTitle">
📩 Meine Kaufanfragen (0)
</h2>

<div id="purchaseRequests"></div>

<h2 id="sellerRequestTitle">
📥 Anfragen für meine Karten (0)
</h2>

<div id="sellerRequests"></div>

</div>

</div>

<footer>
© 2026 Pixel Cards
</footer>

<script>

const sellForm =
document.getElementById("sellForm");

const searchInput =
document.getElementById("searchInput");

const cards =
document.getElementById("cards");

const favoriteCards =
document.getElementById("favoriteCards");

const myCards =
document.getElementById("myCards");

const purchaseRequests =
document.getElementById("purchaseRequests");

const sellerRequests =
document.getElementById("sellerRequests");


/* =========================
   BENUTZERPROFIL
========================= */

function getUsername(){

  return localStorage.getItem("pixelUsername") || "";

}


function saveUsername(){

  const input =
    document.getElementById("usernameInput");

  const name =
    input.value.trim();

  if(!name){

    alert("Bitte gib einen Benutzernamen ein.");

    return;
  }

  localStorage.setItem(
    "pixelUsername",
    name
  );

  updateProfile();

  alert(
    "👤 Profil gespeichert!"
  );

}


function updateProfile(){

  const name =
    getUsername();

  const welcome =
    document.getElementById("welcome");

  const input =
    document.getElementById("usernameInput");

  if(name){

    welcome.textContent =
      "👤 " + name;

    input.value = name;

  }else{

    welcome.textContent =
      "👤 Kein Benutzer";

  }

}


/* =========================
   DATEN
========================= */

function getCards(){

  return JSON.parse(
    localStorage.getItem(
      "footballCards"
    )
  ) || [];

}


function getFavorites(){

  return JSON.parse(
    localStorage.getItem(
      "favoriteCards"
    )
  ) || [];

}


function getRequests(){

  const requests =
    JSON.parse(
      localStorage.getItem(
        "purchaseRequests"
      )
    ) || [];

  let changed = false;

  requests.forEach(request => {

    if(!request.status){

      request.status =
        "pending";

      changed = true;

    }

  });

  if(changed){

    localStorage.setItem(
      "purchaseRequests",
      JSON.stringify(requests)
    );

  }

  return requests;

}


/* =========================
   NAVIGATION
========================= */

function showPage(
  pageId,
  buttonId
){

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove(
        "active"
      )
    );

  document
    .getElementById(pageId)
    .classList.add("active");

  document
    .querySelectorAll(".nav button")
    .forEach(button =>
      button.classList.remove(
        "active"
      )
    );

  document
    .getElementById(buttonId)
    .classList.add("active");

}


/* =========================
   KARTEN
========================= */

function createCard(card){

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "card";

  const username =
    getUsername();

  const favorites =
    getFavorites();

  const favorite =
    favorites.find(
      f => f.id === card.id
    );

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.cardId === card.id &&
        r.buyer === username &&
        r.status !== "rejected"
    );

  let buyButton = "";

  if(card.owner === username){

    buyButton = `
      <button
        class="gray"
        disabled
      >
        🏷️ Deine Karte
      </button>
    `;

  }else if(!username){

    buyButton = `
      <button
        onclick="needUsername()"
      >
        🛒 Kaufen
      </button>
    `;

  }else if(!request){

    buyButton = `
      <button
        onclick="buyCard('${card.id}')"
      >
        🛒 Kaufen
      </button>
    `;

  }else if(
    request.status === "pending"
  ){

    buyButton = `
      <button
        class="gray"
        disabled
      >
        🕐 Anfrage gesendet
      </button>
    `;

  }else{

    buyButton = `
      <button
        class="gray"
        disabled
      >
        ✅ Angenommen
      </button>
    `;

  }

  item.innerHTML = `

    <div class="card-image">

      <img
        src="${card.image}"
        alt="${card.player}"
      >

    </div>

    <h3>
      ${card.player}
    </h3>

    <p class="info">
      ${card.club}
    </p>

    <p class="price">
      ${card.price} €
    </p>

    <p class="info">
      👤 ${card.owner || "Verkäufer"}
    </p>

    <button
      onclick="showCard('${card.id}')"
    >
      👀 Karte ansehen
    </button>

    ${buyButton}

    <button
      class="gray"
      onclick="toggleFavorite('${card.id}')"
    >
      ${
        favorite
        ? "❤️ Favorisiert"
        : "♡ Favorit"
      }
    </button>

  `;

  cards.appendChild(item);

}


function loadCards(){

  cards.innerHTML = "";

  const savedCards =
    getCards();

  const text =
    searchInput.value
      .toLowerCase()
      .trim();

  const filtered =
    savedCards.filter(card =>

      card.player
        .toLowerCase()
        .includes(text)

      ||

      card.club
        .toLowerCase()
        .includes(text)

    );

  if(!filtered.length){

    cards.innerHTML =
      "<p class='empty'>Keine Karten gefunden.</p>";

    return;

  }

  filtered.forEach(
    card => createCard(card)
  );

}


/* =========================
   KARTE EINSTELLEN
========================= */

sellForm.addEventListener(
  "submit",
  function(event){

    event.preventDefault();

    const username =
      getUsername();

    if(!username){

      alert(
        "👤 Bitte zuerst einen Benutzernamen speichern."
      );

      return;
    }

    const player =
      document
        .getElementById("player")
        .value
        .trim();

    const club =
      document
        .getElementById("club")
        .value
        .trim();

    const price =
      document
        .getElementById("price")
        .value;

    const image =
      document
        .getElementById("image")
        .files[0];

    if(!image){

      alert(
        "Bitte wähle ein Foto aus!"
      );

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(){

        const img =
          new Image();

        img.onload =
          function(){

            const canvas =
              document.createElement(
                "canvas"
              );

            const maxSize = 700;

            let width =
              img.width;

            let height =
              img.height;

            if(
              width > height &&
              width > maxSize
            ){

              height =
                height *
                (maxSize / width);

              width =
                maxSize;

            }else if(
              height > maxSize
            ){

              width =
                width *
                (maxSize / height);

              height =
                maxSize;

            }

            canvas.width =
              width;

            canvas.height =
              height;

            const ctx =
              canvas.getContext(
                "2d"
              );

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            const imageData =
              canvas.toDataURL(
                "image/jpeg",
                0.6
              );

            const savedCards =
              getCards();

            savedCards.unshift({

              id:
                Date.now() +
                "-" +
                Math.random()
                  .toString(36)
                  .substring(2),

              player:
                player,

              club:
                club,

              price:
                price,

              image:
                imageData,

              owner:
                username

            });

            localStorage.setItem(
              "footballCards",
              JSON.stringify(
                savedCards
              )
            );

            sellForm.reset();

            loadCards();
            loadMyCards();

            alert(
              "🎉 Karte wurde eingestellt!"
            );

          };

        img.src =
          reader.result;

      };

    reader.readAsDataURL(
      image
    );

  }
);


/* =========================
   MEINE KARTEN
========================= */

function loadMyCards(){

  myCards.innerHTML = "";

  const username =
    getUsername();

  const savedCards =
    getCards().filter(
      card =>
        card.owner === username
    );

  if(!username){

    myCards.innerHTML =
      "<p class='empty'>Bitte zuerst einen Benutzernamen speichern.</p>";

    return;
  }

  if(!savedCards.length){

    myCards.innerHTML =
      "<p class='empty'>Du hast noch keine Karten eingestellt.</p>";

    return;
  }

  savedCards.forEach(card => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "card";

    item.innerHTML = `

      <div class="card-image">

        <img
          src="${card.image}"
          alt="${card.player}"
        >

      </div>

      <h3>
        ${card.player}
      </h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button
        class="red"
        onclick="deleteCard('${card.id}')"
      >
        🗑️ Löschen
      </button>

    `;

    myCards.appendChild(item);

  });

}


function deleteCard(cardId){

  if(
    !confirm(
      "Karte wirklich löschen?"
    )
  ){

    return;
  }

  let savedCards =
    getCards();

  savedCards =
    savedCards.filter(
      card =>
        card.id !== cardId
    );

  localStorage.setItem(
    "footballCards",
    JSON.stringify(
      savedCards
    )
  );

  loadCards();
  loadMyCards();

}


/* =========================
   FAVORITEN
========================= */

function toggleFavorite(cardId){

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if(!card) return;

  let favorites =
    getFavorites();

  const index =
    favorites.findIndex(
      f => f.id === cardId
    );

  if(index !== -1){

    favorites.splice(
      index,
      1
    );

    alert(
      "❤️ Aus Favoriten entfernt!"
    );

  }else{

    favorites.push(card);

    alert(
      "❤️ Zu Favoriten hinzugefügt!"
    );

  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(
      favorites
    )
  );

  loadFavorites();
  loadCards();

}


function loadFavorites(){

  const favorites =
    getFavorites();

  document
    .getElementById(
      "favoriteTitle"
    )
    .textContent =
      "❤️ Favoriten (" +
      favorites.length +
      ")";

  favoriteCards.innerHTML = "";

  if(!favorites.length){

    favoriteCards.innerHTML =
      "<p class='empty'>Noch keine Favoriten.</p>";

    return;
  }

  favorites.forEach(card => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "card";

    item.innerHTML = `

      <div class="card-image">

        <img
          src="${card.image}"
          alt="${card.player}"
        >

      </div>

      <h3>
        ${card.player}
      </h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button
        onclick="showCard('${card.id}')"
      >
        👀 Karte ansehen
      </button>

      <button
        class="gray"
        onclick="toggleFavorite('${card.id}')"
      >
        ❤️ Entfernen
      </button>

    `;

    favoriteCards.appendChild(
      item
    );

  });

}


/* =========================
   KAUFANFRAGE
========================= */

function buyCard(cardId){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;
  }

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if(!card) return;

  if(card.owner === username){

    alert(
      "❌ Du kannst deine eigene Karte nicht kaufen."
    );

    return;
  }

  const requests =
    getRequests();

  const existing =
    requests.find(
      r =>
        r.cardId === cardId &&
        r.buyer === username &&
        r.status !== "rejected"
    );

  if(existing){

    alert(
      existing.status === "accepted"
      ? "✅ Diese Anfrage wurde bereits angenommen!"
      : "🕐 Du hast diese Karte bereits angefragt!"
    );

    return;
  }

  const confirmBuy =
    confirm(

      "Möchtest du diese Karte kaufen?\n\n" +

      card.player +
      " – " +
      card.club +

      "\nPreis: " +
      card.price +
      " €"

    );

  if(!confirmBuy) return;

  requests.push({

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      username,

    seller:
      card.owner,

    status:
      "pending"

  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  showPage(
    "requestsPage",
    "navRequests"
  );

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}


/* =========================
   KAUFANFRAGEN
========================= */

function loadPurchaseRequests(){

  const username =
    getUsername();

  const requests =
    getRequests().filter(
      request =>
        request.buyer === username
    );

  document
    .getElementById(
      "requestTitle"
    )
    .textContent =
      "📩 Meine Kaufanfragen (" +
      requests.length +
      ")";

  purchaseRequests.innerHTML = "";

  if(!requests.length){

    purchaseRequests.innerHTML =
      "<p class='empty'>Noch keine Kaufanfragen.</p>";

    return;
  }

  requests.forEach(request => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "request";

    let status;

    if(
      request.status ===
      "accepted"
    ){

      status =
        "<span class='accepted'>✅ Angenommen</span>";

    }else if(
      request.status ===
      "rejected"
    ){

      status =
        "<span class='rejected'>❌ Abgelehnt</span>";

    }else{

      status =
        "<span class='pending'>🕐 Offen</span>";

    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>
        ${request.player}
      </h3>

      <p>
        ${request.club}
      </p>

      <p>
        ${request.price} €
      </p>

      <p>
        Verkäufer:
        👤 ${request.seller || "Verkäufer"}
      </p>

      <p>
        ${status}
      </p>

    `;

    purchaseRequests.appendChild(
      item
    );

  });

}


/* =========================
   VERKÄUFER-ANFRAGEN
========================= */

function loadSellerRequests(){

  const username =
    getUsername();

  const requests =
    getRequests().filter(
      request =>
        request.seller === username
    );

  document
    .getElementById(
      "sellerRequestTitle"
    )
    .textContent =
      "📥 Anfragen für meine Karten (" +
      requests.length +
      ")";

  sellerRequests.innerHTML = "";

  if(!requests.length){

    sellerRequests.innerHTML =
      "<p class='empty'>Noch keine Anfragen für deine Karten.</p>";

    return;
  }

  requests.forEach(request => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "request";

    let status;

    if(
      request.status ===
      "accepted"
    ){

      status =
        "<span class='accepted'>✅ Angenommen</span>";

    }else if(
      request.status ===
      "rejected"
    ){

      status =
        "<span class='rejected'>❌ Abgelehnt</span>";

    }else{

      status =
        "<span class='pending'>🕐 Offen</span>";

    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>
        ${request.player}
      </h3>

      <p>
        Käufer:
        👤 ${request.buyer || "Käufer"}
      </p>

      <p>
        ${request.price} €
      </p>

      <p>
        ${status}
      </p>

      ${
        request.status === "pending"
        ?

        `

        <button
          class="green"
          onclick="acceptRequest('${request.id}')"
        >
          ✅ Annehmen
        </button>

        <button
          class="red"
          onclick="rejectRequest('${request.id}')"
        >
          ❌ Ablehnen
        </button>

        `

        :

        ""
      }

    `;

    sellerRequests.appendChild(
      item
    );

  });

}


function acceptRequest(
  requestId
){

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if(!request) return;

  request.status =
    "accepted";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  alert(
    "✅ Anfrage angenommen!"
  );

}


function rejectRequest(
  requestId
){

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if(!request) return;

  if(
    !confirm(
      "Anfrage wirklich ablehnen?"
    )
  ){

    return;
  }

  request.status =
    "rejected";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  alert(
    "❌ Anfrage abgelehnt!"
  );

}

function showCard(
  cardId
){

  const card =
    getCards().find(
      c =>
        c.id === cardId
    );

  if(!card) return;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.style.position =
    "fixed";

  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";

  overlay.style.background =
    "rgba(0,0,0,.7)";

  overlay.style.display =
    "flex";

  overlay.style.alignItems =
    "center";

  overlay.style.justifyContent =
    "center";

  overlay.style.zIndex =
    "9999";

  overlay.style.padding =
    "20px";

  overlay.innerHTML = `

    <div style="
      background:white;
      padding:20px;
      border-radius:18px;
      width:100%;
      max-width:400px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        alt="${card.player}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:12px;
        "
      >

      <h2>
        ${card.player}
      </h2>

      <p>
        ${card.club}
      </p>

      <p style="
        font-size:24px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <p>
        👤 ${card.owner || "Verkäufer"}
      </p>

      <button
        id="closeCard"
        style="
          border:none;
          background:#111;
          color:white;
          padding:12px 22px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  document
    .getElementById(
      "closeCard"
    )
    .onclick =
      function(){

        overlay.remove();

      };

}
