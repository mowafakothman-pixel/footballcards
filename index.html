<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootballCards</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .search {
      padding: 20px;
      text-align: center;
    }

    .search input {
      width: 85%;
      max-width: 500px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 9px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

<header>
  <h1>⚽ FootballCards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="search">
  <input type="text" placeholder="Fußballkarte suchen...">
</div>

<div class="container">

  <div class="card">
    <h2>Topps Fußballkarte</h2>
    <p>Sehr guter Zustand</p>
    <p class="price">5,00 €</p>
    <button>Kaufen</button>
  </div>

  <div class="card">
    <h2>Panini Fußballkarte</h2>
    <p>Guter Zustand</p>
    <p class="price">3,50 €</p>
    <button>Kaufen</button>
  </div>

</div>

</body>
</html>
