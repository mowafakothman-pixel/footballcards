<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #111;
}

/* =========================
   HEADER
========================= */

header {
  background: linear-gradient(135deg, #111, #242424);
  color: white;
  padding: 24px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 31px;
}

header p {
  margin: 7px 0 0;
  color: #bdbdbd;
}

/* =========================
   PROFILBAR
========================= */

.profile-bar {
  background: white;
  border-bottom: 1px solid #e3e3e3;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.profile-inner {
  max-width: 1150px;
  margin: auto;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.profile-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  min-width: 0;
}

.avatar {
  width: 42px;
  height: 42px;
  min-width: 42px;
  border-radius: 50%;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.profile-controls {
  display: flex;
  gap: 8px;
}

.profile-controls input {
  width: 180px;
  padding: 10px 12px;
  border: 1px solid #ddd;
  border-radius: 10px;
  outline: none;
}

.profile-controls input:focus {
  border-color: #111;
}

.primary-btn {
  border: none;
  background: #111;
  color: white;
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   NAVIGATION
========================= */

.navigation {
  position: sticky;
  top: 67px;
  z-index: 999;
  background: rgba(244,246,248,.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #ddd;
}

.navigation-inner {
  max-width: 1150px;
  margin: auto;
  padding: 10px 18px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.navigation button {
  flex: 0 0 auto;
  border: none;
  background: white;
  padding: 12px 17px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  position: relative;
}

.navigation button.active {
  background: #111;
  color: white;
}

.badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  margin-left: 5px;
  border-radius: 999px;
  background: #dc2626;
  color: white;
  font-size: 11px;
}

/* =========================
   SEARCH
========================= */

.search {
  background: white;
  padding: 18px;
  border-bottom: 1px solid #e5e5e5;
}

.search-inner {
  max-width: 900px;
  margin: auto;
}

.search input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #ddd;
  border-radius: 13px;
  font-size: 16px;
  outline: none;
}

.search input:focus {
  border-color: #111;
}

/* =========================
   CONTAINER
========================= */

.container {
  width: 100%;
  max-width: 1150px;
  margin: auto;
  padding: 22px 18px 40px;
}

/* =========================
   PAGES
========================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

.section-title {
  margin-top: 5px;
}

/* =========================
   SELL
========================= */

.sell {
  background: linear-gradient(135deg, #111, #272727);
  color: white;
  padding: 24px;
  border-radius: 20px;
  margin-bottom: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.sell h2 {
  margin-top: 0;
}

.sell p {
  color: #c9c9c9;
}

.sell form {
  display: grid;
  grid-template-columns: 1fr 1fr 150px 1.2fr auto;
  gap: 9px;
}

.sell input {
  padding: 12px;
  border: none;
  border-radius: 10px;
  min-width: 0;
}

.sell button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: white;
  color: #111;
  font-weight: bold;
  cursor: pointer;
}

/* =========================
   CARDS GRID
========================= */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 19px;
  padding: 15px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  border: 1px solid #ededed;
  transition: transform .15s ease, box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 9px 25px rgba(0,0,0,.11);
}

.card-image {
  width: 100%;
  height: 210px;
  background: #f1f2f4;
  border-radius: 15px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card h3 {
  margin: 13px 0 5px;
  font-size: 19px;
}

.info {
  color: #666;
  margin: 6px 0;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 10px 0;
}

.card button {
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: none;
  border-radius: 10px;
  background: #111;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.card button.gray {
  background: #eeeeee;
  color: #111;
}

.card button:disabled {
  cursor: default;
  opacity: .7;
}

/* =========================
   FAVORITE COUNT
========================= */

.favorite-count {
  display: inline-block;
  margin-top: 5px;
  color: #777;
  font-size: 13px;
}

/* =========================
   SOLD
========================= */

.sold-box {
  background: #e1f7e8;
  color: #137333;
  padding: 9px 11px;
  border-radius: 10px;
  font-weight: bold;
  margin: 10px 0;
}

/* =========================
   STATUS
========================= */

.status {
  display: inline-block;
  padding: 7px 10px;
  border-radius: 9px;
  font-weight: bold;
  font-size: 13px;
}

.status.open {
  background: #fff1d6;
  color: #946200;
}

.status.accepted {
  background: #ddf7e5;
  color: #137333;
}

.status.rejected {
  background: #ffe1e1;
  color: #b42318;
}

/* =========================
   REQUESTS
========================= */

.request-list {
  display: grid;
  gap: 15px;
}

.request {
  background: white;
  padding: 17px;
  border-radius: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
  border: 1px solid #ededed;
}

.request-top {
  display: flex;
  gap: 15px;
  align-items: center;
}

.request-image {
  width: 95px;
  height: 95px;
  object-fit: contain;
  background: #f1f1f1;
  border-radius: 13px;
  flex-shrink: 0;
}

.request-info {
  flex: 1;
  min-width: 0;
}

.request-info h3 {
  margin: 0 0 7px;
}

.request-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.accept-btn,
.reject-btn {
  border: none;
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  font-weight: bold;
  flex: 1;
  cursor: pointer;
}

.accept-btn {
  background: #16a34a;
}

.reject-btn {
  background: #dc2626;
}

.rate-btn {
  border: none;
  background: #111;
  color: white;
  padding: 11px 15px;
  border-radius: 10px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

/* =========================
   PROFILE
========================= */

.seller-profile {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

.seller-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.big-avatar {
  width: 75px;
  height: 75px;
  min-width: 75px;
  border-radius: 50%;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.seller-header h2 {
  margin: 0;
}

.rating-display {
  margin-top: 7px;
  font-size: 20px;
}

.seller-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 22px;
}

.seller-stat {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 13px;
  text-align: center;
}

.seller-stat strong {
  display: block;
  font-size: 23px;
}

.seller-stat span {
  color: #777;
  font-size: 13px;
}

/* =========================
   EMPTY
========================= */

.empty {
  background: white;
  padding: 28px;
  border-radius: 16px;
  color: #777;
  text-align: center;
  border: 1px solid #eee;
}

/* =========================
   MODAL
========================= */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 18px;
}

.modal {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 20px;
  padding: 22px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h2 {
  margin-top: 0;
}

.modal-image {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  background: #f2f2f2;
  border-radius: 15px;
}

.modal-actions {
  display: flex;
  gap: 9px;
  margin-top: 15px;
}

.modal-actions button {
  flex: 1;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.close-btn {
  background: #eee;
}

.save-rating-btn {
  background: #111;
  color: white;
}

/* =========================
   STAR RATING
========================= */

.star-picker {
  display: flex;
  gap: 5px;
  font-size: 34px;
  margin: 10px 0;
}

.star-picker span {
  cursor: pointer;
  color: #ccc;
}

.star-picker span.active {
  color: #f5b400;
}

.rating-comment {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-family: inherit;
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  padding: 35px;
  color: #777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px) {

  .sell form {
    grid-template-columns: 1fr 1fr;
  }

  .sell button {
    grid-column: span 2;
  }

}

@media(max-width:700px) {

  .profile-inner {
    flex-direction: column;
    align-items: stretch;
  }

  .profile-user {
    justify-content: center;
  }

  .profile-controls {
    width: 100%;
  }

  .profile-controls input {
    flex: 1;
    width: auto;
  }

  .navigation {
    top: 103px;
  }

  .navigation-inner {
    padding: 9px 12px;
  }

  .navigation button {
    padding: 11px 13px;
  }

  .sell form {
    grid-template-columns: 1fr;
  }

  .sell button {
    grid-column: auto;
  }

  .request-top {
    align-items: flex-start;
  }

  .request-actions {
    flex-direction: column;
  }

  .seller-stats {
    grid-template-columns: 1fr;
  }

}

@media(max-width:450px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .request-image {
    width: 75px;
    height: 75px;
  }

}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- =========================
     PROFIL
========================= -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div id="avatar" class="avatar">?</div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        class="primary-btn"
        onclick="saveUsername()"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- =========================
     NAVIGATION
========================= -->

<nav class="navigation">

  <div class="navigation-inner">

    <button
      id="navCards"
      class="active"
      onclick="showPage('cardsPage','navCards')"
    >
      🔥 Karten
    </button>

    <button
      id="navFavorites"
      onclick="showPage('favoritesPage','navFavorites')"
    >
      ❤️ Favoriten
    </button>

    <button
      id="navMine"
      onclick="showPage('minePage','navMine')"
    >
      🃏 Meine Karten
    </button>

    <button
      id="navRequests"
      onclick="showPage('requestsPage','navRequests')"
    >
      📩 Anfragen
      <span id="requestBadge" class="badge" style="display:none">0</span>
    </button>

    <button
      id="navProfile"
      onclick="showPage('profilePage','navProfile')"
    >
      👤 Profil
    </button>

  </div>

</nav>

<!-- =========================
     SUCHE
========================= -->

<div class="search">

  <div class="search-inner">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
    >

  </div>

</div>

<div class="container">

<!-- =========================
     VERKAUFEN
========================= -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm">

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- =========================
     KARTEN
========================= -->

<section id="cardsPage" class="page active">

  <h2 class="section-title">
    🔥 Aktuelle Karten
  </h2>

  <div id="cards" class="cards"></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section id="favoritesPage" class="page">

  <h2 id="favoriteTitle">
    ❤️ Meine Favoriten (0)
  </h2>

  <div id="favoriteCards" class="cards"></div>

</section>

<!-- =========================
     MEINE KARTEN
========================= -->

<section id="minePage" class="page">

  <h2 class="section-title">
    🃏 Meine Karten
  </h2>

  <div id="myCards" class="cards"></div>

</section>

<!-- =========================
     ANFRAGEN
========================= -->

<section id="requestsPage" class="page">

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div id="purchaseRequests" class="request-list"></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div id="sellerRequests" class="request-list"></div>

</section>

<!-- =========================
     PROFIL
========================= -->

<section id="profilePage" class="page">

  <h2 class="section-title">
    👤 Mein Profil
  </h2>

  <div id="profileBox" class="seller-profile"></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function getUsername() {

  return localStorage.getItem("pixelUsername") || "";

}


function getCards() {

  try {

    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];

  } catch {

    return [];

  }

}


function saveCards(cards) {

  localStorage.setItem(
    "footballCards",
    JSON.stringify(cards)
  );

}


function getRequests() {

  try {

    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  } catch {

    return [];

  }

}


function saveRequests(requests) {

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

}


function getRatings() {

  try {

    return JSON.parse(
      localStorage.getItem("sellerRatings")
    ) || [];

  } catch {

    return [];

  }

}


function saveRatings(ratings) {

  localStorage.setItem(
    "sellerRatings",
    JSON.stringify(ratings)
  );

}


function getFavoriteMap() {

  try {

    return JSON.parse(
      localStorage.getItem("favoriteMap")
    ) || {};

  } catch {

    return {};

  }

}


function saveFavoriteMap(map) {

  localStorage.setItem(
    "favoriteMap",
    JSON.stringify(map)
  );

}


function makeId() {

  return Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10);

}


function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getStars(number) {

  const rounded = Math.round(Number(number) || 0);

  return "⭐".repeat(rounded) +
    "☆".repeat(5 - rounded);

}


/* =====================================================
   BENUTZER
===================================================== */

function saveUsername() {

  const input =
    document.getElementById("usernameInput");

  const name =
    input.value.trim();

  if (!name) {

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  localStorage.setItem(
    "pixelUsername",
    name
  );

  updateProfile();
  loadAll();

  alert(
    "👤 Profil gespeichert!"
  );

}


function updateProfile() {

  const name =
    getUsername();

  const profileName =
    document.getElementById("profileName");

  const avatar =
    document.getElementById("avatar");

  const input =
    document.getElementById("usernameInput");

  if (name) {

    profileName.textContent = name;

    avatar.textContent =
      name.charAt(0).toUpperCase();

    input.value = name;

  } else {

    profileName.textContent =
      "Kein Benutzer";

    avatar.textContent = "?";

    input.value = "";

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(pageId, buttonId) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });

  const page =
    document.getElementById(pageId);

  if (page) {
    page.classList.add("active");
  }

  document
    .querySelectorAll(".navigation button")
    .forEach(button => {

      button.classList.remove("active");

    });

  const button =
    document.getElementById(buttonId);

  if (button) {
    button.classList.add("active");
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   ANFRAGEN-BADGE
===================================================== */

function updateRequestBadge() {

  const username =
    getUsername();

  const badge =
    document.getElementById("requestBadge");

  if (!username) {

    badge.style.display = "none";

    return;

  }

  const incoming =
    getRequests().filter(request =>

      request.seller === username &&
      request.status === "pending"

    ).length;

  if (incoming > 0) {

    badge.textContent = incoming;
    badge.style.display = "inline-flex";

  } else {

    badge.style.display = "none";

  }

}


/* =====================================================
   KARTEN LADEN
===================================================== */

function loadCards() {

  const box =
    document.getElementById("cards");

  box.innerHTML = "";

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const username =
    getUsername();

  const cards =
    getCards();

  const filtered =
    cards.filter(card => {

      if (card.sold) {
        return false;
      }

      return (

        String(card.player)
          .toLowerCase()
          .includes(search)

        ||

        String(card.club)
          .toLowerCase()
          .includes(search)

        ||

        String(card.owner)
          .toLowerCase()
          .includes(search)

      );

    });

  if (!filtered.length) {

    box.innerHTML =
      "<div class='empty'>Keine Karten gefunden.</div>";

    return;

  }

  filtered.forEach(card => {

    createCard(card, box);

  });

}


/* =====================================================
   FAVORITEN
===================================================== */

function getFavoriteIdsForUser() {

  const username =
    getUsername();

  if (!username) {
    return [];
  }

  const map =
    getFavoriteMap();

  return Array.isArray(map[username])
    ? map[username]
    : [];

}


function isFavorite(cardId) {

  return getFavoriteIdsForUser()
    .includes(cardId);

}


function getFavoriteCount(cardId) {

  const map =
    getFavoriteMap();

  let count = 0;

  Object.keys(map).forEach(username => {

    const ids =
      Array.isArray(map[username])
        ? map[username]
        : [];

    if (ids.includes(cardId)) {
      count++;
    }

  });

  return count;

}


function toggleFavorite(cardId) {

  const username =
    getUsername();

  if (!username) {

    needUsername();

    return;

  }

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if (!card) return;

  if (card.owner === username) {

    alert(
      "🚫 Du kannst deine eigene Karte nicht favorisieren."
    );

    return;

  }

  if (card.sold) {

    alert(
      "Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const map =
    getFavoriteMap();

  if (!Array.isArray(map[username])) {
    map[username] = [];
  }

  const index =
    map[username].indexOf(cardId);

  if (index !== -1) {

    map[username].splice(index, 1);

  } else {

    map[username].push(cardId);

  }

  saveFavoriteMap(map);

  loadAll();

}

document
  .getElementById("sellForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
      getUsername();

    if (!username) {

      needUsername();

      return;

    }

    const player =
      document
        .getElementById("player")
        .value
        .trim();

    const club =
      document
        .getElementById("club")
        .value
        .trim();

    const price =
      document
        .getElementById("price")
        .value;

    const file =
      document
        .getElementById("image")
        .files[0];

    if (!file) {

      alert(
        "Bitte wähle ein Foto aus."
      );

      return;

    }

    const reader =
      new FileReader();

    reader.onload = function() {

      const image =
        new Image();

      image.onload = function() {

        const canvas =
          document.createElement("canvas");

        const max = 700;

        let width =
          image.width;

        let height =
          image.height;

        if (
          width > height &&
          width > max
        ) {

          height =
            height * max / width;

          width = max;

        }

        else if (
          height > max
        ) {

          width =
            width * max / height;

          height = max;

        }

        canvas.width = width;
        canvas.height = height;

        canvas
          .getContext("2d")
          .drawImage(
            image,
            0,
            0,
            width,
            height
          );

        const imageData =
          canvas.toDataURL(
            "image/jpeg",
            0.6
          );

        const cards =
          getCards();

        cards.unshift({

          id: makeId(),

          player: player,

          club: club,

          price: Number(price).toFixed(2),

          image: imageData,

          owner: username,

          sold: false,

          soldTo: null

        });

        try {

          saveCards(cards);

        }

        catch(error) {

          alert(
            "Der Speicher ist voll. Bitte lösche zuerst einige Karten."
          );

          return;

        }

        document
          .getElementById("sellForm")
          .reset();

        loadAll();

        alert(
          "🎉 Deine Karte wurde eingestellt!"
        );

      };

      image.src =
        reader.result;

    };

    reader.readAsDataURL(file);

  });

function buyCard(cardId) {

  const username =
    getUsername();

  if (!username) {

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c => c.id === cardId
    );

  if (!card) return;

  if (card.owner === username) {

    ownCardMessage();

    return;

  }

  if (card.sold) {

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    loadAll();

    return;

  }

  const requests =
    getRequests();

  const alreadyRequested =
    requests.some(request =>

      request.cardId === cardId &&
      request.buyer === username &&
      (
        request.status === "pending" ||
        request.status === "accepted"
      )

    );

  if (alreadyRequested) {

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const anotherAccepted =
    requests.some(request =>

      request.cardId === cardId &&
      request.status === "accepted"

    );

  if (anotherAccepted) {

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du diese Karte kaufen?\n\n" +
      card.player +
      " – " +
      card.club +
      "\n\nPreis: " +
      card.price +
      " €"
    );

  if (!confirmed) return;

  requests.push({

    id: makeId(),

    cardId: card.id,

    player: card.player,

    club: card.club,

    price: card.price,

    image: card.image,

    buyer: username,

    seller: card.owner,

    status: "pending",

    createdAt:
      new Date().toISOString()

  });

  saveRequests(requests);

  loadAll();

  alert(
    "📩 Anfrage gesendet!"
  );

}

/* =====================================================
   ANNEHMEN
===================================================== */

function acceptRequest(requestId) {

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if (!request) return;

  if (request.seller !== username) {

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if (request.status !== "pending") {

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c => c.id === request.cardId
    );

  if (!card) {

    alert(
      "Die Karte wurde nicht gefunden."
    );

    return;

  }

  if (card.sold) {

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    request.status = "rejected";

    saveRequests(requests);
    loadAll();

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " annehmen?"
    );

  if (!confirmed) return;

  request.status =
    "accepted";

  card.sold =
    true;

  card.soldTo =
    request.buyer;

  /*
     Alle anderen offenen Anfragen
     für dieselbe Karte werden abgelehnt.
  */

  requests.forEach(other => {

    if (
      other.cardId === request.cardId &&
      other.id !== request.id &&
      other.status === "pending"
    ) {

      other.status =
        "rejected";

    }

  });

  saveCards(cards);
  saveRequests(requests);

  loadAll();

  alert(
    "🟢 Anfrage angenommen!\n\n" +
    "Die Karte wurde als verkauft markiert."
  );

}


/* =====================================================
   ABLEHNEN
===================================================== */

function rejectRequest(requestId) {

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if (!request) return;

  if (request.seller !== username) {

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage ablehnen."
    );

    return;

  }

  if (request.status !== "pending") {

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " wirklich ablehnen?"
    );

  if (!confirmed) return;

  request.status =
    "rejected";

  saveRequests(requests);

  alert(

  );

}

  saveFavoriteMap(map);

  loadAll();

        placeholder="Optionaler Kommentar..."
      ></textarea>

      <div class="modal-actions">

        <button
          class="close-btn"
          id="cancelRating"
        >
          Abbrechen
        </button>

        <button
          class="save-rating-btn"
          id="saveRating"
        >
          Bewertung speichern
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(overlay);

  const stars =
    overlay.querySelectorAll(
      ".star-picker span"
    );

  stars.forEach(star => {

    star.addEventListener(
      "click",
      function() {

        selectedStars =
          Number(
            this.dataset.star
          );

        stars.forEach(s => {

          s.classList.toggle(
            "active",
            Number(s.dataset.star) <=
              selectedStars
          );

        });

      }
    );

  });

  overlay
    .querySelector("#cancelRating")
    .onclick = function() {

      overlay.remove();

    };

  overlay
    .querySelector("#saveRating")
    .onclick = function() {

      if (selectedStars < 1) {

        alert(
          "Bitte wähle zuerst eine Sternebewertung."
        );

        return;

      }

      const ratings =
        getRatings();

      if (ratings.some(r =>

        r.requestId === request.id

      )) {

        alert(
          "Diese Anfrage wurde bereits bewertet."
        );

        overlay.remove();

        return;

      }

      ratings.push({

        id: makeId(),

        requestId:
          request.id,

        cardId:
          request.cardId,

        buyer:
          username,

        seller:
          request.seller,

        stars:
          selectedStars,

        comment:
          document
            .getElementById("ratingComment")
            .value
            .trim(),

        createdAt:
          new Date().toISOString()

      });

      saveRatings(ratings);

      overlay.remove();

      loadAll();

      alert(
        "⭐ Bewertung gespeichert!"
      );

    };

}


/* =====================================================
   KARTE ANSEHEN
===================================================== */

function showCard(cardId) {

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if (!card) return;

  const favoriteCount =
    getFavoriteCount(card.id);

  const overlay =
    document.createElement("div");

  overlay.className =
    "modal-backdrop";

  overlay.innerHTML = `

    <div class="modal">

      <img
        class="modal-image"
        src="${card.image}"
        alt="${escapeHtml(card.player)}"
      >

      <h2>
        ${escapeHtml(card.player)}
      </h2>

      <p>
        ${escapeHtml(card.club)}
      </p>

      <p style="
        font-size:25px;
        font-weight:bold;
      ">
        ${escapeHtml(card.price)} €
      </p>

      <p>
        👤 Verkäufer:
        <strong>
          ${escapeHtml(card.owner)}
        </strong>
      </p>

      <p>
        ❤️ ${favoriteCount}
        ${
          favoriteCount === 1
            ? "Favorisierung"
            : "Favorisierungen"
        }
      </p>

      ${
        card.sold
          ? `
            <div class="sold-box">
              🔒 Verkauft an
              ${escapeHtml(card.soldTo)}
            </div>
          `
          : ""
      }

      <div class="modal-actions">

        <button
          class="close-btn"
          id="closeCard"
        >
          Schließen
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(overlay);

  overlay
    .querySelector("#closeCard")
    .onclick = function() {

      overlay.remove();

    };

}
