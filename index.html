<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#080808;
color:#f5f5f5;
}

button,input,textarea,select{font-family:inherit}

header{
background:#080808;
padding:20px 15px 17px;
text-align:center;
border-bottom:1px solid #242424;
}

header h1{
margin:0;
font-size:29px;
}

header p{
margin:6px 0 0;
color:#888;
}

.profile-bar{
background:#111;
border-bottom:1px solid #292929;
padding:9px 14px;
position:sticky;
top:0;
z-index:3000;
}

.profile-inner{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.profile-user{
display:flex;
align-items:center;
gap:8px;
font-weight:bold;
min-width:0;
}

.avatar,.big-avatar{
border-radius:50%;
background:#fff;
color:#000;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
flex-shrink:0;
}

.avatar{
width:38px;
height:38px;
}

.big-avatar{
width:72px;
height:72px;
font-size:28px;
}

.profile-controls{
display:flex;
gap:6px;
}

.profile-controls input{
width:160px;
padding:9px 10px;
border:1px solid #333;
background:#191919;
color:#fff;
border-radius:9px;
outline:none;
}

.primary-btn{
border:0;
background:#fff;
color:#000;
padding:9px 12px;
border-radius:9px;
font-weight:bold;
cursor:pointer;
}

.search{
background:#0d0d0d;
padding:12px 14px;
border-bottom:1px solid #242424;
}

.search input{
display:block;
width:100%;
max-width:900px;
margin:auto;
padding:13px 15px;
border:1px solid #303030;
background:#181818;
color:#fff;
border-radius:12px;
outline:none;
}

.container{
max-width:1200px;
margin:auto;
padding:16px 14px 45px;
}

/* ================= NAVIGATION ================= */

.navigation{
position:sticky;
top:57px;
z-index:2500;
display:grid;
grid-template-columns:1fr 1.15fr 1fr;
gap:6px;
margin-bottom:20px;
padding:7px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:15px;
}

.nav-side{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
}

.navigation button{
position:relative;
width:100%;
min-width:0;
border:1px solid #303030;
background:#171717;
color:#ddd;
padding:11px 5px;
border-radius:10px;
font-size:12px;
font-weight:800;
white-space:nowrap;
cursor:pointer;
}

.navigation button.active{
background:#fff;
color:#000;
border-color:#fff;
}

.navigation .sell-nav{
background:#fff;
color:#000;
font-size:15px;
display:flex;
align-items:center;
justify-content:center;
}

.badge{
position:absolute;
top:-5px;
right:-4px;
min-width:19px;
height:19px;
padding:1px 5px;
border-radius:20px;
background:#ef4444;
color:#fff;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
border:2px solid #111;
}

/* ================= PAGES ================= */

.page{display:none}
.page.active{display:block}

.page h2{
margin:4px 0 16px;
}

/* ================= SELL MODAL ================= */

.sell-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.84);
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:15px;
}

.sell-overlay.show{
display:flex;
}

.sell-box{
width:100%;
max-width:560px;
max-height:92vh;
overflow:auto;
background:#111;
border:1px solid #333;
border-radius:21px;
padding:21px;
box-shadow:0 20px 70px rgba(0,0,0,.7);
}

.sell-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:18px;
}

.sell-header h2{
margin:0;
font-size:23px;
}

.close-btn{
width:37px;
height:37px;
border:0;
border-radius:50%;
background:#252525;
color:#fff;
font-size:20px;
cursor:pointer;
}

.sell-form{
display:grid;
gap:11px;
}

.sell-form label{
font-size:13px;
font-weight:bold;
color:#aaa;
margin-top:3px;
}

.sell-form input,
.sell-form textarea,
.sell-form select{
width:100%;
padding:13px;
border:1px solid #333;
background:#191919;
color:#fff;
border-radius:11px;
outline:none;
font-size:15px;
}

.sell-form textarea{
min-height:90px;
resize:vertical;
}

.photo-box{
border:1px dashed #555;
background:#181818;
border-radius:13px;
padding:18px;
text-align:center;
cursor:pointer;
}

.photo-box strong{
display:block;
margin-bottom:5px;
}

.photo-box span{
color:#777;
font-size:13px;
}

.photo-preview{
display:none;
width:100%;
max-height:230px;
object-fit:contain;
margin-top:12px;
border-radius:12px;
background:#0c0c0c;
}

.sell-submit{
border:0;
background:#fff;
color:#000;
padding:14px;
border-radius:11px;
font-weight:800;
cursor:pointer;
font-size:15px;
}

/* ================= CARDS ================= */

.cards{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:15px;
}

.card{
background:#111;
border:1px solid #282828;
border-radius:17px;
padding:13px;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.card-image{
width:100%;
height:205px;
background:#181818;
border-radius:13px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
}

.card-image img{
width:100%;
height:100%;
object-fit:contain;
}

.card h3{
margin:11px 0 5px;
}

.info{
color:#999;
margin:6px 0;
}

.price{
font-size:22px;
font-weight:800;
margin:9px 0;
}

.card button{
width:100%;
margin-top:7px;
padding:10px;
border:0;
border-radius:9px;
background:#fff;
color:#000;
font-weight:bold;
cursor:pointer;
}

.card button.gray{
background:#252525;
color:#fff;
}

.card button:disabled{
opacity:.55;
cursor:not-allowed;
}

.favorite-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:8px;
color:#888;
font-size:13px;
}

/* ================= REQUESTS ================= */

.request-list{
display:grid;
gap:13px;
}

.request{
background:#111;
border:1px solid #292929;
padding:16px;
border-radius:16px;
}

.request-top{
display:flex;
gap:13px;
align-items:center;
}

.request-image{
width:88px;
height:88px;
object-fit:contain;
background:#191919;
border-radius:11px;
flex-shrink:0;
}

.request-info{
flex:1;
min-width:0;
}

.request-info h3{
margin:0 0 5px;
}

.request-actions{
display:flex;
gap:9px;
margin-top:13px;
}

.accept-btn,.reject-btn,.rate-btn{
border:0;
color:#fff;
padding:11px;
border-radius:9px;
font-weight:bold;
flex:1;
cursor:pointer;
}

.accept-btn{background:#15803d}
.reject-btn{background:#b91c1c}
.rate-btn{background:#fff;color:#000}

.status{
display:inline-block;
padding:6px 9px;
border-radius:8px;
font-weight:bold;
font-size:13px;
}

.status.open{
background:#3a2d13;
color:#f5c96b;
}

.status.accepted{
background:#12351f;
color:#65d98a;
}

.status.rejected{
background:#3b1616;
color:#ff7c7c;
}

/* ================= PROFILE ================= */

.seller-profile{
background:#111;
border:1px solid #292929;
border-radius:19px;
padding:22px;
}

.seller-header{
display:flex;
align-items:center;
gap:14px;
}

.seller-header h2{
margin:0;
}

.rating{
font-size:20px;
margin-top:6px;
}

.seller-stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:20px;
}

.seller-stat{
background:#191919;
padding:14px;
border-radius:11px;
text-align:center;
}

.seller-stat strong{
display:block;
font-size:22px;
}

.seller-stat span{
color:#888;
font-size:12px;
}

.rating-stars{
display:flex;
gap:5px;
margin:15px 0;
justify-content:center;
}

.rating-stars button{
border:0;
background:#252525;
border-radius:8px;
padding:8px;
font-size:20px;
cursor:pointer;
}

.rating-stars button.selected{
background:#66531c;
}

.empty{
background:#111;
border:1px solid #292929;
padding:24px;
border-radius:15px;
color:#888;
text-align:center;
}

footer{
text-align:center;
padding:30px;
color:#666;
border-top:1px solid #222;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

header h1{
font-size:25px;
}

header{
padding:16px 10px 14px;
}

.profile-bar{
padding:8px 9px;
}

.profile-inner{
gap:6px;
}

.profile-controls{
gap:4px;
}

.profile-controls input{
width:105px;
padding:8px 7px;
font-size:12px;
}

.primary-btn{
padding:8px 7px;
font-size:11px;
}

.avatar{
width:34px;
height:34px;
}

.profile-user{
font-size:13px;
}

.container{
padding:11px 8px 35px;
}

.navigation{
top:51px;
gap:4px;
padding:5px;
border-radius:12px;
}

.nav-side{
gap:4px;
}

.navigation button{
padding:10px 2px;
font-size:10px;
border-radius:8px;
}

.navigation .sell-nav{
font-size:12px;
}

.cards{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px;
}

.card{
padding:9px;
border-radius:13px;
}

.card-image{
height:150px;
border-radius:10px;
}

.card h3{
font-size:15px;
margin:8px 0 4px;
}

.info{
font-size:12px;
}

.price{
font-size:18px;
}

.card button{
font-size:11px;
padding:9px 4px;
}

.favorite-row{
font-size:11px;
}

.request{
padding:12px;
}

.request-top{
align-items:flex-start;
}

.request-image{
width:70px;
height:70px;
}

.request-info h3{
font-size:14px;
}

.request-actions{
flex-direction:column;
}

.seller-stats{
grid-template-columns:1fr;
}

.sell-box{
padding:17px;
border-radius:17px;
}

.sell-header h2{
font-size:20px;
}
}

@media(max-width:390px){

.navigation button{
font-size:9px;
padding-left:1px;
padding-right:1px;
}

.navigation .sell-nav{
font-size:10px;
}

.profile-controls input{
width:88px;
}

.profile-user span{
max-width:70px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.cards{
gap:7px;
}

.card-image{
height:135px;
}
}
</style>
</head>

<body>

<header>
<h1>⚽ Pixel Cards</h1>
<p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="profile-bar">
<div class="profile-inner">

<div class="profile-user">
<div id="avatar" class="avatar">?</div>
<span id="profileName">Kein Benutzer</span>
</div>

<div class="profile-controls">
<input id="usernameInput" maxlength="20" placeholder="Benutzername">
<button class="primary-btn" onclick="saveUsername()">Speichern</button>
</div>

</div>
</div>

<div class="search">
<input id="searchInput" placeholder="🔎 Spieler, Verein oder Verkäufer suchen...">
</div>

<div class="container">

<!-- ================= NAVIGATION ================= -->

<div class="navigation">

<div class="nav-side">

<button id="navCards" class="active" onclick="showPage('cardsPage','navCards')">
🔥 Karten
</button>

<button id="navFavorites" onclick="showPage('favoritesPage','navFavorites')">
❤️ Favoriten
</button>

</div>

<button class="sell-nav" onclick="openSell()">
➕ Verkaufen
</button>

<div class="nav-side">

<button id="navMine" onclick="showPage('minePage','navMine')">
🃏 Meine Karten
</button>

<button id="navRequests" onclick="showPage('requestsPage','navRequests')">
📩 Anfragen
<span id="requestBadge" class="badge" style="display:none">0</span>
</button>

</div>

</div>

<!-- ================= KARTEN ================= -->

<section id="cardsPage" class="page active">

<h2>🔥 Aktuelle Karten</h2>

<div id="cards" class="cards"></div>

</section>

<!-- ================= FAVORITEN ================= -->

<section id="favoritesPage" class="page">

<h2 id="favoriteTitle">❤️ Favoriten (0)</h2>

<div id="favoriteCards" class="cards"></div>

</section>

<!-- ================= MEINE KARTEN ================= -->

<section id="minePage" class="page">

<h2>🃏 Meine Karten</h2>

<div id="myCards" class="cards"></div>

</section>

<!-- ================= ANFRAGEN ================= -->

<section id="requestsPage" class="page">

<h2 id="requestTitle">📩 Meine Kaufanfragen (0)</h2>

<div id="purchaseRequests" class="request-list"></div>

<br>

<h2 id="sellerRequestTitle">📥 Anfragen für meine Karten (0)</h2>

<div id="sellerRequests" class="request-list"></div>

</section>

<!-- ================= PROFIL ================= -->

<section id="profilePage" class="page">

<h2>👤 Profil</h2>

<div id="profileBox" class="seller-profile"></div>

</section>

</div>

<footer>
© 2026 Pixel Cards
</footer>


<!-- ================= VERKAUFEN ================= -->

<div id="sellOverlay" class="sell-overlay">

<div class="sell-box">

<div class="sell-header">

<h2>➕ Karte verkaufen</h2>

<button class="close-btn" onclick="closeSell()">×</button>

</div>

<form id="sellForm" class="sell-form">

<label>Spieler</label>
<input id="player" required placeholder="z. B. Lamine Yamal">

<label>Verein</label>
<input id="club" required placeholder="z. B. FC Barcelona">

<label>Preis</label>
<input id="price" type="number" min="0" step="0.01" required placeholder="Preis in €">

<label>Zustand</label>

<select id="condition">
<option value="Sehr gut">Sehr gut</option>
<option value="Gut">Gut</option>
<option value="Akzeptabel">Akzeptabel</option>
</select>

<label>Beschreibung</label>

<textarea id="description" placeholder="Beschreibe deine Karte..."></textarea>

<label>Foto</label>

<div class="photo-box" onclick="document.getElementById('image').click()">

<strong>📷 Foto hinzufügen</strong>
<span>Tippe hier, um ein Bild auszuwählen</span>

<input
id="image"
type="file"
accept="image/*"
style="display:none"
>

<img id="photoPreview" class="photo-preview">

</div>

<button class="sell-submit" type="submit">
🚀 Karte einstellen
</button>

</form>

</div>

</div>


<script>

/* =====================================================
DATEN
===================================================== */

function getUsername(){
return localStorage.getItem("pixelUsername") || "";
}

function getCards(){
try{
return JSON.parse(localStorage.getItem("footballCards")) || [];
}catch(e){
return [];
}
}

function getRequests(){
try{
return JSON.parse(localStorage.getItem("purchaseRequests")) || [];
}catch(e){
return [];
}
}

function getFavorites(){
try{
return JSON.parse(localStorage.getItem("favoriteCards")) || [];
}catch(e){
return [];
}
}

function getFavoriteUsers(){
try{
return JSON.parse(localStorage.getItem("favoriteUsers")) || {};
}catch(e){
return {};
}
}

function getRatings(){
try{
return JSON.parse(localStorage.getItem("sellerRatings")) || {};
}catch(e){
return {};
}
}

function saveData(key,data){
localStorage.setItem(key,JSON.stringify(data));
}


/* =====================================================
PROFIL
===================================================== */

function saveUsername(){

const input=document.getElementById("usernameInput");
const name=input.value.trim();

if(!name){
alert("Bitte gib einen Benutzernamen ein.");
return;
}

const oldName=getUsername();

localStorage.setItem("pixelUsername",name);

updateProfile();
loadAll();

if(oldName && oldName!==name){
alert("👤 Benutzername geändert.");
}else{
alert("👤 Profil gespeichert!");
}
}

function updateProfile(){

const name=getUsername();

document.getElementById("profileName").textContent=
name || "Kein Benutzer";

document.getElementById("avatar").textContent=
name ? name.charAt(0).toUpperCase() : "?";

document.getElementById("usernameInput").value=name;
}


/* =====================================================
NAVIGATION
===================================================== */

function showPage(pageId,buttonId){

document.querySelectorAll(".page").forEach(page=>{
page.classList.remove("active");
});

const page=document.getElementById(pageId);

if(page){
page.classList.add("active");
}

document.querySelectorAll(".navigation button").forEach(button=>{
button.classList.remove("active");
});

const button=document.getElementById(buttonId);

if(button){
button.classList.add("active");
}

if(pageId==="requestsPage"){
updateRequestBadge();
}

if(pageId==="profilePage"){
const username=getUsername();

if(username){
loadSellerProfile(username);
}
}
}


/* =====================================================
VERKAUFEN ÖFFNEN
===================================================== */

function openSell(){

const username=getUsername();

if(!username){

alert("👤 Bitte zuerst einen Benutzernamen festlegen.");
return;

}

document.getElementById("sellOverlay").classList.add("show");
}

function closeSell(){
document.getElementById("sellOverlay").classList.remove("show");
}


/* =====================================================
FOTO VORSCHAU
===================================================== */

document.getElementById("image").addEventListener("change",function(){

const file=this.files[0];

const preview=document.getElementById("photoPreview");

if(!file){
preview.style.display="none";
preview.src="";
return;
}

const reader=new FileReader();

reader.onload=function(e){

preview.src=e.target.result;
preview.style.display="block";

};

reader.readAsDataURL(file);

});


/* =====================================================
BADGE
===================================================== */

function updateRequestBadge(){

const username=getUsername();

const count=username
? getRequests().filter(r=>
r.seller===username &&
r.status==="pending"
).length
:0;

const badge=document.getElementById("requestBadge");

if(count>0){
badge.style.display="flex";
badge.textContent=count;
}else{
badge.style.display="none";
}
}


/* =====================================================
KARTEN LADEN
===================================================== */

function loadCards(){

const box=document.getElementById("cards");

box.innerHTML="";

const search=document.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const cards=getCards();

const filtered=cards.filter(card=>{

return String(card.player||"").toLowerCase().includes(search)
||
String(card.club||"").toLowerCase().includes(search)
||
String(card.owner||"").toLowerCase().includes(search);

});

if(!filtered.length){

box.innerHTML="<div class='empty'>Keine Karten gefunden.</div>";
return;

}

filtered.forEach(card=>{
createCard(card,box);
});

}


/* =====================================================
FAVORITEN
===================================================== */

function isFavorite(cardId){

const username=getUsername();

if(!username)return false;

return getFavorites().some(item=>
item.id===cardId &&
item.favoriteBy===username
);
}

function getFavoriteCount(cardId){

const users=getFavoriteUsers();

return Array.isArray(users[cardId])
? users[cardId].length
:0;
}

function toggleFavorite(cardId){

const username=getUsername();

if(!username){
alert("👤 Bitte zuerst einen Benutzernamen festlegen.");
return;
}

const card=getCards().find(c=>c.id===cardId);

if(!card)return;

if(card.owner===username){
alert("🚫 Deine eigene Karte kannst du nicht favorisieren.");
return;
}

let favorites=getFavorites();
let users=getFavoriteUsers();

if(!Array.isArray(users[cardId])){
users[cardId]=[];
}

const index=favorites.findIndex(item=>
item.id===cardId &&
item.favoriteBy===username
);

if(index>=0){

favorites.splice(index,1);

users[cardId]=users[cardId].filter(
u=>u!==username
);

}else{

favorites.push({
id:cardId,
favoriteBy:username
});

if(!users[cardId].includes(username)){
users[cardId].push(username);
}

}

saveData("favoriteCards",favorites);
saveData("favoriteUsers",users);

loadAll();
}

function loadFavorites(){

const box=document.getElementById("favoriteCards");
box.innerHTML="";

const username=getUsername();

const cards=getCards();

const favorites=getFavorites()
.filter(item=>item.favoriteBy===username)
.map(item=>cards.find(c=>c.id===item.id))
.filter(Boolean);

document.getElementById("favoriteTitle").textContent=
"❤️ Favoriten ("+favorites.length+")";

if(!favorites.length){

box.innerHTML="<div class='empty'>❤️ Noch keine Favoriten.</div>";
return;

}

favorites.forEach(card=>{
createCard(card,box);
});

}


/* =====================================================
KARTE ERSTELLEN
===================================================== */

function createCard(card,box){

const username=getUsername();

const requests=getRequests();

const myRequest=requests.find(r=>
r.cardId===card.id &&
r.buyer===username &&
(r.status==="pending"||r.status==="accepted")
);

let buyButton="";

if(card.owner===username){

buyButton=
`<button class="gray" onclick="ownCardMessage()">🚫 Deine Karte</button>`;

}else if(!username){

buyButton=
`<button onclick="needUsername()">🛒 Kaufen</button>`;

}else if(card.sold===true){

buyButton=
`<button class="gray" disabled>✅ Verkauft</button>`;

}else if(myRequest){

buyButton=myRequest.status==="accepted"

function buyCard(cardId){

const username=getUsername();

if(!username){
needUsername();
return;

const cards=getCards();

const card=cards.find(c=>c.id===cardId);

if(!card)return;

const requests=getRequests();

const existing=requests.find(r=>
r.cardId===cardId &&
r.buyer===username &&
(r.status==="pending"||r.status==="accepted")
);

if(existing){
alert("🕐 Du hast diese Karte bereits angefragt.");
return;
}

if(!confirm(
"Möchtest du diese Karte kaufen?\n\n"+
card.player+
" – "+
card.club+
"\nPreis: "+
card.price+" €"
)){
return;
}

requests.push({

cardId:card.id,
player:card.player,
club:card.club,
price:card.price,
image:card.image,

buyer:username,
seller:card.owner,

status:"pending",

createdAt:new Date().toISOString()

});

}

/* =====================================================
ANNEHMEN
===================================================== */

function acceptRequest(requestId){

const username=getUsername();

const requests=getRequests();

const request=requests.find(r=>r.id===requestId);

if(!request)return;

if(request.seller!==username){
alert("🚫 Nur der Besitzer kann diese Anfrage annehmen.");
return;
}

if(request.status!=="pending"){
alert("Diese Anfrage wurde bereits bearbeitet.");
return;
}

const cards=getCards();

const card=cards.find(c=>c.id===request.cardId);

if(!card){
alert("❌ Karte nicht gefunden.");
return;
}

if(card.sold){
alert("❌ Diese Karte wurde bereits verkauft.");
return;
}

if(!confirm(
"Möchtest du die Anfrage von "+
request.buyer+
" annehmen?"
)){
return;
}

request.status="accepted";

card.sold=true;
card.soldTo=request.buyer;

requests.forEach(other=>{

if(
other.cardId===request.cardId &&
other.id!==request.id &&
other.status==="pending"
){
other.status="rejected";
}

});

saveData("footballCards",cards);
saveData("purchaseRequests",requests);

loadAll();

alert("🟢 Anfrage angenommen!");

}

ABLEHNEN

function rejectRequest(requestId){

const username=getUsername();

const requests=getRequests();

const request=requests.find(r=>r.id===requestId);

if(!request)return;

if(request.seller!==username){
alert("🚫 Nur der Besitzer kann diese Anfrage ablehnen.");
return;
}

if(request.status!=="pending"){

if(!confirm(
"Anfrage von "+

)){

}

request.status="rejected";

alert("🔴 Anfrage abgelehnt.");

}

function openRating(requestId){

if(request.buyer!==username){
alert("🚫 Nur der Käufer kann bewerten.");

}

}

if(!Array.isArray(ratings[request.seller])){
ratings[request.seller]=[];
}

const overlay=document.createElement("div");

overlay.style.cssText=`
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
display:flex;
align-items:center;
justify-content:center;
z-index:10000;
padding:18px;
`;

overlay.innerHTML=`

<div style="
background:#111;
border:1px solid #333;
padding:24px;
border-radius:19px;
width:100%;
max-width:420px;
text-align:center;
">

<h2>⭐ Verkäufer bewerten</h2>

<p>
Wie war deine Erfahrung mit
<strong>${escapeHTML(request.seller)}</strong>?
</p>

<div id="ratingStars" class="rating-stars">

<button data-stars="2">⭐⭐</button>
<button data-stars="3">⭐⭐⭐</button>
<button data-stars="4">⭐⭐⭐⭐</button>
<button data-stars="5">⭐⭐⭐⭐⭐</button>

</div>

<button id="submitRating"
class="rate-btn"
style="width:100%"
disabled>
Bewertung speichern
</button>

<button id="cancelRating"
style="
width:100%;
margin-top:8px;
padding:11px;
border:0;
border-radius:9px;
background:#252525;
color:#fff;
cursor:pointer;
">
Abbrechen
</button>

</div>
`;

document.body.appendChild(overlay);

let selected=0;

overlay.querySelectorAll("#ratingStars button")
.forEach(button=>{

button.onclick=()=>{

selected=Number(button.dataset.stars);

overlay.querySelectorAll("#ratingStars button")
.forEach(b=>{
b.classList.toggle(
"selected",
Number(b.dataset.stars)===selected
);
});

overlay.querySelector("#submitRating").disabled=false;

};

});

overlay.querySelector("#cancelRating").onclick=()=>{
overlay.remove();
};

overlay.querySelector("#submitRating").onclick=()=>{

const current=getRatings();

if(!Array.isArray(current[request.seller])){
current[request.seller]=[];
}

if(current[request.seller].some(r=>r.requestId===requestId)){
overlay.remove();
return;
}

current[request.seller].push({

buyer:username,
stars:selected,
createdAt:new Date().toISOString()

});

saveData("sellerRatings",current);

overlay.remove();

loadAll();

alert("⭐ Bewertung gespeichert!");

};

}

document.getElementById("sellForm")
.addEventListener("submit",function(event){

event.preventDefault();

const username=getUsername();

if(!username){

alert("👤 Bitte zuerst einen Benutzernamen festlegen.");
return;

}

const player=document.getElementById("player").value.trim();
const club=document.getElementById("club").value.trim();
const price=document.getElementById("price").value;
const condition=document.getElementById("condition").value;
const description=document.getElementById("description").value.trim();
const file=document.getElementById("image").files[0];

if(!player||!club||!price||!file){

alert("Bitte fülle alle Pflichtfelder aus.");
return;

}

const reader=new FileReader();

reader.onload=function(){

const image=new Image();

image.onload=function(){

const canvas=document.createElement("canvas");

const max=700;

let width=image.width;
let height=image.height;

if(width>height && width>max){

height=height*max/width;
width=max;

}else if(height>max){

width=width*max/height;
height=max;

}

canvas.width=width;
canvas.height=height;

const context=canvas.getContext("2d");

context.drawImage(
image,
0,
0,
width,
height
);

const imageData=
canvas.toDataURL("image/jpeg",.6);

const cards=getCards();

cards.unshift({

id:
Date.now()+"-"+Math.random()
.toString(36)
.slice(2),

player:player,
club:club,
price:price,
condition:condition,
description:description,

image:imageData,

owner:username,

sold:false,
soldTo:null

});

try{

saveData("footballCards",cards);

}catch(error){

alert(
"Der Speicher ist voll. Bitte lösche zuerst Karten."
);

return;

}

document.getElementById("sellForm").reset();

document.getElementById("photoPreview").style.display="none";

document.getElementById("photoPreview").src="";

closeSell();

loadAll();

showPage("cardsPage","navCards");

alert("🎉 Deine Karte wurde eingestellt!");

};

image.src=reader.result;

};

reader.readAsDataURL(file);

});

/* =====================================================
SICHERHEIT
===================================================== */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeAttribute(value){

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}
