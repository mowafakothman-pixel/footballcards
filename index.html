<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f6f8;
  color:#111827;
}

/* =========================
   HEADER
========================= */

.header{
  background:#111827;
  color:white;
  padding:24px 18px 20px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.logo h1{
  margin:0;
  font-size:25px;
}

.logo p{
  margin:3px 0 0;
  color:#aeb5c0;
  font-size:13px;
}

/* =========================
   PROFILE SWITCHER
========================= */

.profile-switcher{
  display:flex;
  align-items:center;
  gap:8px;
}

.user-select{
  border:1px solid #374151;
  background:#1f2937;
  color:white;
  padding:11px 13px;
  border-radius:12px;
  font-weight:600;
  outline:none;
}

.user-select option{
  color:#111;
  background:white;
}

.avatar-small{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

/* =========================
   TOP NAVIGATION
========================= */

.top-nav{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #e5e7eb;
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:10px 16px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  position:relative;
  flex:0 0 auto;
  border:none;
  background:transparent;
  color:#6b7280;
  padding:11px 15px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  transition:.18s;
}

.nav-btn:hover{
  background:#f3f4f6;
  color:#111827;
}

.nav-btn.active{
  background:#111827;
  color:white;
}

.badge{
  position:absolute;
  top:2px;
  right:2px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:999px;
  background:#ef4444;
  color:white;
  font-size:11px;
  display:none;
  align-items:center;
  justify-content:center;
  border:2px solid white;
}

/* =========================
   SEARCH
========================= */

.search-area{
  background:white;
  border-bottom:1px solid #e5e7eb;
  padding:16px;
}

.search{
  max-width:700px;
  margin:auto;
  position:relative;
}

.search input{
  width:100%;
  padding:15px 18px;
  border:1px solid #dfe3e8;
  border-radius:15px;
  font-size:16px;
  outline:none;
  background:#f9fafb;
}

.search input:focus{
  border-color:#111827;
  background:white;
}

/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:24px 16px 50px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  margin:0 0 18px;
  font-size:26px;
}

/* =========================
   SELL
========================= */

.sell-box{
  background:linear-gradient(135deg,#111827,#273244);
  color:white;
  border-radius:22px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 12px 35px rgba(17,24,39,.18);
}

.sell-box h2{
  margin:0 0 6px;
}

.sell-box p{
  margin:0 0 18px;
  color:#cbd5e1;
}

.sell-form{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.sell-form input{
  min-width:0;
  padding:13px;
  border:none;
  border-radius:11px;
  outline:none;
}

.sell-form button{
  border:none;
  border-radius:11px;
  background:white;
  color:#111827;
  font-weight:800;
  cursor:pointer;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:18px;
}

.card{
  background:white;
  border:1px solid #e8ebef;
  border-radius:20px;
  padding:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
  transition:transform .18s,box-shadow .18s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(0,0,0,.09);
}

.card-image{
  height:205px;
  border-radius:15px;
  background:#f3f4f6;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin:13px 0 4px;
  font-size:19px;
}

.info{
  color:#6b7280;
  margin:6px 0;
}

.price{
  font-size:23px;
  font-weight:800;
  margin:10px 0;
}

.card button{
  width:100%;
  border:none;
  padding:11px;
  border-radius:10px;
  margin-top:7px;
  background:#111827;
  color:white;
  font-weight:700;
  cursor:pointer;
}

.card button.gray{
  background:#eef0f2;
  color:#111827;
}

.card button.green{
  background:#16a34a;
}

.card button:disabled{
  opacity:.7;
  cursor:default;
}

/* =========================
   FAVORITE COUNT
========================= */

.favorite-count{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#f8fafc;
  border-radius:11px;
  padding:8px 11px;
  margin-top:8px;
  font-size:13px;
  color:#6b7280;
}

.favorite-count strong{
  color:#111827;
}

/* =========================
   STATUS
========================= */

.status{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:7px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:800;
}

.status.open{
  background:#fff4d6;
  color:#9a6700;
}

.status.accepted{
  background:#dcfce7;
  color:#15803d;
}

.status.rejected{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================
   REQUESTS
========================= */

.request-list{
  display:grid;
  gap:14px;
}

.request{
  background:white;
  border:1px solid #e7e9ed;
  border-radius:18px;
  padding:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.request-top{
  display:flex;
  align-items:center;
  gap:14px;
}

.request-image{
  width:92px;
  height:92px;
  object-fit:contain;
  background:#f3f4f6;
  border-radius:13px;
  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 5px;
}

.request-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.accept-btn,
.reject-btn{
  flex:1;
  border:none;
  padding:12px;
  border-radius:11px;
  color:white;
  font-weight:800;
  cursor:pointer;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

/* =========================
   PROFILE
========================= */

.profile-box{
  background:white;
  border:1px solid #e7e9ed;
  border-radius:22px;
  padding:24px;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
}

.profile-header{
  display:flex;
  align-items:center;
  gap:16px;
}

.big-avatar{
  width:78px;
  height:78px;
  border-radius:50%;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:29px;
  font-weight:900;
}

.profile-header h2{
  margin:0;
}

.rating-display{
  margin-top:6px;
  font-size:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px;
}

.stat{
  background:#f6f7f8;
  border-radius:14px;
  padding:16px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:23px;
}

.stat span{
  color:#6b7280;
  font-size:13px;
}

/* =========================
   RATING
========================= */

.rating-box{
  margin-top:22px;
  padding:18px;
  background:#f8fafc;
  border-radius:16px;
}

.rating-stars{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.rating-stars button{
  border:none;
  background:transparent;
  font-size:29px;
  cursor:pointer;
  padding:0;
  opacity:.35;
}

.rating-stars button.selected{
  opacity:1;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:white;
  border:1px dashed #d5d9df;
  border-radius:17px;
  padding:28px;
  text-align:center;
  color:#6b7280;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal{
  width:100%;
  max-width:440px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
}

.modal img{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:15px;
  background:#f3f4f6;
}

.modal h2{
  margin-bottom:5px;
}

.modal-close{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:none;
  border-radius:11px;
  background:#111827;
  color:white;
  font-weight:800;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:30px;
  color:#9ca3af;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .profile-switcher{
    width:100%;
  }

  .user-select{
    flex:1;
  }

  .sell-form{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .request-top{
    align-items:flex-start;
  }

}

@media(max-width:500px){

  .nav-inner{
    padding:8px;
  }

  .nav-btn{
    padding:10px 12px;
    font-size:13px;
  }

  .container{
    padding:18px 12px 40px;
  }

  .card-image{
    height:190px;
  }

  .request-top{
    flex-direction:column;
  }

  .request-image{
    width:100%;
    height:170px;
  }

  .request-actions{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-inner">

    <div class="logo">

      <div class="logo-icon">
        ⚽
      </div>

      <div>
        <h1>Pixel Cards</h1>
        <p>Der Marktplatz für Fußballkarten</p>
      </div>

    </div>

    <div class="profile-switcher">

      <div
        id="topAvatar"
        class="avatar-small"
      >
        ?
      </div>

      <select
        id="userSelect"
        class="user-select"
        onchange="switchUser(this.value)"
      >
        <option value="">
          Benutzer auswählen
        </option>
      </select>

    </div>

  </div>

</header>

<!-- =========================
     NAVIGATION
========================= -->

<nav class="top-nav">

  <div class="nav-inner">

    <button
      id="navCards"
      class="nav-btn active"
      onclick="showPage('cardsPage','navCards')"
    >
      🔥 Karten
    </button>

    <button
      id="navFavorites"
      class="nav-btn"
      onclick="showPage('favoritesPage','navFavorites')"
    >
      ❤️ Favoriten
    </button>

    <button
      id="navMine"
      class="nav-btn"
      onclick="showPage('minePage','navMine')"
    >
      🃏 Meine Karten
    </button>

    <button
      id="navRequests"
      class="nav-btn"
      onclick="showPage('requestsPage','navRequests')"
    >
      📩 Anfragen
      <span
        id="requestBadge"
        class="badge"
      >
        0
      </span>
    </button>

    <button
      id="navProfile"
      class="nav-btn"
      onclick="showPage('profilePage','navProfile')"
    >
      👤 Profil
    </button>

  </div>

</nav>

<!-- =========================
     SEARCH
========================= -->

<div class="search-area">

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
    >

  </div>

</div>

<main class="container">

<!-- =========================
     VERKAUFEN
========================= -->

<div class="sell-box">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte auf Pixel Cards ein.
  </p>

  <form
    id="sellForm"
    class="sell-form"
  >

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- =========================
     KARTEN
========================= -->

<section
  id="cardsPage"
  class="page active"
>

  <h2 class="page-title">
    🔥 Aktuelle Karten
  </h2>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section
  id="favoritesPage"
  class="page"
>

  <h2
    id="favoriteTitle"
    class="page-title"
  >
    ❤️ Meine Favoriten
  </h2>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     MEINE KARTEN
========================= -->

<section
  id="minePage"
  class="page"
>

  <h2 class="page-title">
    🃏 Meine Karten
  </h2>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     ANFRAGEN
========================= -->

<section
  id="requestsPage"
  class="page"
>

  <h2
    id="requestTitle"
    class="page-title"
  >
    📩 Meine Kaufanfragen
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br><br>

  <h2
    id="sellerRequestTitle"
    class="page-title"
  >
    📥 Anfragen für meine Karten
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- =========================
     PROFIL
========================= -->

<section
  id="profilePage"
  class="page"
>

  <h2 class="page-title">
    👤 Mein Profil
  </h2>

  <div
    id="profileBox"
    class="profile-box"
  ></div>

</section>

</main>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =====================================================
   DATENBANK / LOCAL STORAGE
===================================================== */

function getCards(){

  try{

    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];

  }catch(e){

    return [];

  }

}


function saveCards(cards){

  localStorage.setItem(
    "footballCards",
    JSON.stringify(cards)
  );

}


function getRequests(){

  try{

    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  }catch(e){

    return [];

  }

}


function saveRequests(requests){

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

}


function getRatings(){

  try{

    return JSON.parse(
      localStorage.getItem("sellerRatings")
    ) || {};

  }catch(e){

    return {};

  }

}


function saveRatings(ratings){

  localStorage.setItem(
    "sellerRatings",
    JSON.stringify(ratings)
  );

}


/* =====================================================
   BENUTZER
===================================================== */

function getUsername(){

  return (
    localStorage.getItem("pixelUsername") || ""
  ).trim();

}


function getUsers(){

  let users=[];

  const current =
    getUsername();

  if(current){
    users.push(current);
  }

  getCards().forEach(card=>{

    if(
      card.owner &&
      !users.includes(card.owner)
    ){

      users.push(card.owner);

    }

  });

  getRequests().forEach(request=>{

    if(
      request.buyer &&
      !users.includes(request.buyer)
    ){

      users.push(request.buyer);

    }

    if(
      request.seller &&
      !users.includes(request.seller)
    ){

      users.push(request.seller);

    }

  });

  return users;

}


function updateUserSelect(){

  const select =
    document.getElementById("userSelect");

  if(!select) return;

  const current =
    getUsername();

  const users =
    getUsers();

  select.innerHTML = "";

  const emptyOption =
    document.createElement("option");

  emptyOption.value="";
  emptyOption.textContent=
    "Benutzer auswählen";

  select.appendChild(emptyOption);

  users.forEach(name=>{

    const option =
      document.createElement("option");

    option.value=name;
    option.textContent=name;

    if(name===current){
      option.selected=true;
    }

    select.appendChild(option);

  });

}


function switchUser(name){

  if(!name){

    localStorage.removeItem(
      "pixelUsername"
    );

  }else{

    localStorage.setItem(
      "pixelUsername",
      name
    );

  }

  updateHeader();
  loadAll();

}


function updateHeader(){

  const name =
    getUsername();

  const avatar =
    document.getElementById(
      "topAvatar"
    );

  if(name){

    avatar.textContent =
      name.charAt(0).toUpperCase();

  }else{

    avatar.textContent="?";

  }

  updateUserSelect();

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(pageId,buttonId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{

      page.classList.remove(
        "active"
      );

    });

  const page =
    document.getElementById(pageId);

  if(page){
    page.classList.add("active");
  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(button=>{

      button.classList.remove(
        "active"
      );

    });

  const button =
    document.getElementById(buttonId);

  if(button){
    button.classList.add("active");
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   FAVORITEN
===================================================== */

/*
   Alte Daten werden weiterhin gelesen.
   Zusätzlich speichern wir Favoriten jetzt
   benutzerbezogen.
*/

function getFavoriteMap(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "favoriteCardsByUser"
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveFavoriteMap(map){

  localStorage.setItem(
    "favoriteCardsByUser",
    JSON.stringify(map)
  );

}


function getUserFavorites(){

  const username =
    getUsername();

  if(!username){
    return [];
  }

  const map =
    getFavoriteMap();

  return map[username] || [];

}


function isFavorite(cardId){

  return getUserFavorites()
    .includes(cardId);

}


function toggleFavorite(cardId){

  const username =
    getUsername();

  if(!username){

    alert(
      "👤 Bitte zuerst einen Benutzer auswählen."
    );

    return;

  }

  const card =
    getCards().find(
      c=>c.id===cardId
    );

  if(!card) return;

  if(card.owner===username){

    alert(
      "🚫 Deine eigene Karte kannst du nicht favorisieren."
    );

    return;

  }

  const map =
    getFavoriteMap();

  if(!map[username]){
    map[username]=[];
  }

  const index =
    map[username].indexOf(cardId);

  if(index>=0){

    map[username].splice(
      index,
      1
    );

  }else{

    map[username].push(
      cardId
    );

  }

  saveFavoriteMap(map);

  loadAll();

}


function getFavoriteCount(cardId){

  const map =
    getFavoriteMap();

  let count=0;

  Object.keys(map).forEach(user=>{

    if(
      Array.isArray(map[user]) &&
      map[user].includes(cardId)
    ){

      count++;

    }

  });

  /*
     Alte globale Favoriten berücksichtigen,
     falls vorhanden.
  */

  const old =
    (()=>{

      try{

        return JSON.parse(
          localStorage.getItem(
            "favoriteCards"
          )
        ) || [];

      }catch(e){

        return [];

      }

    })();

  const oldMatch =
    old.some(
      card=>card.id===cardId
    );

  if(
    oldMatch &&
    count===0
  ){

    count=1;

  }

  return count;

}

function loadCards(){

        "searchInput"
      )?.value || ""

    getCards();

  const filtered =

      return (

        String(card.player||"")
          .toLowerCase()
          .includes(search)

        ||

        String(card.club||"")
          .toLowerCase()
          .includes(search)

        ||

        String(card.owner||"")
          .toLowerCase()
          .includes(search)

      );

    });

  if(!filtered.length){

    box.innerHTML=
      `<div class="empty">

  filtered.forEach(card=>{

/* =====================================================
   SICHERHEIT / TEXT
===================================================== */

function safeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function safeAttr(value){

  return safeHtml(value);

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


/* =====================================================
   VERKAUFEN
===================================================== */

document
  .getElementById("sellForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username =
        getUsername();

      if(!username){

        alert(
          "👤 Bitte zuerst einen Benutzer auswählen."
        );

        return;

      }

      const player =
        document
          .getElementById("player")
          .value
          .trim();

      const club =
        document
          .getElementById("club")
          .value
          .trim();

      const price =
        document
          .getElementById("price")
          .value;

      const file =
        document
          .getElementById("image")
          .files[0];

      if(!file){

        alert(
          "Bitte ein Bild auswählen."
        );

        return;

      }

      const reader =
        new FileReader();

      reader.onload=function(){

        const image =
          new Image();

        image.onload=function(){

          const max=700;

          let width =
            image.width;

          let height =
            image.height;

          if(
            width>max ||
            height>max
          ){

            const ratio =
              Math.min(
                max/width,
                max/height
              );

            width =
              Math.round(
                width*ratio
              );

            height =
              Math.round(
                height*ratio
              );

          }

          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width=width;
          canvas.height=height;

          const context =
            canvas.getContext("2d");

          context.drawImage(
            image,
            0,
            0,
            width,
            height
          );

          const imageData =
            canvas.toDataURL(
              "image/jpeg",
              .65
            );

          const cards =
            getCards();

          cards.unshift({

            id:
              Date.now()+
              "-" +
              Math.random()
                .toString(36)
                .slice(2),

            player:player,

            club:club,

            price:price,

            image:imageData,

            owner:username,

            sold:false,

            soldTo:null

          });

          try{

            saveCards(cards);

          }catch(error){

            alert(
              "Der Speicher ist voll. Bitte lösche zuerst alte Karten."
            );

            return;

          }

          document
            .getElementById(
              "sellForm"
            )
            .reset();

          updateUserSelect();
          loadAll();

          alert(
            "🎉 Deine Karte wurde eingestellt!"
          );

        };

        image.src =
          reader.result;

      };

      reader.readAsDataURL(file);

    }
  );

function buyCard(cardId){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c=>c.id===cardId
    );

  if(!card){

    alert(
      "Karte nicht gefunden."
    );

    return;

  }

  if(card.owner===username){

    ownCardMessage();

    return;

  }

  if(card.sold){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests =
    getRequests();

  const existing =
    requests.find(request=>

      request.cardId===cardId &&

      request.buyer===username &&

      (
        request.status==="pending" ||
        request.status==="accepted"
      )

    );

  if(existing){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du diese Karte kaufen?\n\n"+
      card.player+
      " – "+
      card.club+
      "\nPreis: "+
      card.price+
      " €"
    );

  if(!confirmed) return;

  requests.push({

    id:
      Date.now()+
      "-" +
      Math.random()
        .toString(36)
        .slice(2),

    cardId:card.id,

    player:card.player,

    club:card.club,

    price:card.price,

    image:card.image,

    buyer:username,

    seller:card.owner,

    status:"pending",

    createdAt:
      new Date().toISOString()

  });

  saveRequests(requests);

  loadAll();

  alert(
    "📩 Deine Kaufanfrage wurde gesendet!"
  );

}

/* =====================================================
   ANNEHMEN
===================================================== */

function acceptRequest(requestId){

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r=>r.id===requestId
    );

  if(!request) return;

  if(
    request.seller!==username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(
    request.status!=="pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const card =
    getCards().find(
      c=>c.id===request.cardId
    );

  if(
    card &&
    card.sold
  ){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  if(
    !confirm(
      "Anfrage von "+
      request.buyer+
      " annehmen?"
    )
  ){

    return;

  }

  request.status=
    "accepted";

  const cards =
    getCards();

  const currentCard =
    cards.find(
      c=>c.id===request.cardId
    );

  if(currentCard){

    currentCard.sold=true;

    currentCard.soldTo=
      request.buyer;

  }

  /*
     Andere offene Anfragen für dieselbe
     Karte werden automatisch abgelehnt.
  */

  requests.forEach(other=>{

    if(
      other.cardId===request.cardId &&
      other.id!==request.id &&
      other.status==="pending"
    ){

      other.status="rejected";

    }

  });

  saveCards(cards);
  saveRequests(requests);

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}

function renderSellerProfile(
  seller,
  box,
  ownProfile
){

  const cards =
    getCards().filter(
      card =>
        card.owner===seller
    );

  const soldCards =
    cards.filter(
      card =>
        card.sold===true
    );

  const ratings =
    getRatings();

  const sellerRatings =
    Array.isArray(ratings[seller])
    ? ratings[seller]
    : [];

  let average=0;

  if(sellerRatings.length){

    average =
      sellerRatings.reduce(
        (sum,value)=>
          sum+Number(value),
        0
      ) /
      sellerRatings.length;

  }

  const rounded =
    Math.round(average);

  let stars="";

  for(let i=1;i<=5;i++){

    stars +=
      i<=rounded
      ? "⭐"
      : "☆";

  }

  box.innerHTML=`

    <div class="profile-header">

      <div class="big-avatar">
        ${safeHtml(
          seller.charAt(0).toUpperCase()
        )}
      </div>

      <div>

        <h2>
          ${safeHtml(seller)}
        </h2>

        <div class="rating-display">
          ${stars}
        </div>

        <div class="info">
          ${
            sellerRatings.length
            ? average.toFixed(1)+" / 5"
            : "Noch keine Bewertungen"
          }
        </div>

      </div>

    </div>

    <div class="stats">

      <div class="stat">

        <strong>
          ${soldCards.length}
        </strong>

        <span>
          Verkauft
        </span>

      </div>

      <div class="stat">

        <strong>
          ${cards.length}
        </strong>

        <span>
          Angebote
        </span>

      </div>

      <div class="stat">

        <strong>
          ${sellerRatings.length}
        </strong>

        <span>
          Bewertungen
        </span>

      </div>

    </div>

  `;

  /*
     Bewertung nur für andere Benutzer.
  */

  if(
    !ownProfile &&
    getUsername()
  ){

    const ratingBox =
      document.createElement(
        "div"
      );

    ratingBox.className=
      "rating-box";

    ratingBox.innerHTML=`

      <strong>
        ⭐ Verkäufer bewerten
      </strong>

      <div class="info">
        Deine Bewertung wird für diesen Verkäufer gespeichert.
      </div>

      <div class="rating-stars">

        ${[1,2,3,4,5]
          .map(number=>`

            <button
              type="button"
              onclick="rateSeller('${escapeJs(seller)}',${number})"
            >
              ☆
            </button>

          `)
          .join("")}

      </div>

    `;

    box.appendChild(
      ratingBox
    );

  }

  const heading =
    document.createElement(
      "h2"
    );

  heading.style.marginTop="28px";

  heading.textContent=
    "🏆 Eigene Angebote";

  box.appendChild(
    heading
  );

  const offers =
    document.createElement(
      "div"
    );

  offers.className="cards";

  if(!cards.length){

    offers.innerHTML=
      `<div class="empty">
        Keine Angebote vorhanden.
      </div>`;

  }else{

    cards.forEach(card=>{

      createCard(
        card,
        offers
      );

    });

  }

  box.appendChild(
    offers
  );

}


/* =====================================================
   BEWERTUNG
===================================================== */

function getRatingMap(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "userRatings"
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveRatingMap(map){

  localStorage.setItem(
    "userRatings",
    JSON.stringify(map)
  );

}


function rateSeller(
  seller,
  rating
){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  if(
    seller===username
  ){

    alert(
      "🚫 Du kannst dich nicht selbst bewerten."
    );

    return;

  }

  if(
    rating<1 ||
    rating>5
  ){

    return;

  }

  const ratings =
    getRatings();

  if(
    !Array.isArray(
      ratings[seller]
    )
  ){

    ratings[seller]=[];

  }

  const userRatings =
    getRatingMap();

  if(
    userRatings[username] &&
    userRatings[username][seller]
  ){

    const old =
      userRatings[username][seller];

    const index =
      ratings[seller].indexOf(old);

    if(index>=0){

      ratings[seller].splice(
        index,
        1
      );

    }

  }

  ratings[seller].push(
    rating
  );

  if(
    !userRatings[username]
  ){

    userRatings[username]={};

  }

  userRatings[username][seller]=
    rating;

  saveRatings(ratings);
  saveRatingMap(userRatings);

  loadOwnProfile();

  alert(
    "⭐ Bewertung gespeichert!"
  );

}

function showCard(cardId){

  const card =
    getCards().find(
      c=>c.id===cardId
    );

  if(!card) return;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className=
    "modal-backdrop";

  const favoriteCount =
    getFavoriteCount(card.id);

  overlay.innerHTML=`

    <div class="modal">

      <img
        src="${safeAttr(card.image)}"
        alt="${safeAttr(card.player)}"
      >

      <h2>
        ${safeHtml(card.player)}
      </h2>

      <p class="info">
        ${safeHtml(card.club)}
      </p>

      <p class="price">
        ${safeHtml(card.price)} €
      </p>

      <p class="info">
        👤 Verkäufer:
        <strong>
          ${safeHtml(card.owner)}
        </strong>
      </p>

      <div class="favorite-count">

        <span>
          ❤️ Favorisiert von
        </span>

        <strong>
          ${favoriteCount}
        </strong>

      </div>

      <button
        class="modal-close"
        id="modalClose"
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  overlay
    .querySelector(
      "#modalClose"
    )
    .onclick=function(){

      overlay.remove();

    };

  overlay.addEventListener(
    "click",
    function(event){

      if(
        event.target===overlay
      ){

        overlay.remove();

      }

    }
  );

}

/* =====================================================

===================================================== */

function updateRequestBadge(){

  const username =
    getUsername();

  const badge =
    document.getElementById(
      "requestBadge"
    );

  if(!badge) return;

  if(!username){

    badge.style.display=
      "none";

    return;

  }

  const incoming =
    getRequests().filter(
      request =>

        request.seller===username &&
        request.status==="pending"

    ).length;

  if(incoming>0){

    badge.textContent=
      incoming>99
      ? "99+"
      : incoming;

    badge.style.display=
      "flex";

  }else{

    badge.style.display=
      "none";

  }

}
