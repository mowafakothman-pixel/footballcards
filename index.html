<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  color: #ccc;
}

.search {
  padding: 20px;
  background: white;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 600px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.sell {
  background: #111;
  color: white;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 20px;
}

.sell h2 {
  margin-top: 0;
}

.sell input {
  margin: 5px;
  padding: 11px;
  border-radius: 9px;
  border: none;
}

.sell button,
.card button {
  border: none;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.sell button {
  background: white;
  color: #111;
}

.cards,
.favorite-cards,
.purchase-requests {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.10);
}

.card-image {
  width: 100%;
  height: 200px;
  border-radius: 14px;
  background: #f1f1f1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 12px;
}

.card h3 {
  margin-bottom: 6px;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 10px 0;
}

.info {
  color: #666;
}

.card button {
  background: #111;
  color: white;
  width: 100%;
  margin-top: 8px;
}

.card button.light {
  background: #f1f1f1;
  color: #111;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="search">
  <input
    type="text"
    placeholder="🔎 Suche nach Spieler, Verein oder Karte..."
  >
</div>

<div class="container">

  <div class="sell">
    <h2>Du willst eine Karte verkaufen?</h2>
    <p>Stelle deine Fußballkarte schnell und einfach ein.</p>

    <form id="sellForm">
      <input id="player" type="text" placeholder="Spieler" required>
      <input id="club" type="text" placeholder="Verein" required>
      <input
        id="price"
        type="number"
        placeholder="Preis in €"
        min="0"
        step="0.01"
        required
      >
      <input id="image" type="file" accept="image/*" required>
      <button type="submit">Karte einstellen</button>
    </form>
  </div>

  <h2>🔥 Aktuelle Karten</h2>
  <div class="cards"></div>

  <h2 id="favoriteTitle">❤️ Favoriten (0)</h2>
  <div class="favorite-cards"></div>

  <h2>🃏 Meine Karten</h2>
  <div class="my-cards"></div>

  <h2 id="requestTitle">📩 Meine Kaufanfragen (0)</h2>
  <div class="purchase-requests"></div>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

const sellForm = document.getElementById("sellForm");
const searchInput = document.querySelector(".search input");
const cards = document.querySelector(".cards");
const myCards = document.querySelector(".my-cards");
const favoriteCards = document.querySelector(".favorite-cards");


function createCard(player, club, price, imageData) {

  const newCard = document.createElement("div");
  newCard.className = "card";

  const favorites =
    JSON.parse(localStorage.getItem("favoriteCards")) || [];

  const isFavorite = favorites.some(card =>
    card.player === player &&
    card.club === club &&
    card.price === price &&
    card.image === imageData
  );

  const favoriteText = isFavorite
    ? "❤️ Favorisiert"
    : "♡ Favorit";

  newCard.innerHTML = `
    <div class="card-image">
      <img src="${imageData}" alt="${player}">
    </div>

    <h3>${player}</h3>
    <p class="info">${club}</p>
    <p class="price">${price} €</p>

    <button onclick="showCard('${player}', '${club}', '${price}', '${imageData}')">
      👀 Karte ansehen
    </button>

    <button onclick="buyCard('${player}', '${club}', '${price}', '${imageData}')">
      🛒 Kaufen
    </button>

    <button onclick="toggleFavorite('${player}', '${club}', '${price}', '${imageData}')">
      ${favoriteText}
    </button>
  `;

  cards.appendChild(newCard);
}


function loadCards() {

  const savedCards =
    JSON.parse(localStorage.getItem("footballCards")) || [];

  cards.innerHTML = "";

  const searchText =
    searchInput.value.toLowerCase();

  savedCards.forEach(card => {

    const matches =
      card.player.toLowerCase().includes(searchText) ||
      card.club.toLowerCase().includes(searchText);

    if (matches) {
      createCard(
        card.player,
        card.club,
        card.price,
        card.image
      );
    }

  });
}


function loadMyCards() {

  const savedCards =
    JSON.parse(localStorage.getItem("footballCards")) || [];

  myCards.innerHTML = "";

  if (savedCards.length === 0) {

    myCards.innerHTML =
      "<p>Noch keine eigenen Karten eingestellt.</p>";

    return;
  }

  savedCards.forEach((card, index) => {

    const item = document.createElement("div");
    item.className = "card";

    item.innerHTML = `
      <div class="card-image">
        <img src="${card.image}" alt="${card.player}">
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button onclick="deleteCard(${index})">
        🗑️ Karte löschen
      </button>
    `;

    myCards.appendChild(item);

  });
}


function loadFavorites() {

  const favorites =
    JSON.parse(localStorage.getItem("favoriteCards")) || [];

  document.getElementById("favoriteTitle").textContent =
    "❤️ Favoriten (" + favorites.length + ")";

  favoriteCards.innerHTML = "";

  if (favorites.length === 0) {

    favoriteCards.innerHTML =
      "<p>Noch keine Favoriten gespeichert.</p>";

    return;
  }

  favorites.forEach(card => {

    const item = document.createElement("div");
    item.className = "card";

    item.innerHTML = `
      <div class="card-image">
        <img src="${card.image}" alt="${card.player}">
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button onclick="showCard('${card.player}', '${card.club}', '${card.price}', '${card.image}')">
        👀 Karte ansehen
      </button>

      <button
        class="light"
        onclick="toggleFavorite('${card.player}', '${card.club}', '${card.price}', '${card.image}')"
      >
        ❤️ Entfernen
      </button>
    `;

    favoriteCards.appendChild(item);

  });
}


function toggleFavorite(player, club, price, imageData) {

  const favorites =
    JSON.parse(localStorage.getItem("favoriteCards")) || [];

  const existingIndex =
    favorites.findIndex(card =>
      card.player === player &&
      card.club === club &&
      card.price === price &&
      card.image === imageData
    );

  if (existingIndex !== -1) {

    favorites.splice(existingIndex, 1);

    alert("Aus Favoriten entfernt!");

  } else {

    favorites.push({
      player: player,
      club: club,
      price: price,
      image: imageData
    });

    alert("Zu Favoriten hinzugefügt!");

  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(favorites)
  );

  loadFavorites();
  loadCards();
}


sellForm.addEventListener("submit", function(event) {

  event.preventDefault();

  const player =
    document.getElementById("player").value;

  const club =
    document.getElementById("club").value;

  const price =
    document.getElementById("price").value;

  const image =
    document.getElementById("image").files[0];

  if (!image) {

    alert("Bitte wähle ein Foto aus!");

    return;
  }

  const reader = new FileReader();

  reader.onload = function() {

    const img = new Image();

    img.onload = function() {

      const canvas =
        document.createElement("canvas");

      const maxSize = 700;

      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {

        height =
          height * (maxSize / width);

        width = maxSize;

      } else if (height > maxSize) {

        width =
          width * (maxSize / height);

        height = maxSize;

      }

      canvas.width = width;
      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );

      const imageData =
        canvas.toDataURL(
          "image/jpeg",
          0.6
        );

      const savedCards =
        JSON.parse(
          localStorage.getItem("footballCards")
        ) || [];

      savedCards.unshift({

        player: player,
        club: club,
        price: price,
        image: imageData

      });

      try {

        localStorage.setItem(
          "footballCards",
          JSON.stringify(savedCards)
        );

      } catch (error) {

        alert(
          "Der Speicher ist voll. Bitte lösche zuerst eine Karte."
        );

        return;
      }

      sellForm.reset();

      loadCards();
      loadMyCards();

      alert(
        "Deine Karte wurde eingestellt und gespeichert!"
      );

    };

    img.src = reader.result;

  };

  reader.readAsDataURL(image);

});


function deleteCard(index) {

  const savedCards =
    JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];

  savedCards.splice(index, 1);

  localStorage.setItem(
    "footballCards",
    JSON.stringify(savedCards)
  );

  loadCards();
  loadMyCards();
}


searchInput.addEventListener(
  "input",
  function() {
    loadCards();
  }
);


function loadPurchaseRequests() {

  const requests =
    JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  const requestBox =
    document.querySelector(".purchase-requests");

  const requestTitle =
    document.getElementById("requestTitle");

  requestTitle.textContent =
    "📩 Meine Kaufanfragen (" +
    requests.length +
    ")";

  requestBox.innerHTML = "";

  if (requests.length === 0) {

    requestBox.innerHTML =
      "<p>Noch keine Kaufanfragen gesendet.</p>";

    return;
  }

  requests.forEach((request, index) => {

    const item =
      document.createElement("div");

    item.className = "card";

    item.innerHTML = `
      <div class="card-image">
        <img
          src="${request.image}"
          alt="${request.player}"
        >
      </div>

      <h3>${request.player}</h3>

      <p class="info">
        ${request.club}
      </p>

      <p class="price">
        ${request.price} €
      </p>

      <p>
        🕐 Kaufanfrage gesendet
      </p>

      <button
        class="light"
        onclick="deletePurchaseRequest(${index})"
      >
        ❌ Anfrage zurückziehen
      </button>
    `;

    requestBox.appendChild(item);

  });
}


function buyCard(
  player,
  club,
  price,
  imageData
) {

  const confirmBuy =
    confirm(
      "Möchtest du diese Karte kaufen?\n\n" +
      player +
      " – " +
      club +
      "\n" +
      "Preis: " +
      price +
      " €"
    );

  if (!confirmBuy) {
    return;
  }

  const requests =
    JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  requests.push({

    player: player,
    club: club,
    price: price,
    image: imageData

  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadPurchaseRequests();

  alert(
    "Kaufanfrage für " +
    player +
    " wurde gespeichert!"
  );
}


function deletePurchaseRequest(index) {

  const confirmDelete =
    confirm(
      "Möchtest du diese Kaufanfrage wirklich zurückziehen?"
    );

  if (!confirmDelete) {
    return;
  }

  const requests =
    JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  requests.splice(index, 1);

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadPurchaseRequests();

  alert(
    "Kaufanfrage wurde zurückgezogen!"
  );
}


function showCard(
  player,
  club,
  price,
  imageData
) {

  const overlay =
    document.createElement("div");

  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background =
    "rgba(0,0,0,0.7)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "9999";
  overlay.style.padding = "20px";

  overlay.innerHTML = `
    <div style="
      background:white;
      padding:20px;
      border-radius:18px;
      width:100%;
      max-width:400px;
      text-align:center;
    ">

      <img
        src="${imageData}"
        alt="${player}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:12px;
        "
      >

      <h2>${player}</h2>

      <p>${club}</p>

      <p style="
        font-size:24px;
        font-weight:bold;
      ">
        ${price} €
      </p>

      <button
        id="closeCard"
        style="
          border:none;
          background:#111;
          color:white;
          padding:12px 22px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>
  `;

  document.body.appendChild(overlay);

  document.getElementById(
    "closeCard"
  ).onclick = function() {

    overlay.remove();

  };

}


loadCards();
loadMyCards();
loadFavorites();
loadPurchaseRequests();

</script>

</body>
</html>
