<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#111;
}

/* =========================
   HEADER
========================= */

header{
  background:#111;
  color:white;
  padding:24px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  color:#aaa;
}

/* =========================
   PROFILBAR
========================= */

.profile-bar{
  background:white;
  border-bottom:1px solid #ddd;
  padding:12px 18px;
  position:sticky;
  top:0;
  z-index:1000;
}

.profile-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.profile-user{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.profile-controls{
  display:flex;
  gap:7px;
}

.profile-controls input{
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  width:150px;
}

.primary-btn{
  border:none;
  background:#111;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   SUCHE
========================= */

.search{
  background:white;
  padding:16px;
  text-align:center;
  border-bottom:1px solid #eee;
}

.search input{
  width:90%;
  max-width:650px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

/* =========================
   CONTAINER
========================= */

.container{
  width:100%;
  max-width:1150px;
  margin:auto;
  padding:18px;
}

/* =========================
   VERKAUFEN
========================= */

.sell{
  background:#111;
  color:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:18px;
  text-align:center;
}

.sell h2{
  margin-top:0;
}

.sell form{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.sell input{
  padding:12px;
  border:none;
  border-radius:9px;
}

.sell button{
  padding:12px 18px;
  border:none;
  border-radius:9px;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   NAVIGATION OBEN
========================= */

.navigation{
  position:sticky;
  top:67px;
  z-index:900;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 0;
  margin-bottom:18px;
  background:#f4f5f7;
}

.navigation button{
  flex:1;
  min-width:125px;
  border:none;
  background:white;
  padding:13px 10px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
  cursor:pointer;
  position:relative;
}

.navigation button.active{
  background:#111;
  color:white;
}

.badge{
  position:absolute;
  top:-5px;
  right:-4px;
  min-width:20px;
  height:20px;
  padding:2px 5px;
  border-radius:20px;
  background:#dc2626;
  color:white;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   SEITEN
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   KARTEN
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:17px;
}

.card{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card-image{
  width:100%;
  height:205px;
  background:#f0f1f2;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin:12px 0 5px;
}

.info{
  color:#666;
  margin:6px 0;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}

.card button{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:none;
  border-radius:9px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.card button.gray{
  background:#eee;
  color:#111;
}

.card button:disabled{
  opacity:.6;
  cursor:default;
}

.favorite-count{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

/* =========================
   STATUS
========================= */

.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}

.status.open{
  background:#fff1d6;
  color:#946200;
}

.status.accepted{
  background:#ddf7e5;
  color:#137333;
}

.status.rejected{
  background:#ffe1e1;
  color:#b42318;
}

/* =========================
   ANFRAGEN
========================= */

.request-list{
  display:grid;
  gap:14px;
}

.request{
  background:white;
  padding:17px;
  border-radius:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:90px;
  height:90px;
  object-fit:contain;
  background:#f1f1f1;
  border-radius:12px;
  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 6px;
}

.request-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.accept-btn,
.reject-btn{
  border:none;
  color:white;
  padding:12px 17px;
  border-radius:10px;
  font-weight:bold;
  flex:1;
  cursor:pointer;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

/* =========================
   PROFILE
========================= */

.seller-profile{
  background:white;
  border-radius:20px;
  padding:24px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.seller-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.seller-header h2{
  margin:0;
}

.rating{
  font-size:22px;
  margin-top:8px;
}

.rating-number{
  font-size:14px;
  color:#777;
  margin-left:6px;
}

.seller-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px;
}

.seller-stat{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.seller-stat strong{
  display:block;
  font-size:23px;
}

.seller-stat span{
  color:#777;
  font-size:13px;
}

/* =========================
   BEWERTUNG
========================= */

.rating-box{
  margin-top:20px;
  padding:18px;
  background:#f5f5f5;
  border-radius:15px;
}

.rating-stars{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.rating-star{
  border:none;
  background:none;
  font-size:30px;
  cursor:pointer;
}

/* =========================
   LEER
========================= */

.empty{
  background:white;
  padding:25px;
  border-radius:15px;
  color:#777;
  text-align:center;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.modal{
  background:white;
  padding:22px;
  border-radius:20px;
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  text-align:center;
}

.modal img{
  width:100%;
  max-height:350px;
  object-fit:contain;
  border-radius:14px;
}

.modal button{
  width:100%;
  border:none;
  background:#111;
  color:white;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:35px;
  color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .profile-inner{
    flex-direction:column;
    align-items:stretch;
  }

  .profile-user{
    justify-content:center;
  }

  .profile-controls{
    width:100%;
  }

  .profile-controls input{
    flex:1;
    width:auto;
  }

  .navigation{
    top:116px;
  }

  .sell input{
    width:100%;
  }

  .sell button{
    width:100%;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-actions{
    flex-direction:column;
  }

  .seller-stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- =========================
     PROFIL
========================= -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div id="avatar" class="avatar">?</div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        id="saveUsernameBtn"
        class="primary-btn"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- =========================
     SUCHE
========================= -->

<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
  >

</div>

<div class="container">

<!-- =========================
     VERKAUFEN
========================= -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm">

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- =========================
     NAVIGATION
========================= -->

<div class="navigation">

  <button
    data-page="cardsPage"
    class="nav-btn active"
  >
    🔥 Karten
  </button>

  <button
    data-page="favoritesPage"
    class="nav-btn"
  >
    ❤️ Favoriten
  </button>

  <button
    data-page="minePage"
    class="nav-btn"
  >
    🃏 Meine Karten
  </button>

  <button
    data-page="requestsPage"
    class="nav-btn"
    id="requestsNav"
  >
    📩 Anfragen
    <span
      id="requestBadge"
      class="badge"
      style="display:none;"
    >
      0
    </span>
  </button>

  <button
    data-page="profilePage"
    class="nav-btn"
  >
    👤 Profil
  </button>

</div>

<!-- =========================
     KARTEN
========================= -->

<section
  id="cardsPage"
  class="page active"
>

  <h2>🔥 Aktuelle Karten</h2>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section
  id="favoritesPage"
  class="page"
>

  <h2 id="favoriteTitle">
    ❤️ Favoriten (0)
  </h2>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     MEINE KARTEN
========================= -->

<section
  id="minePage"
  class="page"
>

  <h2>🃏 Meine Karten</h2>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     ANFRAGEN
========================= -->

<section
  id="requestsPage"
  class="page"
>

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- =========================
     PROFIL
========================= -->

<section
  id="profilePage"
  class="page"
>

  <h2>👤 Profil</h2>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =====================================================
   PIXEL CARDS
   SAUBERE VERSION
===================================================== */

/* =========================
   STORAGE
========================= */

const STORAGE = {
  username: "pixelUsername",
  cards: "footballCards",
  requests: "purchaseRequests",
  favorites: "pixelFavoritesByUser",
  ratings: "sellerRatings"
};


/* =========================
   SICHERE ID
========================= */

function createId(){

  return Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,10);

}


/* =========================
   STORAGE FUNKTIONEN
========================= */

function getUsername(){

  return (
    localStorage.getItem(
      STORAGE.username
    ) || ""
  ).trim();

}


function getCards(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE.cards
      )
    ) || [];

  }catch(e){

    return [];

  }

}


function saveCards(cards){

  localStorage.setItem(
    STORAGE.cards,
    JSON.stringify(cards)
  );

}


function getRequests(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE.requests
      )
    ) || [];

  }catch(e){

    return [];

  }

}


function saveRequests(requests){

  localStorage.setItem(
    STORAGE.requests,
    JSON.stringify(requests)
  );

}


function getAllFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE.favorites
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveAllFavorites(data){

  localStorage.setItem(
    STORAGE.favorites,
    JSON.stringify(data)
  );

}


function getUserFavorites(){

  const username =
    getUsername();

  if(!username) return [];

  const all =
    getAllFavorites();

  return all[username] || [];

}


function saveUserFavorites(ids){

  const username =
    getUsername();

  if(!username) return;

  const all =
    getAllFavorites();

  all[username] =
    ids;

  saveAllFavorites(all);

}


function getRatings(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE.ratings
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveRatings(data){

  localStorage.setItem(
    STORAGE.ratings,
    JSON.stringify(data)
  );

}


/* =========================
   PROFIL
========================= */

function updateProfile(){

  const username =
    getUsername();

  const name =
    document.getElementById(
      "profileName"
    );

  const avatar =
    document.getElementById(
      "avatar"
    );

  const input =
    document.getElementById(
      "usernameInput"
    );

  if(username){

    name.textContent =
      username;

    avatar.textContent =
      username
        .charAt(0)
        .toUpperCase();

    input.value =
      username;

  }else{

    name.textContent =
      "Kein Benutzer";

    avatar.textContent =
      "?";

    input.value =
      "";

  }

}


function saveUsername(){

  const input =
    document.getElementById(
      "usernameInput"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  localStorage.setItem(
    STORAGE.username,
    name
  );

  updateProfile();
  loadAll();

  alert(
    "👤 Profil gespeichert!"
  );

}


/* =========================
   NAVIGATION
========================= */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });

  const page =
    document.getElementById(
      pageId
    );

  if(page){

    page.classList.add(
      "active"
    );

  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(button => {

      button.classList.remove(
        "active"
      );

      if(
        button.dataset.page ===
        pageId
      ){

        button.classList.add(
          "active"
        );

      }

    });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   NAVIGATION EVENTS
========================= */

document
  .querySelectorAll(".nav-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        showPage(
          this.dataset.page
        );

      }
    );

  });


/* =========================
   FAVORITEN
========================= */

function isFavorite(cardId){

  return getUserFavorites()
    .includes(cardId);

}


function getFavoriteCount(cardId){

  const all =
    getAllFavorites();

  let count = 0;

  Object.values(all)
    .forEach(list => {

      if(
        Array.isArray(list) &&
        list.includes(cardId)
      ){

        count++;

      }

    });

  return count;

}


function toggleFavorite(cardId){

  const username =
    getUsername();

  if(!username){

    alert(
      "👤 Bitte zuerst einen Benutzernamen festlegen."
    );

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c => c.id === cardId
    );

  if(!card) return;

  if(
    card.owner ===
    username
  ){

    alert(
      "🚫 Deine eigene Karte kann nicht favorisiert werden."
    );

    return;

  }

  let favorites =
    getUserFavorites();

  if(
    favorites.includes(cardId)
  ){

    favorites =
      favorites.filter(
        id => id !== cardId
      );

  }else{

    favorites.push(
      cardId
    );

  }

  saveUserFavorites(
    favorites
  );

  loadAll();

}


function loadFavorites(){

  const box =
    document.getElementById(
      "favoriteCards"
    );

  const ids =
    getUserFavorites();

  const cards =
    getCards().filter(
      card =>
        ids.includes(card.id)
    );

  document
    .getElementById(
      "favoriteTitle"
    )
    .textContent =
      "❤️ Favoriten (" +
      cards.length +
      ")";

  box.innerHTML = "";

  if(!cards.length){

    box.innerHTML =
      "<div class='empty'>❤️ Noch keine Favoriten.</div>";

    return;

  }

  cards.forEach(card => {

    renderCard(
      card,
      box
    );

  });

}


/* =========================
   KARTEN RENDERN
========================= */

function renderCard(
  card,
  box
){

  const username =
    getUsername();

  const favorite =
    isFavorite(
      card.id
    );

  const favoriteCount =
    getFavoriteCount(
      card.id
    );

  const requests =
    getRequests();

  const ownCard =
    username &&
    card.owner ===
    username;

  const myRequest =
    requests.find(
      request =>

        request.cardId ===
        card.id &&

        request.buyer ===
        username &&

        (
          request.status ===
          "pending" ||

          request.status ===
          "accepted"
        )
    );

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "card";

  const image =
    document.createElement(
      "div"
    );

  image.className =
    "card-image";

  const img =
    document.createElement(
      "img"
    );

  img.src =
    card.image;

  img.alt =
    card.player;

  image.appendChild(
    img
  );

  item.appendChild(
    image
  );

  const title =
    document.createElement(
      "h3"
    );

  title.textContent =
    card.player;

  item.appendChild(
    title
  );

  const club =
    document.createElement(
      "p"
    );

  club.className =
    "info";

  club.textContent =
    card.club;

  item.appendChild(
    club
  );

  const price =
    document.createElement(
      "p"
    );

  price.className =
    "price";

  price.textContent =
    card.price +
    " €";

  item.appendChild(
    price
  );

  const seller =
    document.createElement(
      "p"
    );

  seller.className =
    "info";

  seller.innerHTML =
    "👤 Verkäufer: ";

  const sellerStrong =
    document.createElement(
      "strong"
    );

  sellerStrong.textContent =
    card.owner ||
    "Unbekannt";

/* =========================
   KARTE VERKAUFEN
========================= */

document
  .getElementById(
    "sellForm"
  )
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username =
        getUsername();

      if(!username){

        needUsername();

        return;

      }

      const player =
        document
          .getElementById(
            "player"
          )
          .value
          .trim();

      const club =
        document
          .getElementById(
            "club"
          )
          .value
          .trim();

      const price =
        document
          .getElementById(
            "price"
          )
          .value;

      const file =
        document
          .getElementById(
            "image"
          )
          .files[0];

      if(!file){

        alert(
          "Bitte wähle ein Foto aus."
        );

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const image =
            new Image();

          image.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );

              const max =
                700;

              let width =
                image.width;

              let height =
                image.height;

              if(
                width >
                height &&
                width >
                max
              ){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }else if(
                height >
                max
              ){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }

              canvas.width =
                width;

              canvas.height =
                height;

              canvas
                .getContext(
                  "2d"
                )
                .drawImage(
                  image,
                  0,
                  0,
                  width,
                  height
                );

              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  .6
                );

              const cards =
                getCards();

              cards.unshift({

                id:
                  createId(),

                player:
                  player,

                club:
                  club,

                price:
                  price,

                image:
                  imageData,

                owner:
                  username,

                sold:
                  false,

                soldTo:
                  null

              });

              try{

                saveCards(
                  cards
                );

              }catch(error){

                alert(
                  "Der Speicher ist voll. Bitte lösche zuerst Karten."
                );

                return;

              }

              document
                .getElementById(
                  "sellForm"
                )
                .reset();

              loadAll();

              alert(
                "🎉 Deine Karte wurde eingestellt!"
              );

            };

          image.src =
            reader.result;

        };

      reader.readAsDataURL(
        file
      );

    }
  );

   KAUFEN
========================= */

function buyCard(cardId){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c => c.id === cardId
    );

  if(!card) return;

  if(
    card.owner ===
    username
  ){

    ownCardMessage();

    return;

  }

  if(card.sold){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests =
    getRequests();

  const already =
    requests.find(
      request =>

        request.cardId ===
        cardId &&

        request.buyer ===
        username &&

        (
          request.status ===
          "pending" ||

          request.status ===
          "accepted"
        )
    );

  if(already){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du diese Karte kaufen?\n\n" +
      card.player +
      " – " +
      card.club +
      "\nPreis: " +
      card.price +
      " €"
    );

  if(!confirmed) return;

  requests.push({

    id:
      createId(),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      username,

    seller:
      card.owner,

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  });

  saveRequests(
    requests
  );

  loadAll();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}

/* =========================
   ANNEHMEN
========================= */

function acceptRequest(
  requestId
){

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id ===
        requestId
    );

  if(!request) return;

  if(
    request.seller !==
    username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(
    request.status !==
    "pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id ===
        request.cardId
    );

  if(!card){

    alert(
      "Die Karte wurde nicht gefunden."
    );

    return;

  }

  if(card.sold){

    alert(
      "🔒 Die Karte wurde bereits verkauft."
    );

    return;

  }

  if(
    !confirm(
      "Anfrage von " +
      request.buyer +
      " annehmen?"
    )
  ){

    return;

  }

  request.status =
    "accepted";

  card.sold =
    true;

  card.soldTo =
    request.buyer;

  saveCards(
    cards
  );

  saveRequests(
    requests
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}

   ABLEHNEN

function loadSellerProfile(
  seller
){

    document.getElementById(
      "profileBox"
    );

    "";

    getCards().filter(
      card =>
        card.owner ===
        seller
    );

  const soldCards =
    cards.filter(
      card =>
        card.sold ===
        true
    );

  const ratings =
    getRatings();

  const sellerRatings =
    Array.isArray(
      ratings[seller]
    )
    ? ratings[seller]
    : [];

  let average =
    0;

  if(
    sellerRatings.length
  ){

    average =
      sellerRatings.reduce(
        (sum,value) =>
          sum + Number(value),
        0
      ) /
      sellerRatings.length;

  }

  const header =
    document.createElement(
      "div"

    "seller-header";

    );

      "h2"
    );

    );

        )
      );

    const number =
      document.createElement(
        "span"
      );

    number.className =
      "rating-number";

    number.textContent =
      average.toFixed(1) +
      " (" +
      sellerRatings.length +
      ")";

    rating.appendChild(
      number
    );

  }else{

  }

  headInfo.appendChild(
    rating

  header.appendChild(

  );

  box.appendChild(

  const stats =

      <strong>${soldCards.length}</strong>
      <span>Verkauft</span>

      <strong>${cards.length}</strong>

      <strong>${average ? average.toFixed(1) : "-"}</strong>
      <span>Bewertung</span>
    </div>

  box.appendChild(

  /* BEWERTUNG */

  const username =
    getUsername();

  if(

      document.createElement(
        "strong"
      );

    heading.textContent =
      "⭐ Verkäufer bewerten";

    ratingBox.appendChild(
      heading
    );

    const stars =
      document.createElement(
        "div"
      );

    stars.className =
      "rating-stars";

    for(
      let i = 1;
      i <= 5;
      i++
    ){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "rating-star";

      button.textContent =
        "☆";

      button.addEventListener(
        "click",
        function(){

          rateSeller(
            seller,
            i
          );

        }
      );

      stars.appendChild(
        button
      );

    }

    ratingBox.appendChild(
      stars
    );

    box.appendChild(
      ratingBox
    );

  }

  /* ANGEBOTE */

  const heading =
    document.createElement(
      "h2"
    );

  heading.textContent =
    "🏆 Eigene Angebote";

  box.appendChild(
    heading
  );

  const offers =
    document.createElement(
      "div"
    );

  offers.className =
    "cards";

  if(!cards.length){

    offers.innerHTML =
      "<div class='empty'>Keine Angebote vorhanden.</div>";

  }else{

    cards.forEach(
      card => {

        /*
          WICHTIG:
          renderCard erzeugt die Buttons
          unabhängig von der Profilansicht.
          Dadurch bleiben sie funktionstüchtig.
        */

        renderCard(
          card,
          offers
        );

      }
    );

  }

  box.appendChild(
    offers
  );

}


/* =========================
   BEWERTUNG SPEICHERN
========================= */

function rateSeller(
  seller,
  stars
){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  if(
    username ===
    seller
  ){

    alert(
      "🚫 Du kannst dich nicht selbst bewerten."
    );

    return;

  }

  const ratings =
    getRatings();

  if(
    !Array.isArray(
      ratings[seller]
    )
  ){

    ratings[seller] =
      [];

  }

  ratings[seller].push(
    Number(stars)
  );

  saveRatings(
    ratings
  );

  loadSellerProfile(
    seller
  );

  alert(
    "⭐ Bewertung gespeichert!"
  );

}


/* =========================
   KARTE ANSEHEN
========================= */

function showCard(
  cardId
){

  const card =
    getCards().find(
      c =>
        c.id ===
        cardId
    );

  if(!card) return;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "modal-bg";

  const modal =
    document.createElement(
      "div"
    );

  modal.className =
    "modal";

  const image =
    document.createElement(
      "img"
    );

  image.src =
    card.image;

  image.alt =
    card.player;

  modal.appendChild(
    image
  );

  const title =
    document.createElement(
      "h2"
    );

  title.textContent =
    card.player;

  modal.appendChild(
    title
  );

  const club =
    document.createElement(
      "p"
    );

  club.textContent =
    card.club;

  modal.appendChild(
    club
  );

  const price =
    document.createElement(
      "p"
    );

  price.style.fontSize =
    "25px";

  price.style.fontWeight =
    "bold";

  price.textContent =
    card.price +
    " €";

  modal.appendChild(
    price
  );

  const seller =
    document.createElement(
      "p"
    );

  seller.textContent =
    "👤 Verkäufer: " +
    card.owner;

  modal.appendChild(
    seller
  );

  const favorites =
    document.createElement(
      "p"
    );

  favorites.textContent =
    "❤️ " +
    getFavoriteCount(
      card.id
    ) +
    " Favoriten";

  modal.appendChild(
    favorites
  );

  const close =
    document.createElement(
      "button"
    );

  close.textContent =
    "Schließen";

  close.addEventListener(
    "click",
    function(){

      overlay.remove();

    }
  );

  modal.appendChild(
    close
  );

  overlay.appendChild(
    modal
  );

  overlay.addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        overlay
      ){

        overlay.remove();

      }

    }
  );

  document.body.appendChild(
    overlay
  );

}

){

  const badge =

      "none";

  }

}
