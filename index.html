<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  color:#bbb;
}

/* PROFILE */

.profile-bar{
  background:white;
  border-bottom:1px solid #ddd;
  padding:14px 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.profile-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

.profile-user{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.profile-controls{
  display:flex;
  gap:8px;
}

.profile-controls input{
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
}

.primary-btn{
  border:none;
  background:#111;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* SEARCH */

.search{
  background:white;
  padding:20px;
  text-align:center;
}

.search input{
  width:90%;
  max-width:650px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

/* CONTAINER */

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* SELL */

.sell{
  background:linear-gradient(135deg,#111,#252525);
  color:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:22px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.sell h2{
  margin-top:0;
}

.sell form{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.sell input{
  padding:12px;
  border:none;
  border-radius:9px;
}

.sell button{
  padding:12px 18px;
  border:none;
  border-radius:9px;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

/* NAVIGATION */

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:22px;
}

.navigation button{
  border:none;
  background:white;
  padding:15px 8px;
  border-radius:13px;
  font-weight:bold;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
  cursor:pointer;
  position:relative;
}

.navigation button.active{
  background:#111;
  color:white;
}

.badge{
  position:absolute;
  top:-6px;
  right:-5px;
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:50px;
  background:#e53935;
  color:white;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  border:2px solid white;
}

/* PAGES */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:17px;
}

.card{
  background:white;
  border-radius:19px;
  padding:16px;
  box-shadow:0 5px 18px rgba(0,0,0,.09);
  transition:.18s;
  position:relative;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 25px rgba(0,0,0,.13);
}

.card-image{
  width:100%;
  height:205px;
  background:#f0f1f2;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin-bottom:5px;
}

.info{
  color:#666;
  margin:6px 0;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}

.card button{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:none;
  border-radius:9px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.card button.gray{
  background:#eee;
  color:#111;
}

.card button.green{
  background:#16a34a;
}

.favorite-count{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fafafa;
  border-radius:10px;
  padding:8px 10px;
  margin-top:9px;
  font-size:14px;
}

.favorite-count strong{
  font-size:15px;
}

/* STATUS */

.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}

.status.open{
  background:#fff1d6;
  color:#946200;
}

.status.accepted{
  background:#ddf7e5;
  color:#137333;
}

.status.rejected{
  background:#ffe1e1;
  color:#b42318;
}

/* REQUESTS */

.request-list{
  display:grid;
  gap:14px;
}

.request{
  background:white;
  padding:17px;
  border-radius:17px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:90px;
  height:90px;
  object-fit:contain;
  background:#f1f1f1;
  border-radius:12px;
  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 6px;
}

.request-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.accept-btn,
.reject-btn{
  border:none;
  color:white;
  padding:12px 17px;
  border-radius:10px;
  font-weight:bold;
  flex:1;
  cursor:pointer;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.rating-btn{
  border:none;
  background:#111;
  color:white;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

/* SELLER PROFILE */

.seller-profile{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.seller-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.seller-header h2{
  margin:0;
}

.seller-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:22px;
}

.seller-stat{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.seller-stat strong{
  display:block;
  font-size:23px;
}

.seller-stat span{
  color:#777;
  font-size:13px;
}

/* RATING */

.rating{
  font-size:22px;
  margin-top:8px;
}

.rating span{
  cursor:pointer;
}

.rating span.selected{
  color:#f5b400;
}

.review{
  background:#f7f7f7;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
}

.review-stars{
  font-size:19px;
}

.review-name{
  font-weight:bold;
}

/* EMPTY */

.empty{
  background:white;
  padding:25px;
  border-radius:15px;
  color:#777;
  text-align:center;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.modal{
  background:white;
  padding:23px;
  border-radius:20px;
  width:100%;
  max-width:420px;
  text-align:center;
}

.modal textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}

.modal-stars{
  display:flex;
  justify-content:center;
  gap:5px;
  font-size:34px;
  margin:12px 0;
}

.modal-stars span{
  cursor:pointer;
  color:#ccc;
}

.modal-stars span.active{
  color:#f5b400;
}

.modal button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:8px;
  font-weight:bold;
  cursor:pointer;
}

.modal-save{
  background:#111;
  color:white;
}

.modal-close{
  background:#eee;
  color:#111;
}

/* FOOTER */

footer{
  text-align:center;
  padding:35px;
  color:#777;
}

/* MOBILE */

@media(max-width:700px){

  .navigation{
    grid-template-columns:repeat(2,1fr);
  }

  .profile-inner{
    justify-content:center;
  }

  .profile-controls{
    width:100%;
  }

  .profile-controls input{
    flex:1;
    min-width:0;
  }

  .sell input{
    width:100%;
  }

  .sell button{
    width:100%;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-actions{
    flex-direction:column;
  }

  .seller-stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- PROFILBAR -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div id="avatar" class="avatar">
        ?
      </div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        class="primary-btn"
        onclick="saveUsername()"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- SUCHE -->

<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
  >

</div>

<div class="container">

<!-- VERKAUFEN -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm">

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- NAVIGATION -->

<div class="navigation">

  <button
    id="navCards"
    class="active"
    onclick="showPage('cardsPage','navCards')"
  >
    🔥 Karten
  </button>

  <button
    id="navFavorites"
    onclick="showPage('favoritesPage','navFavorites')"
  >
    ❤️ Favoriten
  </button>

  <button
    id="navMine"
    onclick="showPage('minePage','navMine')"
  >
    🃏 Meine Karten
  </button>

  <button
    id="navRequests"
    onclick="showPage('requestsPage','navRequests')"
  >
    📩 Anfragen
    <span id="requestBadge" class="badge" style="display:none;">0</span>
  </button>

  <button
    id="navProfile"
    onclick="showPage('profilePage','navProfile')"
  >
    👤 Profil
  </button>

</div>

<!-- KARTEN -->

<section
  id="cardsPage"
  class="page active"
>

  <h2>🔥 Aktuelle Karten</h2>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- FAVORITEN -->

<section
  id="favoritesPage"
  class="page"
>

  <h2 id="favoriteTitle">
    ❤️ Favoriten (0)
  </h2>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- MEINE KARTEN -->

<section
  id="minePage"
  class="page"
>

  <h2>🃏 Meine Karten</h2>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- ANFRAGEN -->

<section
  id="requestsPage"
  class="page"
>

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- PROFIL -->

<section
  id="profilePage"
  class="page"
>

  <h2>👤 Mein Profil</h2>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =====================================================
   HILFSFUNKTIONEN
===================================================== */

function getUsername(){

  return (
    localStorage.getItem("pixelUsername") || ""
  ).trim();

}


function getCards(){

  try{

    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];

  }catch(error){

    return [];

  }

}


function saveCards(cards){

  localStorage.setItem(
    "footballCards",
    JSON.stringify(cards)
  );

}


function getRequests(){

  try{

    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  }catch(error){

    return [];

  }

}


function saveRequests(requests){

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

}


/* =====================================================
   FAVORITEN-SYSTEM
===================================================== */

/*
  Neue Struktur:

  cardFavorites = {
    "karten-id": ["Mowafak","Messi"],
    "andere-id": ["Messi"]
  }

  Dadurch weiß jede Karte genau,
  WELCHE Benutzer sie favorisiert haben.
*/

function getFavoriteMap(){

  try{

    return JSON.parse(
      localStorage.getItem("cardFavorites")
    ) || {};

  }catch(error){

    return {};

  }

}


function saveFavoriteMap(map){

  localStorage.setItem(
    "cardFavorites",
    JSON.stringify(map)
  );

}


/*
  Alte Favoriten-Daten werden einmalig übernommen.
*/

function migrateOldFavorites(){

  const old =
    localStorage.getItem("favoriteCards");

  if(!old) return;

  const username =
    getUsername();

  if(!username) return;

  let oldCards;

  try{

    oldCards =
      JSON.parse(old) || [];

  }catch(error){

    return;

  }

  const map =
    getFavoriteMap();

  oldCards.forEach(card => {

    if(!card || !card.id) return;

    if(!map[card.id]){
      map[card.id] = [];
    }

    if(
      !map[card.id].includes(username)
    ){

      map[card.id].push(username);

    }

  });

  saveFavoriteMap(map);

}


function getUserFavoriteIds(){

  const username =
    getUsername();

  if(!username) return [];

  const map =
    getFavoriteMap();

  return Object.keys(map).filter(
    cardId =>
      Array.isArray(map[cardId]) &&
      map[cardId].includes(username)
  );

}


function getFavoriteCount(cardId){

  const map =
    getFavoriteMap();

  if(!Array.isArray(map[cardId])){
    return 0;
  }

  return map[cardId].length;

}


function isFavorite(cardId){

  const username =
    getUsername();

  if(!username) return false;

  const map =
    getFavoriteMap();

  return (
    Array.isArray(map[cardId]) &&
    map[cardId].includes(username)
  );

}


/* =====================================================
   BEWERTUNGEN
===================================================== */

function getRatings(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem("sellerRatings")
      );

    if(!data || typeof data !== "object"){
      return {};
    }

    /*
      Alte Struktur:
      sellerRatings = {
        Messi: [5,4,5]
      }

      wird automatisch in neue Struktur umgewandelt.
    */

    Object.keys(data).forEach(seller => {

      if(!Array.isArray(data[seller])){
        data[seller] = [];
        return;
      }

      data[seller] =
        data[seller].map(item => {

          if(typeof item === "number"){

            return {
              stars:item,
              buyer:"Unbekannt",
              comment:"",
              requestId:"legacy-" + Math.random()
            };

          }

          return item;

        });

    });

    return data;

  }catch(error){

    return {};

  }

}


function saveRatings(ratings){

  localStorage.setItem(
    "sellerRatings",
    JSON.stringify(ratings)
  );

}


function hasRatedRequest(requestId){

  const ratings =
    getRatings();

  for(const seller in ratings){

    const list =
      ratings[seller] || [];

    if(
      list.some(
        rating =>
          rating.requestId === requestId
      )
    ){

      return true;

    }

  }

  return false;

}


/* =====================================================
   BENUTZERNAME
===================================================== */

function saveUsername(){

  const input =
    document.getElementById(
      "usernameInput"
    );

  const newName =
    input.value.trim();

  if(!newName){

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  /*
    Benutzername wird exakt so gespeichert,
    damit Käufer und Verkäufer eindeutig
    miteinander verbunden werden.
  */

  localStorage.setItem(
    "pixelUsername",
    newName
  );

  migrateOldFavorites();

  updateProfile();

  loadAll();

  alert(
    "👤 Profil gespeichert!"
  );

}


function updateProfile(){

  const name =
    getUsername();

  const profileName =
    document.getElementById(
      "profileName"
    );

  const avatar =
    document.getElementById(
      "avatar"
    );

  const input =
    document.getElementById(
      "usernameInput"
    );

  if(name){

    profileName.textContent =
      name;

    avatar.textContent =
      name.charAt(0).toUpperCase();

    input.value =
      name;

  }else{

    profileName.textContent =
      "Kein Benutzer";

    avatar.textContent =
      "?";

    input.value =
      "";

  }

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(
  pageId,
  buttonId
){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });

  const page =
    document.getElementById(
      pageId
    );

  if(page){

    page.classList.add(
      "active"
    );

  }

  document
    .querySelectorAll(
      ".navigation button"
    )
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });

  const button =
    document.getElementById(
      buttonId
    );

  if(button){

    button.classList.add(
      "active"
    );

  }

}


/* =====================================================
   KARTEN LADEN
===================================================== */

function loadCards(){

  const box =
    document.getElementById(
      "cards"
    );

  box.innerHTML = "";

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

  const cards =
    getCards();

  const filtered =
    cards.filter(card => {

      return (

        String(card.player)
          .toLowerCase()
          .includes(search)

        ||

        String(card.club)
          .toLowerCase()
          .includes(search)

        ||

        String(card.owner)
          .toLowerCase()
          .includes(search)

      );

    });

  if(!filtered.length){

    box.innerHTML =
      "<div class='empty'>Keine Karten gefunden.</div>";

    return;

  }

  filtered.forEach(card => {

    createCard(
      card,
      box
    );

  });

}


/* =====================================================
   KARTE ERSTELLEN
===================================================== */

function createCard(
  card,
  box
){

  const username =
    getUsername();

  const requests =
    getRequests();

  const favorite =
    isFavorite(card.id);

  const favoriteCount =
    getFavoriteCount(card.id);

  /*
    Wichtig:
    Anfrage wird über cardId + buyer geprüft.
    Verkäufer wird NICHT einfach geraten.
  */

  const myRequest =
    requests.find(
      request =>

        request.cardId ===
        card.id

        &&

        request.buyer ===
        username

        &&

        request.seller ===
        card.owner

        &&

        (
          request.status ===
          "pending"

          ||

          request.status ===
          "accepted"
        )

    );

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "card";

  let buyButton = "";

  /* EIGENE KARTE */

  if(
    username &&
    card.owner === username
  ){

    buyButton = `

      <button
        class="gray"
        onclick="ownCardMessage()"
      >
        🚫 Deine Karte
      </button>

/* =====================================================
   HTML SICHER MACHEN
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =====================================================
   KARTE EINSTELLEN
===================================================== */

document
  .getElementById("sellForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username =
        getUsername();

      if(!username){

        alert(
          "👤 Bitte zuerst einen Benutzernamen festlegen."
        );

        return;

      }

      const player =
        document
          .getElementById("player")
          .value
          .trim();

      const club =
        document
          .getElementById("club")
          .value
          .trim();

      const price =
        document
          .getElementById("price")
          .value;

      const file =
        document
          .getElementById("image")
          .files[0];

      if(!file){

        alert(
          "Bitte wähle ein Foto aus."
        );

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const image =
            new Image();

          image.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );

              const max =
                700;

              let width =
                image.width;

              let height =
                image.height;

              if(
                width > height &&
                width > max
              ){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }else if(
                height > max
              ){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }

              canvas.width =
                width;

              canvas.height =
                height;

              canvas
                .getContext("2d")
                .drawImage(
                  image,
                  0,
                  0,
                  width,
                  height
                );

              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  0.6
                );

              const cards =
                getCards();

              cards.unshift({

                id:
                  Date.now() +
                  "-" +
                  Math.random()
                    .toString(36)
                    .substring(2),

                player:
                  player,

                club:
                  club,

                price:
                  price,

                image:
                  imageData,

                owner:
                  username,

                sold:
                  false,

                soldTo:
                  null

              });

              try{

                saveCards(
                  cards
                );

              }catch(error){

                alert(
                  "Der Speicher ist voll. Bitte lösche zuerst Karten."
                );

                return;

              }

              document
                .getElementById(
                  "sellForm"
                )
                .reset();

              loadAll();

              alert(
                "🎉 Deine Karte wurde eingestellt!"
              );

            };

          image.src =
            reader.result;

        };

      reader.readAsDataURL(
        file
      );

    }
  );

===================================================== */

function buyCard(cardId){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if(!card){

    alert(
      "❌ Karte wurde nicht gefunden."
    );

    return;

  }

  /* EIGENE KARTE */

  if(
    card.owner ===
    username
  ){

    ownCardMessage();

    return;

  }

  /* VERKAUFTE KARTE */

  if(card.sold === true){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests =
    getRequests();

  /*
    EXTREM WICHTIG:

    Käufer = aktueller Benutzer
    Verkäufer = Besitzer der Karte
    Karte = eindeutige Karten-ID

    Damit kann eine Anfrage nicht
    beim falschen Benutzer landen.
  */

  const existing =
    requests.find(
      request =>

        request.cardId ===
        card.id

        &&

        request.buyer ===
        username

        &&

        request.seller ===
        card.owner

        &&

        (
          request.status ===
          "pending"

          ||

          request.status ===
          "accepted"
        )

    );

  if(existing){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed =
    confirm(

      "Möchtest du diese Karte kaufen?\n\n" +

      card.player +

      " – " +

      card.club +

      "\n\nPreis: " +

      card.price +

      " €"

    );

  if(!confirmed) return;

  const request = {

    id:
      "request-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      username,

    seller:
      card.owner,

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  };

  requests.push(
    request
  );

  saveRequests(
    requests
  );

  /*
    Sofort neu laden.
  */

  updateRequestBadge();

  loadAll();

  alert(
    "📩 Anfrage gesendet!\n\n" +
    username +
    " möchte die Karte von " +
    card.owner +
    " kaufen."
  );

}

/* =====================================================
   ANNEHMEN
===================================================== */

function acceptRequest(
  requestId
){

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if(!request){

    alert(
      "❌ Anfrage wurde nicht gefunden."
    );

    return;

  }

  /*
    NUR Verkäufer.
  */

  if(
    request.seller !==
    username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(
    request.status !==
    "pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id ===
        request.cardId
    );

  if(!card){

    alert(
      "❌ Die Karte wurde nicht gefunden."
    );

    return;

  }

  /*
    Noch einmal überprüfen,
    dass der aktuelle Benutzer
    wirklich der Kartenbesitzer ist.
  */

  if(
    card.owner !==
    username
  ){

    alert(
      "🚫 Du bist nicht der Besitzer dieser Karte."
    );

    return;

  }

  /*
    Wenn die Karte bereits verkauft ist,
    darf keine weitere Anfrage angenommen werden.
  */

  if(card.sold === true){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " annehmen?"
    );

  if(!confirmed) return;

  request.status =
    "accepted";

  card.sold =
    true;

  card.soldTo =
    request.buyer;

  /*
    Andere offene Anfragen für dieselbe
    Karte werden automatisch abgelehnt.
  */

  requests.forEach(
    other => {

      if(
        other.cardId ===
        request.cardId

        &&

        other.id !==
        request.id

        &&

        other.status ===
        "pending"
      ){

        other.status =
          "rejected";

      }

    }
  );

  saveCards(
    cards
  );

  saveRequests(
    requests
  );

  updateRequestBadge();

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}


/* =====================================================
   ABLEHNEN
===================================================== */

function rejectRequest(
  requestId
){

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if(!request){

    alert(
      "❌ Anfrage wurde nicht gefunden."
    );

    return;

  }

  if(
    request.seller !==
    username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage ablehnen."
    );

    return;

  }

  if(
    request.status !==
    "pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " wirklich ablehnen?"
    );

  if(!confirmed) return;

  request.status =
    "rejected";

  saveRequests(
    requests
  );

  updateRequestBadge();

  loadAll();

  alert(
    "🔴 Anfrage abgelehnt."
  );

}

function toggleFavorite(
  cardId
){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  const card =
    getCards().find(
      c =>
        c.id === cardId
    );

  if(!card) return;

  /*
    EIGENE KARTE
    darf niemals favorisiert werden.
  */

  if(
    card.owner ===
    username
  ){

    alert(
      "🚫 Du kannst deine eigene Karte nicht favorisieren."
    );

    return;

  }

  const map =
    getFavoriteMap();

  if(!Array.isArray(map[cardId])){

    map[cardId] = [];

  }

  const index =
    map[cardId].indexOf(
      username
    );

  if(index !== -1){

    map[cardId].splice(
      index,
      1
    );

    alert(
      "❤️ Aus Favoriten entfernt."
    );

  }else{

    map[cardId].push(
      username
    );

    alert(
      "❤️ Zu Favoriten hinzugefügt."
    );

  }

  saveFavoriteMap(
    map
  );

  loadAll();

}

/* =====================================================
   KARTE LÖSCHEN
===================================================== */

function deleteCard(
  cardId
){

  const username =
    getUsername();

  let cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if(!card) return;

  if(
    card.owner !==
    username
  ){

    alert(
      "🚫 Du kannst diese Karte nicht löschen."
    );

    return;

  }

  if(
    !confirm(
      "Möchtest du diese Karte wirklich löschen?"
    )
  ){

    return;

  }

  cards =
    cards.filter(
      c =>
        c.id !== cardId
    );

  saveCards(
    cards
  );

  /*
    Favoriten der gelöschten Karte
    ebenfalls entfernen.
  */

  const map =
    getFavoriteMap();

  delete map[cardId];

  saveFavoriteMap(
    map
  );

  /*
    Anfragen zur gelöschten Karte
    entfernen.
  */

  const requests =
    getRequests().filter(
      request =>
        request.cardId !== cardId
    );

  saveRequests(
    requests
  );

  loadAll();

}

function openSellerProfile(

  showPage(
    "profilePage",
    "navProfile"

function loadSellerProfile(
  seller
){

  const box =
    document.getElementById(
      "profileBox"
    );

  const cards =
    getCards().filter(
      card =>
        card.owner ===
        seller
    );

  const soldCards =
    cards.filter(
      card =>
        card.sold === true
    );

  const ratings =
    getRatings();

  const sellerRatings =
    ratings[seller] || [];

  let average =
    0;

  if(
    sellerRatings.length
  ){

    average =
      sellerRatings.reduce(
        (sum,rating) =>
          sum +
          Number(rating.stars || 0),
        0
      ) /
      sellerRatings.length;

  }

  const stars =
    average
    ? "⭐".repeat(
        Math.round(average)
      )
    : "Noch keine Bewertungen";

  let reviewsHtml = "";

  if(sellerRatings.length){

    reviewsHtml = `

      <h2>
        ⭐ Bewertungen
      </h2>

    `;

    sellerRatings
      .slice()
      .reverse()
      .forEach(
        rating => {

          reviewsHtml += `

            <div class="review">

              <div class="review-name">
                👤 ${escapeHtml(rating.buyer || "Benutzer")}
              </div>

              <div class="review-stars">
                ${"⭐".repeat(
                  Number(rating.stars || 0)
                )}
              </div>

              ${
                rating.comment
                ? `
                  <p>
                    ${escapeHtml(rating.comment)}
                  </p>
                `
                : ""
              }

            </div>

          `;

        }
      );

  }else{

    reviewsHtml = `

      <h2>
        ⭐ Bewertungen
      </h2>

      <div class="empty">
        Noch keine Bewertungen.
      </div>

    `;

  }


  box.innerHTML = `

    <div class="seller-header">

      <div class="big-avatar">
        ${escapeHtml(
          seller.charAt(0).toUpperCase()
        )}
      </div>

      <div>

        <h2>
          ${escapeHtml(seller)}
        </h2>

        <div class="rating">
          ${stars}
        </div>

      </div>

    </div>

    <div class="seller-stats">

      <div class="seller-stat">

        <strong>
          ${soldCards.length}
        </strong>

        <span>
          Verkauft
        </span>

      </div>

      <div class="seller-stat">

        <strong>
          ${cards.length}
        </strong>

        <span>
          Angebote
        </span>

      </div>

      <div class="seller-stat">

        <strong>
          ${
            average
            ? average.toFixed(1)
            : "-"
          }
        </strong>

        <span>
          Bewertung
        </span>

      </div>

    </div>

    <br>

    ${reviewsHtml}

    <br>

    <h2>
      🏆 Eigene Angebote
    </h2>

    <div
      id="sellerOffers"
      class="cards"
    ></div>

  `;

  const offers =
    document.getElementById(
      "sellerOffers"
    );

  if(!cards.length){

    offers.innerHTML =
      "<div class='empty'>Keine Angebote vorhanden.</div>";

  }else{

    cards.forEach(
      card => {

        createCard(
          card,
          offers
        );

      }
    );

  }

}


/* =====================================================
   BEWERTUNGSMODAL
===================================================== */

function openRatingModal(
  requestId
){

  const username =
    getUsername();

  const request =
    getRequests().find(
      r =>
        r.id === requestId
    );

  if(!request){

    alert(
      "❌ Anfrage nicht gefunden."
    );

    return;

  }

  if(
    request.buyer !==
    username
  ){

    alert(
      "🚫 Du kannst diese Anfrage nicht bewerten."
    );

    return;

  }

  if(
    request.status !==
    "accepted"
  ){

    alert(
      "⭐ Du kannst erst nach einer Annahme bewerten."
    );

    return;

  }

  if(
    hasRatedRequest(
      requestId
    )
  ){

    alert(
      "⭐ Diese Anfrage wurde bereits bewertet."
    );

    return;

  }

  let selectedStars = 5;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "modal-bg";

  overlay.innerHTML = `

    <div class="modal">

      <h2>
        ⭐ Verkäufer bewerten
      </h2>

      <p>
        Wie war deine Erfahrung mit
        <strong>
          ${escapeHtml(request.seller)}
        </strong>?
      </p>

      <div
        id="modalStars"
        class="modal-stars"
      >

        <span data-star="1">★</span>
        <span data-star="2">★</span>
        <span data-star="3">★</span>
        <span data-star="4">★</span>
        <span data-star="5">★</span>

      </div>

      <textarea
        id="ratingComment"
        maxlength="300"
        placeholder="Kommentar schreiben (optional)..."
      ></textarea>

      <button
        class="modal-save"
        id="saveRatingButton"
      >
        ⭐ Bewertung speichern
      </button>

      <button
        class="modal-close"
        id="closeRatingButton"
      >
        Abbrechen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  const starElements =
    overlay.querySelectorAll(
      "[data-star]"
    );

  function updateStars(){

    starElements.forEach(
      star => {

        const value =
          Number(
            star.dataset.star
          );

        if(
          value <= selectedStars
        ){

          star.classList.add(
            "active"
          );

        }else{

          star.classList.remove(
            "active"
          );

        }

      }
    );

  }

  starElements.forEach(
    star => {

      star.addEventListener(
        "click",
        function(){

          selectedStars =
            Number(
              this.dataset.star
            );

          updateStars();

        }
      );

    }
  );

  updateStars();

  overlay
    .querySelector(
      "#closeRatingButton"
    )
    .onclick =
      function(){

        overlay.remove();

      };


  overlay
    .querySelector(
      "#saveRatingButton"
    )
    .onclick =
      function(){

        const comment =
          overlay
            .querySelector(
              "#ratingComment"
            )
            .value
            .trim();

        saveRating(
          request,
          selectedStars,
          comment
        );

        overlay.remove();

      };

}


/* =====================================================
   BEWERTUNG SPEICHERN
===================================================== */

function saveRating(
  request,
  stars,
  comment
){

  const username =
    getUsername();

  if(
    request.buyer !==
    username
  ){

    alert(
      "🚫 Diese Bewertung gehört nicht zu dir."
    );

    return;

  }

  if(
    request.status !==
    "accepted"
  ){

    alert(
      "⭐ Diese Anfrage ist noch nicht angenommen."
    );

    return;

  }

  if(
    hasRatedRequest(
      request.id
    )
  ){

    alert(
      "⭐ Diese Anfrage wurde bereits bewertet."
    );

    return;

  }

  const ratings =
    getRatings();

  if(
    !ratings[request.seller]
  ){

    ratings[request.seller] =
      [];

  }

  ratings[request.seller].push({

    stars:
      Number(stars),

    buyer:
      username,

    comment:
      comment,

    requestId:
      request.id,

    date:
      new Date().toISOString()

  });

  saveRatings(
    ratings
  );

  loadAll();

  alert(
    "⭐ Bewertung gespeichert!"
  );

}

          width:100%;

          object-fit:contain;
          border-radius:14px;
        "
      >

      <h2>
        ${escapeHtml(card.player)}
      </h2>

      <p>
        ${escapeHtml(card.club)}
      </p>

      <p style="
        font-size:25px;
        font-weight:bold;
      ">
        ${escapeHtml(card.price)} €
      </p>
