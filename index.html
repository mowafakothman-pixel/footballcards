<script>
/* =========================================================
   PIXEL CARDS – STARTSEITE + TESTANGEBOTE + CHATS
   ========================================================= */

(function () {
  "use strict";

  /* ---------- TESTANGEBOTE ---------- */

  const testOffers = [
    {
      id: "demo-card-1",
      player: "Lamine Yamal",
      club: "FC Barcelona",
      price: 29.99,
      condition: "Sehr gut",
      seller: "Max"
    },
    {
      id: "demo-card-2",
      player: "Jude Bellingham",
      club: "Real Madrid",
      price: 34.50,
      condition: "Neu",
      seller: "Leo"
    },
    {
      id: "demo-card-3",
      player: "Kylian Mbappé",
      club: "Real Madrid",
      price: 39.99,
      condition: "Gut",
      seller: "FootballFan"
    },
    {
      id: "demo-card-4",
      player: "Jamal Musiala",
      club: "FC Bayern",
      price: 24.90,
      condition: "Sehr gut",
      seller: "CardKing"
    }
  ];

  function renderTestOffers() {
    const container = document.getElementById("testOffers");

    if (!container) return;

    container.innerHTML = testOffers.map(card => `
      <article class="card demo-card">

        <div class="card-image demo-image">
          <div class="demo-card-placeholder">
            <span>PIXEL</span>
            <strong>${escapeHTML(card.player)}</strong>
            <small>${escapeHTML(card.club)}</small>
          </div>

          <span class="badge">NEU</span>
        </div>

        <div class="card-body">

          <h3>${escapeHTML(card.player)}</h3>

          <p class="club">${escapeHTML(card.club)}</p>

          <div class="card-info">
            <span>${escapeHTML(card.condition)}</span>
            <span>${escapeHTML(card.seller)}</span>
          </div>

          <div class="card-bottom">
            <strong>${card.price.toFixed(2).replace(".", ",")} €</strong>

            <button
              class="primary"
              type="button"
              onclick="demoBuy('${card.id}')">
              Kaufen
            </button>
          </div>

        </div>

      </article>
    `).join("");
  }


  /* ---------- DEMO-KAUF ---------- */

  window.demoBuy = function (id) {
    const card = testOffers.find(item => item.id === id);

    if (!card) return;

    if (typeof toast === "function") {
      toast("Das ist ein Testangebot.");
    } else {
      alert(
        card.player +
        " – " +
        card.price.toFixed(2).replace(".", ",") +
        " €\n\nDies ist nur ein Testangebot."
      );
    }
  };


  /* ---------- CHATS IM BESTEHENDEN HEADER ---------- */

  function addChatsButton() {

    /* Nicht zweimal hinzufügen */
    if (document.getElementById("pixelChatsButton")) return;

    /*
      Wir suchen den bestehenden Header.
      Es wird KEIN neuer Header erstellt.
    */
    const header =
      document.querySelector(".topbar") ||
      document.querySelector("header");

    if (!header) return;

    const actions =
      header.querySelector(".actions") ||
      header.querySelector(".header-actions") ||
      header.querySelector(".top-actions");

    if (!actions) return;

    const button = document.createElement("button");

    button.id = "pixelChatsButton";
    button.type = "button";
    button.className = "chat-btn";

    button.innerHTML = `
      <span>Chats</span>
      <span
        id="pixelChatBadge"
        class="notification-badge"
        style="display:none;">
      </span>
    `;

    button.addEventListener("click", function () {

      if (typeof go === "function") {
        go("messages");
      } else if (typeof chat === "function") {
        chat();
      }

    });

    /*
      Chats möglichst weit vorne im Bereich platzieren.
    */
    actions.insertBefore(button, actions.firstChild);

    updateChatBadge();
  }


  /* ---------- CHAT-BENACHRICHTIGUNGEN ---------- */

  function updateChatBadge() {

    const badge = document.getElementById("pixelChatBadge");

    if (!badge) return;

    try {

      const messages =
        JSON.parse(localStorage.getItem("pc_msg") || "[]");

      if (!Array.isArray(messages)) {
        badge.style.display = "none";
        return;
      }

      /*
        Nur ungelesene Nachrichten zählen.
        Falls das alte System diese Information nicht besitzt,
        bleibt der Badge einfach ausgeblendet.
      */
      const unread = messages.filter(message => {
        return (
          message &&
          (
            message.unread === true ||
            message.read === false
          )
        );
      }).length;

      if (unread > 0) {
        badge.textContent = unread > 99 ? "99+" : unread;
        badge.style.display = "inline-flex";
      } else {
        badge.style.display = "none";
      }

    } catch (error) {
      badge.style.display = "none";
    }
  }


  /* ---------- SICHERER TEXT ---------- */

  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ---------- STARTSEITE ---------- */

  function setupStartseite() {

    /*
      Falls der Bereich noch nicht existiert,
      wird er automatisch angelegt.
    */
    let offersSection = document.getElementById("pixelTestOffersSection");

    if (!offersSection) {

      const home =
        document.getElementById("home") ||
        document.getElementById("start") ||
        document.querySelector(".page.active");

      if (!home) return;

      offersSection = document.createElement("section");

      offersSection.id = "pixelTestOffersSection";
      offersSection.className = "panel";

      offersSection.innerHTML = `
        <div class="section-head">
          <h2>Angebote</h2>

          <button
            class="ghost"
            type="button"
            onclick="go('search')">
            Alle Angebote
          </button>
        </div>

        <div id="testOffers" class="grid"></div>
      `;

      home.appendChild(offersSection);
    }

    renderTestOffers();
  }


  /* ---------- DEMO-DESIGN ---------- */

  function addDemoStyles() {

    if (document.getElementById("pixelDemoStyles")) return;

    const style = document.createElement("style");

    style.id = "pixelDemoStyles";

    style.textContent = `
      .demo-card {
        overflow: hidden;
      }

      .demo-image {
        position: relative;
        min-height: 210px;
        background:
          radial-gradient(
            circle at 50% 25%,
            rgba(24,212,197,.22),
            transparent 45%
          ),
          #0d1111;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .demo-card-placeholder {
        width: 82%;
        height: 82%;
        border: 1px solid rgba(24,212,197,.35);
        border-radius: 14px;
        background: linear-gradient(
          145deg,
          #151a1a,
          #080909
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 18px;
        box-sizing: border-box;
      }

      .demo-card-placeholder span {
        font-size: 11px;
        letter-spacing: 3px;
        color: #18d4c5;
        margin-bottom: 12px;
      }

      .demo-card-placeholder strong {
        font-size: 20px;
        color: #fff;
      }

      .demo-card-placeholder small {
        margin-top: 7px;
        color: #9b9b9b;
      }

      .chat-btn {
        position: relative;
      }

      .notification-badge {
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        background: #18d4c5;
        color: #000;
      }
    `;

    document.head.appendChild(style);
  }


  /* ---------- START ---------- */

  function initPixelCardsHome() {

    addDemoStyles();
    setupStartseite();
    addChatsButton();
    updateChatBadge();

  }


  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initPixelCardsHome
    );
  } else {
    initPixelCardsHome();
  }


  /*
    Wenn Nachrichten geändert werden, Badge aktualisieren.
  */
  window.addEventListener("storage", function (event) {

    if (event.key === "pc_msg") {
      updateChatBadge();
    }

  });

})();
</script>
