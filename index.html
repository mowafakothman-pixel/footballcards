<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#090909;
  --panel:#111;
  --panel2:#171717;
  --border:#292929;
  --text:#fff;
  --muted:#999;
  --accent:#fff;
  --danger:#ef4444;
  --success:#22c55e;
}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */

header{
  background:#050505;
  border-bottom:1px solid #222;
  padding:18px 22px;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo h1{
  margin:0;
  font-size:25px;
}

.logo span{
  color:#777;
  font-size:13px;
}

/* ================= TOP NAVIGATION ================= */

.topbar{
  position:sticky;
  top:0;
  z-index:2000;
  background:rgba(9,9,9,.96);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #222;
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:8px;
}

.navigation{
  display:flex;
  gap:7px;
  flex:1;
  overflow-x:auto;
  scrollbar-width:none;
}

.navigation::-webkit-scrollbar{
  display:none;
}

.nav-btn{
  position:relative;
  flex-shrink:0;
  border:1px solid #292929;
  background:#141414;
  color:#aaa;
  padding:11px 15px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.nav-btn:hover{
  background:#1d1d1d;
  color:#fff;
}

.nav-btn.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

/* ================= PROFILE ================= */

.profile-button{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  background:#151515;
  border:1px solid #292929;
  color:#fff;
  padding:7px 11px;
  border-radius:12px;
  cursor:pointer;
}

.avatar{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.profile-name{
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:bold;
}

/* ================= SEARCH ================= */

.search-area{
  background:#0c0c0c;
  border-bottom:1px solid #222;
  padding:15px 16px;
}

.search-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:10px;
}

.search-input{
  flex:1;
  min-width:0;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:12px;
  padding:13px 15px;
  font-size:15px;
  outline:none;
}

.search-input:focus{
  border-color:#555;
}

/* ================= CONTAINER ================= */

.container{
  max-width:1250px;
  margin:auto;
  padding:20px 16px 40px;
}

/* ================= SELL ================= */

.sell{
  background:linear-gradient(135deg,#171717,#0d0d0d);
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:22px;
}

.sell-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.sell h2{
  margin:0;
  font-size:20px;
}

.sell p{
  margin:5px 0 0;
  color:#888;
  font-size:14px;
}

.sell form{
  display:grid;
  grid-template-columns:1fr 1fr 140px auto;
  gap:9px;
}

.sell input{
  width:100%;
  background:#191919;
  color:#fff;
  border:1px solid #303030;
  border-radius:10px;
  padding:12px;
  outline:none;
}

.sell input:focus{
  border-color:#666;
}

.sell button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

/* ================= PAGES ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.page-title h2{
  margin:0;
  font-size:22px;
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
}

.card{
  background:#111;
  border:1px solid #252525;
  border-radius:16px;
  padding:12px;
  transition:.18s;
  min-width:0;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#3a3a3a;
}

.card-image{
  width:100%;
  height:210px;
  background:#181818;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin:11px 0 4px;
  font-size:17px;
}

.info{
  color:#888;
  margin:5px 0;
  font-size:14px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin:9px 0;
}

.card button{
  width:100%;
  margin-top:7px;
  padding:10px;
  border:0;
  border-radius:9px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.card button.gray{
  background:#202020;
  color:#fff;
  border:1px solid #303030;
}

.card button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.favorite-row{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:13px;
  margin-top:8px;
}

/* ================= BADGE ================= */

.badge{
  position:absolute;
  top:-6px;
  right:-5px;
  min-width:19px;
  height:19px;
  padding:2px 5px;
  border-radius:20px;
  background:#ef4444;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #090909;
}

/* ================= EMPTY ================= */

.empty{
  grid-column:1/-1;
  background:#111;
  border:1px solid #252525;
  border-radius:15px;
  padding:30px 20px;
  color:#777;
  text-align:center;
}

/* ================= REQUESTS ================= */

.request-list{
  display:grid;
  gap:12px;
}

.request{
  background:#111;
  border:1px solid #252525;
  border-radius:16px;
  padding:15px;
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:85px;
  height:85px;
  object-fit:contain;
  background:#181818;
  border-radius:11px;
  flex-shrink:0;
}

.request-info{
  flex:1;
  min-width:0;
}

.request-info h3{
  margin:0 0 6px;
}

.request-actions{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.accept-btn,
.reject-btn,
.rate-btn{
  border:0;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  font-weight:bold;
  flex:1;
  cursor:pointer;
}

.accept-btn{background:#16a34a}
.reject-btn{background:#dc2626}
.rate-btn{background:#222}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.status.open{
  background:#332b19;
  color:#f5c451;
}

.status.accepted{
  background:#12331d;
  color:#4ade80;
}

.status.rejected{
  background:#351818;
  color:#f87171;
}

/* ================= PROFILE ================= */

.profile-box{
  background:#111;
  border:1px solid #252525;
  border-radius:18px;
  padding:22px;
}

.profile-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:bold;
}

.rating{
  margin-top:6px;
  font-size:18px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:20px;
}

.profile-stat{
  background:#191919;
  border:1px solid #292929;
  border-radius:11px;
  padding:13px;
  text-align:center;
}

.profile-stat strong{
  display:block;
  font-size:21px;
}

.profile-stat span{
  color:#777;
  font-size:12px;
}

/* ================= PROFILE SETTINGS ================= */

.profile-settings{
  background:#111;
  border:1px solid #252525;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.profile-settings h2{
  margin-top:0;
}

.profile-settings-row{
  display:flex;
  gap:8px;
}

.profile-settings input{
  flex:1;
  min-width:0;
  background:#191919;
  color:#fff;
  border:1px solid #303030;
  border-radius:10px;
  padding:12px;
}

.primary-btn{
  border:0;
  background:#fff;
  color:#000;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* ================= RATING ================= */

.rating-stars{
  display:flex;
  justify-content:center;
  gap:5px;
  margin:15px 0;
}

.rating-stars button{
  border:0;
  background:#222;
  border-radius:8px;
  padding:8px;
  cursor:pointer;
}

.rating-stars button.selected{
  background:#fff;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  padding:30px;
  color:#555;
  font-size:13px;
}

/* ================= TABLET ================= */

@media(max-width:1000px){

  .cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .sell form{
    grid-template-columns:1fr 1fr;
  }

  .sell button{
    width:100%;
  }
}

/* ================= HANDY ================= */

@media(max-width:700px){

  header{
    padding:14px 14px;
  }

  .header-inner{
    justify-content:center;
  }

  .logo span{
    display:none;
  }

  .logo h1{
    font-size:22px;
  }

  .nav-inner{
    padding:8px 10px;
  }

  .navigation{
    order:1;
  }

  .profile-button{
    order:2;
  }

  .profile-name{
    display:none;
  }

  .profile-button{
    padding:6px;
  }

  .search-area{
    padding:10px;
  }

  .container{
    padding:14px 10px 30px;
  }

  .sell{
    padding:15px;
  }

  .sell-header{
    align-items:flex-start;
  }

  .sell form{
    display:grid;
    grid-template-columns:1fr;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .card{
    padding:9px;
    border-radius:13px;
  }

  .card-image{
    height:150px;
  }

  .card h3{
    font-size:15px;
  }

  .price{
    font-size:18px;
  }

  .card button{
    font-size:12px;
    padding:9px 5px;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-image{
    width:70px;
    height:70px;
  }

  .request-actions{
    flex-direction:column;
  }

  .profile-stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .profile-stat{
    padding:10px 5px;
  }

  .profile-stat strong{
    font-size:18px;
  }

  .profile-settings-row{
    flex-direction:column;
  }
}

/* ================= VERY SMALL PHONES ================= */

@media(max-width:390px){

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .card-image{
    height:130px;
  }

  .nav-btn{
    padding:9px 11px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <h1>⚽ Pixel Cards</h1>
      <span>Der Marktplatz für Fußballkarten</span>
    </div>
  </div>
</header>

<!-- ================= NAVIGATION ================= -->

<div class="topbar">
  <div class="nav-inner">

    <div class="navigation">

      <button id="navCards"
        class="nav-btn active"
        onclick="showPage('cardsPage','navCards')">
        🔥 Karten
      </button>

      <button id="navFavorites"
        class="nav-btn"
        onclick="showPage('favoritesPage','navFavorites')">
        ❤️ Favoriten
      </button>

      <button id="navMine"
        class="nav-btn"
        onclick="showPage('minePage','navMine')">
        🃏 Meine Karten
      </button>

      <button id="navRequests"
        class="nav-btn"
        onclick="showPage('requestsPage','navRequests')">
        📩 Anfragen
        <span id="requestBadge"
          class="badge"
          style="display:none">0</span>
      </button>

    </div>

    <!-- PROFIL GANZ RECHTS -->

    <button class="profile-button"
      onclick="showPage('profilePage','navProfile')">

      <div id="avatar" class="avatar">?</div>

      <span id="profileName"
        class="profile-name">
        Profil
      </span>

    </button>

  </div>
</div>

<!-- ================= SEARCH ================= -->

<div class="search-area">
  <div class="search-inner">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
    >

  </div>
</div>

<div class="container">

<!-- ================= SELL ================= -->

<div class="sell">

  <div class="sell-header">
    <div>
      <h2>🎟️ Karte verkaufen</h2>
      <p>Stelle deine Fußballkarte schnell ein.</p>
    </div>
  </div>

  <form id="sellForm">

    <input id="player"
      type="text"
      placeholder="Spieler"
      required>

    <input id="club"
      type="text"
      placeholder="Verein"
      required>

    <input id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis €"
      required>

    <input id="image"
      type="file"
      accept="image/*"
      required>

    <button type="submit">
      📷 Foto auswählen & Karte einstellen
    </button>

  </form>

</div>

<!-- ================= KARTEN ================= -->

<section id="cardsPage" class="page active">

  <div class="page-title">
    <h2>🔥 Aktuelle Karten</h2>
  </div>

  <div id="cards" class="cards"></div>

</section>

<!-- ================= FAVORITEN ================= -->

<section id="favoritesPage" class="page">

  <div class="page-title">
    <h2 id="favoriteTitle">❤️ Favoriten (0)</h2>
  </div>

  <div id="favoriteCards" class="cards"></div>

</section>

<!-- ================= MEINE KARTEN ================= -->

<section id="minePage" class="page">

  <div class="page-title">
    <h2>🃏 Meine Karten</h2>
  </div>

  <div id="myCards" class="cards"></div>

</section>

<!-- ================= ANFRAGEN ================= -->

<section id="requestsPage" class="page">

  <div class="page-title">
    <h2 id="requestTitle">📩 Meine Kaufanfragen (0)</h2>
  </div>

  <div id="purchaseRequests"
    class="request-list"></div>

  <br>

  <div class="page-title">
    <h2 id="sellerRequestTitle">
      📥 Anfragen für meine Karten (0)
    </h2>
  </div>

  <div id="sellerRequests"
    class="request-list"></div>

</section>

<!-- ================= PROFIL ================= -->

<section id="profilePage" class="page">

  <div class="profile-settings">

    <h2>👤 Mein Profil</h2>

    <p class="info">
      Ändere hier deinen Benutzernamen.
    </p>

    <div class="profile-settings-row">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername">

      <button
        class="primary-btn"
        onclick="saveUsername()">
        Profil speichern
      </button>

    </div>

  </div>

  <div id="profileBox"
    class="profile-box"></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =========================================================
   DATEN
========================================================= */

function getUsername(){
  return localStorage.getItem("pixelUsername") || "";
}

function getCards(){
  try{
    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];
  }catch(e){
    return [];
  }
}

function getRequests(){
  try{
    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];
  }catch(e){
    return [];
  }
}

function getFavorites(){
  try{
    return JSON.parse(
      localStorage.getItem("favoriteCards")
    ) || [];
  }catch(e){
    return [];
  }
}

function getFavoriteUsers(){
  try{
    return JSON.parse(
      localStorage.getItem("favoriteUsers")
    ) || {};
  }catch(e){
    return {};
  }
}

function getRatings(){
  try{
    return JSON.parse(
      localStorage.getItem("sellerRatings")
    ) || {};
  }catch(e){
    return {};
  }
}

function saveData(key,data){
  localStorage.setItem(
    key,
    JSON.stringify(data)
  );
}

/* =========================================================
   PROFIL
========================================================= */

function updateProfile(){

  const name=getUsername();

  document.getElementById("profileName").textContent=
    name || "Profil";

  document.getElementById("avatar").textContent=
    name
      ? name.charAt(0).toUpperCase()
      : "?";

  document.getElementById("usernameInput").value=name;
}

function saveUsername(){

  const input=
    document.getElementById("usernameInput");

  const name=input.value.trim();

  if(!name){
    alert("Bitte gib einen Benutzernamen ein.");
    return;
  }

  if(name.length<2){
    alert("Der Benutzername muss mindestens 2 Zeichen haben.");
    return;
  }

  localStorage.setItem(
    "pixelUsername",
    name
  );

  updateProfile();
  loadAll();

  alert("👤 Profil gespeichert!");
}

/* =========================================================
   NAVIGATION
========================================================= */

function showPage(pageId,buttonId){

  document
    .querySelectorAll(".page")
    .forEach(page=>{
      page.classList.remove("active");
    });

  const page=document.getElementById(pageId);

  if(page){
    page.classList.add("active");
  }

  document
    .querySelectorAll(".nav-btn")
    .forEach(button=>{
      button.classList.remove("active");
    });

  if(buttonId){

    const button=
      document.getElementById(buttonId);

    if(button){
      button.classList.add("active");
    }
  }

  if(pageId==="requestsPage"){
    updateRequestBadge();
  }

  if(pageId==="profilePage"){
    const username=getUsername();

    if(username){
      loadSellerProfile(username);
    }
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   BADGE
========================================================= */

function updateRequestBadge(){

  const username=getUsername();

  const requests=getRequests();

  const count=username
    ? requests.filter(request=>
        request.seller===username &&
        request.status==="pending"
      ).length
    : 0;

  const badge=
    document.getElementById("requestBadge");

  if(count>0){

    badge.style.display="flex";
    badge.textContent=count;

  }else{

    badge.style.display="none";

  }
}

/* =========================================================
   KARTEN LADEN
========================================================= */

function loadCards(){

  const box=
    document.getElementById("cards");

  box.innerHTML="";

  const search=
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

  const cards=getCards();

  const filtered=cards.filter(card=>{

    if(card.sold===true){
      return false;
    }

    return(
      String(card.player||"")
        .toLowerCase()
        .includes(search)
      ||
      String(card.club||"")
        .toLowerCase()
        .includes(search)
      ||
      String(card.owner||"")
        .toLowerCase()
        .includes(search)
    );

  });

  if(!filtered.length){

    box.innerHTML=
      `<div class="empty">
        🔎 Keine Karten gefunden.
      </div>`;

    return;
  }

  filtered.forEach(card=>{
    createCard(card,box);
  });
}

/* =========================================================
   FAVORITEN
========================================================= */

function isFavorite(cardId){

  const username=getUsername();

  if(!username) return false;

  return getFavorites().some(item=>
    item.id===cardId &&
    item.favoriteBy===username
  );
}

function getFavoriteCount(cardId){

  const users=getFavoriteUsers();

  return Array.isArray(users[cardId])
    ? users[cardId].length
    : 0;
}

function toggleFavorite(cardId){

  const username=getUsername();

  if(!username){

    alert(
      "👤 Bitte zuerst dein Profil einrichten."
    );

    return;
  }

  const cards=getCards();

  const card=
    cards.find(c=>c.id===cardId);

  if(!card) return;

  if(card.owner===username){

    alert(
      "🚫 Deine eigene Karte kannst du nicht favorisieren."
    );

    return;
  }

  let favorites=getFavorites();

  let users=getFavoriteUsers();

  if(!Array.isArray(users[cardId])){
    users[cardId]=[];
  }

  const index=
    favorites.findIndex(item=>
      item.id===cardId &&
      item.favoriteBy===username
    );

  if(index!==-1){

    favorites.splice(index,1);

    users[cardId]=users[cardId].filter(
      user=>user!==username
    );

  }else{

    favorites.push({
      id:cardId,
      favoriteBy:username
    });

    if(!users[cardId].includes(username)){
      users[cardId].push(username);
    }
  }

  saveData(
    "favoriteCards",
    favorites
  );

  saveData(
    "favoriteUsers",
    users
  );

  loadAll();
}

function needUsername(){

    "👤 Bitte zuerst dein Profil einrichten."

    null

function ownCardMessage(){

  alert(
    "🚫 Du kannst deine eigene Karte nicht kaufen."

function buyCard(cardId){

  const username=getUsername();

  if(!username){

    needUsername();
    return;
  }

  const cards=getCards();

  const card=
    cards.find(c=>c.id===cardId);

  if(!card) return;

  if(card.owner===username){

    ownCardMessage();
    return;
  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;
  }

  const requests=getRequests();

  const existing=
    requests.find(request=>
      request.cardId===cardId &&
      request.buyer===username &&
      (
        request.status==="pending" ||
        request.status==="accepted"
      )
    );

  if(existing){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;
  }

  const confirmed=confirm(
    "Möchtest du diese Karte kaufen?\n\n"+
    card.player+
    " – "+
    card.club+
    "\n\nPreis: "+
    card.price+
    " €"
  );

  if(!confirmed) return;

  requests.push({

    id:
      Date.now()+"-"+
      Math.random()
        .toString(36)
        .substring(2),

    cardId:card.id,
    player:card.player,
    club:card.club,
    price:card.price,
    image:card.image,

    buyer:username,
    seller:card.owner,

    status:"pending",

    createdAt:
      new Date().toISOString()

  });

  saveData(
    "purchaseRequests",
    requests
  );

  loadAll();

  alert(
    "📩 Kaufanfrage gesendet!"
  );
}

/* =========================================================
   ANNEHMEN
========================================================= */

function acceptRequest(requestId){

  const username=getUsername();

  const requests=getRequests();

  const request=
    requests.find(r=>r.id===requestId);

  if(!request) return;

  if(request.seller!==username){

    alert(
      "🚫 Nur der Verkäufer kann diese Anfrage annehmen."
    );

    return;
  }

  if(request.status!=="pending"){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;
  }

  const cards=getCards();

  const card=
    cards.find(c=>
      c.id===request.cardId
    );

  if(!card){

    alert(
      "❌ Die Karte wurde nicht gefunden."
    );

    return;
  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;
  }

  if(!confirm(
    "Möchtest du die Anfrage von "+
    request.buyer+
    " annehmen?"
  )){
    return;
  }

  request.status="accepted";

  card.sold=true;
  card.soldTo=request.buyer;

  requests.forEach(other=>{

    if(
      other.cardId===request.cardId &&
      other.id!==request.id &&
      other.status==="pending"
    ){
      other.status="rejected";
    }

  });

  saveData(
    "footballCards",
    cards
  );

  saveData(
    "purchaseRequests",
    requests
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );
}

function openRating(requestId){

  const request=
    getRequests().find(
      r=>r.id===requestId
    );

  if(!request) return;

  const username=getUsername();

  if(request.buyer!==username){

    alert(
      "🚫 Nur der Käufer kann bewerten."
    );

    return;
  }

  if(request.status!=="accepted"){

    alert(
      "⭐ Bewerten kannst du erst nach Annahme."
    );

    return;
  }

  const ratings=getRatings();

  if(!Array.isArray(ratings[request.seller])){
    ratings[request.seller]=[];
  }

  if(
    ratings[request.seller].some(
      r=>r.requestId===requestId
    )
  ){

    alert(
      "⭐ Bereits bewertet."
    );

    return;
  }

  const overlay=
    document.createElement("div");

  overlay.style.cssText=`
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
  `;

  overlay.innerHTML=`

    <div style="
      background:#111;
      color:#fff;
      border:1px solid #333;
      width:100%;
      max-width:400px;
      padding:24px;
      border-radius:18px;
      text-align:center;
    ">

      <h2>⭐ Verkäufer bewerten</h2>

      <p>
        Wie war deine Erfahrung mit
        <strong>
          ${escapeHTML(request.seller)}
        </strong>?
      </p>

      <div id="ratingStars"
        class="rating-stars">

        <button data-stars="1">⭐</button>
        <button data-stars="2">⭐⭐</button>
        <button data-stars="3">⭐⭐⭐</button>
        <button data-stars="4">⭐⭐⭐⭐</button>
        <button data-stars="5">⭐⭐⭐⭐⭐</button>

      </div>

      <button
        id="submitRating"
        class="rate-btn"
        style="width:100%"
        disabled>
        Bewertung speichern
      </button>

      <button
        id="cancelRating"
        class="gray"
        style="
          width:100%;
          border:0;
          padding:11px;
          border-radius:9px;
          margin-top:8px;
          cursor:pointer;
        ">
        Abbrechen
      </button>

    </div>
  `;

  document.body.appendChild(overlay);

  let selected=0;

  const buttons=
    overlay.querySelectorAll(
      "#ratingStars button"
    );

  buttons.forEach(button=>{

    button.onclick=()=>{

      selected=
        Number(
          button.dataset.stars
        );

      buttons.forEach(btn=>{
        btn.classList.toggle(
          "selected",
          Number(
            btn.dataset.stars
          )===selected
        );
      });

      overlay.querySelector(
        "#submitRating"
      ).disabled=false;
    };
  });

  overlay.querySelector(
    "#cancelRating"
  ).onclick=()=>{
    overlay.remove();
  };

  overlay.querySelector(
    "#submitRating"
  ).onclick=()=>{

    if(selected<1 || selected>5){
      return;
    }

    const current=getRatings();

    if(!Array.isArray(
      current[request.seller]
    )){
      current[request.seller]=[];
    }

    current[request.seller].push({

      requestId:request.id,
      buyer:username,
      stars:selected,
      createdAt:
        new Date().toISOString()

    });

    saveData(
      "sellerRatings",
      current
    );

    overlay.remove();

    loadAll();

    alert(
      "⭐ Bewertung gespeichert!"
    );
  };
}

      if(!username){

        alert(
          "👤 Bitte zuerst dein Profil einrichten."
        );

        showPage(
          "profilePage",
          null
        );

        return;
      }

      const player=
        document
          .getElementById("player")
          .value.trim();

      const club=
        document
          .getElementById("club")
          .value.trim();

      const price=
        document
          .getElementById("price")
          .value;

      const file=
        document
          .getElementById("image")
          .files[0];

      if(!file){

        alert(
          "📷 Bitte zuerst ein Foto auswählen."
        );

        return;
      }

      const reader=
        new FileReader();

      reader.onload=function(){

        const image=
          new Image();

        image.onload=function(){

          const canvas=
            document.createElement(
              "canvas"
            );

          const max=700;

          let width=image.width;
          let height=image.height;

          if(
            width>height &&
            width>max
          ){

            height=
              height*max/width;

            width=max;

          }else if(height>max){

            width=
              width*max/height;

            height=max;
          }

          canvas.width=width;
          canvas.height=height;

          canvas
            .getContext("2d")
            .drawImage(
              image,
              0,
              0,
              width,
              height
            );

          const imageData=
            canvas.toDataURL(
              "image/jpeg",
              .6
            );

          const cards=getCards();

          cards.unshift({

            id:
              Date.now()+"-"+
              Math.random()
                .toString(36)
                .substring(2),

            player:player,
            club:club,
            price:price,
            image:imageData,

            owner:username,

            sold:false,
            soldTo:null

          });

          try{

            saveData(
              "footballCards",
              cards
            );

          }catch(error){

            alert(
              "Der Speicher ist voll. Bitte lösche zuerst einige Karten."
            );

            return;
          }

          document
            .getElementById("sellForm")
            .reset();

          loadAll();

          alert(
            "🎉 Deine Karte wurde eingestellt!"
          );
        };

        image.src=reader.result;
      };

      reader.readAsDataURL(file);
    }
  );

/* =========================================================
   SUCHE
========================================================= */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    loadCards
  );

/* =========================================================
   SICHERHEIT
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   ALLES AKTUALISIEREN
========================================================= */

function loadAll(){

  updateProfile();

  loadCards();

  loadFavorites();

  loadMyCards();

  loadPurchaseRequests();

  loadSellerRequests();

  updateRequestBadge();

  const username=getUsername();

  if(username){

    loadSellerProfile(username);

  }else{

    document.getElementById(
      "profileBox"
    ).innerHTML=`
      <div class="empty">
        👤 Richte zuerst dein Profil ein.
      </div>
    `;
  }
}

updateProfile();
loadAll();
