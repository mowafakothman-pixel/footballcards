<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pixel Cards</title>

<style>
:root{
  --bg:#050707;
  --panel:#0b1010;
  --panel2:#101717;
  --border:#1b2929;
  --text:#f2ffff;
  --muted:#829393;
  --cyan:#20e6d2;
  --cyan2:#0bbbad;
  --danger:#ff5964;
  --gold:#ffd35a;
  --shadow:0 12px 40px rgba(0,0,0,.35);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1500px,100%);
  margin:auto;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,7,7,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header{
  padding:15px 20px;
  display:flex;
  align-items:center;
  gap:18px;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--cyan);
}

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  background:#0d1414;
  border:1px solid var(--border);
  color:white;
  border-radius:14px;
  padding:13px 16px 13px 43px;
  outline:none;
  transition:.2s;
}

.search input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(32,230,210,.08);
}

.search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.user-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  padding:10px 14px;
  border-radius:12px;
}

.nav{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-top:1px solid var(--border);
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:13px 5px;
  font-size:13px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  color:var(--cyan);
  background:rgba(32,230,210,.05);
}

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  background:var(--cyan);
  color:#00110f;
  font-size:10px;
  font-weight:900;
}

/* CONTENT */
main{
  padding:25px 20px 80px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.hero{
  background:
    radial-gradient(circle at 80% 20%,rgba(32,230,210,.12),transparent 35%),
    linear-gradient(135deg,#0a1111,#070909);
  border:1px solid var(--border);
  border-radius:22px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:var(--shadow);
}

.hero h1{
  font-size:34px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 14px;
}

.section-title h2{
  font-size:20px;
}

.muted{
  color:var(--muted);
}

/* FILTERS */
.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:13px;
  border-radius:17px;
  margin-bottom:22px;
}

.filters input,
.filters select,
.form input,
.form select{
  width:100%;
  background:#080d0d;
  color:white;
  border:1px solid var(--border);
  padding:11px 12px;
  border-radius:11px;
  outline:none;
}

.filters input:focus,
.filters select:focus,
.form input:focus,
.form select:focus{
  border-color:var(--cyan);
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
  gap:17px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  position:relative;
  transition:.22s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#294141;
  box-shadow:var(--shadow);
}

.card-image{
  aspect-ratio:1/1.18;
  background:#080d0d;
  position:relative;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:45px;
}

.card-top{
  position:absolute;
  left:10px;
  right:10px;
  top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tag{
  background:var(--cyan);
  color:#00110f;
  font-size:10px;
  font-weight:900;
  padding:5px 8px;
  border-radius:7px;
}

.tag.popular{
  background:var(--gold);
}

.favorite{
  border:0;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:17px;
}

.favorite.active{
  color:#ff6671;
}

.card-body{
  padding:14px;
}

.player{
  font-size:17px;
  font-weight:800;
}

.club{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-top:14px;
}

.price{
  color:var(--cyan);
  font-size:21px;
  font-weight:900;
}

.views{
  color:var(--muted);
  font-size:11px;
}

.seller{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border);
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
}

.card-actions{
  display:grid;
  grid-template-columns:1fr 42px;
  gap:7px;
  margin-top:12px;
}

.btn{
  border:1px solid var(--border);
  background:#111919;
  color:white;
  padding:10px;
  border-radius:10px;
  transition:.2s;
}

.btn:hover{
  border-color:var(--cyan);
}

.btn.primary{
  background:var(--cyan);
  border-color:var(--cyan);
  color:#00110f;
  font-weight:900;
}

.btn.danger{
  color:#ff7c84;
}

.btn.small{
  padding:8px 10px;
  font-size:12px;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:55px 20px;
  border:1px dashed var(--border);
  border-radius:18px;
  color:var(--muted);
}

/* FORMS */
.form-box{
  max-width:650px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.form{
  display:grid;
  gap:13px;
}

.form label{
  font-size:12px;
  color:var(--muted);
}

.form-group{
  display:grid;
  gap:6px;
}

/* ORDERS */
.order-list,
.request-list,
.message-list{
  display:grid;
  gap:12px;
}

.item{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.item-main{
  display:flex;
  align-items:center;
  gap:13px;
}

.mini-img{
  width:58px;
  height:68px;
  object-fit:cover;
  border-radius:9px;
  background:#080d0d;
}

.status{
  font-size:11px;
  color:var(--cyan);
  margin-top:4px;
}

/* PROFILE */
.profile-head{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  display:flex;
  align-items:center;
  gap:18px;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--cyan);
  color:#00110f;
  font-weight:900;
  font-size:25px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#080d0d;
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
  color:var(--cyan);
}

.rating{
  color:var(--gold);
  letter-spacing:2px;
}

/* MESSAGES */
.message{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.message .name{
  font-weight:800;
}

.message .text{
  color:var(--muted);
}

.time{
  font-size:10px;
  color:#526161;
}

/* TOAST */
.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:100;
  background:#101919;
  border:1px solid var(--cyan);
  color:white;
  padding:13px 16px;
  border-radius:12px;
  box-shadow:var(--shadow);
  transform:translateY(100px);
  opacity:0;
  transition:.25s;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */
@media(max-width:800px){
  .header{
    flex-wrap:wrap;
  }

  .logo{
    order:1;
  }

  .user-btn{
    order:2;
    margin-left:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .nav{
    grid-template-columns:repeat(4,1fr);
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .filters input:first-child{
    grid-column:1/-1;
  }

  main{
    padding:17px 12px 60px;
  }

  .hero{
    padding:22px;
  }

  .hero h1{
    font-size:27px;
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card-body{
    padding:10px;
  }

  .player{
    font-size:14px;
  }

  .price{
    font-size:17px;
  }

  .item{
    align-items:flex-start;
    flex-direction:column;
  }

  .item > div:last-child{
    width:100%;
  }

  .profile-head{
    padding:18px;
  }
}

@media(max-width:400px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header">

    <div class="logo">PIXEL<span>CARDS</span></div>

    <div class="search">
      <span class="search-icon">⌕</span>
      <input id="search" placeholder="Spieler, Verein oder Karte suchen...">
    </div>

    <button class="user-btn" onclick="showPage('profilePage')">
      <span id="headerUser">Gast</span>
    </button>

  </div>

  <nav class="nav">
    <button id="navHome" onclick="showPage('homePage')">Start</button>
    <button id="navCards" onclick="showPage('cardsPage')">Karten</button>
    <button id="navFavorites" onclick="showPage('favoritesPage')">♥ Favoriten</button>
    <button id="navSell" onclick="showPage('sellPage')">Verkaufen</button>
    <button id="navOrders" onclick="showPage('ordersPage')">Käufe</button>
    <button id="navMine" onclick="showPage('minePage')">Meine Karten</button>
    <button id="navMessages" onclick="showPage('messagesPage')">Nachrichten <span id="messageBadge" class="badge" style="display:none">0</span></button>
    <button id="navProfile" onclick="showPage('profilePage')">Profil</button>
  </nav>
</header>

<main>

<!-- START -->
<section id="homePage" class="page active">

  <div class="hero">
    <h1>Dein Fußballkarten-Marktplatz.</h1>
    <p>Kaufen, verkaufen, sammeln – alles an einem Ort.</p>
    <br>
    <button class="btn primary" onclick="showPage('cardsPage')">Karten entdecken</button>
    <button class="btn" onclick="showPage('sellPage')">Karte verkaufen</button>
  </div>

  <div class="section-title">
    <h2>Beliebte Karten</h2>
  </div>

  <div id="popularCards" class="cards"></div>

  <div class="section-title">
    <h2>Neu eingestellt</h2>
  </div>

  <div id="newCards" class="cards"></div>

</section>

<!-- MARKETPLACE -->
<section id="cardsPage" class="page">

  <div class="section-title">
    <h2>Aktuelle Karten</h2>
    <span id="resultCount" class="muted"></span>
  </div>

  <div class="filters">
    <input id="marketSearch" placeholder="Spieler oder Verein...">
    <input id="minPrice" type="number" min="0" placeholder="Preis ab €">
    <input id="maxPrice" type="number" min="0" placeholder="Preis bis €">

    <select id="condition">
      <option value="">Zustand</option>
      <option>Neu</option>
      <option>Sehr gut</option>
      <option>Gut</option>
      <option>Schlecht</option>
    </select>

    <select id="sort">
      <option value="new">Neueste</option>
      <option value="cheap">Preis niedrig</option>
      <option value="expensive">Preis hoch</option>
      <option value="views">Beliebt</option>
    </select>
  </div>

  <div id="marketCards" class="cards"></div>

</section>

<!-- FAVORITEN -->
<section id="favoritesPage" class="page">
  <div class="section-title">
    <h2>Meine Favoriten</h2>
  </div>
  <div id="favoriteCards" class="cards"></div>
</section>

<!-- VERKAUFEN -->
<section id="sellPage" class="page">

  <div class="section-title">
    <h2>Karte verkaufen</h2>
  </div>

  <div class="form-box">
    <form class="form" id="sellForm">

      <div class="form-group">
        <label>Spieler</label>
        <input id="player" required placeholder="z. B. Désiré Doué">
      </div>

      <div class="form-group">
        <label>Verein</label>
        <input id="club" placeholder="z. B. PSG">
      </div>

      <div class="form-group">
        <label>Preis (€)</label>
        <input id="price" type="number" min="0.01" step="0.01" required placeholder="10.00">
      </div>

      <div class="form-group">
        <label>Zustand</label>
        <select id="sellCondition">
          <option>Neu</option>
          <option>Sehr gut</option>
          <option>Gut</option>
          <option>Schlecht</option>
        </select>
      </div>

      <div class="form-group">
        <label>Kartenbild</label>
        <input id="image" type="file" accept="image/*">
      </div>

      <button class="btn primary" type="submit">Karte einstellen</button>

    </form>
  </div>

</section>

<!-- KÄUFE -->
<section id="ordersPage" class="page">

  <div class="section-title">
    <h2>Meine Käufe & Verkäufe</h2>
  </div>

  <div id="orders" class="order-list"></div>

</section>

<!-- MEINE KARTEN -->
<section id="minePage" class="page">

  <div class="section-title">
    <h2>Meine Karten</h2>
  </div>

  <div id="mineCards" class="cards"></div>

</section>

<!-- NACHRICHTEN -->
<section id="messagesPage" class="page">

  <div class="section-title">
    <h2>Nachrichten</h2>
  </div>

  <div class="form-box">
    <form class="form" id="messageForm">

      <div class="form-group">
        <label>Empfänger</label>
        <input id="messageTo" required placeholder="Benutzername">
      </div>

      <div class="form-group">
        <label>Nachricht</label>
        <input id="messageText" required placeholder="Nachricht schreiben...">
      </div>

      <button class="btn primary">Nachricht senden</button>

    </form>
  </div>

  <br>

  <div id="messages" class="message-list"></div>

</section>

<!-- PROFIL -->
<section id="profilePage" class="page">

  <div class="profile-head">

    <div class="avatar" id="avatar">G</div>

    <div>
      <h2 id="profileName">Gast</h2>
      <div class="rating" id="profileRating">★★★★★</div>
      <div class="muted">Pixel Cards Verkäufer</div>
    </div>

  </div>

  <div class="stats">
    <div class="stat">
      <strong id="statCards">0</strong>
      Karten
    </div>
    <div class="stat">
      <strong id="statSales">0</strong>
      Verkäufe
    </div>
    <div class="stat">
      <strong id="statPurchases">0</strong>
      Käufe
    </div>
  </div>

  <br>

  <div class="form-box">

    <form class="form" id="profileForm">

      <div class="form-group">
        <label>Benutzername</label>
        <input id="username" required>
      </div>

      <button class="btn primary">Profil speichern</button>

    </form>

  </div>

</section>

</main>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================================
   PIXEL CARDS – DATA
========================================================= */

const STORAGE = {
  cards:"pixelCards_cards",
  favorites:"pixelCards_favorites",
  requests:"pixelCards_requests",
  orders:"pixelCards_orders",
  messages:"pixelCards_messages",
  users:"pixelCards_users",
  username:"pixelCards_username",
  ratings:"pixelCards_ratings"
};

function load(key,fallback=[]){
  try{
    return JSON.parse(localStorage.getItem(key)) ?? fallback;
  }catch{
    return fallback;
  }
}

function save(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

let cards = load(STORAGE.cards,[]);
let favorites = load(STORAGE.favorites,[]);
let requests = load(STORAGE.requests,[]);
let orders = load(STORAGE.orders,[]);
let messages = load(STORAGE.messages,[]);
let ratings = load(STORAGE.ratings,{});

let username = localStorage.getItem(STORAGE.username) || "Gast";

/* =========================================================
   HELPERS
========================================================= */

function id(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function escapeHTML(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  return Number(value).toLocaleString("de-DE",{
    style:"currency",
    currency:"EUR"
  });
}

function toast(text){
  const t=document.getElementById("toast");
  t.textContent=text;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },2200);
}

function currentUser(){
  return username;
}

/* =========================================================
   NAVIGATION
========================================================= */

function showPage(pageId){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  const page=document.getElementById(pageId);

  if(page){
    page.classList.add("active");
  }

  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.remove("active");
  });

  const map={
    homePage:"navHome",
    cardsPage:"navCards",
    favoritesPage:"navFavorites",
    sellPage:"navSell",
    ordersPage:"navOrders",
    minePage:"navMine",
    messagesPage:"navMessages",
    profilePage:"navProfile"
  };

  if(map[pageId]){
    document.getElementById(map[pageId]).classList.add("active");
  }

  renderAll();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* =========================================================
   CARD RENDER
========================================================= */

function cardHTML(card){

  const liked=favorites.includes(card.id);
  const own=card.seller===currentUser();

  const isNew=
    Date.now()-Number(card.createdAt||0)
    < 1000*60*60*24*3;

  const popular=Number(card.views||0)>=10;

  let tag="";

  if(isNew){
    tag='<span class="tag">NEU</span>';
  }else if(popular){
    tag='<span class="tag popular">BELIEBT</span>';
  }

  const image=card.image
    ? `<img src="${card.image}" alt="">`
    : `<div class="placeholder">◈</div>`;

  return `
  <article class="card">

    <div class="card-image">

      ${image}

      <div class="card-top">
        ${tag}

        <button
          class="favorite ${liked?"active":""}"
          onclick="toggleFavorite('${card.id}')"
          title="Favorit">
          ${liked?"♥":"♡"}
        </button>
      </div>

    </div>

    <div class="card-body">

      <div class="player">${escapeHTML(card.player)}</div>

      <div class="club">
        ${escapeHTML(card.club || "Kein Verein")}
      </div>

      <div class="price-row">

        <div class="price">
          ${money(card.price)}
        </div>

        <div class="views">
          ◉ ${Number(card.views||0)} Aufrufe
        </div>

      </div>

      <div
        class="seller"
        onclick="openSeller('${escapeHTML(card.seller)}')">
        Verkäufer: <strong>${escapeHTML(card.seller)}</strong>
      </div>

      <div class="muted" style="font-size:11px;margin-top:8px">
        Zustand: ${escapeHTML(card.condition||"Gut")}
      </div>

      <div class="card-actions">

        ${
          own
          ? `<button class="btn danger" onclick="deleteCard('${card.id}')">Löschen</button>`
          : `<button class="btn primary" onclick="buyCard('${card.id}')">Kaufen</button>`
        }

        <button
          class="btn"
          onclick="viewCard('${card.id}')">
          →
        </button>

      </div>

    </div>

  </article>
  `;
}

function renderCards(list,containerId){

  const el=document.getElementById(containerId);

  if(!el)return;

  if(!list.length){
    el.innerHTML=`
      <div class="empty" style="grid-column:1/-1">
        Keine Karten gefunden.
      </div>
    `;
    return;
  }

  el.innerHTML=list.map(cardHTML).join("");
}

/* =========================================================
   MARKETPLACE
========================================================= */

function getFilteredCards(){

  const q=(
    document.getElementById("marketSearch")?.value ||
    document.getElementById("search")?.value ||
    ""
  ).toLowerCase().trim();

  const min=Number(document.getElementById("minPrice")?.value||0);
  const maxInput=document.getElementById("maxPrice")?.value;
  const max=maxInput==="" || maxInput==null
    ? Infinity
    : Number(maxInput);

  const condition=
    document.getElementById("condition")?.value || "";

  const sort=
    document.getElementById("sort")?.value || "new";

  let list=cards.filter(c=>{

    if(c.seller===currentUser())return true;

    const text=
      `${c.player} ${c.club} ${c.seller}`
      .toLowerCase();

    if(q && !text.includes(q))return false;

    if(Number(c.price)<min)return false;
    if(Number(c.price)>max)return false;

    if(condition && c.condition!==condition)return false;

    return true;
  });

  if(sort==="cheap"){
    list.sort((a,b)=>Number(a.price)-Number(b.price));
  }

  if(sort==="expensive"){
    list.sort((a,b)=>Number(b.price)-Number(a.price));
  }

  if(sort==="views"){
    list.sort((a,b)=>Number(b.views||0)-Number(a.views||0));
  }

  if(sort==="new"){
    list.sort((a,b)=>Number(b.createdAt)-Number(a.createdAt));
  }

  return list;
}

/* =========================================================
   BUYING
========================================================= */

function buyCard(cardId){

  const card=cards.find(c=>c.id===cardId);

  if(!card)return;

  if(card.seller===currentUser()){
    toast("Du kannst deine eigene Karte nicht kaufen.");
    return;
  }

  const existing=requests.find(r=>
    r.cardId===cardId &&
    r.buyer===currentUser() &&
    r.status==="pending"
  );

  if(existing){
    toast("Du hast bereits eine Anfrage gesendet.");
    return;
  }

  requests.push({
    id:id(),
    cardId,
    buyer:currentUser(),
    seller:card.seller,
    price:card.price,
    status:"pending",
    createdAt:Date.now()
  });

  save(STORAGE.requests,requests);

  toast("Kaufanfrage gesendet.");

  renderAll();
}

/* =========================================================
   REQUESTS / SELLING
========================================================= */

function acceptRequest(requestId){

  const request=requests.find(r=>r.id===requestId);

  if(!request)return;

  const card=cards.find(c=>c.id===request.cardId);

  if(!card)return;

  request.status="accepted";

  orders.push({
    id:id(),
    cardId:card.id,
    player:card.player,
    buyer:request.buyer,
    seller:request.seller,
    price:card.price,
    createdAt:Date.now(),
    status:"Kauf abgeschlossen"
  });

  card.sold=true;
  card.buyer=request.buyer;

  save(STORAGE.requests,requests);
  save(STORAGE.orders,orders);
  save(STORAGE.cards,cards);

  toast("Kaufanfrage angenommen.");

  renderAll();
}

function declineRequest(requestId){

  const request=requests.find(r=>r.id===requestId);

  if(!request)return;

  request.status="declined";

  save(STORAGE.requests,requests);

  toast("Kaufanfrage abgelehnt.");

  renderAll();
}

/* =========================================================
   CARD ACTIONS
========================================================= */

function toggleFavorite(cardId){

  const card=cards.find(c=>c.id===cardId);

  if(!card)return;

  if(card.seller===currentUser()){
    toast("Eigene Karten können nicht favorisiert werden.");
    return;
  }

  if(favorites.includes(cardId)){
    favorites=favorites.filter(id=>id!==cardId);
    toast("Aus Favoriten entfernt.");
  }else{
    favorites.push(cardId);
    toast("Zu Favoriten hinzugefügt.");
  }

  save(STORAGE.favorites,favorites);

  renderAll();
}

function deleteCard(cardId){

  const card=cards.find(c=>c.id===cardId);

  if(!card || card.seller!==currentUser())return;

  if(!confirm("Karte wirklich löschen?"))return;

  cards=cards.filter(c=>c.id!==cardId);

  favorites=favorites.filter(id=>id!==cardId);

  save(STORAGE.cards,cards);
  save(STORAGE.favorites,favorites);

  toast("Karte gelöscht.");

  renderAll();
}

function viewCard(cardId){

  const card=cards.find(c=>c.id===cardId);

  if(!card)return;

  /*
    Aufrufe werden pro Benutzer und Karte nur einmal erhöht.
  */

  const viewedKey="pixelCards_viewed_"+currentUser();

  const viewed=load(viewedKey,[]);

  if(!viewed.includes(cardId)){

    viewed.push(cardId);

    card.views=Number(card.views||0)+1;

    save(viewedKey,viewed);
    save(STORAGE.cards,cards);

  }

  alert(
    `${card.player}\n\n`+
    `Verein: ${card.club||"Kein Verein"}\n`+
    `Preis: ${money(card.price)}\n`+
    `Zustand: ${card.condition}\n`+
    `Verkäufer: ${card.seller}`
  );

  renderAll();
}

/* =========================================================
   SELLER PROFILE
========================================================= */

function openSeller(name){

  const sellerCards=cards.filter(c=>c.seller===name);

  const sales=orders.filter(o=>o.seller===name);

  const ratingList=ratings[name]||[];

  const average=ratingList.length
    ? ratingList.reduce((a,b)=>a+b,0)/ratingList.length
    : 5;

  const stars="★★★★★".slice(0,Math.round(average));

  alert(
    `Verkäuferprofil\n\n`+
    `${name}\n`+
    `${stars} ${average.toFixed(1)}/5\n\n`+
    `${sellerCards.length} Karten\n`+
    `${sales.length} Verkäufe`
  );
}

/* =========================================================
   SELL FORM
========================================================= */

document.getElementById("sellForm").addEventListener("submit",async e=>{

  e.preventDefault();

  if(username==="Gast"){
    toast("Bitte zuerst einen Benutzernamen festlegen.");
    showPage("profilePage");
    return;
  }

  const file=document.getElementById("image").files[0];

  let image="";

  if(file){
    image=await fileToDataURL(file);
  }

  const card={
    id:id(),
    player:document.getElementById("player").value.trim(),
    club:document.getElementById("club").value.trim()||"Kein Verein",
    price:Number(document.getElementById("price").value),
    condition:document.getElementById("sellCondition").value,
    image,
    seller:currentUser(),
    views:0,
    createdAt:Date.now(),
    sold:false
  };

  cards.unshift(card);

  save(STORAGE.cards,cards);

  e.target.reset();

  toast("Karte erfolgreich eingestellt.");

  showPage("minePage");
});

function fileToDataURL(file){

  return new Promise(resolve=>{

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.readAsDataURL(file);

  });
}

function renderHome(){

  const popular=[...cards]
    .filter(c=>!c.sold)
    .sort((a,b)=>Number(b.views||0)-Number(a.views||0))
    .slice(0,5);

  const newest=[...cards]
    .filter(c=>!c.sold)
    .sort((a,b)=>Number(b.createdAt)-Number(a.createdAt))
    .slice(0,5);

  renderCards(popular,"popularCards");
  renderCards(newest,"newCards");
}

/* =========================================================
   ORDERS
========================================================= */

function renderOrders(){

  const el=document.getElementById("orders");

  const mine=orders.filter(o=>
    o.buyer===currentUser() ||
    o.seller===currentUser()
  );

  const incoming=requests.filter(r=>
    r.seller===currentUser() &&
    r.status==="pending"
  );

  let html="";

  if(incoming.length){

    html+=`
      <div class="section-title">
        <h2>Kaufanfragen</h2>
      </div>
    `;

    incoming.forEach(r=>{

      const card=cards.find(c=>c.id===r.cardId);

      if(!card)return;

      html+=`
      <div class="item">

        <div class="item-main">

          <div>
            <strong>${escapeHTML(card.player)}</strong>
            <div class="muted">
              ${escapeHTML(r.buyer)} möchte deine Karte kaufen
            </div>
            <div class="status">${money(r.price)}</div>
          </div>

        </div>

        <div>
          <button class="btn primary small"
            onclick="acceptRequest('${r.id}')">
            Annehmen
          </button>

          <button class="btn small"
            onclick="declineRequest('${r.id}')">
            Ablehnen
          </button>
        </div>

      </div>
      `;
    });
  }

  if(mine.length){

    html+=`
      <div class="section-title">
        <h2>Abgeschlossene Käufe & Verkäufe</h2>
      </div>
    `;

    mine.forEach(o=>{

      const isBuyer=o.buyer===currentUser();

      html+=`
      <div class="item">

        <div>
          <strong>${escapeHTML(o.player)}</strong>
          <div class="muted">
            ${isBuyer
              ? "Gekauft von "+escapeHTML(o.seller)
              : "Verkauft an "+escapeHTML(o.buyer)}
          </div>
        </div>

        <div>
          <strong>${money(o.price)}</strong>
          <div class="status">${o.status}</div>
        </div>

      </div>
      `;
    });
  }

  if(!html){
    html=`<div class="empty">Noch keine Käufe, Verkäufe oder Kaufanfragen.</div>`;
  }

  el.innerHTML=html;
}

/* =========================================================
   MESSAGES
========================================================= */

function renderMessages(){

  const el=document.getElementById("messages");

  const mine=messages
    .filter(m=>
      m.from===currentUser() ||
      m.to===currentUser()
    )
    .sort((a,b)=>b.createdAt-a.createdAt);

  if(!mine.length){
    el.innerHTML=`<div class="empty">Noch keine Nachrichten.</div>`;
    return;
  }

  el.innerHTML=mine.map(m=>`

    <div class="item">

      <div class="message">

        <div class="name">
          ${m.from===currentUser()
            ? "An "+escapeHTML(m.to)
            : "Von "+escapeHTML(m.from)}
        </div>

        <div class="text">
          ${escapeHTML(m.text)}
        </div>

        <div class="time">
          ${new Date(m.createdAt).toLocaleString("de-DE")}
        </div>

      </div>

    </div>

  `).join("");
}

/* =========================================================
   PROFILE
========================================================= */

function renderProfile(){

  document.getElementById("headerUser").textContent=username;
  document.getElementById("profileName").textContent=username;
  document.getElementById("username").value=username;

  document.getElementById("avatar").textContent=
    username.charAt(0).toUpperCase();

  const own=cards.filter(c=>c.seller===currentUser());

  const sales=orders.filter(o=>o.seller===currentUser());

  const purchases=orders.filter(o=>o.buyer===currentUser());

  document.getElementById("statCards").textContent=own.length;
  document.getElementById("statSales").textContent=sales.length;
  document.getElementById("statPurchases").textContent=purchases.length;

  const list=ratings[currentUser()]||[];

  const average=list.length
    ? list.reduce((a,b)=>a+b,0)/list.length
    : 5;

  document.getElementById("profileRating").textContent=
    "★★★★★ "+average.toFixed(1);
}

========================================================= */

function renderBadges(){

  const unread=messages.filter(m=>

  if(unread){
    badge.style.display="inline-flex";
    badge.textContent=unread;
  }else{
    badge.style.display="none";
  }
}
