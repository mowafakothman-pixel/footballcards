<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #ccc;
}

.search {
  background: white;
  padding: 18px;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 600px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.profile {
  background: white;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 20px;
  text-align: center;
}

.profile input {
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 9px;
  width: 70%;
  max-width: 350px;
}

button {
  border: none;
  padding: 11px 16px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.profile button {
  background: #111;
  color: white;
}

.sell {
  background: #111;
  color: white;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.sell input {
  display: block;
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 9px;
  border: none;
}

.sell button {
  width: 100%;
  background: white;
  color: #111;
  margin-top: 8px;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.tabs button {
  background: white;
}

.tabs button.active {
  background: #111;
  color: white;
}

.section {
  display: none;
}

.section.active {
  display: block;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 18px;
  box-shadow: 0 5px 18px rgba(0,0,0,.1);
}

.card-image {
  width: 100%;
  height: 200px;
  background: #f1f1f1;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.price {
  font-size: 22px;
  font-weight: bold;
}

.info {
  color: #666;
}

.card button {
  width: 100%;
  margin-top: 8px;
  background: #111;
  color: white;
}

.card button.light {
  background: #eee;
  color: #111;
}

.request {
  background: white;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 12px;
}

.status {
  font-weight: bold;
  margin: 8px 0;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media(max-width:600px) {
  .tabs {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🎟️ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="search">
  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Spieler, Verein oder Karte suchen..."
  >
</div>

<div class="container">

  <div class="profile">
    <h2>👤 Mein Profil</h2>

    <p id="profileName">
      Noch kein Benutzername
    </p>

    <input
      id="usernameInput"
      type="text"
      placeholder="Dein Benutzername"
    >

    <button onclick="saveUsername()">
      Profil speichern
    </button>
  </div>

  <div class="sell">
    <h2>🃏 Karte verkaufen</h2>

    <form id="sellForm">

      <input
        id="player"
        type="text"
        placeholder="Spieler"
        required
      >

      <input
        id="club"
        type="text"
        placeholder="Verein"
        required
      >

      <input
        id="price"
        type="number"
        placeholder="Preis in €"
        min="0"
        step="0.01"
        required
      >

      <input
        id="image"
        type="file"
        accept="image/*"
        required
      >

      <button type="submit">
        Karte einstellen
      </button>

    </form>
  </div>

  <div class="tabs">

    <button class="active" onclick="showSection('market', this)">
      🏪 Markt
    </button>

    <button onclick="showSection('mine', this)">
      🃏 Meine Karten
    </button>

    <button onclick="showSection('favorites', this)">
      ❤️ Favoriten
    </button>

    <button onclick="showSection('requests', this)">
      📩 Anfragen
    </button>

  </div>

  <section id="market" class="section active">

    <h2>🔥 Aktuelle Karten</h2>

    <div id="cards" class="cards"></div>

  </section>

  <section id="mine" class="section">

    <h2>🃏 Meine Karten</h2>

    <div id="myCards" class="cards"></div>

  </section>

  <section id="favorites" class="section">

    <h2>❤️ Meine Favoriten</h2>

    <div id="favoriteCards" class="cards"></div>

  </section>

  <section id="requests" class="section">

    <h2>📩 Kaufanfragen</h2>

    <div id="purchaseRequests"></div>

  </section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

const sellForm = document.getElementById("sellForm");
const cardsBox = document.getElementById("cards");
const myCardsBox = document.getElementById("myCards");
const favoriteCardsBox =
  document.getElementById("favoriteCards");
const purchaseRequestsBox =
  document.getElementById("purchaseRequests");
const searchInput =
  document.getElementById("searchInput");


function getCards() {
  return JSON.parse(
    localStorage.getItem("footballCards") || "[]"
  );
}


function getFavorites() {
  return JSON.parse(
    localStorage.getItem("favoriteCards") || "[]"
  );
}


function getRequests() {
  return JSON.parse(
    localStorage.getItem("purchaseRequests") || "[]"
  );
}


function saveUsername() {

  const name =
    document.getElementById("usernameInput").value.trim();

  if (!name) {
    alert("Bitte gib einen Benutzernamen ein!");
    return;
  }

  localStorage.setItem("pixelUsername", name);

  document.getElementById("profileName").textContent =
    "👤 " + name;

  alert("Profil gespeichert!");
}


function loadUsername() {

  const name =
    localStorage.getItem("pixelUsername");

  if (name) {

    document.getElementById("profileName").textContent =
      "👤 " + name;

    document.getElementById("usernameInput").value =
      name;
  }
}


function showSection(id, button) {

  document.querySelectorAll(".section")
    .forEach(section => {
      section.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".tabs button")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  loadAll();
}


function isFavorite(card) {

  return getFavorites().some(f =>
    f.player === card.player &&
    f.club === card.club &&
    f.price === card.price &&
    f.image === card.image
  );
}


function createCard(card, index) {

  const div = document.createElement("div");

  div.className = "card";

  div.innerHTML = `

    <div class="card-image">
      <img src="${card.image}" alt="${card.player}">
    </div>

    <h3>${card.player}</h3>

    <p class="info">
      ${card.club}
    </p>

    <p class="price">
      ${card.price} €
    </p>

    <button onclick="showCard(${index})">
      👀 Karte ansehen
    </button>

    <button onclick="buyCard(${index})">
      🛒 Kaufen
    </button>

    <button
      class="light"
      onclick="toggleFavorite(${index})"
    >
      ${isFavorite(card)
        ? "❤️ Favorisiert"
        : "♡ Favorit"}
    </button>

  `;

  return div;
}


function loadCards() {

  const allCards = getCards();

  const search =
    searchInput.value.toLowerCase();

  cardsBox.innerHTML = "";

  const filtered = allCards.filter(card =>
    card.player.toLowerCase().includes(search) ||
    card.club.toLowerCase().includes(search)
  );

  if (filtered.length === 0) {

    cardsBox.innerHTML =
      "<p>Keine Karten gefunden.</p>";

    return;
  }

  filtered.forEach((card, index) => {

    cardsBox.appendChild(
      createCard(card, index)
    );

  });
}


function loadMyCards() {

  const allCards = getCards();

  myCardsBox.innerHTML = "";

  if (allCards.length === 0) {

    myCardsBox.innerHTML =
      "<p>Noch keine Karten eingestellt.</p>";

    return;
  }

  allCards.forEach((card, index) => {

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="card-image">
        <img src="${card.image}">
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button
        class="light"
        onclick="deleteCard(${index})"
      >
        🗑️ Karte löschen
      </button>

    `;

    myCardsBox.appendChild(div);

  });
}


function loadFavorites() {

  const favorites = getFavorites();

  favoriteCardsBox.innerHTML = "";

  if (favorites.length === 0) {

    favoriteCardsBox.innerHTML =
      "<p>Noch keine Favoriten.</p>";

    return;
  }

  favorites.forEach((card, index) => {

    const div = document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="card-image">
        <img src="${card.image}">
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button onclick="buyFavorite(${index})">
        🛒 Kaufen
      </button>

      <button
        class="light"
        onclick="removeFavorite(${index})"
      >
        ❤️ Entfernen
      </button>

    `;

    favoriteCardsBox.appendChild(div);

  });
}


function loadRequests() {

  const requests = getRequests();

  purchaseRequestsBox.innerHTML = "";

  if (requests.length === 0) {

    purchaseRequestsBox.innerHTML =
      "<p>Noch keine Kaufanfragen.</p>";

    return;
  }

  requests.forEach((request, index) => {

    const div =
      document.createElement("div");

    div.className = "request";

    let buttons = "";

    if (request.status === "offen") {

      buttons = `

        <button
          onclick="acceptRequest(${index})"
        >
          ✅ Annehmen
        </button>

        <button
          class="light"
          onclick="rejectRequest(${index})"
        >
          ❌ Ablehnen
        </button>

      `;

    }

    div.innerHTML = `

      <h3>
        📩 ${request.player}
      </h3>

      <p class="info">
        ${request.club}
      </p>

      <p class="price">
        ${request.price} €
      </p>

      <p class="status">
        Status:
        ${getStatusText(request.status)}
      </p>

      ${buttons}

    `;

    purchaseRequestsBox.appendChild(div);

  });
}


function getStatusText(status) {

  if (status === "angenommen")
    return "✅ Angenommen";

  if (status === "abgelehnt")
    return "❌ Abgelehnt";

  return "🕐 Offen";
}


function toggleFavorite(index) {

  const cards = getCards();

  const card = cards[index];

  let favorites = getFavorites();

  const existing =
    favorites.findIndex(f =>
      f.player === card.player &&
      f.club === card.club &&
      f.price === card.price &&
      f.image === card.image
    );

  if (existing !== -1) {

    favorites.splice(existing, 1);

    alert("Aus Favoriten entfernt!");

  } else {

    favorites.push(card);

    alert("Zu Favoriten hinzugefügt!");

  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(favorites)
  );

  loadAll();
}


function removeFavorite(index) {

  const favorites = getFavorites();

  favorites.splice(index, 1);

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(favorites)
  );

  loadFavorites();

}


function buyFavorite(index) {

  const favorites = getFavorites();

  const card = favorites[index];

  sendPurchaseRequest(card);

}


function buyCard(index) {

  const cards = getCards();

  const card = cards[index];

  sendPurchaseRequest(card);

}


function sendPurchaseRequest(card) {

  const confirmBuy = confirm(
    "Möchtest du diese Karte kaufen?\n\n" +
    card.player + " – " +
    card.club + "\n" +
    "Preis: " +
    card.price + " €"
  );

  if (!confirmBuy) return;

  const requests = getRequests();

  requests.push({

    player: card.player,
    club: card.club,
    price: card.price,
    image: card.image,
    status: "offen"

  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadRequests();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );
}


function acceptRequest(index) {

  const requests = getRequests();

  requests[index].status =
    "angenommen";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadRequests();

  alert(
    "✅ Kaufanfrage angenommen!"
  );
}


function rejectRequest(index) {

  const requests = getRequests();

  requests[index].status =
    "abgelehnt";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadRequests();

  alert(
    "❌ Kaufanfrage abgelehnt!"
  );
}


function deleteCard(index) {

  const cards = getCards();

  if (!confirm(
    "Möchtest du diese Karte wirklich löschen?"
  )) {
    return;
  }

  cards.splice(index, 1);

  localStorage.setItem(
    "footballCards",
    JSON.stringify(cards)
  );

  loadAll();

}


function showCard(index) {

  const cards = getCards();

  const card = cards[index];

  const overlay =
    document.createElement("div");

  overlay.style.position = "fixed";
  overlay.style.inset = "0";
  overlay.style.background =
    "rgba(0,0,0,.7)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.padding = "20px";
  overlay.style.zIndex = "9999";

  overlay.innerHTML = `

    <div style="
      background:white;
      padding:20px;
      border-radius:18px;
      width:100%;
      max-width:420px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:12px;
        "
      >

      <h2>${card.player}</h2>

      <p>${card.club}</p>

      <p style="
        font-size:25px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <button
        onclick="buyCard(${index}); this.parentElement.parentElement.remove();"
        style="
          width:100%;
          background:#111;
          color:white;
          margin-top:8px;
        "
      >
        🛒 Kaufen
      </button>

      <button
        onclick="this.parentElement.parentElement.remove()"
        style="
          width:100%;
          background:#eee;
          margin-top:8px;
        "
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(overlay);
}


sellForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    const player =
      document.getElementById("player").value.trim();

    const club =
      document.getElementById("club").value.trim();

    const price =
      document.getElementById("price").value;

    const image =
      document.getElementById("image").files[0];

    if (!image) {

      alert("Bitte wähle ein Bild aus!");

      return;
    }

    const reader =
      new FileReader();

    reader.onload = function() {

      const img =
        new Image();

      img.onload = function() {

        const canvas =
          document.createElement("canvas");

        const maxSize = 700;

        let width = img.width;
        let height = img.height;

        if (width > height &&
            width > maxSize) {

          height *= maxSize / width;
          width = maxSize;

        } else if (
          height > maxSize
        ) {

          width *= maxSize / height;
          height = maxSize;

        }

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        const imageData =
          canvas.toDataURL(
            "image/jpeg",
            0.6
          );

        const cards = getCards();

        cards.unshift({

          player: player,
          club: club,
          price: price,
          image: imageData

        });

        try {

          localStorage.setItem(
            "footballCards",
            JSON.stringify(cards)
          );

        } catch(error) {

          alert(
            "Speicher voll. Bitte lösche zuerst eine Karte."
          );

          return;
        }

        sellForm.reset();

        loadAll();

        alert(
          "🎉 Deine Karte wurde eingestellt!"
        );

      };

      img.src = reader.result;

    };

    reader.readAsDataURL(image);

  }
);


searchInput.addEventListener(
  "input",
  loadCards
);


function loadAll() {

  loadCards();
  loadMyCards();
  loadFavorites();
  loadRequests();

}


loadUsername();
loadAll();

</script>

</body>
</html>
