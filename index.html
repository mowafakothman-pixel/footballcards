<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 7px 0 0;
  color: #bbb;
}

/* PROFILBAR */

.profile-bar {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 14px 20px;
}

.profile-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.profile-user {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.profile-controls {
  display: flex;
  gap: 8px;
}

.profile-controls input {
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 10px;
}

.primary-btn {
  border: none;
  background: #111;
  color: white;
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: bold;
}

/* SUCHE */

.search {
  background: white;
  padding: 20px;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 650px;
  padding: 15px;
  border: 1px solid #ddd;
  border-radius: 13px;
  font-size: 16px;
}

/* CONTAINER */

.container {
  width: 100%;
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

/* VERKAUFEN */

.sell {
  background: #111;
  color: white;
  padding: 22px;
  border-radius: 18px;
  margin-bottom: 22px;
  text-align: center;
}

.sell h2 {
  margin-top: 0;
}

.sell form {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

.sell input {
  padding: 12px;
  border: none;
  border-radius: 9px;
}

.sell button {
  padding: 12px 18px;
  border: none;
  border-radius: 9px;
  background: white;
  color: #111;
  font-weight: bold;
}

/* NAVIGATION */

.navigation {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 22px;
}

.navigation button {
  border: none;
  background: white;
  padding: 15px 8px;
  border-radius: 13px;
  font-weight: bold;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.navigation button.active {
  background: #111;
  color: white;
}

/* SEITEN */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* KARTEN */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
  gap: 17px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,.09);
}

.card-image {
  width: 100%;
  height: 205px;
  background: #f0f1f2;
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.card h3 {
  margin-bottom: 5px;
}

.info {
  color: #666;
  margin: 6px 0;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 10px 0;
}

.card button {
  width: 100%;
  margin-top: 8px;
  padding: 11px;
  border: none;
  border-radius: 9px;
  background: #111;
  color: white;
  font-weight: bold;
}

.card button.gray {
  background: #eee;
  color: #111;
}

/* STATUS */

.status {
  display: inline-block;
  padding: 7px 10px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
}

.status.open {
  background: #fff1d6;
  color: #946200;
}

.status.accepted {
  background: #ddf7e5;
  color: #137333;
}

.status.rejected {
  background: #ffe1e1;
  color: #b42318;
}

/* ANFRAGEN */

.request-list {
  display: grid;
  gap: 14px;
}

.request {
  background: white;
  padding: 17px;
  border-radius: 17px;
  box-shadow: 0 4px 14px rgba(0,0,0,.08);
}

.request-top {
  display: flex;
  gap: 14px;
  align-items: center;
}

.request-image {
  width: 90px;
  height: 90px;
  object-fit: contain;
  background: #f1f1f1;
  border-radius: 12px;
  flex-shrink: 0;
}

.request-info {
  flex: 1;
}

.request-info h3 {
  margin: 0 0 6px;
}

.request-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.accept-btn,
.reject-btn {
  border: none;
  color: white;
  padding: 12px 17px;
  border-radius: 10px;
  font-weight: bold;
  flex: 1;
}

.accept-btn {
  background: #16a34a;
}

.reject-btn {
  background: #dc2626;
}

/* VERKÄUFERPROFIL */

.seller-profile {
  background: white;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
  margin-bottom: 20px;
}

.seller-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.big-avatar {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: bold;
}

.seller-header h2 {
  margin: 0;
}

.seller-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 22px;
}

.seller-stat {
  background: #f5f5f5;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

.seller-stat strong {
  display: block;
  font-size: 23px;
}

.seller-stat span {
  color: #777;
  font-size: 13px;
}

/* BEWERTUNG */

.rating {
  font-size: 22px;
  margin-top: 8px;
}

.rating span {
  cursor: pointer;
}

.rating span.selected {
  color: #f5b400;
}

/* LEER */

.empty {
  background: white;
  padding: 25px;
  border-radius: 15px;
  color: #777;
  text-align: center;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 35px;
  color: #777;
}

/* MOBILE */

@media(max-width:700px) {

  .navigation {
    grid-template-columns: repeat(2, 1fr);
  }

  .profile-inner {
    justify-content: center;
  }

  .profile-controls {
    width: 100%;
  }

  .profile-controls input {
    flex: 1;
    min-width: 0;
  }

  .sell input {
    width: 100%;
  }

  .sell button {
    width: 100%;
  }

  .request-top {
    align-items: flex-start;
  }

  .request-actions {
    flex-direction: column;
  }

  .seller-stats {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- PROFIL -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div
        id="avatar"
        class="avatar"
      >
        ?
      </div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        class="primary-btn"
        onclick="saveUsername()"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- SUCHE -->

<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
  >

</div>

<div class="container">

<!-- VERKAUFEN -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm">

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- NAVIGATION -->

<div class="navigation">

  <button
    id="navCards"
    class="active"
    onclick="showPage('cardsPage','navCards')"
  >
    🔥 Karten
  </button>

  <button
    id="navFavorites"
    onclick="showPage('favoritesPage','navFavorites')"
  >
    ❤️ Favoriten
  </button>

  <button
    id="navMine"
    onclick="showPage('minePage','navMine')"
  >
    🃏 Meine Karten
  </button>

  <button
    id="navRequests"
    onclick="showPage('requestsPage','navRequests')"
  >
    📩 Anfragen
  </button>

  <button
    id="navProfile"
    onclick="showPage('profilePage','navProfile')"
  >
    👤 Profil
  </button>

</div>

<!-- KARTEN -->

<section
  id="cardsPage"
  class="page active"
>

  <h2>🔥 Aktuelle Karten</h2>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- FAVORITEN -->

<section
  id="favoritesPage"
  class="page"
>

  <h2 id="favoriteTitle">
    ❤️ Favoriten (0)
  </h2>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- MEINE KARTEN -->

<section
  id="minePage"
  class="page"
>

  <h2>🃏 Meine Karten</h2>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- ANFRAGEN -->

<section
  id="requestsPage"
  class="page"
>

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- PROFIL -->

<section
  id="profilePage"
  class="page"
>

  <h2>👤 Mein Profil</h2>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* ==========================================
   HILFSFUNKTIONEN
========================================== */

function getUsername() {

  return localStorage.getItem(
    "pixelUsername"
  ) || "";

}


function getCards() {

  return JSON.parse(
    localStorage.getItem(
      "footballCards"
    )
  ) || [];

}


function getRequests() {

  return JSON.parse(
    localStorage.getItem(
      "purchaseRequests"
    )
  ) || [];

}


function getFavorites() {

  return JSON.parse(
    localStorage.getItem(
      "favoriteCards"
    )
  ) || [];

}


function getRatings() {

  return JSON.parse(
    localStorage.getItem(
      "sellerRatings"
    )
  ) || {};

}


/* ==========================================
   BENUTZERNAME
========================================== */

function saveUsername() {

  const input =
    document.getElementById(
      "usernameInput"
    );

  const name =
    input.value.trim();

  if (!name) {

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  localStorage.setItem(
    "pixelUsername",
    name
  );

  updateProfile();

  loadAll();

  alert(
    "👤 Profil gespeichert!"
  );

}


function updateProfile() {

  const name =
    getUsername();

  const profileName =
    document.getElementById(
      "profileName"
    );

  const avatar =
    document.getElementById(
      "avatar"
    );

  const input =
    document.getElementById(
      "usernameInput"
    );

  if (name) {

    profileName.textContent =
      name;

    avatar.textContent =
      name.charAt(0).toUpperCase();

    input.value =
      name;

  } else {

    profileName.textContent =
      "Kein Benutzer";

    avatar.textContent =
      "?";

  }

}


/* ==========================================
   NAVIGATION
========================================== */

function showPage(
  pageId,
  buttonId
) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });

  document
    .getElementById(pageId)
    .classList.add("active");

  document
    .querySelectorAll(
      ".navigation button"
    )
    .forEach(button => {

      button.classList.remove(
        "active"
      );

    });

  document
    .getElementById(buttonId)
    .classList.add("active");

}


/* ==========================================
   KARTEN LADEN
========================================== */

function loadCards() {

  const box =
    document.getElementById(
      "cards"
    );

  box.innerHTML = "";

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

  const cards =
    getCards();

  const filtered =
    cards.filter(card => {

      return (

        String(card.player)
          .toLowerCase()
          .includes(search)

        ||

        String(card.club)
          .toLowerCase()
          .includes(search)

        ||

        String(card.owner)
          .toLowerCase()
          .includes(search)

      );

    });

  if (!filtered.length) {

    box.innerHTML =
      "<div class='empty'>Keine Karten gefunden.</div>";

    return;

  }

  filtered.forEach(card => {

    createCard(
      card,
      box
    );

  });

}


/* ==========================================
   KARTE ERSTELLEN
========================================== */

function createCard(
  card,
  box
) {

  const username =
    getUsername();

  const favorites =
    getFavorites();

  const requests =
    getRequests();

  const favorite =
    favorites.some(
      f =>
        f.id === card.id
    );

  const myRequest =
    requests.find(
      request =>

        request.cardId ===
        card.id

        &&

        request.buyer ===
        username

        &&

        request.status !==
        "rejected"

    );

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "card";

  let buyButton = "";

  /* EIGENE KARTE */

  if (
    card.owner ===
    username
  ) {

    buyButton = `
      <button
        class="gray"
        onclick="ownCardMessage()"
      >
        🚫 Deine Karte
      </button>
    `;

  }

  /* NOCH KEIN BENUTZER */

  else if (!username) {

    buyButton = `
      <button
        onclick="needUsername()"
      >
        🛒 Kaufen
      </button>
    `;

  }

  /* ANFRAGE WURDE GESENDET */

  else if (myRequest) {

    if (
      myRequest.status ===
      "accepted"
    ) {

      buyButton = `
        <button
          class="gray"
          disabled
        >
          ✅ Angenommen
        </button>
      `;

    } else {

      buyButton = `
        <button
          class="gray"
          disabled
        >
          🕐 Anfrage offen
        </button>
      `;

    }

  }

  /* NORMALES KAUFEN */

  else {

    buyButton = `
      <button
        onclick="buyCard('${card.id}')"
      >
        🛒 Kaufen
      </button>
    `;

  }

  item.innerHTML = `

    <div class="card-image">

      <img
        src="${card.image}"
        alt="${card.player}"
      >

    </div>

    <h3>
      ${card.player}
    </h3>

    <p class="info">
      ${card.club}
    </p>

    <p class="price">
      ${card.price} €
    </p>

    <p class="info">
      👤 Verkäufer:
      <strong>
        ${card.owner || "Unbekannt"}
      </strong>
    </p>

    <button
      onclick="showCard('${card.id}')"
    >
      👀 Karte ansehen
    </button>

    ${buyButton}

    <button
      class="gray"
      onclick="toggleFavorite('${card.id}')"
    >
      ${
        favorite
        ? "❤️ Favorisiert"
        : "♡ Favorit"
      }
    </button>

    <button
      class="gray"
      onclick="openSellerProfile('${card.owner}')"
    >
      👤 Verkäuferprofil
    </button>

  `;

  box.appendChild(item);

}


/* ==========================================
   KARTE EINSTELLEN
========================================== */

document
  .getElementById(
    "sellForm"
  )
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();

      const username =
        getUsername();

      if (!username) {

        alert(
          "👤 Bitte zuerst einen Benutzernamen festlegen."
        );

        return;

      }

      const player =
        document
          .getElementById(
            "player"
          )
          .value
          .trim();

      const club =
        document
          .getElementById(
            "club"
          )
          .value
          .trim();

      const price =
        document
          .getElementById(
            "price"
          )
          .value;

      const file =
        document
          .getElementById(
            "image"
          )
          .files[0];

      if (!file) {

        alert(
          "Bitte wähle ein Foto aus."
        );

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function() {

          const image =
            new Image();

          image.onload =
            function() {

              const canvas =
                document.createElement(
                  "canvas"
                );

              const max =
                700;

              let width =
                image.width;

              let height =
                image.height;

              if (
                width > height &&
                width > max
              ) {

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              } else if (
                height > max
              ) {

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }

              canvas.width =
                width;

              canvas.height =
                height;

              canvas
                .getContext("2d")
                .drawImage(
                  image,
                  0,
                  0,
                  width,
                  height
                );

              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  0.6
                );

              const cards =
                getCards();

              cards.unshift({

                id:
                  Date.now() +
                  "-" +
                  Math.random()
                    .toString(36)
                    .substring(2),

                player:
                  player,

                club:
                  club,

                price:
                  price,

                image:
                  imageData,

                owner:
                  username,

                sold:
                  false,

                soldTo:
                  null

              });

              try {

                localStorage.setItem(
                  "footballCards",
                  JSON.stringify(cards)
                );

              } catch(error) {

                alert(
                  "Der Speicher ist voll. Bitte lösche zuerst Karten."
                );

                return;

              }

              document
                .getElementById(
                  "sellForm"
                )
                .reset();

              loadAll();

              alert(
                "🎉 Deine Karte wurde eingestellt!"
              );

            };

          image.src =
            reader.result;

        };

      reader.readAsDataURL(file);

    }
  );


/* ==========================================
   EIGENE KARTE
========================================== */

function ownCardMessage() {

  alert(
    "🚫 Du kannst deine eigene Karte nicht kaufen."
  );

}


/* ==========================================
   BENUTZERNAME FEHLT
========================================== */

function needUsername() {

  alert(
    "👤 Bitte zuerst einen Benutzernamen festlegen."
  );

}


/* ==========================================
   KAUFANFRAGE
========================================== */

function buyCard(cardId) {

  const username =
    getUsername();

  if (!username) {

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if (!card) return;

  /* SICHERHEITSCHECK */

  if (
    card.owner ===
    username
  ) {

    ownCardMessage();

    return;

  }

  /* SCHON ANGEFRAGT? */

  const requests =
    getRequests();

  const existing =
    requests.find(
      request =>

        request.cardId ===
        cardId

        &&

        request.buyer ===
        username

        &&

        (
          request.status ===
          "pending"

          ||

          request.status ===
          "accepted"
        )

    );

  if (existing) {

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed =
    confirm(

      "Möchtest du diese Karte kaufen?\n\n" +

      card.player +

      " – " +

      card.club +

      "\n\nPreis: " +

      card.price +

      " €"

    );

  if (!confirmed) return;

  requests.push({

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      username,

    seller:
      card.owner,

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadAll();

  alert(
    "📩 " +
    username +

/* ==========================================
   ANNEHMEN
========================================== */

function acceptRequest(
  requestId
) {

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if (!request) return;

  /* NUR VERKÄUFER */

  if (
    request.seller !==
    username
  ) {

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if (
    request.status !==
    "pending"
  ) {

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " annehmen?"
    );

  if (!confirmed) return;

  request.status =
    "accepted";

  /*
    Karte wird als verkauft markiert.
  */

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id ===
        request.cardId
    );

  if (card) {

    card.sold =
      true;

    card.soldTo =
      request.buyer;

  }

  localStorage.setItem(
    "footballCards",
    JSON.stringify(cards)
  );

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(requests)
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}


/* ==========================================
   ABLEHNEN
========================================== */

function rejectRequest(
  requestId
) {

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if (!request) return;

  /* NUR VERKÄUFER */

  if (
    request.seller !==
    username
  ) {

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage ablehnen."
    );

    return;

  }

  if (
    request.status !==
    "pending"
  ) {

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const confirmed =
    confirm(
      "Möchtest du die Anfrage von " +
      request.buyer +
      " wirklich ablehnen?"
    );

  if (!confirmed) return;

  request.status =
    "rejected";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadAll();

  alert(
    "🔴 Anfrage abgelehnt."
  );

}


/* ==========================================
   FAVORITEN
========================================== */

function toggleFavorite(
  cardId
) {

  const card =
    getCards().find(
      c =>
        c.id === cardId
    );

  if (!card) return;

  let favorites =
    getFavorites();

  const index =
    favorites.findIndex(
      f =>
        f.id === cardId
    );

  if (index !== -1) {

    favorites.splice(
      index,
      1
    );

    alert(
      "❤️ Aus Favoriten entfernt."
    );

  } else {

    favorites.push(card);

    alert(
      "❤️ Zu Favoriten hinzugefügt."
    );

  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(
      favorites
    )
  );

  loadAll();

}

/* ==========================================
   KARTE LÖSCHEN
========================================== */

function deleteCard(
  cardId
) {

  const username =
    getUsername();

  let cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if (!card) return;

  if (
    card.owner !==
    username
  ) {

    alert(
      "🚫 Du kannst diese Karte nicht löschen."
    );

    return;

  }

  if (
    !confirm(
      "Möchtest du diese Karte wirklich löschen?"
    )
  ) {

    return;

  }

  cards =
    cards.filter(
      c =>
        c.id !== cardId
    );

  localStorage.setItem(
    "footballCards",
    JSON.stringify(
      cards
    )
  );

  loadAll();

}

function openSellerProfile(

) {

    "profilePage",
    "navProfile"
  );

  loadSellerProfile(

  );

}


function loadSellerProfile(
  seller
) {

  const box =
    document.getElementById(
      "profileBox"
    );

  const cards =
    getCards().filter(
      card =>
        card.owner ===
        seller
    );

  const soldCards =
    cards.filter(
      card =>
        card.sold === true
    );

  const ratings =
    getRatings();

  const sellerRatings =
    ratings[seller] || [];

  let average =
    0;

  if (
    sellerRatings.length
  ) {

    average =
      sellerRatings.reduce(
        (a,b) =>
          a + b,
        0
      ) /
      sellerRatings.length;

  }

  const stars =
    average
    ? "⭐".repeat(
        Math.round(average)
      )
    : "Noch keine Bewertungen";

  box.innerHTML = `

    <div class="seller-header">

      <div class="big-avatar">
        ${seller.charAt(0).toUpperCase()}
      </div>

      <div>

        <h2>
          ${seller}
        </h2>

        <div class="rating">
          ${stars}
        </div>

      </div>

    </div>

    <div class="seller-stats">

      <div class="seller-stat">

        <strong>
          ${soldCards.length}
        </strong>

        <span>
          Verkauft
        </span>

      </div>

      <div class="seller-stat">

        <strong>
          ${cards.length}
        </strong>

        <span>
          Angebote
        </span>

      </div>

      <div class="seller-stat">

        <strong>
          ${
            average
            ? average.toFixed(1)
            : "-"
          }
        </strong>

        <span>
          Bewertung
        </span>

      </div>

    </div>

  `;

  /* EIGENE ANGEBOTE */

  const heading =
    document.createElement(
      "h2"
    );

  heading.textContent =
    "🏆 Eigene Angebote";

  box.appendChild(
    heading
  );

  const offers =
    document.createElement(
      "div"
    );

  offers.className =
    "cards";

  if (!cards.length) {

    offers.innerHTML =
      "<div class='empty'>Keine Angebote vorhanden.</div>";

  } else {

    cards.forEach(
      card => {

        createCard(
          card,
          offers
        );

      }
    );

  }

  box.appendChild(
    offers
  );

}


/* ==========================================
   KARTE ANSEHEN
========================================== */

function showCard(
  cardId
) {

  const card =
    getCards().find(
      c =>
        c.id === cardId
    );

  if (!card) return;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.style.position =
    "fixed";

  overlay.style.top =
    "0";

  overlay.style.left =
    "0";

  overlay.style.width =
    "100%";

  overlay.style.height =
    "100%";

  overlay.style.background =
    "rgba(0,0,0,.72)";

  overlay.style.display =
    "flex";

  overlay.style.alignItems =
    "center";

  overlay.style.justifyContent =
    "center";

  overlay.style.zIndex =
    "9999";

  overlay.style.padding =
    "20px";

  overlay.innerHTML = `

    <div style="
      background:white;
      padding:22px;
      border-radius:20px;
      width:100%;
      max-width:420px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        alt="${card.player}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:14px;
        "
      >

      <h2>
        ${card.player}
      </h2>

      <p>
        ${card.club}
      </p>

      <p style="
        font-size:25px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <p>
        👤 Verkäufer:
        <strong>
          ${card.owner}
        </strong>
      </p>

      <button
        id="closeCard"
        style="
          width:100%;
          border:none;
          background:#111;
          color:white;
          padding:13px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  document
    .getElementById(
      "closeCard"
    )
    .onclick =
      function() {

        overlay.remove();

      };

}
