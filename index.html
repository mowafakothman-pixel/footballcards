<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Cards</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f5f7;
  color: #111;
}

/* HEADER */

header {
  background: linear-gradient(135deg, #111, #252525);
  color: white;
  padding: 25px 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 31px;
}

header p {
  color: #bbb;
  margin: 7px 0 0;
}

/* PROFILBAR */

.profile-bar {
  background: white;
  border-bottom: 1px solid #e5e5e5;
  padding: 13px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.profile-inner {
  max-width: 1100px;
  margin: auto;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;
}

.profile-user {
  display: flex;
  align-items: center;
  gap: 10px;

  font-weight: bold;
}

.avatar {
  width: 43px;
  height: 43px;

  border-radius: 50%;

  background: #111;
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: bold;
}

/* BENACHRICHTIGUNG */

.notification {
  position: relative;
}

.notification-badge {
  position: absolute;

  top: -8px;
  right: -8px;

  min-width: 20px;
  height: 20px;

  padding: 2px 6px;

  background: #e53935;
  color: white;

  border-radius: 20px;

  font-size: 12px;
  font-weight: bold;

  display: none;

  align-items: center;
  justify-content: center;
}

.notification-badge.show {
  display: flex;
}

/* PROFIL CONTROLS */

.profile-controls {
  display: flex;
  gap: 8px;
}

.profile-controls input {
  padding: 10px;

  border: 1px solid #ddd;
  border-radius: 10px;
}

.primary-btn {
  border: none;

  background: #111;
  color: white;

  padding: 10px 15px;

  border-radius: 10px;

  font-weight: bold;
}

/* SEARCH */

.search {
  background: white;
  padding: 20px;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 650px;

  padding: 15px;

  border: 1px solid #ddd;
  border-radius: 13px;

  font-size: 16px;
}

/* CONTAINER */

.container {
  width: 100%;
  max-width: 1100px;

  margin: auto;
  padding: 20px;
}

/* SELL */

.sell {
  background: linear-gradient(135deg, #111, #292929);

  color: white;

  padding: 23px;

  border-radius: 20px;

  margin-bottom: 22px;

  text-align: center;

  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

.sell h2 {
  margin-top: 0;
}

.sell form {
  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 8px;
}

.sell input {
  padding: 12px;

  border: none;
  border-radius: 9px;
}

.sell button {
  padding: 12px 18px;

  border: none;
  border-radius: 9px;

  background: white;
  color: #111;

  font-weight: bold;
}

/* NAVIGATION */

.navigation {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 10px;

  margin-bottom: 23px;
}

.navigation button {
  border: none;

  background: white;

  padding: 14px 8px;

  border-radius: 14px;

  font-weight: bold;

  box-shadow:
    0 3px 12px rgba(0,0,0,.06);

  transition: .2s;
}

.navigation button.active {
  background: #111;
  color: white;

  transform: translateY(-1px);
}

/* PAGE */

.page {
  display: none;
}

.page.active {
  display: block;

  animation: pageIn .2s ease;
}

@keyframes pageIn {

  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* CARDS */

.cards {
  display: grid;

  grid-template-columns:
    repeat(auto-fit, minmax(245px, 1fr));

  gap: 17px;
}

.card {
  background: white;

  border-radius: 19px;

  padding: 16px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  transition:
    transform .2s,
    box-shadow .2s;
}

.card:hover {
  transform: translateY(-3px);

  box-shadow:
    0 10px 25px rgba(0,0,0,.12);
}

.card-image {
  width: 100%;
  height: 205px;

  background: #f0f1f2;

  border-radius: 14px;

  overflow: hidden;

  display: flex;

  align-items: center;
  justify-content: center;
}

.card-image img {
  width: 100%;
  height: 100%;

  object-fit: contain;
}

.card h3 {
  margin-bottom: 5px;
}

.info {
  color: #666;

  margin: 6px 0;
}

.price {
  font-size: 23px;

  font-weight: bold;

  margin: 10px 0;
}

.card button {
  width: 100%;

  margin-top: 8px;

  padding: 11px;

  border: none;

  border-radius: 9px;

  background: #111;
  color: white;

  font-weight: bold;
}

.card button.gray {
  background: #eee;
  color: #111;
}

/* STATUS */

.status {
  display: inline-block;

  padding: 7px 10px;

  border-radius: 9px;

  font-size: 13px;

  font-weight: bold;
}

.status.open {
  background: #fff1d6;
  color: #946200;
}

.status.accepted {
  background: #ddf7e5;
  color: #137333;
}

.status.rejected {
  background: #ffe1e1;
  color: #b42318;
}

/* REQUESTS */

.request-list {
  display: grid;

  gap: 14px;
}

.request {
  background: white;

  padding: 17px;

  border-radius: 17px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.07);
}

.request-top {
  display: flex;

  gap: 14px;

  align-items: center;
}

.request-image {
  width: 90px;
  height: 90px;

  object-fit: contain;

  background: #f1f1f1;

  border-radius: 12px;

  flex-shrink: 0;
}

.request-info {
  flex: 1;
}

.request-info h3 {
  margin: 0 0 6px;
}

.request-actions {
  display: flex;

  gap: 10px;

  margin-top: 15px;
}

.accept-btn,
.reject-btn {
  border: none;

  color: white;

  padding: 12px 17px;

  border-radius: 10px;

  font-weight: bold;

  flex: 1;
}

.accept-btn {
  background: #16a34a;
}

.reject-btn {
  background: #dc2626;
}

/* PROFILE */

.seller-profile {
  background: white;

  border-radius: 21px;

  padding: 25px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  margin-bottom: 20px;
}

.seller-header {
  display: flex;

  align-items: center;

  gap: 15px;
}

.big-avatar {
  width: 75px;
  height: 75px;

  border-radius: 50%;

  background: linear-gradient(
    135deg,
    #111,
    #333
  );

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 28px;

  font-weight: bold;
}

.seller-header h2 {
  margin: 0;
}

.seller-rating {
  margin-top: 7px;

  color: #f2a900;

  font-size: 21px;
}

.seller-rating small {
  color: #777;

  font-size: 13px;
}

/* STATS */

.seller-stats {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-top: 22px;
}

.seller-stat {
  background: #f5f5f5;

  padding: 16px;

  border-radius: 13px;

  text-align: center;
}

.seller-stat strong {
  display: block;

  font-size: 23px;
}

.seller-stat span {
  color: #777;

  font-size: 13px;
}

/* RATING BOX */

.rating-box {
  background: #f8f8f8;

  padding: 18px;

  border-radius: 15px;

  margin-top: 18px;
}

.rating-stars {
  display: flex;

  gap: 4px;

  margin: 10px 0;
}

.rating-star {
  border: none;

  background: transparent;

  font-size: 29px;

  cursor: pointer;

  color: #ccc;
}

.rating-star.selected {
  color: #f2a900;
}

.rating-comment {
  width: 100%;

  min-height: 75px;

  border: 1px solid #ddd;

  border-radius: 10px;

  padding: 10px;

  resize: vertical;
}

.rating-submit {
  margin-top: 9px;

  border: none;

  background: #111;

  color: white;

  padding: 11px 17px;

  border-radius: 9px;

  font-weight: bold;
}

/* REVIEWS */

.review {
  background: #f7f7f7;

  padding: 13px;

  border-radius: 12px;

  margin-top: 10px;
}

.review-stars {
  color: #f2a900;
}

/* EMPTY */

.empty {
  background: white;

  padding: 25px;

  border-radius: 15px;

  color: #777;

  text-align: center;
}

/* FOOTER */

footer {
  text-align: center;

  padding: 35px;

  color: #777;
}

/* MOBILE */

@media(max-width:700px) {

  .profile-inner {
    flex-wrap: wrap;

    justify-content: center;
  }

  .profile-controls {
    width: 100%;
  }

  .profile-controls input {
    flex: 1;
    min-width: 0;
  }

  .navigation {
    grid-template-columns:
      repeat(2, 1fr);
  }

  .sell input {
    width: 100%;
  }

  .sell button {
    width: 100%;
  }

  .request-top {
    align-items: flex-start;
  }

  .request-actions {
    flex-direction: column;
  }

  .seller-stats {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>

<h1>⚽ Pixel Cards</h1>

<p>
Der Marktplatz für Fußballkarten
</p>

</header>


<!-- PROFILBAR -->

<div class="profile-bar">

<div class="profile-inner">

<div class="profile-user">

<div
id="avatar"
class="avatar"
>
?
</div>

<span id="profileName">
Kein Benutzer
</span>

</div>


<div class="profile-controls">

<input
id="usernameInput"
type="text"
maxlength="20"
placeholder="Benutzername"
>

<button
class="primary-btn"
onclick="saveUsername()"
>
Profil speichern
</button>

</div>

</div>

</div>


<!-- SUCHE -->

<div class="search">

<input
id="searchInput"
type="text"
placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
>

</div>


<div class="container">


<!-- VERKAUFEN -->

<div class="sell">

<h2>
🎟️ Karte verkaufen
</h2>

<p>
Stelle deine Fußballkarte schnell und einfach ein.
</p>

<form id="sellForm">

<input
id="player"
type="text"
placeholder="Spieler"
required
>

<input
id="club"
type="text"
placeholder="Verein"
required
>

<input
id="price"
type="number"
min="0"
step="0.01"
placeholder="Preis in €"
required
>

<input
id="image"
type="file"
accept="image/*"
required
>

<button type="submit">
Karte einstellen
</button>

</form>

</div>


<!-- NAVIGATION -->

<div class="navigation">

<button
id="navCards"
class="active"
onclick="showPage('cardsPage','navCards')"
>
🔥 Karten
</button>


<button
id="navFavorites"
onclick="showPage('favoritesPage','navFavorites')"
>
❤️ Favoriten
</button>


<button
id="navMine"
onclick="showPage('minePage','navMine')"
>
🃏 Meine Karten
</button>


<button
id="navRequests"
onclick="showPage('requestsPage','navRequests')"
>

<div
class="notification"
>

📩 Anfragen

<span
id="requestBadge"
class="notification-badge"
>
0
</span>

</div>

</button>


<button
id="navProfile"
onclick="showPage('profilePage','navProfile')"
>
👤 Profil
</button>

</div>


<!-- KARTEN -->

<section
id="cardsPage"
class="page active"
>

<h2>
🔥 Aktuelle Karten
</h2>

<div
id="cards"
class="cards"
></div>

</section>


<!-- FAVORITEN -->

<section
id="favoritesPage"
class="page"
>

<h2 id="favoriteTitle">
❤️ Favoriten (0)
</h2>

<div
id="favoriteCards"
class="cards"
></div>

</section>


<!-- MEINE KARTEN -->

<section
id="minePage"
class="page"
>

<h2>
🃏 Meine Karten
</h2>

<div
id="myCards"
class="cards"
></div>

</section>


<!-- ANFRAGEN -->

<section
id="requestsPage"
class="page"
>

<h2 id="requestTitle">
📩 Meine Kaufanfragen (0)
</h2>

<div
id="purchaseRequests"
class="request-list"
></div>


<br>


<h2 id="sellerRequestTitle">
📥 Anfragen für meine Karten (0)
</h2>

<div
id="sellerRequests"
class="request-list"
></div>

</section>


<!-- PROFIL -->

<section
id="profilePage"
class="page"
>

<h2>
👤 Mein Profil
</h2>

<div
id="profileBox"
class="seller-profile"
></div>

</section>


</div>


<footer>

© 2026 Pixel Cards

</footer>


<script>

/* ======================================
   DATEN
====================================== */

function getUsername() {

return localStorage.getItem(
"pixelUsername"
) || "";

}


function getCards() {

return JSON.parse(
localStorage.getItem(
"footballCards"
)
) || [];

}


function getRequests() {

return JSON.parse(
localStorage.getItem(
"purchaseRequests"
)
) || [];

}


function getFavorites() {

return JSON.parse(
localStorage.getItem(
"favoriteCards"
)
) || [];

}


function getRatings() {

return JSON.parse(
localStorage.getItem(
"sellerRatings"
)
) || {};

}


/* ======================================
   PROFIL
====================================== */

function saveUsername() {

const input =
document.getElementById(
"usernameInput"
);

const name =
input.value.trim();

if (!name) {

alert(
"Bitte gib einen Benutzernamen ein."
);

return;

}

localStorage.setItem(
"pixelUsername",
name
);

updateProfile();

loadAll();

alert(
"👤 Profil gespeichert!"
);

}


function updateProfile() {

const name =
getUsername();

document.getElementById(
"profileName"
).textContent =
name || "Kein Benutzer";

document.getElementById(
"avatar"
).textContent =
name
? name.charAt(0).toUpperCase()
: "?";

document.getElementById(
"usernameInput"
).value =
name;

}


/* ======================================
   NAVIGATION
====================================== */

function showPage(
pageId,
buttonId
) {

document
.querySelectorAll(".page")
.forEach(
page =>
page.classList.remove("active")
);

document
.getElementById(pageId)
.classList.add("active");

document
.querySelectorAll(".navigation button")
.forEach(
button =>
button.classList.remove("active")
);

document
.getElementById(buttonId)
.classList.add("active");

}


/* ======================================
   BADGE
====================================== */

function updateNotificationBadge() {

const username =
getUsername();

const requests =
getRequests();

const open =
requests.filter(
request =>
request.seller === username &&
request.status === "pending"
);

const badge =
document.getElementById(
"requestBadge"
);

if (open.length > 0) {

badge.textContent =
open.length;

badge.classList.add(
"show"
);

} else {

badge.classList.remove(
"show"
);

}

}


/* ======================================
   KARTEN
====================================== */

function loadCards() {

const box =
document.getElementById(
"cards"
);

box.innerHTML = "";

const search =
document.getElementById(
"searchInput"
)
.value
.toLowerCase()
.trim();

const cards =
getCards();

const filtered =
cards.filter(
card =>

String(card.player)
.toLowerCase()
.includes(search)

||

String(card.club)
.toLowerCase()
.includes(search)

||

String(card.owner)
.toLowerCase()
.includes(search)

);

if (!filtered.length) {

box.innerHTML =
"<div class='empty'>Keine Karten gefunden.</div>";

return;

}

filtered.forEach(
card =>
createCard(card,box)
);

}


function createCard(
card,
box
) {

const username =
getUsername();

const favorites =
getFavorites();

const requests =
getRequests();

const favorite =
favorites.some(
f =>
f.id === card.id
);

const request =
requests.find(
r =>
r.cardId === card.id &&
r.buyer === username &&
(
r.status === "pending" ||
r.status === "accepted"
)
);

let buyButton = "";


if (
card.owner === username
) {

buyButton = `

<button
class="gray"
onclick="ownCardMessage()"
>
🚫 Deine Karte
</button>

`;

}

else if (!username) {

buyButton = `

<button
onclick="needUsername()"
>
🛒 Kaufen
</button>

`;

}

else if (request) {

if (
request.status === "accepted"
) {

buyButton = `

<button
class="gray"
disabled
>
✅ Angenommen
</button>

`;

}
else {

buyButton = `

<button
class="gray"
disabled
>
🕐 Anfrage offen
</button>

`;

}

}

else {

buyButton = `

<button
onclick="buyCard('${card.id}')"
>
🛒 Kaufen
</button>

`;

}


const item =
document.createElement(
"div"
);

item.className =
"card";


item.innerHTML = `

<div class="card-image">

<img
src="${card.image}"
alt="${card.player}"
>

</div>


<h3>
${card.player}
</h3>


<p class="info">
${card.club}
</p>


<p class="price">
${card.price} €
</p>


<p class="info">

👤 Verkäufer:

<strong>
${card.owner}
</strong>

</p>


<button
onclick="showCard('${card.id}')"
>
👀 Karte ansehen
</button>


${buyButton}


<button
class="gray"
onclick="toggleFavorite('${card.id}')"
>
${
favorite
? "❤️ Favorisiert"
: "♡ Favorit"
}
</button>


<button
class="gray"
onclick="openSellerProfile('${card.owner}')"
>
👤 Verkäuferprofil
</button>

`;


box.appendChild(item);

}


/* ======================================
   VERKAUFEN
====================================== */

document
.getElementById("sellForm")
.addEventListener(
"submit",
function(event) {

event.preventDefault();

const username =
getUsername();

if (!username) {

alert(
"👤 Bitte zuerst einen Benutzernamen festlegen."
);

return;

}

const player =
document.getElementById(
"player"
).value.trim();

const club =
document.getElementById(
"club"
).value.trim();

const price =
document.getElementById(
"price"
).value;

const file =
document.getElementById(
"image"
).files[0];

if (!file) {

alert(
"Bitte wähle ein Foto aus."
);

return;

}

const reader =
new FileReader();

reader.onload =
function() {

const img =
new Image();

img.onload =
function() {

const canvas =
document.createElement(
"canvas"
);

const max =
700;

let width =
img.width;

let height =
img.height;

if (
width > height &&
width > max
) {

height =
height * max / width;

width =
max;

}
else if (
height > max
) {

width =
width * max / height;

height =
max;

}

canvas.width =
width;

canvas.height =
height;

canvas
.getContext("2d")
.drawImage(
img,
0,
0,
width,
height
);

const imageData =
canvas.toDataURL(
"image/jpeg",
0.6
);

const cards =
getCards();

cards.unshift({

id:
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2),

player:
player,

club:
club,

price:
price,

image:
imageData,

owner:
username,

sold:
false,

soldTo:
null

});

try {

localStorage.setItem(
"footballCards",
JSON.stringify(cards)
);

}
catch(error) {

alert(
"Der Speicher ist voll."
);

return;

}

document
.getElementById(
"sellForm"
)
.reset();

loadAll();

alert(
"🎉 Deine Karte wurde eingestellt!"
);

};

img.src =
reader.result;

};

reader.readAsDataURL(file);

}
);


/* ======================================
   KAUFEN
====================================== */

function buyCard(cardId) {

const username =
getUsername();

if (!username) {

needUsername();

return;

}

const cards =
getCards();

const card =
cards.find(
c =>
c.id === cardId
);

if (!card) return;


if (
card.owner === username
) {

ownCardMessage();

return;

}


if (card.sold) {

alert(
"Diese Karte wurde bereits verkauft."
);

return;

}


const requests =
getRequests();

const existing =
requests.find(
r =>
r.cardId === cardId &&
r.buyer === username &&
(
r.status === "pending" ||
r.status === "accepted"
)
);

if (existing) {

alert(
"🕐 Du hast diese Karte bereits angefragt."
);

return;

}


const confirmed =
confirm(

"Möchtest du diese Karte kaufen?\n\n" +

card.player +
" – " +
card.club +

"\n\nPreis: " +
card.price +
" €"

);

if (!confirmed) return;


requests.push({

id:
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2),

cardId:
card.id,

player:
card.player,

club:
card.club,

price:
card.price,

image:
card.image,

buyer:
username,

seller:
card.owner,

status:

/* ======================================
   ANNEHMEN
====================================== */

function acceptRequest(
requestId
) {

const username =
getUsername();

const requests =
getRequests();

const request =
requests.find(
r =>
r.id === requestId
);

if (!request) return;


if (
request.seller !== username
) {

alert(
"🚫 Nur der Besitzer der Karte kann die Anfrage annehmen."
);

return;

}


if (
request.status !== "pending"
) {

return;

}


request.status =
"accepted";


const cards =
getCards();

const card =
cards.find(
c =>
c.id === request.cardId
);

if (card) {

card.sold =
true;

card.soldTo =
request.buyer;

}


localStorage.setItem(
"footballCards",
JSON.stringify(cards)
);

localStorage.setItem(
"purchaseRequests",
JSON.stringify(requests)
);

loadAll();

alert(
"🟢 Anfrage angenommen!"
);

}

requestId

);

request.seller !== username
) {

alert(

);

return;

}


if (
request.status !== "pending"
) {

return;

}


request.status =
"rejected";


localStorage.setItem(
"purchaseRequests",
JSON.stringify(requests)
);

loadAll();

alert(
"🔴 Anfrage abgelehnt."
);

}

let favorites =

const index =

);

}

loadAll();

}

cardId
) {

getCards();

);

) {

/* ======================================
   BEWERTUNGEN
====================================== */

function getSellerReviews(
seller
) {

const ratings =
getRatings();

return ratings[seller] || [];

}


function saveRating(
seller,
requestId
) {

const username =
getUsername();

const stars =
document.querySelector(
"#ratingStars"
);

const selected =
stars.dataset.value;

if (!selected) {

alert(
"⭐ Bitte wähle zuerst eine Bewertung."
);

return;

}


const comment =
document.getElementById(
"ratingComment"
).value.trim();


const ratings =
getRatings();

if (!ratings[seller]) {

ratings[seller] = [];

}


const already =
ratings[seller].some(
r =>
r.requestId === requestId
);

if (already) {

alert(
"Du hast diesen Kauf bereits bewertet."
);

return;

}


ratings[seller].push({

requestId:
requestId,

buyer:
username,

stars:
Number(selected),

comment:
comment,

date:
new Date().toISOString()

});


localStorage.setItem(
"sellerRatings",
JSON.stringify(ratings)
);

loadAll();

alert(
"⭐ Bewertung gespeichert!"
);

}

function loadSellerProfile(

</div>

${sold.length}

<strong>
${cards.length}
</strong>

</span>

</div>


<div class="seller-stat">

<strong>
${
average
? average.toFixed(1)
: "-"
}
</strong>

<span>
Bewertung
</span>

</div>

</div>


<h2>
🎟️ Angebote
</h2>

<div
id="sellerOffers"
class="cards"
></div>


<h2 style="margin-top:30px;">
⭐ Bewertungen
</h2>

<div id="sellerReviews"></div>

`;


const offers =
document.getElementById(
"sellerOffers"
);

if (!cards.length) {

offers.innerHTML =
"<div class='empty'>Keine Angebote vorhanden.</div>";

}
else {

cards.forEach(
card =>
createCard(card,offers)
);

}


const reviewBox =
document.getElementById(
"sellerReviews"
);

if (!reviews.length) {

reviewBox.innerHTML =
"<div class='empty'>Noch keine Bewertungen.</div>";

}
else {

reviews
.slice()
.reverse()
.forEach(
review => {

const div =
document.createElement(
"div"
);

div.className =
"review";

div.innerHTML = `

<strong>
${review.buyer}
</strong>

<div class="review-stars">

${"⭐".repeat(review.stars)}

</div>

${
review.comment
? `<p>${review.comment}</p>`
: ""
}

reviewBox.appendChild(div);

}
);

}
