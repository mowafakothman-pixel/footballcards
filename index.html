<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#111;
}

/* =========================
   HEADER
========================= */

header{
  background:#111;
  color:#fff;
  padding:20px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  color:#aaa;
}

/* =========================
   NAVIGATION OBEN
========================= */

.top-navigation{
  position:sticky;
  top:0;
  z-index:5000;

  background:#fff;
  border-bottom:1px solid #ddd;

  box-shadow:0 3px 12px rgba(0,0,0,.08);

  display:flex;
  align-items:center;

  padding:10px 14px;

  gap:8px;

  overflow-x:auto;
  white-space:nowrap;
}

.top-navigation::-webkit-scrollbar{
  height:4px;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  min-width:max-content;
}

.nav-right{
  margin-left:auto;
  flex-shrink:0;
  padding-left:8px;
  border-left:1px solid #ddd;
}

.nav-button{
  position:relative;

  border:none;
  background:#f1f2f4;
  color:#111;

  padding:12px 15px;

  border-radius:11px;

  font-weight:bold;
  font-size:14px;

  cursor:pointer;

  white-space:nowrap;
}

.nav-button:hover{
  background:#e6e7e9;
}

.nav-button.active{
  background:#111;
  color:#fff;
}

.badge{
  position:absolute;

  top:-6px;
  right:-5px;

  min-width:20px;
  height:20px;

  padding:2px 6px;

  border-radius:20px;

  background:#dc2626;
  color:#fff;

  font-size:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:2px solid #fff;
}

/* =========================
   PROFIL KLEIN
========================= */

.profile-bar{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px 15px;
}

.profile-inner{
  max-width:1150px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:flex-end;

  gap:10px;
}

.profile-user{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:bold;
}

.avatar,
.big-avatar{
  border-radius:50%;
  background:#111;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
}

.avatar{
  width:38px;
  height:38px;
}

.big-avatar{
  width:75px;
  height:75px;
  font-size:28px;
}

.profile-controls{
  display:flex;
  gap:7px;
}

.profile-controls input{
  padding:9px 11px;
  border:1px solid #ddd;
  border-radius:9px;
}

.primary-btn{
  border:none;
  background:#111;
  color:#fff;

  padding:9px 13px;

  border-radius:9px;

  font-weight:bold;
  cursor:pointer;
}

/* =========================
   SUCHE
========================= */

.search{
  background:#fff;
  padding:16px 20px;
  text-align:center;
  border-bottom:1px solid #eee;
}

.search input{
  width:90%;
  max-width:700px;

  padding:13px;

  border:1px solid #ddd;
  border-radius:13px;

  font-size:16px;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1150px;
  margin:auto;
  padding:20px;
}

/* =========================
   SEITEN
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   VERKAUFEN
========================= */

.sell{
  background:#111;
  color:#fff;

  padding:22px;

  border-radius:18px;

  margin-bottom:22px;

  text-align:center;
}

.sell h2{
  margin-top:0;
}

.sell form{
  display:flex;
  flex-wrap:wrap;

  justify-content:center;

  gap:8px;
}

.sell input{
  padding:12px;
  border:none;
  border-radius:9px;
}

.sell button{
  padding:12px 18px;

  border:none;
  border-radius:9px;

  background:#fff;
  color:#111;

  font-weight:bold;

  cursor:pointer;
}

/* =========================
   KARTEN
========================= */

.cards{
  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(245px,1fr));

  gap:17px;
}

.card{
  background:#fff;

  border-radius:18px;

  padding:15px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card-image{
  width:100%;
  height:205px;

  background:#f0f1f2;

  border-radius:14px;

  overflow:hidden;

  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;

  object-fit:contain;
}

.card h3{
  margin:12px 0 5px;
}

.info{
  color:#666;
  margin:6px 0;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}

.card button{
  width:100%;

  margin-top:8px;

  padding:11px;

  border:none;
  border-radius:9px;

  background:#111;
  color:#fff;

  font-weight:bold;

  cursor:pointer;
}

.card button.gray{
  background:#eee;
  color:#111;
}

.card button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.favorite-row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-top:8px;

  color:#666;

  font-size:14px;
}

/* =========================
   ANFRAGEN
========================= */

.request-list{
  display:grid;
  gap:14px;
}

.request{
  background:#fff;

  padding:17px;

  border-radius:17px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.08);
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:90px;
  height:90px;

  object-fit:contain;

  background:#f1f1f1;

  border-radius:12px;

  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 6px;
}

.request-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.accept-btn,
.reject-btn,
.rate-btn{
  border:none;
  color:#fff;

  padding:12px 17px;

  border-radius:10px;

  font-weight:bold;

  flex:1;

  cursor:pointer;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.rate-btn{
  background:#111;
}

.status{
  display:inline-block;

  padding:7px 10px;

  border-radius:8px;

  font-weight:bold;

  font-size:14px;
}

.status.open{
  background:#fff1d6;
  color:#946200;
}

.status.accepted{
  background:#ddf7e5;
  color:#137333;
}

.status.rejected{
  background:#ffe1e1;
  color:#b42318;
}

/* =========================
   VERKÄUFERPROFIL
========================= */

.seller-profile{
  background:#fff;

  border-radius:20px;

  padding:25px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.08);

  margin-bottom:20px;
}

.seller-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.seller-header h2{
  margin:0;
}

.rating{
  font-size:22px;
  margin-top:8px;
}

.seller-stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-top:22px;
}

.seller-stat{
  background:#f5f5f5;

  padding:15px;

  border-radius:12px;

  text-align:center;
}

.seller-stat strong{
  display:block;
  font-size:23px;
}

.seller-stat span{
  color:#777;
  font-size:13px;
}

/* =========================
   BEWERTUNG
========================= */

.rating-stars{
  display:flex;
  gap:5px;
  margin:15px 0;
}

.rating-stars button{
  border:none;

  background:#eee;

  border-radius:8px;

  padding:9px;

  font-size:22px;

  cursor:pointer;
}

.rating-stars button.selected{
  background:#ffe7a3;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:#fff;

  padding:25px;

  border-radius:15px;

  color:#777;

  text-align:center;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  padding:35px;

  color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .top-navigation{
    padding:9px 8px;
  }

  .nav-button{
    padding:11px 12px;
    font-size:13px;
  }

  .profile-inner{
    justify-content:center;
    flex-wrap:wrap;
  }

  .profile-controls{
    width:100%;
  }

  .profile-controls input{
    flex:1;
    min-width:0;
  }

  .sell input,
  .sell button{
    width:100%;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-actions{
    flex-direction:column;
  }

  .seller-stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- =========================
     NAVIGATION GANZ OBEN
========================= -->

<nav class="top-navigation">

  <div class="nav-left">

    <button
      id="navCards"
      class="nav-button active"
      onclick="showPage('cardsPage','navCards')"
    >
      🔥 Karten
    </button>

    <button
      id="navFavorites"
      class="nav-button"
      onclick="showPage('favoritesPage','navFavorites')"
    >
      ❤️ Favoriten
    </button>

    <button
      id="navMine"
      class="nav-button"
      onclick="showPage('minePage','navMine')"
    >
      🃏 Meine Karten
    </button>

    <button
      id="navRequests"
      class="nav-button"
      onclick="showPage('requestsPage','navRequests')"
    >
      📩 Anfragen
      <span
        id="requestBadge"
        class="badge"
        style="display:none"
      >0</span>
    </button>

  </div>

  <div class="nav-right">

    <button
      id="navProfile"
      class="nav-button"
      onclick="showPage('profilePage','navProfile')"
    >
      👤 Profil
    </button>

  </div>

</nav>

<!-- =========================
     PROFILBAR
========================= -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div id="avatar" class="avatar">
        ?
      </div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        class="primary-btn"
        onclick="saveUsername()"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- =========================
     SUCHE
========================= -->

<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
  >

</div>

<div class="container">

<!-- =========================
     KARTEN
========================= -->

<section
  id="cardsPage"
  class="page active"
>

  <div class="sell">

    <h2>🎟️ Karte verkaufen</h2>

    <p>
      Stelle deine Fußballkarte schnell und einfach ein.
    </p>

    <form id="sellForm">

      <input
        id="player"
        type="text"
        placeholder="Spieler"
        required
      >

      <input
        id="club"
        type="text"
        placeholder="Verein"
        required
      >

      <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Preis in €"
        required
      >

      <input
        id="image"
        type="file"
        accept="image/*"
        required
      >

      <button type="submit">
        Karte einstellen
      </button>

    </form>

  </div>

  <h2>🔥 Aktuelle Karten</h2>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section
  id="favoritesPage"
  class="page"
>

  <h2 id="favoriteTitle">
    ❤️ Favoriten (0)
  </h2>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     MEINE KARTEN
========================= -->

<section
  id="minePage"
  class="page"
>

  <h2>
    🃏 Meine Karten
  </h2>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     ANFRAGEN
========================= -->

<section
  id="requestsPage"
  class="page"
>

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- =========================
     PROFIL
========================= -->

<section
  id="profilePage"
  class="page"
>

  <h2>
    👤 Verkäuferprofil
  </h2>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =========================================================
   DATEN
========================================================= */

function getUsername(){

  return localStorage.getItem("pixelUsername") || "";

}

function getCards(){

  try{

    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];

  }catch(e){

    return [];

  }

}

function getRequests(){

  try{

    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];

  }catch(e){

    return [];

  }

}

function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem("favoriteCards")
    ) || [];

  }catch(e){

    return [];

  }

}

function getFavoriteUsers(){

  try{

    return JSON.parse(
      localStorage.getItem("favoriteUsers")
    ) || {};

  }catch(e){

    return {};

  }

}

function getRatings(){

  try{

    return JSON.parse(
      localStorage.getItem("sellerRatings")
    ) || {};

  }catch(e){

    return {};

  }

}

function saveData(key,data){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}


/* =========================================================
   PROFIL
========================================================= */

function saveUsername(){

  const input=
    document.getElementById("usernameInput");

  const name=
    input.value.trim();

  if(!name){

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  const oldName=
    getUsername();

  localStorage.setItem(
    "pixelUsername",
    name
  );

  updateProfile();

  loadAll();

  if(
    oldName &&
    oldName!==name
  ){

    alert(
      "👤 Benutzername geändert zu: "+
      name
    );

  }else{

    alert(
      "👤 Profil gespeichert!"
    );

  }

}

function updateProfile(){

  const name=
    getUsername();

  document.getElementById(
    "profileName"
  ).textContent=
    name || "Kein Benutzer";

  document.getElementById(
    "avatar"
  ).textContent=
    name
      ? name.charAt(0).toUpperCase()
      : "?";

  document.getElementById(
    "usernameInput"
  ).value=name;

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(
  pageId,
  buttonId
){

  document
    .querySelectorAll(".page")
    .forEach(page=>{

      page.classList.remove(
        "active"
      );

    });

  const page=
    document.getElementById(
      pageId
    );

  if(page){

    page.classList.add(
      "active"
    );

  }

  document
    .querySelectorAll(
      ".nav-button"
    )
    .forEach(button=>{

      button.classList.remove(
        "active"
      );

    });

  const button=
    document.getElementById(
      buttonId
    );

  if(button){

    button.classList.add(
      "active"
    );

  }

  if(pageId==="requestsPage"){

    markRequestsViewed();

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   BADGE
========================================================= */

function updateRequestBadge(){

  const username=
    getUsername();

  const requests=
    getRequests();

  let count=0;

  if(username){

    count=
      requests.filter(request=>
        request.seller===username &&
        request.status==="pending"
      ).length;

  }

  const badge=
    document.getElementById(
      "requestBadge"
    );

  if(count>0){

    badge.style.display="flex";
    badge.textContent=count;

  }else{

    badge.style.display="none";

  }

}

function markRequestsViewed(){

  updateRequestBadge();

}


/* =========================================================
   KARTEN LADEN
========================================================= */

function loadCards(){

  const box=
    document.getElementById(
      "cards"
    );

  box.innerHTML="";

  const search=
    document.getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();

  const cards=
    getCards();

  const filtered=
    cards.filter(card=>{

      return String(
        card.player||""
      )
      .toLowerCase()
      .includes(search)

      ||

      String(
        card.club||""
      )
      .toLowerCase()
      .includes(search)

      ||

      String(
        card.owner||""
      )
      .toLowerCase()
      .includes(search);

    });

  if(!filtered.length){

    box.innerHTML=
      "<div class='empty'>Keine Karten gefunden.</div>";

    return;

  }

  filtered.forEach(card=>{

    createCard(
      card,
      box
    );

  });

}


/* =========================================================
   FAVORITEN
========================================================= */

function isFavorite(cardId){

  const username=
    getUsername();

  if(!username){

    return false;

  }

  return getFavorites()
    .some(item=>
      item.id===cardId &&
      item.favoriteBy===username
    );

}

function getFavoriteCount(cardId){

  const users=
    getFavoriteUsers();

  if(
    !Array.isArray(
      users[cardId]
    )
  ){

    return 0;

  }

  return users[
    cardId
  ].length;

}

function toggleFavorite(cardId){

  const username=
    getUsername();

  if(!username){

    alert(
      "👤 Bitte zuerst einen Benutzernamen festlegen."
    );

    return;

  }

  const cards=
    getCards();

  const card=
    cards.find(
      c=>c.id===cardId
    );

  if(!card){

    return;

  }

  if(card.owner===username){

    alert(
      "🚫 Deine eigene Karte kannst du nicht favorisieren."
    );

    return;

  }

  let favorites=
    getFavorites();

  const existingIndex=
    favorites.findIndex(item=>
      item.id===cardId &&
      item.favoriteBy===username
    );

  let users=
    getFavoriteUsers();

  if(
    !Array.isArray(
      users[cardId]
    )
  ){

    users[cardId]=[];

  }

  if(existingIndex!==-1){

    favorites.splice(
      existingIndex,
      1
    );

    users[cardId]=
      users[cardId].filter(
        user=>user!==username
      );

  }else{

    favorites.push({

      id:cardId,
      favoriteBy:username

    });

    if(
      !users[cardId].includes(
        username
      )
    ){

      users[cardId].push(
        username
      );

    }

  }

  saveData(
    "favoriteCards",
    favorites
  );

  saveData(
    "favoriteUsers",
    users
  );

  loadAll();

}

function loadFavorites(){

  const box=
    document.getElementById(
      "favoriteCards"
    );

  box.innerHTML="";

  const favorites=
    getFavorites();

  const username=
    getUsername();

  const cards=
    getCards();

  const myFavorites=
    favorites
      .filter(
        item=>
          item.favoriteBy===username
      )
      .map(
        item=>
          cards.find(
            card=>card.id===item.id
          )
      )
      .filter(Boolean);

  document.getElementById(
    "favoriteTitle"
  ).textContent=
    "❤️ Favoriten ("+
    myFavorites.length+
    ")";

  if(!myFavorites.length){

    box.innerHTML=
      "<div class='empty'>❤️ Noch keine Favoriten.</div>";

    return;

  }

  myFavorites.forEach(card=>{

    createCard(
      card,
      box
    );

  });

}


/* =========================================================
   KARTE ERSTELLEN
========================================================= */

function createCard(
  card,
  box
){

  const username=
    getUsername();

  const favorite=
    isFavorite(
      card.id
    );

  const favoriteCount=
    getFavoriteCount(
      card.id
    );

  const requests=
    getRequests();

  const myRequest=
    requests.find(request=>

      request.cardId===card.id &&

      request.buyer===username &&

      (
        request.status==="pending" ||
        request.status==="accepted"
      )

    );

  const item=
    document.createElement(
      "div"
    );

  item.className="card";

  let buyButton="";

  if(card.owner===username){

    buyButton=`
      <button
        class="gray"
        onclick="ownCardMessage()"
      >
        🚫 Deine Karte
      </button>
    `;

  }

  else if(!username){

    buyButton=`
      <button
        onclick="needUsername()"
      >

/* =========================================================
   KAUFEN
========================================================= */

function ownCardMessage(){

  alert(
    "🚫 Du kannst deine eigene Karte nicht kaufen."
  );

}

function needUsername(){

  alert(
    "👤 Bitte zuerst einen Benutzernamen festlegen."
  );

}

function buyCard(cardId){

  const username=
    getUsername();

  if(!username){

    needUsername();
    return;

  }

  const cards=
    getCards();

  const card=
    cards.find(
      c=>c.id===cardId
    );

  if(!card){

    return;

  }

  if(card.owner===username){

    ownCardMessage();
    return;

  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests=
    getRequests();

  const existing=
    requests.find(request=>

      request.cardId===cardId &&

      request.buyer===username &&

      (
        request.status==="pending" ||
        request.status==="accepted"
      )

    );

  if(existing){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed=
    confirm(

      "Möchtest du diese Karte kaufen?\n\n"+
      card.player+
      " – "+
      card.club+
      "\n\nPreis: "+
      card.price+
      " €"

    );

  if(!confirmed){

    return;

  }

  requests.push({

    id:
      Date.now()+
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:card.id,

    player:card.player,

    club:card.club,

    price:card.price,

    image:card.image,

    buyer:username,

    seller:card.owner,

    status:"pending",

    createdAt:
      new Date()
        .toISOString()

  });

  saveData(
    "purchaseRequests",
    requests
  );

  updateRequestBadge();

  loadAll();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}

/* =========================================================
   ANNEHMEN
========================================================= */

function acceptRequest(requestId){

  const username=
    getUsername();

  const requests=
    getRequests();

  const request=
    requests.find(
      r=>r.id===requestId
    );

  if(!request){

    return;

  }

  if(
    request.seller!==username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(
    request.status!=="pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards=
    getCards();

  const card=
    cards.find(
      c=>c.id===request.cardId
    );

  if(!card){

    alert(
      "❌ Die Karte wurde nicht gefunden."
    );

    return;

  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const confirmed=
    confirm(
      "Möchtest du die Anfrage von "+
      request.buyer+
      " annehmen?"
    );

  if(!confirmed){

    return;

  }

  request.status="accepted";

  card.sold=true;

  card.soldTo=
    request.buyer;

  requests.forEach(
    other=>{

      if(

        other.cardId===
        request.cardId &&

        other.id!==
        request.id &&

        other.status===
        "pending"

      ){

        other.status=
          "rejected";

      }

    }
  );

  saveData(
    "footballCards",
    cards
  );

  saveData(
    "purchaseRequests",
    requests
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}

function loadSellerProfile(

    );

    );

    )
      ? ratings[seller]

function openRating(
  requestId
){

  const requests=
    getRequests();

  const request=
    requests.find(
      r=>r.id===requestId
    );

  if(!request){

    return;

  }

  const username=
    getUsername();

  if(
    request.buyer!==username
  ){

    alert(
      "🚫 Nur der Käufer kann diese Bewertung abgeben."
    );

    return;

  }

  if(
    request.status!=="accepted"
  ){

    alert(
      "⭐ Bewerten kannst du erst nach einer angenommenen Anfrage."
    );

    return;

  }

  const ratings=
    getRatings();

  if(
    !Array.isArray(
      ratings[request.seller]
    )
  ){

    ratings[
      request.seller
    ]=[];

  }

  if(
    ratings[
      request.seller
    ].some(
      rating=>
        rating.requestId===
        requestId
    )
  ){

    alert(
      "⭐ Du hast diesen Verkäufer bereits bewertet."
    );

    return;

  }

  const overlay=
    document.createElement(
      "div"
    );

  overlay.style.cssText=`

    position:fixed;
    inset:0;

    background:rgba(0,0,0,.7);

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:9999;

    padding:20px;

  `;

  overlay.innerHTML=`

    <div style="
      background:#fff;
      width:100%;
      max-width:420px;
      padding:25px;
      border-radius:20px;
      text-align:center;
    ">

      <h2>
        ⭐ Verkäufer bewerten
      </h2>

      <p>
        Wie war deine Erfahrung mit
        <strong>
          ${escapeHTML(request.seller)}
        </strong>?
      </p>

      <div
        id="ratingStars"
        class="rating-stars"
      >

        <button data-stars="1">
          ⭐
        </button>

        <button data-stars="2">
          ⭐⭐
        </button>

        <button data-stars="3">
          ⭐⭐⭐
        </button>

        <button data-stars="4">
          ⭐⭐⭐⭐
        </button>

        <button data-stars="5">
          ⭐⭐⭐⭐⭐
        </button>

      </div>

      <button
        id="submitRating"
        class="rate-btn"
        style="
          width:100%;
          margin-top:10px
        "
        disabled
      >
        Bewertung speichern
      </button>

      <button
        id="cancelRating"
        class="gray"
        style="
          width:100%;
          border:none;
          padding:12px;
          border-radius:10px;
          margin-top:8px;
          cursor:pointer;
        "
      >
        Abbrechen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  let selected=0;

  const starButtons=
    overlay.querySelectorAll(
      "#ratingStars button"
    );

  starButtons.forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>{

          selected=
            Number(
              button.dataset.stars
            );

          starButtons.forEach(
            btn=>{

              btn.classList.toggle(
                "selected",
                Number(
                  btn.dataset.stars
                )===selected
              );

            }
          );

          overlay.querySelector(
            "#submitRating"
          ).disabled=false;

        }
      );

    }
  );

  overlay.querySelector(
    "#cancelRating"
  ).onclick=()=>{

    overlay.remove();

  };

  overlay.querySelector(
    "#submitRating"
  ).onclick=()=>{

    if(
      selected<1 ||
      selected>5
    ){

      return;

    }

    const currentRatings=
      getRatings();

    if(
      !Array.isArray(
        currentRatings[
          request.seller
        ]
      )
    ){

      currentRatings[
        request.seller
      ]=[];

    }

    if(
      currentRatings[
        request.seller
      ].some(
        rating=>
          rating.requestId===
          requestId
      )
    ){

      alert(
        "⭐ Bereits bewertet."
      );

      overlay.remove();

      return;

    }

    currentRatings[
      request.seller
    ].push({

      requestId:
        request.id,

      buyer:
        username,

      stars:
        selected,

      createdAt:
        new Date()
          .toISOString()

    });

    saveData(
      "sellerRatings",
      currentRatings
    );

    overlay.remove();

    loadAll();

    alert(
      "⭐ Bewertung gespeichert!"
    );

  };

}

/* =========================================================
   VERKAUFEN
========================================================= */

document
  .getElementById(
    "sellForm"
  )
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username=
        getUsername();

      if(!username){

        alert(
          "👤 Bitte zuerst einen Benutzernamen festlegen."
        );

        return;

      }

      const player=
        document.getElementById(
          "player"
        )
        .value
        .trim();

      const club=
        document.getElementById(
          "club"
        )
        .value
        .trim();

      const price=
        document.getElementById(
          "price"
        ).value;

      const file=
        document.getElementById(
          "image"
        ).files[0];

      if(!file){

        alert(
          "Bitte wähle ein Foto aus."
        );

        return;

      }

      const reader=
        new FileReader();

      reader.onload=function(){

        const image=
          new Image();

        image.onload=function(){

          const canvas=
            document.createElement(
              "canvas"
            );

          const max=700;

          let width=
            image.width;

          let height=
            image.height;

          if(
            width>height &&
            width>max
          ){

            height=
              height*
              max/
              width;

            width=max;

          }else if(
            height>max
          ){

            width=
              width*
              max/
              height;

            height=max;

          }

          canvas.width=
            width;

          canvas.height=
            height;

          canvas
            .getContext(
              "2d"
            )
            .drawImage(
              image,
              0,
              0,
              width,
              height
            );

          const imageData=
            canvas.toDataURL(
              "image/jpeg",
              .6
            );

          const cards=
            getCards();

          cards.unshift({

            id:
              Date.now()+
              "-" +
              Math.random()
                .toString(36)
                .substring(2),

            player:
              player,

            club:
              club,

            price:
              price,

            image:
              imageData,

            owner:
              username,

            sold:
              false,

            soldTo:
              null

          });

          try{

            saveData(
              "footballCards",
              cards
            );

          }catch(error){

            alert(
              "Der Speicher ist voll. Bitte lösche zuerst Karten."
            );

            return;

          }

          document
            .getElementById(
              "sellForm"
            )
            .reset();

          loadAll();

          alert(
            "🎉 Deine Karte wurde eingestellt!"
          );

        };

        image.src=
          reader.result;

      };

      reader.readAsDataURL(
        file
      );

    }
  );

/* =========================================================
   SICHERHEIT
========================================================= */

function escapeHTML(
  value
){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

function escapeAttribute(
  value
){

  return String(value)

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}
