<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

header{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  text-align:center;
  padding:25px 15px;
}

header h1{
  margin:0;
  font-size:31px;
}

header p{
  color:#bbb;
  margin:7px 0 0;
}

.topbar{
  background:white;
  border-bottom:1px solid #ddd;
  padding:12px 16px;
  position:sticky;
  top:0;
  z-index:100;
}

.topbar-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.user-controls{
  display:flex;
  gap:7px;
}

.user-controls input{
  width:150px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
}

.black-btn{
  border:0;
  background:#111;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-weight:bold;
}

.search{
  background:white;
  padding:18px;
  text-align:center;
}

.search input{
  width:90%;
  max-width:650px;
  padding:14px;
  border:1px solid #ddd;
  border-radius:13px;
  font-size:16px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.sell{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:20px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.sell h2{
  margin-top:0;
}

.sell form{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}

.sell input{
  padding:12px;
  border:0;
  border-radius:9px;
}

.sell button{
  border:0;
  background:white;
  color:#111;
  padding:12px 18px;
  border-radius:9px;
  font-weight:bold;
}

.navigation{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  margin-bottom:22px;
}

.navigation button{
  position:relative;
  border:0;
  background:white;
  padding:14px 7px;
  border-radius:13px;
  font-weight:bold;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.navigation button.active{
  background:#111;
  color:white;
}

.badge{
  position:absolute;
  top:-6px;
  right:-4px;
  background:#e53935;
  color:white;
  min-width:20px;
  height:20px;
  padding:2px 6px;
  border-radius:20px;
  font-size:12px;
  display:none;
  align-items:center;
  justify-content:center;
}

.badge.show{
  display:flex;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(245px,1fr));
  gap:17px;
}

.card{
  background:white;
  padding:16px;
  border-radius:19px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.card-image{
  width:100%;
  height:205px;
  background:#f0f1f2;
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin:12px 0 5px;
}

.info{
  color:#666;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:10px 0;
}

.card button{
  width:100%;
  border:0;
  background:#111;
  color:white;
  padding:11px;
  border-radius:9px;
  font-weight:bold;
  margin-top:7px;
}

.card button.gray{
  background:#eee;
  color:#111;
}

.empty{
  background:white;
  padding:25px;
  border-radius:15px;
  color:#777;
  text-align:center;
}

.request{
  background:white;
  padding:17px;
  border-radius:17px;
  margin-bottom:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:90px;
  height:90px;
  object-fit:contain;
  background:#f1f1f1;
  border-radius:12px;
  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 6px;
}

.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.pending{
  background:#fff1d6;
  color:#946200;
}

.accepted{
  background:#dcfce7;
  color:#137333;
}

.rejected{
  background:#fee2e2;
  color:#b42318;
}

.request-actions{
  display:flex;
  gap:9px;
  margin-top:14px;
}

.accept{
  flex:1;
  border:0;
  background:#16a34a;
  color:white;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.reject{
  flex:1;
  border:0;
  background:#dc2626;
  color:white;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.profile{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.rating{
  color:#f2a900;
  font-size:21px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:20px;
}

.stat{
  background:#f5f5f5;
  padding:15px;
  text-align:center;
  border-radius:13px;
}

.stat strong{
  display:block;
  font-size:23px;
}

.stat span{
  color:#777;
  font-size:13px;
}

.review{
  background:#f6f6f6;
  padding:13px;
  border-radius:12px;
  margin-top:10px;
}

.stars{
  color:#f2a900;
}

.rating-box{
  background:#f5f5f5;
  padding:17px;
  border-radius:14px;
  margin-top:15px;
}

.star-select{
  display:flex;
  gap:4px;
  margin:8px 0;
}

.star-btn{
  border:0;
  background:transparent;
  font-size:30px;
  color:#ccc;
  cursor:pointer;
}

.star-btn.selected{
  color:#f2a900;
}

.rating-comment{
  width:100%;
  min-height:70px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
}

footer{
  text-align:center;
  color:#777;
  padding:35px;
}

@media(max-width:700px){

  .topbar-inner{
    flex-direction:column;
  }

  .user-controls{
    width:100%;
  }

  .user-controls input{
    flex:1;
    width:auto;
  }

  .navigation{
    grid-template-columns:repeat(2,1fr);
  }

  .navigation button:last-child{
    grid-column:span 2;
  }

  .sell input,
  .sell button{
    width:100%;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-actions{
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="topbar">
  <div class="topbar-inner">

    <div class="user-box">
      <div class="avatar" id="avatar">?</div>
      <span id="currentUser">Kein Benutzer</span>
    </div>

    <div class="user-controls">
      <input
        id="usernameInput"
        maxlength="20"
        placeholder="Benutzername"
      >
      <button class="black-btn" onclick="saveUsername()">
        Speichern
      </button>
    </div>

  </div>
</div>

<div class="search">
  <input
    id="searchInput"
    placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
  >
</div>

<div class="container">

<div class="sell">
  <h2>🎟️ Karte verkaufen</h2>
  <p>Stelle deine Fußballkarte schnell und einfach ein.</p>

  <form id="sellForm">

    <input
      id="player"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>
</div>

<div class="navigation">

<button
id="navMarket"
class="active"
onclick="openPage('market','navMarket')"
>
🔥 Karten
</button>

<button
id="navFavorites"
onclick="openPage('favorites','navFavorites')"
>
❤️ Favoriten
</button>

<button
id="navMine"
onclick="openPage('mine','navMine')"
>
🃏 Meine Karten
</button>

<button
id="navRequests"
onclick="openPage('requests','navRequests')"
>
📩 Anfragen
<span id="requestBadge" class="badge">0</span>
</button>

<button
id="navProfile"
onclick="openPage('profile','navProfile')"
>
👤 Profil
</button>

</div>

<section id="market" class="page active">
  <h2>🔥 Aktuelle Karten</h2>
  <div id="cards" class="cards"></div>
</section>

<section id="favorites" class="page">
  <h2 id="favoriteTitle">❤️ Favoriten (0)</h2>
  <div id="favoriteCards" class="cards"></div>
</section>

<section id="mine" class="page">
  <h2>🃏 Meine Karten</h2>
  <div id="myCards" class="cards"></div>
</section>

<section id="requests" class="page">

  <h2 id="buyerRequestTitle">
    📩 Meine Kaufanfragen (0)
  </h2>

  <div id="buyerRequests"></div>

  <h2 id="sellerRequestTitle" style="margin-top:30px;">
    📥 Anfragen für meine Karten (0)
  </h2>

  <div id="sellerRequests"></div>

</section>

<section id="profile" class="page">
  <h2>👤 Mein Profil</h2>
  <div id="profileContent"></div>
</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =========================
   DATEN
========================= */

function cards(){
  return JSON.parse(
    localStorage.getItem("pixel_cards") || "[]"
  );
}

function saveCards(data){
  localStorage.setItem(
    "pixel_cards",
    JSON.stringify(data)
  );
}

function requests(){
  return JSON.parse(
    localStorage.getItem("pixel_requests") || "[]"
  );
}

function saveRequests(data){
  localStorage.setItem(
    "pixel_requests",
    JSON.stringify(data)
  );
}

function favorites(){
  return JSON.parse(
    localStorage.getItem("pixel_favorites") || "[]"
  );
}

function saveFavorites(data){
  localStorage.setItem(
    "pixel_favorites",
    JSON.stringify(data)
  );
}

function ratings(){
  return JSON.parse(
    localStorage.getItem("pixel_ratings") || "{}"
  );
}

function saveRatings(data){
  localStorage.setItem(
    "pixel_ratings",
    JSON.stringify(data)
  );
}

function username(){
  return (
    localStorage.getItem("pixel_username") || ""
  );
}


/* =========================
   BENUTZER
========================= */

function saveUsername(){

  const input =
    document.getElementById("usernameInput");

  const name =
    input.value.trim();

  if(!name){
    alert("Bitte gib einen Benutzernamen ein.");
    return;
  }

  localStorage.setItem(
    "pixel_username",
    name
  );

  updateUser();
  renderAll();

  alert("👤 Profil gespeichert!");

}

function updateUser(){

  const name = username();

  document.getElementById(
    "currentUser"
  ).textContent =
    name || "Kein Benutzer";

  document.getElementById(
    "usernameInput"
  ).value = name;

  document.getElementById(
    "avatar"
  ).textContent =
    name
    ? name.charAt(0).toUpperCase()
    : "?";

}


/* =========================
   NAVIGATION
========================= */

function openPage(page,id){

  document
    .querySelectorAll(".page")
    .forEach(p =>
      p.classList.remove("active")
    );

  document
    .getElementById(page)
    .classList.add("active");

  document
    .querySelectorAll(".navigation button")
    .forEach(b =>
      b.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

}


/* =========================
   BENACHRICHTIGUNG
========================= */

function updateBadge(){

  const name = username();

  const count =
    requests().filter(r =>
      r.seller === name &&
      r.status === "pending"
    ).length;

  const badge =
    document.getElementById(
      "requestBadge"
    );

  if(count > 0){

    badge.textContent = count;
    badge.classList.add("show");

  }else{

    badge.classList.remove("show");

  }

}


/* =========================
   KARTE ERSTELLEN
========================= */

function cardHTML(card){

  const name = username();

  const fav =
    favorites().includes(card.id);

  let buyButton = "";

  if(card.owner === name){

    buyButton = `
      <button
        class="gray"
        onclick="ownCard()"
      >
        🚫 Eigene Karte
      </button>
    `;

  }else if(!name){

    buyButton = `
      <button onclick="needUser()">
        🛒 Kaufen
      </button>
    `;

  }else{

    const existing =
      requests().find(r =>
        r.cardId === card.id &&
        r.buyer === name &&
        (
          r.status === "pending" ||
          r.status === "accepted"
        )
      );

    if(existing){

      if(existing.status === "accepted"){

        buyButton = `
          <button class="gray">
            ✅ Angenommen
          </button>
        `;

      }else{

        buyButton = `
          <button class="gray">
            🕐 Anfrage offen
          </button>
        `;

      }

    }else{

      buyButton = `
        <button
          onclick="buy('${card.id}')"
        >
          🛒 Kaufen
        </button>
      `;

    }

  }

  return `

    <div class="card">

      <div class="card-image">
        <img src="${card.image}">
      </div>

      <h3>${escapeHTML(card.player)}</h3>

      <p class="info">
        ${escapeHTML(card.club)}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <p class="info">
        👤 Verkäufer:
        <strong>
          ${escapeHTML(card.owner)}
        </strong>
      </p>

      <button
        onclick="showCard('${card.id}')"
      >
        👀 Karte ansehen
      </button>

      ${buyButton}

      <button
        class="gray"
        onclick="toggleFavorite('${card.id}')"
      >
        ${fav ? "❤️ Favorisiert" : "♡ Favorit"}
      </button>

      <button
        class="gray"
        onclick="showSeller('${escapeAttr(card.owner)}')"
      >
        👤 Verkäuferprofil
      </button>

    </div>
  `;
}


/* =========================
   AKTUELLE KARTEN
========================= */

function renderCards(){

  const box =
    document.getElementById("cards");

  const search =
    document.getElementById(
      "searchInput"
    ).value.toLowerCase();

  const result =
    cards().filter(c =>
      !c.sold &&
      (
        c.player.toLowerCase().includes(search) ||
        c.club.toLowerCase().includes(search) ||
        c.owner.toLowerCase().includes(search)
      )
    );

  if(!result.length){

    box.innerHTML =
      `<div class="empty">
        Keine Karten gefunden.
      </div>`;

    return;

  }

  box.innerHTML =
    result.map(cardHTML).join("");

}


/* =========================
   VERKAUFEN
========================= */

document
  .getElementById("sellForm")
  .addEventListener(
    "submit",
    function(e){

      e.preventDefault();

      const name = username();

      if(!name){

        alert(
          "👤 Bitte zuerst deinen Benutzernamen speichern."
        );

        return;
      }

      const player =
        document.getElementById(
          "player"
        ).value.trim();

      const club =
        document.getElementById(
          "club"
        ).value.trim();

      const price =
        document.getElementById(
          "price"
        ).value;

      const file =
        document.getElementById(
          "image"
        ).files[0];

      if(!file){

        alert("Bitte wähle ein Bild.");
        return;

      }

      const reader =
        new FileReader();

      reader.onload = function(){

        const img = new Image();

        img.onload = function(){

          const canvas =
            document.createElement(
              "canvas"
            );

          const max = 700;

          let w = img.width;
          let h = img.height;

          if(w > h && w > max){

            h = h * max / w;
            w = max;

          }else if(h > max){

            w = w * max / h;
            h = max;

          }

          canvas.width = w;
          canvas.height = h;

          canvas
            .getContext("2d")
            .drawImage(
              img,
              0,
              0,
              w,
              h
            );

          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.65
            );

          const data = cards();

          data.unshift({

            id:
              Date.now() +
              "_" +
              Math.random()
                .toString(36)
                .slice(2),

            player,
            club,
            price,
            image,
            owner:name,
            sold:false,
            soldTo:null

          });

          try{

            saveCards(data);

          }catch(err){

            alert(
              "Der Speicher ist voll."
            );

            return;

          }

          document
            .getElementById("sellForm")
            .reset();

          renderAll();

          alert(
            "🎉 Deine Karte wurde eingestellt!"
          );

        };

        img.src = reader.result;

      };

      reader.readAsDataURL(file);

    }
  );


/* =========================
   KAUFEN
========================= */

function buy(id){

  const name = username();

  if(!name){

    needUser();
    return;

  }

  const card =
    cards().find(c => c.id === id);

  if(!card) return;

  if(card.owner === name){

    ownCard();
    return;

  }

  if(card.sold){

    alert(
      "Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const exists =
    requests().some(r =>
      r.cardId === id &&
      r.buyer === name &&
      (
        r.status === "pending" ||
        r.status === "accepted"
      )
    );

  if(exists){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  if(!confirm(
    "Möchtest du diese Karte kaufen?\n\n" +
    card.player +
    " – " +
    card.club +
    "\nPreis: " +
    card.price +
    " €"
  )) return;

  const data = requests();

  data.push({

    id:
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    cardId:id,

    player:card.player,
    club:card.club,
    price:card.price,
    image:card.image,

    buyer:name,
    seller:card.owner,

    status:"pending",

    rated:false

  });

  saveRequests(data);

  renderAll();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}


/* =========================
   ANNEHMEN
========================= */

function acceptRequest(id){

  const name = username();

  const data = requests();

  const request =
    data.find(r => r.id === id);

  if(!request) return;

  if(request.seller !== name){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(request.status !== "pending")
    return;

  request.status = "accepted";

  const allCards = cards();

  const card =
    allCards.find(
      c => c.id === request.cardId
    );

  if(card){

    card.sold = true;
    card.soldTo = request.buyer;

  }

  saveCards(allCards);
  saveRequests(data);

  renderAll();

  alert(
    "🟢 Kaufanfrage angenommen!"
  );

}


/* =========================
   ABLEHNEN
========================= */

function rejectRequest(id){

  const name = username();

  const data = requests();

  const request =
    data.find(r => r.id === id);

  if(!request) return;

  if(request.seller !== name){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage ablehnen."
    );

    return;

  }

  if(request.status !== "pending")
    return;

  request.status = "rejected";

  saveRequests(data);

  renderAll();

  alert(
    "🔴 Kaufanfrage abgelehnt."
  );

}


/* =========================
   KÄUFER ANFRAGEN
========================= */

function renderBuyerRequests(){

  const name = username();

  const box =
    document.getElementById(
      "buyerRequests"
    );

  const data =
    requests().filter(
      r => r.buyer === name
    );

  document.getElementById(
    "buyerRequestTitle"
  ).textContent =
    "📩 Meine Kaufanfragen (" +
    data.length +
    ")";

  if(!data.length){

    box.innerHTML =
      `<div class="empty">
        Noch keine Kaufanfragen.
      </div>`;

    return;

  }

  box.innerHTML =
    data.map(r => {

      let status;

      if(r.status === "accepted"){

        status =
          `<span class="status accepted">
            ✅ Angenommen
          </span>`;

      }else if(r.status === "rejected"){

        status =
          `<span class="status rejected">
            ❌ Abgelehnt
          </span>`;

      }else{

        status =
          `<span class="status pending">
            🕐 Offen
          </span>`;

      }

      let rating = "";

      if(
        r.status === "accepted" &&
        !r.rated
      ){

        rating = ratingBox(r);

      }

      return `

        <div class="request">

          <div class="request-top">

            <img
              class="request-image"
              src="${r.image}"
            >

            <div class="request-info">

              <h3>
                ${escapeHTML(r.player)}
              </h3>

              <p class="info">
                ${escapeHTML(r.club)}
              </p>

              <p class="price">
                ${r.price} €
              </p>

              <p class="info">
                👤 Verkäufer:
                <strong>
                  ${escapeHTML(r.seller)}
                </strong>
              </p>

              ${status}

            </div>

          </div>

          ${rating}

        </div>
      `;

    }).join("");

}

/* =========================
   BEWERTUNG
========================= */

function ratingBox(request){

  return `

    <div class="rating-box">

      <strong>
        ⭐ Wie war dein Kauf bei ${escapeHTML(request.seller)}?
      </strong>

      <div
        class="star-select"
        id="stars-${request.id}"
      >

        <button
          class="star-btn"
          onclick="selectStar('${request.id}',1)"
        >★</button>

        <button
          class="star-btn"
          onclick="selectStar('${request.id}',2)"
        >★</button>

        <button
          class="star-btn"
          onclick="selectStar('${request.id}',3)"
        >★</button>

        <button
          class="star-btn"
          onclick="selectStar('${request.id}',4)"
        >★</button>

        <button
          class="star-btn"
          onclick="selectStar('${request.id}',5)"
        >★</button>

      </div>

      <textarea
        class="rating-comment"
        id="comment-${request.id}"
        placeholder="Kommentar (optional)"
      ></textarea>

      <button
        class="black-btn"
        style="margin-top:8px"
        onclick="submitRating('${request.id}')"
      >
        ⭐ Bewertung absenden
      </button>

    </div>

  `;

}


const selectedStars = {};


function selectStar(id,value){

  selectedStars[id] = value;

  const box =
    document.getElementById(
      "stars-" + id
    );

  const buttons =
    box.querySelectorAll(
      ".star-btn"
    );

  buttons.forEach(
    (button,index) => {

      button.classList.toggle(
        "selected",
        index < value
      );

    }
  );

}


function submitRating(id){

  const name = username();

  const data = requests();

  const request =
    data.find(r => r.id === id);

  if(!request) return;

  if(
    request.buyer !== name ||
    request.status !== "accepted"
  ){

    alert(
      "Diese Bewertung ist nicht möglich."
    );

    return;

  }

  if(request.rated){

    alert(
      "Du hast diesen Kauf bereits bewertet."
    );

    return;

  }

  const stars =
    selectedStars[id] || 0;

  if(stars === 0){

    alert(
      "⭐ Bitte wähle zuerst Sterne."
    );

    return;

  }

  const comment =
    document.getElementById(
      "comment-" + id
    ).value.trim();

  const allRatings = ratings();

  if(!allRatings[request.seller]){
    allRatings[request.seller] = [];
  }

  allRatings[request.seller].push({

    buyer:name,
    stars,
    comment,
    requestId:id

  });

  request.rated = true;

  saveRatings(allRatings);
  saveRequests(data);

  renderAll();

  alert(
    "⭐ Bewertung gespeichert!"
  );

}

function deleteCard(id){

  const name = username();

  const data = cards();

  const card =
    data.find(c => c.id === id);

  if(!card || card.owner !== name){

    alert(
      "🚫 Du kannst diese Karte nicht löschen."
    );

    return;

  }

  if(!confirm(
    "Möchtest du diese Karte wirklich löschen?"
  )) return;

  saveCards(
    data.filter(c => c.id !== id)
  );

  renderAll();

}

function showSeller(name){

function renderProfile(name){

  const box =
    document.getElementById(
      "profileContent"
    );

  const offers =
    cards().filter(
      c => c.owner === name
    );

  const sold =
    offers.filter(
      c => c.sold
    );

  const reviews =
    (ratings()[name] || []);

  let average = 0;

  if(reviews.length){

    average =
      reviews.reduce(
        (sum,r) =>
          sum + Number(r.stars),
        0
      ) / reviews.length;

  }

  const stars =
    average
    ? "★".repeat(
        Math.round(average)
      )
    : "Noch keine Bewertung";

  box.innerHTML = `

    <div class="profile">

      <div class="profile-head">

        <div class="big-avatar">
          ${escapeHTML(
            name.charAt(0).toUpperCase()
          )}
        </div>

        <div>

          <h2>
            ${escapeHTML(name)}
          </h2>

          <div class="rating">
            ${stars}
          </div>

          <small>
            ${
              reviews.length
              ? average.toFixed(1) +
                " / 5 (" +
                reviews.length +
                " Bewertungen)"
              : "Noch keine Bewertungen"
            }
          </small>

        </div>

      </div>

      <div class="stats">

        <div class="stat">
          <strong>${sold.length}</strong>
          <span>Verkauft</span>
        </div>

        <div class="stat">
          <strong>${offers.length}</strong>
          <span>Angebote</span>
        </div>

        <div class="stat">
          <strong>
            ${average ? average.toFixed(1) : "-"}
          </strong>
          <span>Bewertung</span>
        </div>

      </div>

      <h2 style="margin-top:30px">
        🎟️ Eigene Angebote
      </h2>

      <div class="cards" id="profileOffers"></div>

      <h2 style="margin-top:30px">
        ⭐ Bewertungen
      </h2>

      <div id="profileReviews"></div>

    </div>

  `;

  const offersBox =
    document.getElementById(
      "profileOffers"
    );

  if(!offers.length){

    offersBox.innerHTML =
      `<div class="empty">
        Keine Angebote.
      </div>`;

  }else{

    offersBox.innerHTML =
      offers
        .filter(c => !c.sold)
        .map(cardHTML)
        .join("");

  }

  const reviewsBox =
    document.getElementById(
      "profileReviews"
    );

  if(!reviews.length){

    reviewsBox.innerHTML =
      `<div class="empty">
        Noch keine Bewertungen.
      </div>`;

  }else{

    reviewsBox.innerHTML =
      reviews
        .slice()
        .reverse()
        .map(r => `

          <div class="review">

            <strong>
              ${escapeHTML(r.buyer)}
            </strong>

            <div class="stars">
              ${"★".repeat(r.stars)}
            </div>

            ${
              r.comment
              ? `<p>${escapeHTML(r.comment)}</p>`
              : ""
            }

          </div>

        `)
        .join("");

  }

}


/* =========================
   KARTE ANSEHEN
========================= */

function showCard(id){

  const card =
    cards().find(
      c => c.id === id
    );

  if(!card) return;

  const overlay =
    document.createElement("div");

  overlay.style.position="fixed";
  overlay.style.inset="0";
  overlay.style.background="rgba(0,0,0,.72)";
  overlay.style.display="flex";
  overlay.style.alignItems="center";
  overlay.style.justifyContent="center";
  overlay.style.padding="20px";
  overlay.style.zIndex="9999";

  overlay.innerHTML = `

    <div style="
      background:white;
      width:100%;
      max-width:420px;
      padding:22px;
      border-radius:20px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:14px;
        "
      >

      <h2>
        ${escapeHTML(card.player)}
      </h2>

      <p>
        ${escapeHTML(card.club)}
      </p>

      <p style="
        font-size:25px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <p>
        👤 Verkäufer:
        <strong>
          ${escapeHTML(card.owner)}
        </strong>
      </p>

      <button
        id="closeOverlay"
        style="
          width:100%;
          border:0;
          background:#111;
          color:white;
          padding:13px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>
  `;

  document.body.appendChild(
    overlay
  );

  document
    .getElementById(
      "closeOverlay"
    )
    .onclick = () =>
      overlay.remove();

}

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return String(value)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}
