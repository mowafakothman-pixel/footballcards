<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111;
}

/* =========================
   HEADER
========================= */

header{
  background:linear-gradient(135deg,#080808,#222);
  color:white;
  padding:28px 18px 24px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:32px;
  letter-spacing:-1px;
}

header p{
  margin:7px 0 0;
  color:#aaa;
}

/* =========================
   USER BAR
========================= */

.profile-bar{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #ddd;
}

.profile-inner{
  max-width:1200px;
  margin:auto;
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.profile-user{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.profile-controls{
  display:flex;
  gap:8px;
}

.profile-controls input{
  width:180px;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.primary-btn{
  border:0;
  background:#111;
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.primary-btn:hover{
  opacity:.85;
}

/* =========================
   NAVIGATION
========================= */

.navigation-wrap{
  position:sticky;
  top:67px;
  z-index:999;
  background:white;
  border-bottom:1px solid #ddd;
}

.navigation{
  max-width:1200px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.navigation button{
  position:relative;
  flex:0 0 auto;
  border:0;
  background:#f1f2f4;
  padding:11px 16px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap;
}

.navigation button.active{
  background:#111;
  color:white;
}

.badge{
  position:absolute;
  top:-5px;
  right:-4px;
  min-width:19px;
  height:19px;
  padding:0 5px;
  border-radius:20px;
  background:#ef4444;
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid white;
}

/* =========================
   SEARCH
========================= */

.search{
  background:white;
  padding:18px;
  border-bottom:1px solid #eee;
}

.search-inner{
  max-width:900px;
  margin:auto;
}

.search input{
  width:100%;
  padding:14px 17px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  outline:none;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:22px 18px 50px;
}

/* =========================
   SELL
========================= */

.sell{
  background:linear-gradient(135deg,#111,#292929);
  color:white;
  padding:24px;
  border-radius:20px;
  margin-bottom:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.sell h2{
  margin:0 0 7px;
}

.sell p{
  color:#bbb;
}

.sell form{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:18px;
}

.sell input{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
}

.sell button{
  border:0;
  border-radius:10px;
  background:white;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   PAGE
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.page-title h2{
  margin:0;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:18px;
}

.card{
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 9px 26px rgba(0,0,0,.11);
}

.card-image{
  width:100%;
  height:210px;
  background:#f0f1f3;
  border-radius:15px;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card h3{
  margin:14px 0 4px;
}

.info{
  color:#666;
  margin:6px 0;
}

.price{
  font-size:23px;
  font-weight:bold;
  margin:11px 0;
}

.card button{
  width:100%;
  border:0;
  padding:11px;
  border-radius:10px;
  margin-top:7px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.card button:hover{
  opacity:.86;
}

.card button.gray{
  background:#eceef0;
  color:#111;
}

.card button.green{
  background:#16a34a;
}

.favorite-info{
  margin-top:9px;
  color:#777;
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

.sold-label{
  display:inline-block;
  background:#ddf7e5;
  color:#137333;
  padding:7px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

/* =========================
   REQUESTS
========================= */

.request-list{
  display:grid;
  gap:14px;
}

.request{
  background:white;
  padding:17px;
  border-radius:18px;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.request-top{
  display:flex;
  align-items:center;
  gap:15px;
}

.request-image{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:12px;
  background:#f1f2f3;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 6px;
}

.request-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.accept-btn,
.reject-btn{
  flex:1;
  border:0;
  color:white;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.status{
  display:inline-block;
  padding:7px 10px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
}

.status.open{
  background:#fff1d6;
  color:#946200;
}

.status.accepted{
  background:#ddf7e5;
  color:#137333;
}

.status.rejected{
  background:#ffe1e1;
  color:#b42318;
}

/* =========================
   PROFILE
========================= */

.seller-profile{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.seller-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
}

.seller-header h2{
  margin:0;
}

.rating{
  margin-top:7px;
  font-size:20px;
}

.seller-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:22px 0;
}

.seller-stat{
  background:#f5f6f7;
  padding:16px;
  border-radius:13px;
  text-align:center;
}

.seller-stat strong{
  display:block;
  font-size:23px;
}

.seller-stat span{
  color:#777;
  font-size:13px;
}

/* =========================
   RATING
========================= */

.rating-box{
  background:#f5f6f7;
  padding:18px;
  border-radius:15px;
  margin-top:20px;
}

.star-picker{
  display:flex;
  gap:4px;
  margin-top:10px;
}

.star-picker button{
  border:0;
  background:transparent;
  font-size:30px;
  cursor:pointer;
  padding:0;
}

.star-picker button.active{
  color:#f5b400;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:white;
  padding:30px;
  border-radius:17px;
  color:#777;
  text-align:center;
}

/* =========================
   MODAL
========================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  background:rgba(0,0,0,.72);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.modal{
  width:100%;
  max-width:440px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:22px;
  text-align:center;
}

.modal img{
  width:100%;
  max-height:360px;
  object-fit:contain;
  border-radius:15px;
  background:#f1f2f3;
}

.modal button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  margin-top:9px;
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:35px;
  color:#888;
}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

  .profile-inner{
    flex-direction:column;
    align-items:stretch;
  }

  .profile-controls{
    width:100%;
  }

  .profile-controls input{
    flex:1;
    width:auto;
  }

  .navigation-wrap{
    top:104px;
  }

  .sell form{
    grid-template-columns:1fr;
  }

  .seller-stats{
    grid-template-columns:1fr;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-actions{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<!-- =========================
     USER
========================= -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-user">

      <div id="avatar" class="avatar">?</div>

      <span id="profileName">
        Kein Benutzer
      </span>

    </div>

    <div class="profile-controls">

      <input
        id="usernameInput"
        type="text"
        maxlength="20"
        placeholder="Benutzername"
      >

      <button
        class="primary-btn"
        onclick="saveUsername()"
      >
        Profil speichern
      </button>

    </div>

  </div>

</div>

<!-- =========================
     NAVIGATION
========================= -->

<div class="navigation-wrap">

  <div class="navigation">

    <button
      id="navCards"
      class="active"
      onclick="showPage('cardsPage','navCards')"
    >
      🔥 Karten
    </button>

    <button
      id="navFavorites"
      onclick="showPage('favoritesPage','navFavorites')"
    >
      ❤️ Favoriten
    </button>

    <button
      id="navMine"
      onclick="showPage('minePage','navMine')"
    >
      🃏 Meine Karten
    </button>

    <button
      id="navRequests"
      onclick="showPage('requestsPage','navRequests')"
    >
      📩 Anfragen
      <span id="requestBadge" class="badge" style="display:none">0</span>
    </button>

    <button
      id="navProfile"
      onclick="showPage('profilePage','navProfile')"
    >
      👤 Profil
    </button>

  </div>

</div>

<!-- =========================
     SEARCH
========================= -->

<div class="search">

  <div class="search-inner">

    <input
      id="searchInput"
      type="text"
      placeholder="🔎 Spieler, Verein oder Verkäufer suchen..."
    >

  </div>

</div>

<div class="container">

<!-- =========================
     SELL
========================= -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm">

    <input
      id="player"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <input
      id="image"
      type="file"
      accept="image/*"
      required
    >

    <button type="submit">
      Karte einstellen
    </button>

  </form>

</div>

<!-- =========================
     CARDS
========================= -->

<section
  id="cardsPage"
  class="page active"
>

  <div class="page-title">

    <h2>🔥 Aktuelle Karten</h2>

  </div>

  <div
    id="cards"
    class="cards"
  ></div>

</section>

<!-- =========================
     FAVORITES
========================= -->

<section
  id="favoritesPage"
  class="page"
>

  <div class="page-title">

    <h2 id="favoriteTitle">
      ❤️ Meine Favoriten
    </h2>

  </div>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     MY CARDS
========================= -->

<section
  id="minePage"
  class="page"
>

  <div class="page-title">

    <h2>🃏 Meine Karten</h2>

  </div>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     REQUESTS
========================= -->

<section
  id="requestsPage"
  class="page"
>

  <h2 id="requestTitle">
    📩 Meine Kaufanfragen
  </h2>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <h2 id="sellerRequestTitle">
    📥 Anfragen für meine Karten
  </h2>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- =========================
     PROFILE
========================= -->

<section
  id="profilePage"
  class="page"
>

  <h2>👤 Profil</h2>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE = {

  cards:"footballCards",

  requests:"purchaseRequests",

  favorites:"pixelFavoritesByUser",

  ratings:"sellerRatingsByUser",

  username:"pixelUsername"

};


/* =====================================================
   SAFE STORAGE
===================================================== */

function readJSON(key,fallback){

  try{

    const value =
      localStorage.getItem(key);

    if(!value){
      return fallback;
    }

    const parsed =
      JSON.parse(value);

    return parsed ?? fallback;

  }catch(error){

    console.error(
      "Storage Fehler:",
      error
    );

    return fallback;

  }

}


function writeJSON(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

    return true;

  }catch(error){

    alert(
      "Der Browser-Speicher ist voll."
    );

    return false;

  }

}


/* =====================================================
   USER
===================================================== */

function getUsername(){

  return (
    localStorage.getItem(
      STORAGE.username
    ) || ""
  ).trim();

}


function saveUsername(){

  const input =
    document.getElementById(
      "usernameInput"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Bitte gib einen Benutzernamen ein."
    );

    return;

  }

  localStorage.setItem(
    STORAGE.username,
    name
  );

  updateProfile();

  loadAll();

  alert(
    "👤 Profil gespeichert!"
  );

}


function updateProfile(){

  const name =
    getUsername();

  const avatar =
    document.getElementById(
      "avatar"
    );

  const profileName =
    document.getElementById(
      "profileName"
    );

  const input =
    document.getElementById(
      "usernameInput"
    );

  if(name){

    profileName.textContent =
      name;

    avatar.textContent =
      name.charAt(0).toUpperCase();

    input.value =
      name;

  }else{

    profileName.textContent =
      "Kein Benutzer";

    avatar.textContent =
      "?";

    input.value =
      "";

  }

}


/* =====================================================
   DATA
===================================================== */

function getCards(){

  return readJSON(
    STORAGE.cards,
    []
  );

}


function getRequests(){

  return readJSON(
    STORAGE.requests,
    []
  );

}


function getFavoritesData(){

  return readJSON(
    STORAGE.favorites,
    {}
  );

}


function getRatingsData(){

  return readJSON(
    STORAGE.ratings,
    {}
  );

}


/* =====================================================
   USER FAVORITES
===================================================== */

function getMyFavoriteIds(){

  const user =
    getUsername();

  if(!user){
    return [];
  }

  const all =
    getFavoritesData();

  return Array.isArray(
    all[user]
  )
    ? all[user]
    : [];

}


function isFavorite(cardId){

  return getMyFavoriteIds()
    .includes(cardId);

}


function getFavoriteCount(cardId){

  const all =
    getFavoritesData();

  let count = 0;

  Object.keys(all).forEach(
    user => {

      const ids =
        Array.isArray(all[user])
          ? all[user]
          : [];

      if(ids.includes(cardId)){
        count++;
      }

    }
  );

  return count;

}


function toggleFavorite(cardId){

  const user =
    getUsername();

  if(!user){

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if(!card){
    return;
  }

  /* EIGENE KARTE NICHT FAVORISIERBAR */

  if(card.owner === user){

    alert(
      "🚫 Deine eigene Karte kannst du nicht favorisieren."
    );

    return;

  }

  const all =
    getFavoritesData();

  if(!Array.isArray(all[user])){
    all[user] = [];
  }

  const index =
    all[user].indexOf(cardId);

  if(index >= 0){

    all[user].splice(
      index,
      1
    );

  }else{

    all[user].push(
      cardId
    );

  }

  writeJSON(
    STORAGE.favorites,
    all
  );

  loadAll();

}


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(
  pageId,
  buttonId
){

  document
    .querySelectorAll(".page")
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );

  const page =
    document.getElementById(
      pageId
    );

  if(page){
    page.classList.add(
      "active"
    );
  }

  document
    .querySelectorAll(
      ".navigation button"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );

  const button =
    document.getElementById(
      buttonId
    );

  if(button){
    button.classList.add(
      "active"
    );
  }

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    loadCards
  );


/* =====================================================
   CARD HTML
===================================================== */

function createCard(
  card,
  box
){

  const username =
    getUsername();

  const favorite =
    isFavorite(
      card.id
    );

  const favoriteCount =
    getFavoriteCount(
      card.id
    );

  const requests =
    getRequests();

  const existing =
    requests.find(
      request =>

        request.cardId === card.id &&

        request.buyer === username &&

        (
          request.status === "pending" ||
          request.status === "accepted"
        )
    );

  const item =
    document.createElement(
      "div"
    );

  item.className =
    "card";

  let buyButton = "";

  /* VERKAUFT */

  if(card.sold){

    buyButton = `
      <button
        class="gray"
        disabled
      >
        🔒 Bereits verkauft
      </button>
    `;

  }

  /* EIGENE KARTE */

  else if(
    username &&
    card.owner === username
  ){

    buyButton = `
      <button
        class="gray"
        onclick="ownCardMessage()"
      >
        🚫 Deine Karte
      </button>
    `;

  }

  /* KEIN USER */

  else if(!username){

    buyButton = `
      <button
        onclick="needUsername()"
      >
        🛒 Kaufen
      </button>
    `;

  }

  /* SCHON ANGEFRAGT */

  else if(existing){

    if(
      existing.status === "accepted"
    ){

      buyButton = `
        <button
          class="gray"
          disabled
        >
          ✅ Angenommen
        </button>
      `;

    }else{

      buyButton = `
        <button
          class="gray"
          disabled
        >
          🕐 Anfrage offen
        </button>
      `;

    }

  }

  /* KAUFEN */

  else{

    buyButton = `
      <button
        onclick="buyCard('${card.id}')"
      >
        🛒 Kaufen
      </button>
    `;

  }

  item.innerHTML = `

    <div class="card-image">

      <img
        src="${card.image}"
        alt="${escapeHTML(card.player)}"
      >

/* =====================================================
   SELL CARD
===================================================== */

document
  .getElementById(
    "sellForm"
  )
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username =
        getUsername();

      if(!username){

        needUsername();

        return;

      }

      const player =
        document
          .getElementById("player")
          .value
          .trim();

      const club =
        document
          .getElementById("club")
          .value
          .trim();

      const price =
        document
          .getElementById("price")
          .value;

      const file =
        document
          .getElementById("image")
          .files[0];

      if(
        !player ||
        !club ||
        !price ||
        !file
      ){

        alert(
          "Bitte alle Felder ausfüllen."
        );

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const image =
            new Image();

          image.onload =
            function(){

              const canvas =
                document.createElement(
                  "canvas"
                );

              const max =
                700;

              let width =
                image.width;

              let height =
                image.height;

              if(width > max){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }

              if(height > max){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                image,
                0,
                0,
                width,
                height
              );

              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  .65
                );

              const cards =
                getCards();

              cards.unshift({

                id:
                  Date.now() +
                  "-" +
                  Math.random()
                    .toString(36)
                    .slice(2),

                player:
                  player,

                club:
                  club,

                price:
                  Number(price),

                image:
                  imageData,

                owner:
                  username,

                sold:
                  false,

                soldTo:
                  null,

                createdAt:
                  new Date().toISOString()

              });

              if(
                !writeJSON(
                  STORAGE.cards,
                  cards
                )
              ){
                return;
              }

              document
                .getElementById(
                  "sellForm"
                )
                .reset();

              loadAll();

              alert(
                "🎉 Deine Karte wurde eingestellt!"
              );

            };

          image.src =
            reader.result;

        };

      reader.readAsDataURL(
        file
      );

    }
  );

function buyCard(cardId){

  const username =
    getUsername();

  if(!username){

    needUsername();

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === cardId
    );

  if(!card){
    return;
  }

  if(
    card.owner === username
  ){

    ownCardMessage();

    return;

  }

  if(card.sold){

    alert(
      "🔒 Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests =
    getRequests();

  const already =
    requests.find(
      r =>

        r.cardId === cardId &&

        r.buyer === username &&

        (
          r.status === "pending" ||
          r.status === "accepted"
        )
    );

  if(already){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  const confirmed =
    confirm(
      "Möchtest du " +
      card.player +
      " für " +
      Number(card.price).toFixed(2) +
      " € anfragen?"
    );

  if(!confirmed){
    return;
  }

  requests.push({

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      username,

    seller:
      card.owner,

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  });

  writeJSON(
    STORAGE.requests,
    requests
  );

  loadAll();

  alert(
    "📩 Kaufanfrage gesendet!"

/* =====================================================
   ACCEPT
===================================================== */

function acceptRequest(requestId){

  const username =
    getUsername();

  const requests =
    getRequests();

  const request =
    requests.find(
      r =>
        r.id === requestId
    );

  if(!request){
    return;
  }

  if(
    request.seller !== username
  ){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(
    request.status !== "pending"
  ){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards =
    getCards();

  const card =
    cards.find(
      c =>
        c.id === request.cardId
    );

  if(!card){

    alert(
      "Die Karte wurde nicht gefunden."
    );

    return;

  }

  if(card.sold){

    alert(
      "🔒 Die Karte wurde bereits verkauft."
    );

    request.status =
      "rejected";

    writeJSON(
      STORAGE.requests,
      requests
    );

    loadAll();

    return;

  }

  if(
    !confirm(
      "Anfrage von " +
      request.buyer +
      " annehmen?"
    )
  ){
    return;
  }

  request.status =
    "accepted";

  card.sold =
    true;

  card.soldTo =
    request.buyer;

  /*
    Andere offene Anfragen
    derselben Karte ablehnen.
  */

  requests.forEach(
    other => {

      if(
        other.cardId ===
        request.cardId &&

        other.id !==
        request.id &&

        other.status ===
        "pending"
      ){

        other.status =
          "rejected";

      }

    }
  );

  writeJSON(
    STORAGE.cards,
    cards
  );

  writeJSON(
    STORAGE.requests,
    requests
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}

function loadSellerProfile(

){

    document.getElementById(

  const cards =
    getCards().filter(
      card =>
        card.owner === seller
    );

  const sold =
    cards.filter(
      card =>
        card.sold === true
    );

  const ratings =
    getRatingsData();

  const sellerRatings =
    Array.isArray(
      ratings[seller]
    )
      ? ratings[seller]
      : [];

  let average = 0;

  if(
    sellerRatings.length
  ){

    average =
      sellerRatings.reduce(
        (a,b) =>
          a + Number(b.stars),
        0
      ) /
      sellerRatings.length;

  const stars =
    average

  const currentUser =

  let ratingHTML =

    currentUser &&
    currentUser !== seller &&
    getRequests().some(
      request =>

        request.buyer === currentUser &&

        request.seller === seller &&

        request.status === "accepted"

            ☆
          </button>

          <button onclick="rateSeller('${escapeJS(seller)}',4)">
            ☆
          </button>

          <button onclick="rateSeller('${escapeJS(seller)}',5)">
            ☆
          </button>

        </div>

      </div>

    `;

  }else if(
    alreadyRated
  ){

    ratingHTML = `

      <div class="rating-box">
        ✅ Du hast diesen Verkäufer bereits bewertet.
      </div>

    `;

  box.innerHTML = `

          seller.charAt(0).toUpperCase()
        )}

          ${cards.length}
        </strong>

        <span>

        </span>

      </div>

        <strong>

            average
              ? average.toFixed(1)

          }
        </strong>

        <span>
          Bewertung

      🏆 Eigene Angebote

/* =====================================================
   RATE SELLER
===================================================== */

function rateSeller(
  seller,
  stars
){

  const user =
    getUsername();

  if(!user){

    needUsername();

    return;

  }

  if(
    user === seller
  ){

    alert(
      "🚫 Du kannst dich nicht selbst bewerten."
    );

    return;

  }

  const requests =
    getRequests();

  const validPurchase =
    requests.some(
      request =>

        request.buyer === user &&

        request.seller === seller &&

        request.status === "accepted"
    );

  if(!validPurchase){

    alert(
      "Du kannst diesen Verkäufer nur nach einem erfolgreichen Kauf bewerten."
    );

    return;

  }

  const ratings =
    getRatingsData();

  if(!Array.isArray(ratings[seller])){
    ratings[seller] = [];
  }

  const already =
    ratings[seller].some(
      rating =>
        rating.from === user
    );

  if(already){

    alert(
      "Du hast diesen Verkäufer bereits bewertet."
    );

    return;

  }

  ratings[seller].push({

    from:
      user,

    stars:
      Number(stars),

    date:
      new Date().toISOString()

  });

  writeJSON(
    STORAGE.ratings,
    ratings
  );

  loadSellerProfile(
    seller
  );

  alert(
    "⭐ Bewertung gespeichert!"
  );

}


/* =====================================================
   CARD MODAL
===================================================== */

function showCard(
  cardId
){

  const card =
    getCards().find(
      c =>
        c.id === cardId
    );

  if(!card){
    return;
  }

  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "modal-overlay";

  overlay.innerHTML = `

    <div class="modal">

      <img
        src="${card.image}"
        alt="${escapeHTML(card.player)}"
      >

      <h2>
        ${escapeHTML(card.player)}
      </h2>

      <p>
        ${escapeHTML(card.club)}
      </p>

      <p class="price">
        ${Number(card.price).toFixed(2)} €
      </p>

      <p>
        👤 Verkäufer:
        <strong>
          ${escapeHTML(card.owner)}
        </strong>
      </p>

      <p>
        ❤️ ${getFavoriteCount(card.id)}
        Favorisierungen
      </p>

      ${
        card.sold
          ? `
            <span class="sold-label">
              🔒 Verkauft
            </span>
          `
          : ""
      }

      <button
        onclick="openSellerFromModal('${escapeJS(card.owner)}',this)"
      >
        👤 Verkäuferprofil
      </button>

      <button
        onclick="this.closest('.modal-overlay').remove()"
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

}


function openSellerFromModal(
  seller,
  button
){

  const modal =
    button.closest(
      ".modal-overlay"
    );

  if(modal){
    modal.remove();
  }

  openSellerProfile(
    seller
  );

}

function escapeHTML(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeJS(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    );

}
