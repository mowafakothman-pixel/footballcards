<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  color: #ccc;
}

.search {
  padding: 20px;
  background: white;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 600px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.sell {
  background: #111;
  color: white;
  padding: 18px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 20px;
}

.sell input {
  padding: 11px;
  margin: 4px;
  border-radius: 8px;
  border: none;
}

.sell button {
  border: none;
  background: white;
  color: #111;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.nav button {
  border: none;
  background: white;
  padding: 14px 8px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.nav button.active {
  background: #111;
  color: white;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,.10);
}

.card-image {
  width: 100%;
  height: 200px;
  border-radius: 14px;
  background: #f1f1f1;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.price {
  font-size: 23px;
  font-weight: bold;
  margin: 10px 0;
}

.info {
  color: #666;
}

.card button {
  width: 100%;
  margin-top: 8px;
  border: none;
  padding: 11px;
  border-radius: 9px;
  background: #111;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.card button.gray {
  background: #eee;
  color: #111;
}

.card button.green {
  background: #16803c;
}

.card button.red {
  background: #c62828;
}

.request {
  background: white;
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.request img {
  width: 80px;
  height: 80px;
  object-fit: contain;
  border-radius: 10px;
  background: #f1f1f1;
  float: left;
  margin-right: 14px;
}

.request::after {
  content: "";
  display: block;
  clear: both;
}

.status {
  font-weight: bold;
}

.pending {
  color: #d17b00;
}

.accepted {
  color: #16803c;
}

.rejected {
  color: #c62828;
}

.empty {
  color: #777;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}

@media(max-width:600px) {
  .nav {
    grid-template-columns: repeat(2, 1fr);
  }

  .sell input {
    width: 100%;
    margin: 5px 0;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="search">
  <input
    id="searchInput"
    type="text"
    placeholder="🔎 Suche nach Spieler oder Verein..."
  >
</div>

<div class="container">

  <div class="sell">
    <h2>🎟️ Karte verkaufen</h2>
    <p>Stelle deine Fußballkarte schnell und einfach ein.</p>

    <form id="sellForm">

      <input
        id="player"
        type="text"
        placeholder="Spieler"
        required
      >

      <input
        id="club"
        type="text"
        placeholder="Verein"
        required
      >

      <input
        id="price"
        type="number"
        placeholder="Preis in €"
        min="0"
        step="0.01"
        required
      >

      <input
        id="image"
        type="file"
        accept="image/*"
        required
      >

      <button type="submit">
        Karte einstellen
      </button>

    </form>
  </div>

  <div class="nav">

    <button
      id="navCards"
      class="active"
      onclick="showPage('cardsPage','navCards')"
    >
      🔥 Karten
    </button>

    <button
      id="navFavorites"
      onclick="showPage('favoritesPage','navFavorites')"
    >
      ❤️ Favoriten
    </button>

    <button
      id="navMine"
      onclick="showPage('minePage','navMine')"
    >
      🃏 Meine Karten
    </button>

    <button
      id="navRequests"
      onclick="showPage('requestsPage','navRequests')"
    >
      📩 Kaufanfragen
    </button>

  </div>

  <div id="cardsPage" class="page active">

    <h2>🔥 Aktuelle Karten</h2>

    <div
      id="cards"
      class="cards"
    ></div>

  </div>

  <div id="favoritesPage" class="page">

    <h2 id="favoriteTitle">
      ❤️ Favoriten (0)
    </h2>

    <div
      id="favoriteCards"
      class="cards"
    ></div>

  </div>

  <div id="minePage" class="page">

    <h2>🃏 Meine Karten</h2>

    <div
      id="myCards"
      class="cards"
    ></div>

  </div>

  <div id="requestsPage" class="page">

    <h2 id="requestTitle">
      📩 Meine Kaufanfragen (0)
    </h2>

    <div id="purchaseRequests"></div>

    <h2 id="sellerRequestTitle">
      📥 Anfragen für meine Karten (0)
    </h2>

    <div id="sellerRequests"></div>

  </div>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

const sellForm =
  document.getElementById("sellForm");

const searchInput =
  document.getElementById("searchInput");

const cards =
  document.getElementById("cards");

const favoriteCards =
  document.getElementById("favoriteCards");

const myCards =
  document.getElementById("myCards");

const purchaseRequests =
  document.getElementById("purchaseRequests");

const sellerRequests =
  document.getElementById("sellerRequests");


function getCards() {

  return JSON.parse(
    localStorage.getItem("footballCards")
  ) || [];

}


function getFavorites() {

  return JSON.parse(
    localStorage.getItem("favoriteCards")
  ) || [];

}


function getRequests() {

  return JSON.parse(
    localStorage.getItem("purchaseRequests")
  ) || [];

}


function showPage(pageId, buttonId) {

  document.querySelectorAll(".page")
    .forEach(page => {
      page.classList.remove("active");
    });

  document.getElementById(pageId)
    .classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(button => {
      button.classList.remove("active");
    });

  document.getElementById(buttonId)
    .classList.add("active");

}


function createCard(card) {

  const item =
    document.createElement("div");

  item.className = "card";

  const favorites =
    getFavorites();

  const favorite =
    favorites.find(f => f.id === card.id);

  const requests =
    getRequests();

  const request =
    requests.find(r =>
      r.cardId === card.id &&
      r.status !== "rejected"
    );

  let buyButton;

  if (!request) {

    buyButton = `
      <button onclick="buyCard('${card.id}')">
        🛒 Kaufen
      </button>
    `;

  } else if (request.status === "pending") {

    buyButton = `
      <button class="gray" disabled>
        🕐 Anfrage gesendet
      </button>
    `;

  } else {

    buyButton = `
      <button class="gray" disabled>
        ✅ Angenommen
      </button>
    `;

  }

  item.innerHTML = `

    <div class="card-image">
      <img
        src="${card.image}"
        alt="${card.player}"
      >
    </div>

    <h3>${card.player}</h3>

    <p class="info">
      ${card.club}
    </p>

    <p class="price">
      ${card.price} €
    </p>

    <button onclick="showCard('${card.id}')">
      👀 Karte ansehen
    </button>

    ${buyButton}

    <button
      class="gray"
      onclick="toggleFavorite('${card.id}')"
    >
      ${favorite
        ? "❤️ Favorisiert"
        : "♡ Favorit"}
    </button>

  `;

  cards.appendChild(item);

}


function loadCards() {

  cards.innerHTML = "";

  const savedCards =
    getCards();

  const text =
    searchInput.value
      .toLowerCase()
      .trim();

  const filtered =
    savedCards.filter(card =>
      card.player
        .toLowerCase()
        .includes(text) ||
      card.club
        .toLowerCase()
        .includes(text)
    );

  if (filtered.length === 0) {

    cards.innerHTML =
      "<p class='empty'>Keine Karten gefunden.</p>";

    return;
  }

  filtered.forEach(card =>
    createCard(card)
  );

}


function loadFavorites() {

  const favorites =
    getFavorites();

  document.getElementById(
    "favoriteTitle"
  ).textContent =
    "❤️ Favoriten (" +
    favorites.length +
    ")";

  favoriteCards.innerHTML = "";

  if (favorites.length === 0) {

    favoriteCards.innerHTML =
      "<p class='empty'>Noch keine Favoriten.</p>";

    return;
  }

  favorites.forEach(card => {

    const item =
      document.createElement("div");

    item.className = "card";

    item.innerHTML = `

      <div class="card-image">
        <img
          src="${card.image}"
          alt="${card.player}"
        >
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button
        onclick="showCard('${card.id}')"
      >
        👀 Karte ansehen
      </button>

      <button
        class="gray"
        onclick="toggleFavorite('${card.id}')"
      >
        ❤️ Entfernen
      </button>

    `;

    favoriteCards.appendChild(item);

  });

}


function loadMyCards() {

  myCards.innerHTML = "";

  const savedCards =
    getCards();

  if (savedCards.length === 0) {

    myCards.innerHTML =
      "<p class='empty'>Noch keine eigenen Karten.</p>";

    return;
  }

  savedCards.forEach(card => {

    const item =
      document.createElement("div");

    item.className = "card";

    item.innerHTML = `

      <div class="card-image">
        <img
          src="${card.image}"
          alt="${card.player}"
        >
      </div>

      <h3>${card.player}</h3>

      <p class="info">
        ${card.club}
      </p>

      <p class="price">
        ${card.price} €
      </p>

      <button
        class="red"
        onclick="deleteCard('${card.id}')"
      >
        🗑️ Löschen
      </button>

    `;

    myCards.appendChild(item);

  });

}


sellForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    const player =
      document.getElementById("player")
        .value.trim();

    const club =
      document.getElementById("club")
        .value.trim();

    const price =
      document.getElementById("price")
        .value;

    const image =
      document.getElementById("image")
        .files[0];

    if (!image) {

      alert(
        "Bitte wähle ein Foto aus!"
      );

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function() {

        const img =
          new Image();

        img.onload =
          function() {

            const canvas =
              document.createElement(
                "canvas"
              );

            const maxSize = 700;

            let width =
              img.width;

            let height =
              img.height;

            if (
              width > height &&
              width > maxSize
            ) {

              height =
                height *
                (maxSize / width);

              width = maxSize;

            } else if (
              height > maxSize
            ) {

              width =
                width *
                (maxSize / height);

              height = maxSize;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx =
              canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            const imageData =
              canvas.toDataURL(
                "image/jpeg",
                0.6
              );

            const savedCards =
              getCards();

            savedCards.unshift({

              id:
                Date.now() +
                "-" +
                Math.random()
                  .toString(36)
                  .substring(2),

              player: player,

              club: club,

              price: price,

              image: imageData

            });

            localStorage.setItem(
              "footballCards",
              JSON.stringify(
                savedCards
              )
            );

            sellForm.reset();

            loadCards();
            loadMyCards();

            alert(
              "🎉 Karte wurde eingestellt!"
            );

          };

        img.src =
          reader.result;

      };

    reader.readAsDataURL(image);

  }
);


function deleteCard(cardId) {

  if (
    !confirm(
      "Karte wirklich löschen?"
    )
  ) {
    return;
  }

  let savedCards =
    getCards();

  savedCards =
    savedCards.filter(
      card => card.id !== cardId
    );

  localStorage.setItem(
    "footballCards",
    JSON.stringify(
      savedCards
    )
  );

  loadCards();
  loadMyCards();

}


function toggleFavorite(cardId) {

  const savedCards =
    getCards();

  const card =
    savedCards.find(
      c => c.id === cardId
    );

  if (!card) return;

  let favorites =
    getFavorites();

  const index =
    favorites.findIndex(
      f => f.id === cardId
    );

  if (index !== -1) {

    favorites.splice(index, 1);

  } else {

    favorites.push(card);

  }

  localStorage.setItem(
    "favoriteCards",
    JSON.stringify(
      favorites
    )
  );

  loadFavorites();
  loadCards();

}


function buyCard(cardId) {

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if (!card) return;

  const requests =
    getRequests();

  const alreadyRequested =
    requests.find(
      r =>
        r.cardId === cardId &&
        r.status !== "rejected"
    );

  if (alreadyRequested) {

    alert(
      alreadyRequested.status === "accepted"
        ? "✅ Diese Karte wurde bereits angenommen!"
        : "🕐 Du hast diese Karte bereits angefragt!"
    );

    return;
  }

  const confirmBuy =
    confirm(
      "Möchtest du diese Karte kaufen?\n\n" +
      card.player +
      " – " +
      card.club +
      "\nPreis: " +
      card.price +
      " €"
    );

  if (!confirmBuy) return;

  requests.push({

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:
      card.id,

    player:
      card.player,

    club:
      card.club,

    price:
      card.price,

    image:
      card.image,

    buyer:
      "Käufer",

    status:
      "pending"

  });

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  showPage(
    "requestsPage",
    "navRequests"
  );

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}


function loadPurchaseRequests() {

  const requests =
    getRequests();

  document.getElementById(
    "requestTitle"
  ).textContent =
    "📩 Meine Kaufanfragen (" +
    requests.length +
    ")";

  purchaseRequests.innerHTML = "";

  if (requests.length === 0) {

    purchaseRequests.innerHTML =
      "<p class='empty'>Noch keine Kaufanfragen.</p>";

    return;
  }

  requests.forEach(request => {

    const item =
      document.createElement("div");

    item.className =
      "request";

    let status = "";

    if (
      request.status ===
      "pending"
    ) {

      status =
        "<span class='pending'>🕐 Offen</span>";

    } else if (
      request.status ===
      "accepted"
    ) {

      status =
        "<span class='accepted'>✅ Angenommen</span>";

    } else {

      status =
        "<span class='rejected'>❌ Abgelehnt</span>";

    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>
        ${request.player}
      </h3>

      <p>
        ${request.club}
      </p>

      <p>
        ${request.price} €
      </p>

      <p class="status">
        ${status}
      </p>

      ${
        request.status === "rejected"
          ? "<p>Du kannst die Karte erneut anfragen.</p>"
          : ""
      }

    `;

    purchaseRequests.appendChild(
      item
    );

  });

}


function loadSellerRequests() {

  const requests =
    getRequests();

  const myCards =
    getCards();

  const myIds =
    myCards.map(
      card => card.id
    );

  const incoming =
    requests.filter(
      request =>
        myIds.includes(
          request.cardId
        )
    );

  document.getElementById(
    "sellerRequestTitle"
  ).textContent =
    "📥 Anfragen für meine Karten (" +
    incoming.length +
    ")";

  sellerRequests.innerHTML = "";

  if (incoming.length === 0) {

    sellerRequests.innerHTML =
      "<p class='empty'>Noch keine Anfragen für deine Karten.</p>";

    return;
  }

  incoming.forEach(request => {

    const item =
      document.createElement("div");

    item.className =
      "request";

    let status = "";

    if (
      request.status ===
      "pending"
    ) {

      status =
        "<span class='pending'>🕐 Offen</span>";

    } else if (
      request.status ===
      "accepted"
    ) {

      status =
        "<span class='accepted'>✅ Angenommen</span>";

    } else {

      status =
        "<span class='rejected'>❌ Abgelehnt</span>";

    }

    item.innerHTML = `

      <img
        src="${request.image}"
        alt="${request.player}"
      >

      <h3>
        ${request.player}
      </h3>

      <p>
        Käufer: 👤 ${request.buyer}
      </p>

      <p>
        ${request.price} €
      </p>

      <p class="status">
        ${status}
      </p>

      ${
        request.status === "pending"
        ? `
          <button
            class="green"
            onclick="acceptRequest('${request.id}')"
          >
            ✅ Annehmen
          </button>

          <button
            class="red"
            onclick="rejectRequest('${request.id}')"
          >
            ❌ Ablehnen
          </button>
        `
        : ""
      }

    `;

    sellerRequests.appendChild(
      item
    );

  });

}


function acceptRequest(requestId) {

  const requests =
    getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if (!request) return;

  request.status =
    "accepted";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  alert(
    "✅ Anfrage angenommen!"
  );

}


function rejectRequest(requestId) {

  const requests =
    getRequests();

  const request =
    requests.find(
      r => r.id === requestId
    );

  if (!request) return;

  if (
    !confirm(
      "Anfrage wirklich ablehnen?"
    )
  ) {
    return;
  }

  request.status =
    "rejected";

  localStorage.setItem(
    "purchaseRequests",
    JSON.stringify(
      requests
    )
  );

  loadCards();
  loadPurchaseRequests();
  loadSellerRequests();

  alert(
    "❌ Anfrage abgelehnt!"
  );

}


function showCard(cardId) {

  const card =
    getCards().find(
      c => c.id === cardId
    );

  if (!card) return;

  const overlay =
    document.createElement(
      "div"
    );

  overlay.style.position =
    "fixed";

  overlay.style.top = "0";
  overlay.style.left = "0";

  overlay.style.width =
    "100%";

  overlay.style.height =
    "100%";

  overlay.style.background =
    "rgba(0,0,0,.7)";

  overlay.style.display =
    "flex";

  overlay.style.alignItems =
    "center";

  overlay.style.justifyContent =
    "center";

  overlay.style.zIndex =
    "9999";

  overlay.style.padding =
    "20px";

  overlay.innerHTML = `

    <div style="
      background:white;
      padding:20px;
      border-radius:18px;
      width:100%;
      max-width:400px;
      text-align:center;
    ">

      <img
        src="${card.image}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:12px;
        "
      >

      <h2>
        ${card.player}
      </h2>

      <p>
        ${card.club}
      </p>

      <p style="
        font-size:24px;
        font-weight:bold;
      ">
        ${card.price} €
      </p>

      <button
        id="closeCard"
        style="
          border:none;
          background:#111;
          color:white;
          padding:12px 22px;
          border-radius:10px;
          font-weight:bold;
        "
      >
        Schließen
      </button>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  document.getElementById(
    "closeCard"
  ).onclick =
    function() {

      overlay.remove();

    };

}


searchInput.addEventListener(
  "input",
  loadCards
);


loadCards();
loadFavorites();
loadMyCards();
loadPurchaseRequests();
loadSellerRequests();

</script>

</body>
</html>
