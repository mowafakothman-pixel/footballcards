<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Cardly — Football Cards</title>

<style>
:root{
  --bg:#050506;
  --panel:#0d0d10;
  --panel2:#131318;
  --line:#26262e;
  --text:#f7f7fa;
  --muted:#8b8b96;
  --accent:#fff;
  --green:#36e58a;
  --red:#ff5570;
  --yellow:#ffd45c;
  --blue:#79a8ff;
  --shadow:0 20px 60px rgba(0,0,0,.38);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 50% -20%,
      #202026 0,
      #09090b 34%,
      #050506 70%
    );
  background-attachment:fixed;
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

/* =========================
   TOP BAR
========================= */

.top{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,6,.82);
  backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.top-inner{
  width:min(1280px,94%);
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:950;
  letter-spacing:-1px;
  font-size:22px;
  white-space:nowrap;
}

.brand-mark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(145deg,#fff,#aaa);
  color:#000;
  display:grid;
  place-items:center;
  box-shadow:0 8px 28px rgba(255,255,255,.13);
}

/* =========================
   SEARCH
========================= */

.search{
  flex:1;
  position:relative;
}

.search input{
  width:100%;
  height:44px;
  padding:0 16px 0 43px;
  border:1px solid #2a2a31;
  background:#111116;
  color:#fff;
  border-radius:14px;
  outline:0;
}

.search input:focus{
  border-color:#666;
}

.search:before{
  content:"⌕";
  position:absolute;
  left:15px;
  top:8px;
  font-size:23px;
  color:#777;
  z-index:2;
}

/* =========================
   PROFILE BUTTON
========================= */

.profile-btn{
  border:1px solid #303039;
  background:#121217;
  color:#fff;
  border-radius:14px;
  height:44px;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800;
}

.mini-avatar{
  width:28px;
  height:28px;
  border-radius:9px;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
  font-weight:950;
}

/* =========================
   MAIN
========================= */

.container{
  width:min(1280px,94%);
  margin:auto;
  padding:25px 0 120px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   HERO
========================= */

.hero{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:18px;
  margin:4px 0 24px;
}

.hero h1{
  font-size:clamp(28px,4vw,46px);
  line-height:1;
  margin:0;
  letter-spacing:-2px;
}

.hero p{
  color:var(--muted);
  margin:9px 0 0;
}

.hero-chip{
  border:1px solid #303039;
  background:rgba(255,255,255,.04);
  padding:10px 13px;
  border-radius:13px;
  color:#aaa;
  font-size:12px;
}

/* =========================
   SELL
========================= */

.sell-wrap{
  margin-bottom:22px;
}

.sell-main{
  width:100%;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(120deg,#fff,#cfcfcf);
  color:#000;
  border-radius:18px;
  padding:17px;
  font-weight:950;
  font-size:16px;
  box-shadow:0 14px 45px rgba(255,255,255,.08);
}

.sell-main:hover{
  transform:translateY(-1px);
}

.sell-panel{
  display:none;
  margin-top:12px;
  background:linear-gradient(145deg,#17171c,#0b0b0e);
  border:1px solid #303039;
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}

.sell-panel.open{
  display:block;
}

.sell-panel h2{
  margin:0 0 15px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  background:#111116;
  border:1px solid #2b2b33;
  color:#fff;
  border-radius:12px;
  padding:13px;
  outline:0;
  width:100%;
}

.field:focus{
  border-color:#777;
}

.full{
  grid-column:1/-1;
}

.photo{
  border:1px dashed #45454f;
  background:#111116;
  border-radius:12px;
  padding:14px;
  text-align:center;
  color:#ddd;
  font-weight:800;
}

.photo input{
  display:none;
}

.form-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.primary,
.secondary,
.danger,
.success{
  border:0;
  border-radius:12px;
  padding:12px;
  font-weight:900;
}

.primary{
  background:#fff;
  color:#000;
}

.secondary{
  background:#1c1c22;
  color:#fff;
  border:1px solid #303039;
}

.danger{
  background:#39121a;
  color:#ff9aaa;
}

.success{
  background:#0c3a25;
  color:#76f2ad;
}

/* =========================
   SECTION HEAD
========================= */

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 15px;
}

.section-head h2{
  margin:0;
  font-size:22px;
  letter-spacing:-.6px;
}

.count{
  color:#777;
  font-size:12px;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:14px;
}

.card{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(25,25,31,.96),
      rgba(11,11,14,.96)
    );
  border:1px solid #25252d;
  border-radius:20px;
  padding:10px;
  overflow:hidden;
  box-shadow:
    0 10px 30px rgba(0,0,0,.16);
  transition:.18s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#42424d;
  box-shadow:
    0 18px 45px rgba(0,0,0,.3);
}

.card-image{
  height:205px;
  border-radius:15px;
  background:
    radial-gradient(
      circle,
      #24242b,
      #101014
    );
  display:grid;
  place-items:center;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.tag{
  position:absolute;
  left:18px;
  top:18px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.12);
  padding:5px 8px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
}

.card h3{
  font-size:16px;
  margin:11px 2px 3px;
}

.muted{
  color:var(--muted);
}

.price{
  font-size:21px;
  font-weight:950;
  margin:9px 2px;
}

.stats{
  display:grid;
  grid-template-columns:
    1fr 1fr 1fr;
  gap:5px;
  color:#7f7f8a;
  font-size:11px;
  margin:8px 0;
}

.stats span{
  background:#15151a;
  border-radius:8px;
  padding:7px 5px;
  text-align:center;
}

.card-actions{
  display:grid;
  gap:7px;
  margin-top:7px;
}

.card-actions.two{
  grid-template-columns:1fr 1fr;
}

.card-actions button{
  width:100%;
}

/* =========================
   EMPTY
========================= */

.empty{
  grid-column:1/-1;
  background:#0d0d11;
  border:1px dashed #303039;
  color:#777;
  border-radius:18px;
  padding:38px 20px;
  text-align:center;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom{
  position:fixed;
  z-index:60;
  left:0;
  right:0;
  bottom:0;
  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));
  background:rgba(5,5,6,.88);
  backdrop-filter:blur(22px);
  border-top:1px solid rgba(255,255,255,.08);
}

.nav{
  width:min(920px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:
    repeat(5,1fr);
  gap:7px;
}

.nav button{
  position:relative;
  border:1px solid #292930;
  background:#101014;
  color:#999;
  border-radius:13px;
  padding:10px 5px;
  font-size:11px;
  font-weight:850;
}

.nav button.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.nav .sell{
  background:
    linear-gradient(
      145deg,
      #fff,
      #cfcfcf
    );
  color:#000;
  border-color:#fff;
  font-size:13px;
}

.badge{
  display:none;
  position:absolute;
  right:-3px;
  top:-5px;
  min-width:18px;
  height:18px;
  border-radius:50%;
  background:#ff4562;
  color:#fff;
  border:2px solid #070708;
  font-size:9px;
  place-items:center;
}

/* =========================
   TRANSACTIONS
========================= */

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.tabs button{
  border:1px solid #303039;
  background:#121217;
  color:#999;
  border-radius:12px;
  padding:12px;
  font-weight:900;
}

.tabs button.active{
  background:#fff;
  color:#000;
}

.transactions{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:11px;
}

.tx{
  background:#101014;
  border:1px solid #282831;
  border-radius:16px;
  padding:12px;
}

.tx-top{
  display:flex;
  gap:11px;
}

.tx img{
  width:68px;
  height:68px;
  border-radius:11px;
  object-fit:contain;
  background:#19191f;
}

.tx-info{
  min-width:0;
  flex:1;
}

.tx-info h3{
  font-size:15px;
  margin:0 0 3px;
}

.status{
  display:inline-flex;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:900;
  margin-top:5px;
}

.pending{
  background:#3b2f0c;
  color:#ffe071;
}

.accepted{
  background:#0b3822;
  color:#73efaa;
}

.rejected{
  background:#42131c;
  color:#ff91a0;
}

.tx-actions{
  display:grid;
  grid-template-columns:
    1fr 1fr 1fr;
  gap:6px;
  margin-top:10px;
}

.tx-actions button{
  border:0;
  border-radius:9px;
  padding:9px 5px;
  font-size:11px;
  font-weight:900;
}

/* =========================
   CHAT
========================= */

.chat-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:12px;
  min-height:560px;
}

.chat-list,
.chat-window,
.profile-box{
  background:#101014;
  border:1px solid #292930;
  border-radius:18px;
  overflow:hidden;
}

.chat-list{
  height:560px;
  overflow:auto;
}

.chat-title{
  padding:15px;
  border-bottom:1px solid #292930;
  font-weight:950;
}

.chat-item{
  padding:13px;
  border-bottom:1px solid #202027;
  cursor:pointer;
}

.chat-item:hover,
.chat-item.selected{
  background:#19191f;
}

.chat-item strong{
  display:block;
}

.chat-item small{
  color:#777;
}

.chat-window{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid #292930;
  font-weight:950;
}

.messages{
  flex:1;
  min-height:420px;
  max-height:475px;
  overflow:auto;
  padding:15px;
}

.message{
  max-width:75%;
  width:max-content;
  background:#202027;
  border:1px solid #303039;
  padding:10px 12px;
  border-radius:14px;
  margin-bottom:8px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.mine{
  margin-left:auto;
  background:#fff;
  color:#000;
  border-color:#fff;
}

.message small{
  display:block;
  opacity:.5;
  font-size:9px;
  margin-top:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #292930;
}

.chat-input input{
  flex:1;
  min-width:0;
  background:#17171d;
  border:1px solid #303039;
  color:#fff;
  border-radius:11px;
  padding:12px;
  outline:0;
}

.chat-input button{
  border:0;
  background:#fff;
  color:#000;
  border-radius:11px;
  padding:0 16px;
  font-weight:900;
}

/* =========================
   PROFILE
========================= */

.profile-box{
  padding:22px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.big-avatar{
  width:72px;
  height:72px;
  border-radius:20px;
  background:#fff;
  color:#000;
  display:grid;
  place-items:center;
  font-size:26px;
  font-weight:950;
}

.profile-head h2{
  margin:0;
}

.profile-stats{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:9px;
  margin:20px 0;
}

.profile-stat{
  background:#18181e;
  border:1px solid #272730;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.profile-stat strong{
  display:block;
  font-size:21px;
}

.profile-stat span{
  font-size:11px;
  color:#777;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(10px);
  display:grid;
  place-items:center;
  padding:15px;
}

.modal-box{
  width:min(700px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0f0f13;
  border:1px solid #3a3a44;
  border-radius:22px;
  padding:20px;
  box-shadow:
    0 30px 100px rgba(0,0,0,.6);
}

.detail-image{
  width:100%;
  height:310px;
  object-fit:contain;
  border-radius:16px;
  background:#17171d;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.modal .close{
  width:100%;
  margin-top:9px;
}

/* =========================
   ACCOUNT
========================= */

.account-list{
  display:grid;
  gap:8px;
  margin:15px 0;
}

.account-option{
  text-align:left;
  border:1px solid #303039;
  background:#17171d;
  color:#fff;
  border-radius:11px;
  padding:13px;
  font-weight:850;
}

.new-account{
  display:flex;
  gap:8px;
}

.new-account input{
  flex:1;
  min-width:0;
  background:#17171d;
  border:1px solid #303039;
  color:#fff;
  border-radius:11px;
  padding:12px;
}

.new-account button{
  border:0;
  background:#fff;
  color:#000;
  border-radius:11px;
  padding:0 14px;
  font-weight:900;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:2000;
  left:50%;
  bottom:92px;
  transform:
    translate(-50%,10px);
  opacity:0;
  pointer-events:none;
  background:#fff;
  color:#000;
  padding:11px 15px;
  border-radius:12px;
  font-weight:850;
  box-shadow:
    0 15px 50px rgba(0,0,0,.4);
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:
    translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

  .cards{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

  .transactions{
    grid-template-columns:1fr;
  }

}

@media(max-width:720px){

  .brand-text{
    display:none;
  }

  .top-inner{
    min-height:64px;
  }

  .container{
    width:94%;
    padding-top:18px;
  }

  .hero{
    align-items:flex-start;
    flex-direction:column;
  }

  .cards{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .card-image{
    height:150px;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .form-actions{
    grid-template-columns:1fr;
  }

  .chat-layout{
    grid-template-columns:1fr;
    min-height:0;
  }

  .chat-list{
    height:180px;
  }

  .messages{
    min-height:300px;
    max-height:380px;
  }

  .profile-stats{
    grid-template-columns:1fr;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

  .nav button{
    font-size:9px;
    padding:9px 2px;
  }

  .nav{
    gap:4px;
  }

  .profile-btn{
    padding:0 9px;
  }

}

@media(max-width:430px){

  .search input{
    padding-left:38px;
    font-size:12px;
  }

  .card{
    padding:8px;
    border-radius:16px;
  }

  .card-image{
    height:125px;
  }

  .card h3{
    font-size:14px;
  }

  .price{
    font-size:18px;
  }

  .stats{
    font-size:9px;
  }

  .nav button{
    font-size:8px;
  }

}
</style>
</head>

<body>

<header class="top">

  <div class="top-inner">

    <div class="brand">

      <div class="brand-mark">
        ⚡
      </div>

      <span class="brand-text">
        CARDLY
      </span>

    </div>

    <div class="search">

      <input
        id="searchInput"
        placeholder="Spieler, Verein oder Verkäufer suchen …">

    </div>

    <button
      class="profile-btn"
      onclick="openAccountManager()">

      <span
        id="miniAvatar"
        class="mini-avatar">
        ?
      </span>

      <span id="currentUser">
        Kein Account
      </span>

    </button>

  </div>

</header>


<main class="container">


<!-- =========================
     CARDS
========================= -->

<section
  id="cardsPage"
  class="page active">

  <div class="hero">

    <div>

      <h1>
        Football Cards.<br>
        Dein Markt.
      </h1>

      <p>
        Kaufen, verkaufen, chatten —
        alles an einem Ort.
      </p>

    </div>

    <div class="hero-chip">
      ● LIVE MARKTPLATZ
    </div>

  </div>


  <div class="sell-wrap">

    <button
      class="sell-main"
      onclick="toggleSell()">

      ＋ Karte verkaufen

    </button>


    <div
      id="sellPanel"
      class="sell-panel">

      <h2>
        Neue Karte einstellen
      </h2>

      <form
        id="sellForm"
        class="form">

        <input
          id="player"
          class="field"
          required
          placeholder="Spieler *">

        <input
          id="club"
          class="field"
          required
          placeholder="Verein *">

        <input
          id="price"
          class="field"
          required
          type="number"
          min="0.01"
          step=".01"
          placeholder="Preis in € *">

        <select
          id="condition"
          class="field">

          <option value="">
            Zustand auswählen
          </option>

          <option>
            Neu
          </option>

          <option>
            Sehr gut
          </option>

          <option>
            Gut
          </option>

          <option>
            Akzeptabel
          </option>

        </select>

        <textarea
          id="description"
          class="field full"
          placeholder="Beschreibung …"></textarea>

        <label class="photo full">

          📷 Foto auswählen

          <input
            id="image"
            type="file"
            accept="image/*"
            required>

        </label>

        <div class="form-actions full">

          <button
            class="primary"
            type="submit">

            Karte einstellen

          </button>

          <button
            class="secondary"
            type="button"
            onclick="toggleSell()">

            Abbrechen

          </button>

        </div>

      </form>

    </div>

  </div>


  <div class="section-head">

    <h2>
      🔥 Aktuelle Karten
    </h2>

    <span
      id="cardCount"
      class="count">
    </span>

  </div>


  <div
    id="cards"
    class="cards">
  </div>

</section>


<!-- =========================
     FAVORITES
========================= -->

<section
  id="favoritesPage"
  class="page">

<script>

/* =========================================================
   STORAGE
========================================================= */

const ACCOUNT_KEY =
  "cardlyAccounts";

const CURRENT_KEY =
  "cardlyCurrentAccount";

const CARD_KEY =
  "cardlyCards";

const TX_KEY =
  "cardlyTransactions";

const MSG_KEY =
  "cardlyMessages";


let selectedChatUser = "";

let transactionMode =
  "received";


const $ =
  id => document.getElementById(id);


/* =========================================================
   SAFE STORAGE
========================================================= */

function read(key,fallback=[]){

  try{

    return JSON.parse(
      localStorage.getItem(key)
    ) ?? fallback;

  }catch{

    return fallback;

  }

}


function write(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


function getAccounts(){
  return read(
    ACCOUNT_KEY,
    []
  );
}


function saveAccounts(value){
  write(
    ACCOUNT_KEY,
    value
  );
}


function getCards(){
  return read(
    CARD_KEY,
    []
  );
}


function saveCards(value){
  write(
    CARD_KEY,
    value
  );
}


function getTransactions(){
  return read(
    TX_KEY,
    []
  );
}


function saveTransactions(value){
  write(
    TX_KEY,
    value
  );
}


function getMessages(){
  return read(
    MSG_KEY,
    []
  );
}


function saveMessages(value){
  write(
    MSG_KEY,
    value
  );
}


/* =========================================================
   HELPERS
========================================================= */

function id(prefix){

  return (
    prefix +
    "-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,9)
  );

}


function currentId(){

  return (
    localStorage.getItem(
      CURRENT_KEY
    ) || ""
  );

}


function current(){

  return getAccounts().find(
    account =>
      account.id === currentId()
  ) || null;

}


function esc(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function toast(text){

  const box =
    $("toast");

  box.textContent =
    text;

  box.classList.add(
    "show"
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        box.classList.remove(
          "show"
        ),
      2200
    );

}


function accountName(id){

  const account =
    getAccounts().find(
      a => a.id === id
    );

  return account
    ? account.name
    : "Unbekannt";

}


function cardById(id){

  return getCards().find(
    card => card.id === id
  ) || null;

}


function ownerName(card){

  return accountName(
    card.ownerId
  );

}


function ensureAccount(){

  if(current()){
    return true;
  }

  openAccountManager();

  toast(
    "Bitte zuerst einen Account auswählen."
  );

  return false;

}


/* =========================================================
   ACCOUNTS
========================================================= */

function createAccount(name){

  name =
    String(
      name || ""
    ).trim();

  if(!name){

    toast(
      "Bitte einen Namen eingeben."
    );

    return;

  }


  if(name.length > 20){

    toast(
      "Maximal 20 Zeichen."
    );

    return;

  }


  const accounts =
    getAccounts();


  if(
    accounts.some(
      account =>
        account.name.toLowerCase() ===
        name.toLowerCase()
    )
  ){

    toast(
      "Dieser Benutzername existiert bereits."
    );

    return;

  }


  const account = {

    id:id("acc"),

    name:name,

    createdAt:
      new Date().toISOString()

  };


  accounts.push(
    account
  );


  saveAccounts(
    accounts
  );


  localStorage.setItem(
    CURRENT_KEY,
    account.id
  );


  closeModals();

  renderAll();

  toast(
    "Account erstellt."
  );

}


function createAccountFromModal(){

  const input =
    $("newAccountName");

  if(!input){
    return;
  }

  createAccount(
    input.value
  );

}


function renameCurrentAccount(){

  const account =
    current();


  if(!account){

    openAccountManager();

    return;

  }


  const name =
    prompt(
      "Neuer Benutzername:",
      account.name
    );


  if(name === null){
    return;
  }


  const newName =
    name.trim();


  if(!newName){

    toast(
      "Name darf nicht leer sein."
    );

    return;

  }


  const accounts =
    getAccounts();


  if(
    accounts.some(
      other =>
        other.id !== account.id &&
        other.name.toLowerCase() ===
        newName.toLowerCase()
    )
  ){

    toast(
      "Dieser Name wird bereits verwendet."
    );

    return;

  }


  account.name =
    newName;


  saveAccounts(
    accounts
  );


  renderAll();

  toast(
    "Benutzername geändert."
  );

}


function switchAccount(accountId){

  const account =
    getAccounts().find(
      a => a.id === accountId
    );


  if(!account){
    return;
  }


  localStorage.setItem(
    CURRENT_KEY,
    account.id
  );


  selectedChatUser =
    "";


  closeModals();


  showPage(
    "cardsPage",
    "navCards"
  );


  renderAll();

  toast(
    "Account gewechselt."
  );

}


function openAccountManager(){

  const modal =
    document.createElement(
      "div"
    );


  modal.className =
    "modal";


  const accounts =
    getAccounts();


  modal.innerHTML = `

    <div class="modal-box">

      <h2>
        👤 Accounts
      </h2>

      <p class="muted">
        Mehrere Accounts funktionieren
        auf demselben Gerät.
        Wechsle hier zwischen A und B.
      </p>


      <div class="account-list">

        ${
          accounts.map(
            account => `

              <button
                class="account-option"
                onclick="
                  switchAccount(
                    '${esc(account.id)}'
                  )
                ">

                ${
                  account.id === currentId()
                  ? "✅ "
                  : ""
                }

                ${esc(account.name)}

              </button>

            `
          ).join("")
          ||
          `
            <div class="empty">
              Noch kein Account.
            </div>
          `
        }

      </div>


      <div class="new-account">

        <input
          id="newAccountName"
          maxlength="20"
          placeholder="Neuer Benutzername">

        <button
          onclick="
            createAccountFromModal()
          ">

          Erstellen

        </button>

      </div>


      <button
        class="secondary close"
        onclick="
          this.closest('.modal').remove()
        ">

        Schließen

      </button>

    </div>

  `;


  document.body.appendChild(
    modal
  );

}


/* =========================================================
   MODALS
========================================================= */

function closeModals(){

  document
    .querySelectorAll(
      ".modal"
    )
    .forEach(
      modal =>
        modal.remove()
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(
  pageId,
  navId
){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );


  const page =
    $(pageId);


  if(page){

    page.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const nav =
    $(navId);


  if(nav){

    nav.classList.add(
      "active"
    );

  }


  if(
    pageId ===
    "transactionsPage"
  ){

    renderTransactions();

  }


  if(
    pageId ===
    "messagesPage"
  ){

    renderChatList();


    if(
      selectedChatUser
    ){

      renderMessages(
        selectedChatUser
      );

    }

  }


  if(
    pageId ===
    "profilePage"
  ){

    renderProfile();

  }

}


/* =========================================================
   SELL PANEL
========================================================= */

function toggleSell(){

  if(
    !ensureAccount()
  ){

    return;

  }


  const panel =
    $("sellPanel");


  panel.classList.toggle(
    "open"
  );


  if(
    panel.classList.contains(
      "open"
    )
  ){

    setTimeout(
      () =>
        panel.scrollIntoView({
          behavior:"smooth",
          block:"center"
        }),
      30
    );

  }

}


/* =========================================================
   CARD COUNTERS
========================================================= */

function viewCount(card){

  return Array.isArray(
    card.views
  )
    ? card.views.length
    : 0;

}


function favoriteCount(card){

  return Array.isArray(
    card.favorites
  )
    ? card.favorites.length
    : 0;

}


function isFavorite(card){

  const account =
    current();


  if(!account){
    return false;
  }


  return (
    Array.isArray(
      card.favorites
    ) &&
    card.favorites.includes(
      account.id
    )
  );

}


/* =========================================================
   VIEWS
========================================================= */

function addView(cardId){

  const account =
    current();


  if(!account){
    return;
  }


  const cards =
    getCards();


  const card =
    cards.find(
      c => c.id === cardId
    );


  if(!card){
    return;
  }


  if(
    card.ownerId ===
    account.id
  ){

    return;

  }


  if(
    !Array.isArray(
      card.views
    )
  ){

    card.views = [];

  }


  if(
    card.views.includes(
      account.id
    )
  ){

    return;

  }


  card.views.push(
    account.id
  );


  /*
    WICHTIG:
    Hier wird jetzt wirklich
    DASSELBE Cards-Array
    gespeichert.
  */

  saveCards(
    cards
  );

}


/* =========================================================
   FAVORITES
========================================================= */

function toggleFavorite(
  cardId
){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  const cards =
    getCards();


  const card =
    cards.find(
      c => c.id === cardId
    );


  if(!card){
    return;
  }


  if(
    card.ownerId ===
    account.id
  ){

    return;

  }


  if(
    !Array.isArray(
      card.favorites
    )
  ){

    card.favorites = [];

  }


  const index =
    card.favorites.indexOf(
      account.id
    );


  if(index >= 0){

    card.favorites.splice(
      index,
      1
    );

  }else{

    card.favorites.push(
      account.id
    );

  }


  saveCards(
    cards
  );


  renderAll();

}


/* =========================================================
   CARD ELEMENT
========================================================= */

function cardElement(card){

  const account =
    current();


  const own =
    !!account &&
    card.ownerId ===
    account.id;


  const element =
    document.createElement(
      "article"
    );


  element.className =
    "card";


  let actions = "";


  /*
    EIGENE KARTE:
    Kaufen und Favorit
    werden komplett entfernt.
  */

  if(own){

    actions = `

      <button
        class="secondary"
        onclick="
          showCard(
            '${esc(card.id)}'
          )
        ">

        Karte ansehen

      </button>

    `;

  }else{

    actions = `

      <div class="card-actions two">

        <button
          class="primary"
          onclick="
            buyCard(
              '${esc(card.id)}'
            )
          ">

          🛒 Kaufen

        </button>


        <button
          class="secondary"
          onclick="
            toggleFavorite(
              '${esc(card.id)}'
            )
          ">

          ${
            isFavorite(card)
            ? "❤️ Favorisiert"
            : "♡ Favorit"
          }

        </button>

      </div>


      <button
        class="secondary"
        onclick="
          showCard(
            '${esc(card.id)}'
          )
        ">

        Karte ansehen

      </button>

    `;

  }


  element.innerHTML = `

    <div class="card-image">

      <img
        src="${card.image}"
        alt="${esc(card.player)}">

    </div>


    ${
      card.sold
      ? `
        <span class="tag">
          VERKAUFT
        </span>
      `
      : ""
    }


    <h3>
      ${esc(card.player)}
    </h3>


    <div class="muted">
      ${esc(card.club)}
    </div>


    <div class="price">
      ${Number(card.price).toFixed(2)} €
    </div>


    <div class="stats">

      <span>
        👀 ${viewCount(card)}
      </span>

      <span>
        ♡ ${favoriteCount(card)}
      </span>

      <span>
        ${esc(
          card.condition || "—"
        )}
      </span>

    </div>


    <div class="card-actions">

      ${actions}

    </div>

  `;


  return element;

}


/* =========================================================
   RENDER MARKET
========================================================= */

function renderCards(){

  const box =
    $("cards");


  const query =
    $("searchInput")
      .value
      .toLowerCase()
      .trim();


  box.innerHTML = "";


  const cards =
    getCards()
      .filter(
        card =>
          !card.sold
      );


  const filtered =
    cards.filter(
      card => {

        const player =
          String(
            card.player
          )
          .toLowerCase();


        const club =
          String(
            card.club
          )
          .toLowerCase();


        const seller =
          ownerName(card)
            .toLowerCase();


        return (
          !query ||
          player.includes(query) ||
          club.includes(query) ||
          seller.includes(query)
        );

      }
    );


  $("cardCount").textContent =
    filtered.length +
    " Karten";


  if(!filtered.length){

    box.innerHTML = `

      <div class="empty">

        Keine passenden Karten
        gefunden.

      </div>

    `;

    return;

  }


  filtered.forEach(
    card =>
      box.appendChild(
        cardElement(card)
      )
  );

}


/* =========================================================
   CARD DETAIL
========================================================= */

function showCard(cardId){

  if(
    !ensureAccount()
  ){

    return;

  }


  let card =
    cardById(cardId);


  if(!card){
    return;
  }


  /*
    Ansicht wird beim Öffnen
    genau einmal pro Account
    gespeichert.
  */

  addView(
    cardId
  );


  card =
    cardById(cardId);


  const account =
    current();


  const own =
    card.ownerId ===
    account.id;


  const modal =
    document.createElement(
      "div"
    );


  modal.className =
    "modal";


  let actions = "";


  if(!own){

    actions = `

      <button
        class="primary"
        onclick="
          buyCard(
            '${esc(card.id)}'
          )
        ">

        🛒 Kaufen

      </button>


      <button
        class="secondary"
        onclick="
          makeOffer(
            '${esc(card.id)}'
          )
        ">

        💰 Angebot

      </button>


      <button
        class="secondary"
        onclick="
          askQuestion(
            '${esc(card.id)}'
          )
        ">

        ❓ Frage

      </button>


      <button
        class="secondary"
        onclick="
          toggleFavorite(
            '${esc(card.id)}'
          )
        ">

        ${
          isFavorite(card)
          ? "❤️ Favorisiert"
          : "♡ Favorit"
        }

      </button>


      <button
        class="secondary"
        onclick="
          openChatWith(
            '${esc(card.ownerId)}'
          )
        ">

        💬 Chat öffnen

      </button>

    `;

  }


  modal.innerHTML = `

    <div class="modal-box">

      <img
        class="detail-image"
        src="${card.image}"
        alt="${esc(card.player)}">


      <h2>
        ${esc(card.player)}
      </h2>


      <p class="muted">

        ⚽ ${esc(card.club)}
        ·
        ${esc(
          card.condition ||
          "Kein Zustand"
        )}

      </p>


      <div class="price">

        ${Number(card.price).toFixed(2)}
        €

      </div>


      <p class="muted">

        Verkäufer:
        <strong>
          ${esc(
            ownerName(card)
          )}
        </strong>

        <br>

        👀 ${viewCount(card)}
        Ansichten

        ·

        ♡ ${favoriteCount(card)}
        Favoriten

      </p>


      ${
        card.description
        ? `
          <div
            style="
              background:#17171d;
              border-radius:12px;
              padding:13px;
              color:#ccc;
            ">

            ${esc(
              card.description
            )}

          </div>
        `
        : ""
      }


      <div class="detail-grid">

        ${actions}


        <button
          class="secondary"
          onclick="
            openSellerProfile(
              '${esc(card.ownerId)}'
            )
          ">

          👤 Verkäuferprofil

        </button>

      </div>


      <button
        class="secondary close"
        onclick="
          this.closest('.modal').remove()
        ">

        Schließen

      </button>

    </div>

  `;


  document.body.appendChild(
    modal
  );

}


/* =========================================================
   BUY
========================================================= */

function buyCard(cardId){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  const card =
    cardById(cardId);


  if(!card){
    return;
  }


  if(
    card.ownerId ===
    account.id
  ){

    return;

  }


  if(card.sold){

    toast(
      "Diese Karte ist bereits verkauft."
    );

    return;

  }


  const transactions =
    getTransactions();


  const already =
    transactions.some(
      t =>
        t.cardId === card.id &&
        t.buyerId === account.id &&
        t.type === "purchase" &&
        (
          t.status ===
          "pending" ||
          t.status ===
          "accepted"
        )
    );


  if(already){

    toast(
      "Du hast diese Karte bereits angefragt."
    );

    return;

  }


  if(
    !confirm(
      "Karte kaufen/anfragen?\n\n" +
      card.player +
      "\n" +
      Number(card.price).toFixed(2) +
      " €"
    )
  ){

    return;

  }


  transactions.push({

    id:id("tx"),

    type:"purchase",

    cardId:
      card.id,

    buyerId:
      account.id,

    sellerId:
      card.ownerId,

    amount:
      Number(card.price),

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  });


  saveTransactions(
    transactions
  );


  updateBadges();


  closeModals();


  renderAll();


  toast(
    "Kaufanfrage gesendet."
  );

}


/* =========================================================
   OFFERS
========================================================= */

function makeOffer(cardId){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  const card =
    cardById(cardId);


  if(
    !card ||
    card.ownerId ===
    account.id
  ){

    return;

  }


  const already =
    getTransactions().some(
      t =>
        t.cardId === card.id &&
        t.buyerId === account.id &&
        t.type === "offer" &&
        t.status === "pending"
    );


  if(already){

    toast(
      "Du hast bereits ein offenes Angebot."
    );

    return;

  }


  const raw =
    prompt(
      "Dein Angebot in €\n" +
      "Originalpreis: " +
      card.price +
      " €"
    );


  if(raw === null){
    return;
  }


  const amount =
    Number(raw);


  if(
    !Number.isFinite(amount) ||
    amount <= 0
  ){

    toast(
      "Ungültiger Betrag."
    );

    return;

  }


  const transactions =
    getTransactions();


  transactions.push({

    id:id("offer"),

    type:"offer",

    cardId:
      card.id,

    buyerId:
      account.id,

    sellerId:
      card.ownerId,

    amount:
      amount,

    status:
      "pending",

    createdAt:
      new Date().toISOString()

  });


  saveTransactions(
    transactions
  );


  sendChatMessageByIds(

    card.ownerId,

    "💰 Angebot für „" +
    card.player +
    "“: " +
    amount.toFixed(2) +
    " €"

  );


  closeModals();


  renderAll();


  toast(
    "Angebot gesendet."
  );

}

/* =========================================================
   CHAT
========================================================= */

function chatKey(
  a,
  b
){

  return [
    a,
    b
  ]
  .sort()
  .join("|||");

}


function sendChatMessageByIds(
  receiverId,
  text
){

  const account =
    current();


  if(
    !account ||
    !receiverId ||
    receiverId ===
    account.id
  ){

    return;

  }


  if(
    !String(text).trim()
  ){

    return;

  }


  const messages =
    getMessages();


  messages.push({

    id:id("msg"),

    chat:
      chatKey(
        account.id,
        receiverId
      ),

    senderId:
      account.id,

    receiverId:
      receiverId,

    text:
      String(text).trim(),

    read:false,

    createdAt:
      new Date().toISOString()

  });


  saveMessages(
    messages
  );


  updateBadges();


  renderChatList();


  if(
    selectedChatUser ===
    receiverId
  ){

    renderMessages(
      receiverId
    );

  }

}


function openChatWith(
  otherId
){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  if(
    !otherId ||
    otherId ===
    account.id
  ){

    return;

  }


  /*
    Wichtig:
    Wenn der Chat aus einem
    Karten-Modal geöffnet wird,
    wird das Modal jetzt geschlossen.
    Dadurch ist der Chat wirklich sichtbar.
  */

  closeModals();


  selectedChatUser =
    otherId;


  showPage(
    "messagesPage",
    "navMessages"
  );


  renderChatList();


  renderMessages(
    otherId
  );


  markRead(
    otherId
  );

}


function markRead(
  otherId
){

  const account =
    current();


  if(!account){
    return;
  }


  const messages =
    getMessages();


  let changed =
    false;


  messages.forEach(
    message => {

      if(
        message.senderId ===
        otherId &&
        message.receiverId ===
        account.id &&
        !message.read
      ){

        message.read =
          true;

        changed =
          true;

      }

    }
  );


  if(changed){

    saveMessages(
      messages
    );

  }


  updateBadges();

}


function chatUsers(){

  const account =
    current();


  if(!account){
    return [];
  }


  const users =
    new Set();


  getMessages().forEach(
    message => {

      if(
        message.senderId ===
        account.id
      ){

        users.add(
          message.receiverId
        );

      }


      if(
        message.receiverId ===
        account.id
      ){

        users.add(
          message.senderId
        );

      }

    }
  );


  return [
    ...users
  ].filter(
    id =>
      getAccounts()
        .some(
          account =>
            account.id === id
        )
  );

}


function renderChatList(){

function renderMessages(
  otherId
){

  const account =
    current();


  if(!account){
    return;
  }


  const box =
    $("messages");


  const input =
    $("messageInput");


  const send =
    $("sendMessage");


  $("chatHeader")
    .textContent =
      "💬 Chat mit " +
      accountName(
        otherId
      );


  const messages =
    getMessages()
      .filter(
        message =>
          message.chat ===
          chatKey(
            account.id,
            otherId
          )
      )
      .sort(
        (a,b) =>
          new Date(
            a.createdAt
          ) -
          new Date(
            b.createdAt
          )
      );


  box.innerHTML =
    "";


  if(!messages.length){

    box.innerHTML = `

      <div class="empty">

        Noch keine Nachrichten.

        <br>

        Schreib etwas.

      </div>

    `;

  }


  messages.forEach(
    message => {

      const element =
        document.createElement(
          "div"
        );


      element.className =
        "message" +
        (
          message.senderId ===
          account.id
          ? " mine"
          : ""
        );


      element.innerHTML = `

        ${esc(
          message.text
        )}

        <small>
          ${formatTime(
            message.createdAt
          )}
        </small>

      `;


      box.appendChild(
        element
      );

    }
  );


  input.disabled =
    false;

  send.disabled =
    false;


  box.scrollTop =
    box.scrollHeight;


  markRead(
    otherId
  );

}


function sendMessage(){

  if(
    !selectedChatUser
  ){

    return;

  }


  const input =
    $("messageInput");


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  sendChatMessageByIds(

    selectedChatUser,

    text

  );


  input.value =
    "";


  renderMessages(
    selectedChatUser
  );

}

function showTransactions(

){

  $("receivedTab")

      mode ===
      "received"
    );


  $("sentTab")

function renderTransactions(){

  const box =
    $("transactions");


  box.innerHTML =
    "";


  const account =
    current();


  if(!account){

    box.innerHTML = `

      <div class="empty">

        Account auswählen.

      </div>

    `;

    return;

  }


  const list =
    getTransactions()
      .filter(
        transaction => {

          if(
            transactionMode ===
            "received"
          ){

            return (
              transaction.sellerId ===
              account.id
            );

          }


          return (
            transaction.buyerId ===
            account.id
          );

        }
      )
      .slice()
      .reverse();


  if(!list.length){

    box.innerHTML = `

      <div class="empty">

          ? "Noch keine erhaltenen Angebote."

    return;

  list.forEach(

  );

function transactionElement(

){

  const card =
    cardById(
      transaction.cardId

    document.createElement(

  if(
    transaction.status ===

  ){

    statusText =

  }


  if(
    transaction.status ===
    "rejected"
  ){

    statusClass =
      "rejected";

    statusText =
      "❌ Abgelehnt";

  }


  const other =
    received
    ? transaction.buyerId
    : transaction.sellerId;

        src="${card.image}"
        alt="">

        </strong>

        : "An: "
      }

      )}

          )

}


/* =========================================================
   ACCEPT
========================================================= */

function acceptTransaction(
  transactionId
){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  const transactions =
    getTransactions();


  const transaction =
    transactions.find(
      t =>
        t.id ===
        transactionId
    );


  if(!transaction){
    return;
  }


  if(
    transaction.sellerId !==
    account.id
  ){

    return;

  }


  if(
    transaction.status !==
    "pending"
  ){

    return;

  }


  const card =
    cardById(
      transaction.cardId
    );


  if(
    !card ||
    card.sold
  ){

    toast(
      "Diese Karte ist nicht mehr verfügbar."
    );

    return;

  }


  if(
    !confirm(
      "Transaktion annehmen?"
    )
  ){

    return;

  }


  transaction.status =
    "accepted";


  const cards =
    getCards();


  const storedCard =
    cards.find(
      c =>
        c.id ===
        card.id
    );


  if(storedCard){

    storedCard.sold =
      true;

    storedCard.soldTo =
      transaction.buyerId;

  }


  transactions.forEach(
    other => {

      if(
        other.cardId ===
        transaction.cardId &&
        other.id !==
        transaction.id &&
        other.status ===
        "pending"
      ){

        other.status =
          "rejected";

      }

    }
  );


  saveCards(
    cards
  );


  saveTransactions(
    transactions
  );


  sendChatMessageByIds(

    transaction.buyerId,

    "✅ Dein Angebot für „" +
    card.player +
    "“ wurde angenommen."

  );


  renderAll();


  toast(
    "Transaktion angenommen."
  );

}


/* =========================================================
   REJECT
========================================================= */

function rejectTransaction(
  transactionId
){

  if(
    !ensureAccount()
  ){

    return;

  }


  const account =
    current();


  const transactions =
    getTransactions();


  const transaction =
    transactions.find(
      t =>
        t.id ===
        transactionId
    );


  if(!transaction){
    return;
  }


  if(
    transaction.sellerId !==
    account.id
  ){

    return;

  }


  if(
    transaction.status !==
    "pending"
  ){

    return;

  }


  transaction.status =
    "rejected";


  saveTransactions(
    transactions
  );


  const card =
    cardById(
      transaction.cardId
    );


  sendChatMessageByIds(

    transaction.buyerId,

    "❌ Dein Angebot für „" +
    (
      card?.player ||
      "die Karte"
    ) +
    "“ wurde abgelehnt."

  );


  renderAll();


  toast(
    "Transaktion abgelehnt."
  );

}

){

  if(
    !ensureAccount()

  const account =
    current();


  const cards =
    getCards();


  const card =
    cards.find(
      c =>

  const unread =

      message =>
        message.receiverId ===
        account.id &&
        !message.read
    ).length;


  const pending =
    getTransactions().filter(
      transaction =>
        transaction.sellerId ===
        account.id &&
        transaction.status ===
        "pending"
    ).length;


  const favorites =
    getCards().filter(
      card =>
        Array.isArray(
          card.favorites
        ) &&
        card.favorites.includes(
          account.id
        )
    ).length;


  setBadge(
    "messageBadge",
    unread
  );


  setBadge(
    "transactionBadge",
    pending
  );


  setBadge(
    "favoriteBadge",
    favorites
  );

}

        Number(
          $("price")
            .value
        );


      if(
        !file ||
        !player ||
        !club ||
        !Number.isFinite(price) ||
        price <= 0
      ){

        toast(
          "Bitte alle Pflichtfelder korrekt ausfüllen."
        );

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        () => {

          const image =
            new Image();


          image.onload =
            () => {

              const max =
                900;


              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    image.width,
                    image.height
                  )
                );


              const width =
                Math.max(
                  1,
                  Math.round(
                    image.width *
                    scale
                  )
                );


              const height =
                Math.max(
                  1,
                  Math.round(
                    image.height *
                    scale
                  )
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              const imageData =
                canvas.toDataURL(
                  "image/jpeg",
                  .68
                );


              const cards =
                getCards();


              cards.unshift({

                id:id("card"),

                player:
                  player,

                club:
                  club,

                price:
                  price,

                condition:
                  $("condition")
                    .value,

                description:
                  $("description")
                    .value
                    .trim(),

                image:
                  imageData,

                ownerId:
                  account.id,

                sold:
                  false,

                soldTo:
                  null,

                views:
                  [],

                favorites:
                  [],

                createdAt:
                  new Date()
                    .toISOString()

              });


              try{

                saveCards(
                  cards
                );

              }catch{

                toast(
                  "Speicher voll — bitte alte Karten löschen."
                );

                return;

              }


              $("sellForm")
                .reset();


              $("sellPanel")
                .classList.remove(
                  "open"
                );


              renderAll();


              toast(
                "🎉 Karte erfolgreich eingestellt."
              );

            };


          image.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );


/* =========================================================
   SEARCH
========================================================= */

$("searchInput")
  .addEventListener(
    "input",
    renderCards
  );


/* =========================================================
   ENTER IN CHAT
========================================================= */

$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  const account =
    current();


  $("currentUser")
    .textContent =
      account
      ? account.name
      : "Kein Account";


  $("miniAvatar")
    .textContent =
      account
      ? account.name
          .charAt(0)
          .toUpperCase()
      : "?";


  renderCards();

  renderFavorites();

  renderMine();

  renderTransactions();

  renderChatList();

  renderProfile();

  updateBadges();


  if(
    selectedChatUser &&
    account
  ){

    renderMessages(
      selectedChatUser
    );

  }

}


/* =========================================================
   TIME
========================================================= */

function formatTime(
  value
){

  try{

    return new Date(
      value
    ).toLocaleString(
      "de-DE",
      {
        day:"2-digit",
        month:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch{

    return "";

  }

}


/* =========================================================
   START
========================================================= */

function start(){

  const accounts =
    getAccounts();


  if(
    !accounts.length
  ){

    const account = {

      id:id("acc"),

      name:
        "DemoUser",

      createdAt:
        new Date()
          .toISOString()

    };


    saveAccounts(
      [account]
    );


    localStorage.setItem(
      CURRENT_KEY,
      account.id
    );

  }else{

    if(
      !current()
    ){

      localStorage.setItem(
        CURRENT_KEY,
        accounts[0].id
      );

    }

  }


  renderAll();

}


start();

</script>
