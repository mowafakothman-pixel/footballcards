<!DOCTYPE html> 
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  color: #ccc;
}

.search {
  padding: 20px;
  background: white;
  text-align: center;
}

.search input {
  width: 90%;
  max-width: 600px;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.sell {
  background: #111;
  color: white;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 20px;
}

.sell h2 {
  margin-top: 0;
}

.sell button,
.card button {
  border: none;
  background: white;
  color: #111;
  padding: 11px 18px;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card-image {
  width: 100%;
  height: 180px;
  border-radius: 12px;
  background: linear-gradient(135deg, #222, #777);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: white;
  font-size: 45px;
}

.card-image img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 180px;
  object-fit: contain;
  border-radius: 12px;
}
.card-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 12px;
}
.card h3 {
  margin-bottom: 6px;
}

.price {
  font-size: 21px;
  font-weight: bold;
}

.info {
  color: #666;
}

.card button {
  background: #111;
  color: white;
  width: 100%;
  margin-top: 8px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <h1>⚽ Pixel Cards</h1>
  <p>Der Marktplatz für Fußballkarten</p>
</header>

<div class="search">
  <input type="text" placeholder="🔎 Suche nach Spieler, Verein oder Karte...">
</div>
<div class="container">

  <div class="sell">
    <h2>Du willst eine Karte verkaufen?</h2>
    <p>Stelle deine Fußballkarte schnell und einfach ein.</p>

    <form id="sellForm">
      <input id="player" type="text" placeholder="Spieler" required>
      <input id="club" type="text" placeholder="Verein" required>
      <input id="price" type="number" placeholder="Preis in €" min="0" step="0.01" required>
      <input id="image" type="file" accept="image/*" required>
      <button type="submit">Karte einstellen</button>
    </form>
  </div>

  <h2>🔥 Aktuelle Karten</h2>

  <div class="cards"></div>

  <h2>🃏 Meine Karten</h2>

  <div class="my-cards"></div>

</div>

<footer>
  © 2026 Pixel Cards
</footer>
<script>
const sellForm = document.getElementById("sellForm");
const cards = document.querySelector(".cards");
const myCards = document.querySelector(".my-cards");

function createCard(player, club, price, imageData) {
  const newCard = document.createElement("div");
  newCard.className = "card";

  newCard.innerHTML = `
    <div class="card-image">
      <img src="${imageData}" alt="${player}">
    </div>
    <h3>${player}</h3>
    <p class="info">${club}</p>
    <p class="price">${price} €</p>
    <button onclick="alert('Diese Karte wurde ausgewählt!')">
      Kaufen
    </button>
  `;

  cards.appendChild(newCard);
}

function loadCards() {
  const savedCards =
    JSON.parse(localStorage.getItem("footballCards")) || [];

  cards.innerHTML = "";

  savedCards.forEach(card => {
    createCard(
      card.player,
      card.club,
      card.price,
      card.image
    );
  });
}

function loadMyCards() {
  const savedCards =
    JSON.parse(localStorage.getItem("footballCards")) || [];

  myCards.innerHTML = "";

  if (savedCards.length === 0) {
    myCards.innerHTML =
      "<p>Noch keine eigenen Karten eingestellt.</p>";
    return;
  }

  savedCards.forEach((card, index) => {
    const item = document.createElement("div");

    item.style.background = "white";
    item.style.padding = "12px";
    item.style.marginBottom = "10px";
    item.style.borderRadius = "10px";
    item.style.display = "flex";
    item.style.alignItems = "center";
    item.style.gap = "12px";

    item.innerHTML = `
      <img
        src="${card.image}"
        alt="${card.player}"
        style="width:70px;height:70px;object-fit:contain;border-radius:8px;"
      >

      <div style="flex:1;">
        <strong>${card.player}</strong><br>
        ${card.club} · ${card.price} €
      </div>

      <button onclick="deleteCard(${index})">
        🗑️ Löschen
      </button>
    `;

    myCards.appendChild(item);
  });
}

sellForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const player = document.getElementById("player").value;
  const club = document.getElementById("club").value;
  const price = document.getElementById("price").value;
  const image = document.getElementById("image").files[0];

  if (!image) {
    alert("Bitte wähle ein Foto aus!");
    return;
  }

  const reader = new FileReader();

  reader.onload = function() {
    const savedCards =
      JSON.parse(localStorage.getItem("footballCards")) || [];

    savedCards.unshift({
      player: player,
      club: club,
      price: price,
      image: reader.result
    });

    localStorage.setItem(
      "footballCards",
      JSON.stringify(savedCards)
    );

    sellForm.reset();

    loadCards();
    loadMyCards();

    alert("Deine Karte wurde eingestellt und gespeichert!");
  };

  reader.readAsDataURL(image);
});

function deleteCard(index) {
  const savedCards =
    JSON.parse(localStorage.getItem("footballCards")) || [];

  savedCards.splice(index, 1);

  localStorage.setItem(
    "footballCards",
    JSON.stringify(savedCards)
  );

  loadCards();
  loadMyCards();
}

loadCards();
loadMyCards();
</script>
</body>
</html>
