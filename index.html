<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Cards</title>

<style>
:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --line:#292929;
  --accent:#18d4c5;
  --text:#fff;
  --muted:#8d8d8d;
  --green:#39d98a;
  --red:#ff5555;
  --yellow:#ffd34d;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:var(--bg);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  font-size:14px;
  padding-bottom:82px;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================
   TOP SEARCH
========================= */

.header{
  position:sticky;
  top:0;
  z-index:30;
  background:#080808ed;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  padding:10px;
}

.searchTop{
  max-width:900px;
  margin:auto;
  position:relative;
}

.searchTop input{
  width:100%;
  height:48px;
  background:#151515;
  border:1px solid #303030;
  border-radius:15px;
  color:white;
  padding:0 17px 0 45px;
  outline:none;
  transition:.2s;
}

.searchTop input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px #18d4c51a;
}

.searchIcon{
  position:absolute;
  left:16px;
  top:14px;
  color:#888;
  pointer-events:none;
}

/* =========================
   MAIN
========================= */

.wrap{
  width:100%;
  max-width:1450px;
  margin:auto;
  padding:12px 12px 25px;
}

.page{
  display:none;
  animation:pageIn .25s ease;
}

.page.onpage{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   MARKET GRID
========================= */

.marketTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 2px 12px;
}

.marketTitle h1{
  font-size:23px;
}

.marketTitle span{
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

/* =========================
   OFFER CARD
========================= */

.card{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
  animation:cardIn .3s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(10px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.card:hover{
  transform:translateY(-3px);
  border-color:#3c3c3c;
}

.card:active{
  transform:scale(.985);
}

/* STARTSEITE: nur Bild + Herz */

.cardImage{
  position:relative;
  width:100%;
  aspect-ratio:4/5;
  background:#191919;
  overflow:hidden;
  cursor:pointer;
}

.cardImage img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .35s ease;
}

.card:hover .cardImage img{
  transform:scale(1.025);
}

/* kleine Badges oben links */

.badges{
  position:absolute;
  top:8px;
  left:8px;
  display:flex;
  gap:5px;
  z-index:3;
}

.tag{
  background:#000c;
  border:1px solid #ffffff22;
  padding:5px 7px;
  border-radius:7px;
  font-size:9px;
  font-weight:900;
  backdrop-filter:blur(5px);
}

.tag.new{
  background:var(--accent);
  color:#000;
  border-color:var(--accent);
}

/* Herz unten rechts */

.favoriteBtn{
  position:absolute;
  right:8px;
  bottom:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid #ffffff33;
  background:#050505d9;
  color:white;
  display:grid;
  place-items:center;
  font-size:17px;
  transition:
    transform .18s ease,
    color .18s ease,
    background .18s ease;
  z-index:5;
}

.favoriteBtn:hover{
  transform:scale(1.1);
}

.favoriteBtn:active{
  transform:scale(.88);
}

.favoriteBtn.active{
  color:var(--accent);
  background:#101f1e;
}

/* Auf Startseite versteckt */

.cardInfo{
  display:none;
}

/* =========================
   DETAIL
========================= */

.detail{
  max-width:900px;
  margin:auto;
}

.detailBack{
  margin-bottom:10px;
}

.detailImageBox{
  background:#101010;
  border:1px solid var(--line);
  border-radius:18px;
  padding:10px;
  overflow:hidden;
}

.detailImage{
  width:100%;
  max-height:68vh;
  object-fit:contain;
  display:block;
  margin:auto;
  border-radius:12px;
  transition:transform .25s ease;
  cursor:zoom-in;
}

.zoomControls{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:10px;
}

.zoomControls button{
  min-width:45px;
}

.detailInfo{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-top:12px;
}

.detailInfo h1{
  font-size:27px;
  margin-bottom:6px;
}

.detailClub{
  color:var(--muted);
  margin-bottom:15px;
}

.detailPrice{
  color:var(--accent);
  font-size:27px;
  font-weight:900;
  margin-bottom:15px;
}

.detailDescription{
  background:#0b0b0b;
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  margin:15px 0;
}

.detailSeller{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-top:1px solid var(--line);
}

.detailActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:1px solid var(--line);
  background:#151515;
  color:#fff;
  border-radius:11px;
  padding:11px 14px;
  transition:.18s;
}

.btn:hover{
  border-color:var(--accent);
  transform:translateY(-1px);
}

.btn:active{
  transform:scale(.97);
}

.primary{
  background:var(--accent);
  color:#000;
  border-color:var(--accent);
  font-weight:900;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  z-index:40;
  background:#0b0b0bf5;
  border-top:1px solid var(--line);
  backdrop-filter:blur(18px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:6px 8px env(safe-area-inset-bottom);
}

.bottomNav button{
  border:0;
  background:transparent;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  border-radius:12px;
  transition:.18s;
}

.bottomNav button .navIcon{
  font-size:20px;
}

.bottomNav button span:last-child{
  font-size:10px;
  font-weight:700;
}

.bottomNav button.active{
  color:var(--accent);
  background:#18d4c50d;
}

.bottomNav button:active{
  transform:scale(.9);
}

/* verkaufen in der Mitte */

.sellNav{
  color:white!important;
}

.sellCircle{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--accent);
  color:#000;
  display:grid;
  place-items:center;
  font-size:21px;
  font-weight:900;
  margin-top:-17px;
  border:4px solid #0b0b0b;
}

/* =========================
   PROFILE
========================= */

.profileTop{
  background:
    radial-gradient(circle at 90% 0%,#18d4c51d,transparent 40%),
    var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-bottom:12px;
}

.profileHeader{
  display:flex;
  align-items:center;
  gap:15px;
}

.bigAvatar{
  width:72px;
  height:72px;
  border-radius:50%;
  background:var(--accent);
  color:#000;
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:900;
  flex-shrink:0;
}

.profileName{
  font-size:25px;
  font-weight:900;
}

.profileBio{
  color:var(--muted);
  margin-top:4px;
}

.profileRating{
  margin-top:7px;
  color:var(--accent);
}

.profileStats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-top:17px;
}

.stat{
  background:#0b0b0b;
  border:1px solid var(--line);
  padding:12px;
  border-radius:11px;
  text-align:center;
}

.stat small{
  display:block;
  color:var(--muted);
}

.stat strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

/* Vinted-artige Bereiche untereinander */

.profileMenu{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
}

.profileMenuTitle{
  padding:17px;
  font-size:18px;
  font-weight:900;
  border-bottom:1px solid var(--line);
}

.menuRow{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:15px 16px;
  background:transparent;
  color:white;
  border:0;
  border-bottom:1px solid #222;
  text-align:left;
  transition:.18s;
}

.menuRow:last-child{
  border-bottom:0;
}

.menuRow:hover{
  background:#181818;
  padding-left:20px;
}

.menuIcon{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#191919;
  display:grid;
  place-items:center;
  font-size:17px;
  flex-shrink:0;
}

.menuText{
  flex:1;
}

.menuText b{
  display:block;
  font-size:14px;
}

.menuText small{
  color:var(--muted);
  display:block;
  margin-top:2px;
}

.arrow{
  color:#666;
  font-size:18px;
}

/* =========================
   PANELS / FORMS
========================= */

.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
  margin-bottom:12px;
}

.panel h2{
  margin-bottom:5px;
}

.panel p{
  color:var(--muted);
  line-height:1.5;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.full{
  grid-column:1/-1;
}

.form input,
.form textarea,
.form select,
.filterBox input,
.filterBox select{
  background:#090909;
  color:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  outline:none;
}

.form input:focus,
.form textarea:focus,
.form select:focus{
  border-color:var(--accent);
}

.upload{
  min-height:240px;
  border:1px dashed #444;
  border-radius:13px;
  display:grid;
  place-items:center;
  text-align:center;
  overflow:hidden;
  cursor:pointer;
  margin-top:10px;
}

.upload img{
  max-width:100%;
  max-height:300px;
  object-fit:contain;
}

/* =========================
   SEARCH / FILTER
========================= */

.filterPanel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
}

.filterGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.filterBox{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.filterBox input,
.filterBox select{
  width:100%;
}

/* =========================
   LISTS
========================= */

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#0b0b0b;
  border:1px solid var(--line);
  padding:11px;
  border-radius:12px;
  transition:.18s;
}

.item:hover{
  border-color:#3a3a3a;
  transform:translateX(2px);
}

.itemLeft{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.thumb{
  width:45px;
  height:56px;
  object-fit:cover;
  border-radius:7px;
  background:#222;
  flex-shrink:0;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--accent);
  color:#000;
  display:grid;
  place-items:center;
  font-weight:900;
  flex-shrink:0;
}

.muted{
  color:var(--muted);
}

.empty{
  text-align:center;
  color:#777;
  border:1px dashed #333;
  padding:35px 15px;
  border-radius:13px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000d;
  backdrop-filter:blur(9px);
  padding:12px;
}

.modal.show{
  display:flex;
  animation:modalBg .2s ease;
}

@keyframes modalBg{
  from{opacity:0}
  to{opacity:1}
}

.modalBox{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#111;
  border:1px solid #333;
  border-radius:18px;
  padding:17px;
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{
    transform:translateY(20px) scale(.97);
    opacity:0;
  }
  to{
    transform:translateY(0) scale(1);
    opacity:1;
  }
}

.modalHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.close{
  background:#191919;
  color:white;
  border:1px solid #333;
  border-radius:9px;
  padding:8px 11px;
}

/* =========================
   TOAST
========================= */

.toastBox{
  position:fixed;
  left:12px;
  right:12px;
  bottom:88px;
  z-index:150;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  pointer-events:none;
}

.toast{
  background:#171717;
  border:1px solid #333;
  border-left:4px solid var(--accent);
  padding:11px 14px;
  border-radius:10px;
  min-width:230px;
  max-width:90%;
  animation:toastIn .22s ease;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   STATUS
========================= */

.status{
  font-size:10px;
  font-weight:900;
  padding:5px 7px;
  border-radius:7px;
}

.pending{
  background:#332b15;
  color:var(--yellow);
}

.accepted{
  background:#123625;
  color:var(--green);
}

.declined{
  background:#381919;
  color:var(--red);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:1101px){
  .wrap{
    padding-left:20px;
    padding-right:20px;
  }
}

/* iPad */

@media(min-width:701px) and (max-width:1100px){
  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:10px;
  }

  .filterGrid{
    grid-template-columns:repeat(3,1fr);
  }

  .wrap{
    padding-left:14px;
    padding-right:14px;
  }
}

/* Handy */

@media(max-width:700px){

  body{
    padding-bottom:80px;
  }

  .wrap{
    padding:9px 8px 20px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
  }

  .card{
    border-radius:11px;
  }

  .cardImage{
    aspect-ratio:4/5;
  }

  .favoriteBtn{
    width:32px;
    height:32px;
    right:6px;
    bottom:6px;
    font-size:16px;
  }

  .badges{
    top:6px;
    left:6px;
  }

  .tag{
    padding:4px 6px;
    font-size:8px;
  }

  .marketTitle{
    margin:3px 2px 9px;
  }

  .marketTitle h1{
    font-size:19px;
  }

  .profileStats{
    grid-template-columns:repeat(2,1fr);
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .filterGrid{
    grid-template-columns:1fr 1fr;
  }

  .detailActions{
    grid-template-columns:1fr;
  }

  .detailInfo{
    padding:14px;
  }

  .detailInfo h1{
    font-size:23px;
  }

  .bottomNav{
    height:74px;
  }
}

/* Sehr kleine Handys */

@media(max-width:390px){

  .grid{
    gap:5px;
  }

  .wrap{
    padding-left:5px;
    padding-right:5px;
  }

  .searchTop input{
    height:45px;
  }

  .bottomNav button span:last-child{
    font-size:9px;
  }
}
</style>
</head>

<body>

<!-- =========================
     SEARCH HEADER
========================= -->

<header class="header">
  <div class="searchTop">
    <span class="searchIcon">⌕</span>
    <input
      id="globalSearch"
      type="search"
      placeholder="Spieler, Verein oder Verkäufer suchen..."
      oninput="globalSearch()"
    >
  </div>
</header>

<main class="wrap">

<!-- =========================
     STARTSEITE
========================= -->

<section id="home" class="page onpage">

  <div class="marketTitle">
    <h1>Angebote</h1>
    <span id="offerCount"></span>
  </div>

  <div id="homeCards" class="grid"></div>

</section>

<!-- =========================
     SUCHEN
========================= -->

<section id="searchPage" class="page">

  <div class="marketTitle">
    <h1>Suchen</h1>
  </div>

  <div class="filterPanel">

    <div class="filterGrid">

      <div class="filterBox">
        <label>Verein</label>
        <select id="clubFilter" onchange="renderSearch()">
          <option value="">Alle Vereine</option>
        </select>
      </div>

      <div class="filterBox">
        <label>Preis ab</label>
        <input id="minPrice" type="number" placeholder="€" oninput="renderSearch()">
      </div>

      <div class="filterBox">
        <label>Preis bis</label>
        <input id="maxPrice" type="number" placeholder="€" oninput="renderSearch()">
      </div>

      <div class="filterBox">
        <label>Zustand</label>
        <select id="conditionFilter" onchange="renderSearch()">
          <option value="">Alle</option>
          <option>Neu</option>
          <option>Sehr gut</option>
          <option>Gut</option>
          <option>Schlecht</option>
        </select>
      </div>

      <div class="filterBox">
        <label>Sortieren</label>
        <select id="sortFilter" onchange="renderSearch()">
          <option value="new">Neueste</option>
          <option value="low">Preis niedrig</option>
          <option value="high">Preis hoch</option>
          <option value="views">Beliebt</option>
        </select>
      </div>

    </div>

    <button class="btn" style="margin-top:9px" onclick="resetFilters()">
      Filter zurücksetzen
    </button>

  </div>

  <div id="searchCards" class="grid"></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section id="favorites" class="page">

  <div class="marketTitle">
    <h1>Favoriten</h1>
  </div>

  <div id="favoriteCards" class="grid"></div>

</section>

<!-- =========================
     VERKAUFEN
========================= -->

<section id="sell" class="page">

  <div class="marketTitle">
    <h1>Karte verkaufen</h1>
  </div>

  <div class="panel">

    <div class="formgrid">

      <div class="form">
        <label>Spieler *</label>
        <input id="playerInput" placeholder="Lamine Yamal">
      </div>

      <div class="form">
        <label>Verein *</label>
        <input id="clubInput" placeholder="FC Barcelona">
      </div>

      <div class="form">
        <label>Preis *</label>
        <input id="priceInput" type="number" min=".01" step=".01" placeholder="25">
      </div>

      <div class="form">
        <label>Zustand</label>
        <select id="conditionInput">
          <option>Neu</option>
          <option>Sehr gut</option>
          <option>Gut</option>
          <option>Schlecht</option>
        </select>
      </div>

      <div class="form full">
        <label>Beschreibung</label>
        <textarea id="descriptionInput" rows="5" placeholder="Beschreibe deine Karte..."></textarea>
      </div>

      <div class="form full">
        <button class="btn primary" onclick="createCard()">
          Karte einstellen
        </button>
      </div>

    </div>

  </div>

  <div class="panel">

    <h2>Kartenbild *</h2>

    <p style="margin-top:5px">
      Das Bild wird später direkt auf der Startseite angezeigt.
    </p>

    <label class="upload" for="imageInput">

<div id="toastBox" class="toastBox"></div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const KEY = {

  cards:'pc_cards',
  user:'pc_user',
  profile:'pc_profile',
  fav:'pc_fav',
  req:'pc_req',
  msg:'pc_msg',
  not:'pc_not',
  rating:'pc_rating',
  views:'pc_views',
  accounts:'pc_accounts',
  wallet:'pc_wallet'

};

function getData(key, fallback){

  try{

    const value = localStorage.getItem(key);

    return value === null
      ? fallback
      : JSON.parse(value);

  }catch{

    return fallback;

  }

}

function saveData(key,value){

  localStorage.setItem(
    key,
    JSON.stringify(value)
  );

}


/* =========================================================
   DATA
========================================================= */

let user =
  localStorage.getItem(KEY.user)
  || 'Pixel User';

let profile =
  getData(
    KEY.profile,
    {
      username:user,
      bio:'Fußballkarten-Sammler'
    }
  );

user = profile.username || user;

let cards =
  getData(KEY.cards,[]);

let favorites =
  getData(KEY.fav,[]);

let requests =
  getData(KEY.req,[]);

let messages =
  getData(KEY.msg,[]);

let notificationsData =
  getData(KEY.not,[]);

let ratings =
  getData(KEY.rating,[]);

let views =
  getData(KEY.views,{});

let accounts =
  getData(KEY.accounts,[]);

let wallets =
  getData(KEY.wallet,{});


/* =========================================================
   ACCOUNT INITIALIZATION
========================================================= */

if(!accounts.length){

  accounts=[
    {
      username:user,
      bio:profile.bio || 'Fußballkarten-Sammler'
    }
  ];

  saveData(KEY.accounts,accounts);

}

if(wallets[user] == null){

  wallets[user]=0;

  saveData(KEY.wallet,wallets);

}


/* =========================================================
   DEMO CARDS
========================================================= */

if(!cards.length){

  cards=[

    {
      id:'demo1',
      player:'Désiré Doué',
      club:'PSG',
      price:25,
      condition:'Sehr gut',
      seller:'Max',
      description:'Schöne Fußballkarte von Désiré Doué.',
      image:'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85',
      createdAt:Date.now()-30000,
      views:28,
      sold:false
    },

    {
      id:'demo2',
      player:'Lamine Yamal',
      club:'FC Barcelona',
      price:35,
      condition:'Neu',
      seller:'LeoCards',
      description:'Neue Karte in sehr gutem Zustand.',
      image:'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85',
      createdAt:Date.now()-50000,
      views:53,
      sold:false
    },

    {
      id:'demo3',
      player:'Kylian Mbappé',
      club:'Real Madrid',
      price:30,
      condition:'Gut',
      seller:'FootballKing',
      description:'Gepflegte Karte.',
      image:'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1000&q=85',
      createdAt:Date.now()-70000,
      views:42,
      sold:false
    }

  ];

  saveData(KEY.cards,cards);

}


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? '')
    .replace(/[&<>"']/g,function(m){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'

      }[m];

    });

}


function toast(text){

  const box =
    document.getElementById('toastBox');

  const item =
    document.createElement('div');

  item.className='toast';

  item.textContent=text;

  box.appendChild(item);

  setTimeout(function(){

    item.remove();

  },2300);

}


/* =========================================================
   NAVIGATION
========================================================= */

function go(page,button){

  document
    .querySelectorAll('.page')
    .forEach(function(p){

      p.classList.remove('onpage');

    });

  const target =
    document.getElementById(page);

  if(target){

    target.classList.add('onpage');

  }

  document
    .querySelectorAll('.bottomNav button')
    .forEach(function(b){

      b.classList.remove('active');

    });

  if(button){

    button.classList.add('active');

  }else{

    if(page==='home')
      document.getElementById('navHome').classList.add('active');

    if(page==='searchPage')
      document.getElementById('navSearch').classList.add('active');

    if(page==='messages')
      document.getElementById('navMessages').classList.add('active');

    if(page==='profile')
      document.getElementById('navProfile').classList.add('active');

  }

  renderAll();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =========================================================
   GLOBAL SEARCH
========================================================= */

function globalSearch(){

  const value =
    document
      .getElementById('globalSearch')
      .value
      .trim();

  if(value){

    go('searchPage');

    renderSearch();

  }else{

    renderHome();

  }

}


/* =========================================================
   FILTER
========================================================= */

function getSearchValue(){

  return document
    .getElementById('globalSearch')
    .value
    .trim()
    .toLowerCase();

}


function filterCards(){

  let result =
    cards.filter(function(c){

      return !c.sold;

    });

  const q =
    getSearchValue();

  const club =
    document
      .getElementById('clubFilter')
      ?.value || '';

  const condition =
    document
      .getElementById('conditionFilter')
      ?.value || '';

  const min =
    document
      .getElementById('minPrice')
      ?.value || '';

  const max =
    document
      .getElementById('maxPrice')
      ?.value || '';

  result =
    result.filter(function(c){

      const text =
        `${c.player} ${c.club} ${c.seller}`
          .toLowerCase();

      return (

        (!q || text.includes(q)) &&

        (!club || c.club === club) &&

        (!condition || c.condition === condition) &&

        (!min || +c.price >= +min) &&

        (!max || +c.price <= +max)

      );

    });

  const sort =
    document
      .getElementById('sortFilter')
      ?.value || 'new';

  if(sort==='low'){

    result.sort(
      (a,b)=>+a.price-+b.price
    );

  }

  if(sort==='high'){

    result.sort(
      (a,b)=>+b.price-+a.price
    );

  }

  if(sort==='views'){

    result.sort(
      (a,b)=>(b.views||0)-(a.views||0)
    );

  }

  if(sort==='new'){

    result.sort(
      (a,b)=>b.createdAt-a.createdAt
    );

  }

  return result;

}


/* =========================================================
   CARD
========================================================= */

function createCardHTML(c){

  const isOwn =
    c.seller === user;

  const isFav =
    favorites.includes(c.id);

  const isNew =
    Date.now()-c.createdAt < 86400000;

  const isPopular =
    (c.views||0) >= 40;

  return `

    <article class="card">

      <div
        class="cardImage"
        onclick="openDetails('${esc(c.id)}')"
      >

        <img
          src="${esc(c.image)}"
          alt="${esc(c.player)}"
        >

        <div class="badges">

          ${
            isNew
            ? `<span class="tag new">NEU</span>`
            : ''
          }

          ${
            isPopular
            ? `<span class="tag">BELIEBT</span>`
            : ''
          }

        </div>

        ${
          !isOwn
          ? `
            <button
              class="favoriteBtn ${isFav?'active':''}"
              onclick="event.stopPropagation();toggleFavorite('${esc(c.id)}')"
              aria-label="Favorisieren"
            >
              ${isFav?'♥':'♡'}
            </button>
          `
          : ''
        }

      </div>

      <!-- bewusst unsichtbar auf Startseite -->

      <div class="cardInfo">

        <b>${esc(c.player)}</b>

        <span>
          ${esc(c.club||'Kein Verein')}
        </span>

      </div>

    </article>

  `;

}


/* =========================================================
   HOME
========================================================= */

function renderHome(){

  const container =
    document.getElementById('homeCards');

  if(!container)
    return;

  let result =
    cards.filter(c=>!c.sold);

  const q =
    getSearchValue();

  if(q){

    result =
      result.filter(function(c){

        return `${c.player} ${c.club} ${c.seller}`
          .toLowerCase()
          .includes(q);

      });

  }

  result.sort(
    (a,b)=>b.createdAt-a.createdAt
  );

  container.innerHTML =
    result.length
    ? result.map(createCardHTML).join('')
    : `
      <div class="empty">
        Keine Angebote gefunden.
      </div>
    `;

  document.getElementById('offerCount').textContent =
    result.length+' Angebote';

}


/* =========================================================
   SEARCH PAGE
========================================================= */

function renderSearch(){

  const container =
    document.getElementById('searchCards');

  if(!container)
    return;

  const result =
    filterCards();

  container.innerHTML =
    result.length
    ? result.map(createCardHTML).join('')
    : `
      <div class="empty">
        <b>Keine Karten gefunden.</b>
        <br>
        Ändere deine Suche oder Filter.
      </div>
    `;

  updateClubFilter();

}


/* =========================================================
   CLUB FILTER
========================================================= */

function updateClubFilter(){

  const select =
    document.getElementById('clubFilter');

  if(!select)
    return;

  const old =
    select.value;

  const clubs =
    [...new Set(
      cards
        .map(c=>c.club)
        .filter(Boolean)
    )].sort();

  select.innerHTML =
    `<option value="">Alle Vereine</option>`+
    clubs.map(function(c){

      return `
        <option value="${esc(c)}">
          ${esc(c)}
        </option>
      `;

    }).join('');

  select.value=old;

}


function resetFilters(){

  document.getElementById('globalSearch').value='';
  document.getElementById('minPrice').value='';
  document.getElementById('maxPrice').value='';
  document.getElementById('clubFilter').value='';
  document.getElementById('conditionFilter').value='';
  document.getElementById('sortFilter').value='new';

  renderSearch();

}


/* =========================================================
   FAVORITES
========================================================= */

function toggleFavorite(id){

  const card =
    cards.find(c=>c.id===id);

  if(!card)
    return;

  if(card.seller===user){

    toast('Eigene Karten können nicht favorisiert werden.');

    return;

  }

  if(favorites.includes(id)){

    favorites =
      favorites.filter(x=>x!==id);

    toast('Aus Favoriten entfernt.');

  }else{

    favorites.push(id);

    toast('Zu Favoriten hinzugefügt ♥');

  }

  saveData(KEY.fav,favorites);

  renderAll();

}


/* =========================================================
   DETAIL
========================================================= */

let detailZoom=1;


function openDetails(id){

  const card =
    cards.find(c=>c.id===id);

  if(!card)
    return;

  registerView(id);

  detailZoom=1;

  const detail =
    document.getElementById('detailContent');

  detail.innerHTML=`

    <div class="detail">

      <button
        class="btn detailBack"
        onclick="go('home')"
      >
        ← Zurück
      </button>

      <div class="detailImageBox">

        <img
          id="detailImage"
          class="detailImage"
          src="${esc(card.image)}"
          onclick="zoomDetail(0.25)"
        >

        <div class="zoomControls">

          <button
            class="btn"
            onclick="zoomDetail(-0.25)"
          >
            −
          </button>

          <button
            class="btn"
            onclick="resetDetailZoom()"
          >
            100%
          </button>

          <button
            class="btn"
            onclick="zoomDetail(0.25)"
          >
            +
          </button>

        </div>

      </div>


      <div class="detailInfo">

        <h1>
          ${esc(card.player)}
        </h1>

        <div class="detailClub">
          ${esc(card.club||'Kein Verein')}
          ·
          ${esc(card.condition||'Gut')}
        </div>

        <div class="detailPrice">
          ${(+card.price).toFixed(2)} €
        </div>


        <div class="detailDescription">

          <b>Beschreibung</b>

          <p style="margin-top:6px">
            ${esc(card.description||'Keine Beschreibung.')}
          </p>

        </div>


        <div class="detailSeller">

          <div class="avatar">
            ${esc(card.seller?.[0]?.toUpperCase()||'P')}
          </div>

          <div style="flex:1">

            <b>${esc(card.seller)}</b>

            <div class="muted">
              ${sellerRating(card.seller)}
            </div>

          </div>

          <button
            class="btn"
            onclick="openSeller('${esc(card.seller)}')"
          >
            Profil
          </button>

        </div>


        <div class="detailActions">

          ${
            card.seller!==user && !card.sold
            ? `
              <button
                class="btn primary"
                onclick="buyCard('${esc(card.id)}')"
              >
                Kaufen
              </button>
            `
            : ''
          }

          ${
            card.seller!==user
            ? `
              <button
                class="btn"
                onclick="sendMessage('${esc(card.seller)}')"
              >
                Nachricht
              </button>
            `
            : ''
          }

          ${
            card.seller===user
            ? `
              <button
                class="btn"
                onclick="deleteCard('${esc(card.id)}')"
              >
                Karte löschen
              </button>
            `
            : ''
          }

        </div>

      </div>

    </div>

  `;

  go('detailPage');

}


function zoomDetail(amount){

  detailZoom =
    Math.max(
      .6,
      Math.min(
        2.7,
        detailZoom+amount
      )
    );

  const img =
    document.getElementById('detailImage');

  if(img){

    img.style.transform =
      `scale(${detailZoom})`;

  }

}


function resetDetailZoom(){

  detailZoom=1;

  const img =
    document.getElementById('detailImage');

  if(img){

    img.style.transform='scale(1)';

  }

}


/* =========================================================
   VIEWS
========================================================= */

function registerView(id){

  views[id] ||= [];

  if(!views[id].includes(user)){

    views[id].push(user);

    const card =
      cards.find(c=>c.id===id);

    if(card){

      card.views =
        (card.views||0)+1;

    }

    saveData(KEY.views,views);
    saveData(KEY.cards,cards);

  }

}


/* =========================================================
   SELLER RATING
========================================================= */

function sellerRating(name){

  const list =
    ratings.filter(
      r=>r.seller===name
    );

  if(!list.length)
    return 'Noch keine Bewertung';

  const avg =
    list.reduce(
      (sum,r)=>sum+(+r.rating),
      0
    ) / list.length;

  return `★ ${avg.toFixed(1)} · ${list.length} Bewertungen`;

}


/* =========================================================
   BUY
========================================================= */

function buyCard(id){

  const card =
    cards.find(c=>c.id===id);

  if(!card)
    return;

  const existing =
    requests.find(function(r){

      return (
        r.cardId===id &&
        r.buyer===user &&
        r.status==='pending'
      );

    });

  if(existing){

    toast('Deine Anfrage läuft bereits.');

    return;

  }

  openModal(
    'Kaufanfrage',
    `

      <div class="panel">

        <h2>
          ${esc(card.player)}
        </h2>

        <p>
          ${esc(card.club)}
        </p>

        <div
          class="detailPrice"
          style="margin-top:10px"
        >
          ${(+card.price).toFixed(2)} €
        </div>

      </div>

      <button
        class="btn primary"
        style="width:100%"
        onclick="sendPurchaseRequest('${esc(id)}')"
      >
        Kaufanfrage senden
      </button>

    `
  );

}


function sendPurchaseRequest(id){

  const card =
    cards.find(c=>c.id===id);

  if(!card)
    return;

  requests.push({

    id:'r'+Date.now(),

    cardId:id,

    player:card.player,

    price:+card.price,

    buyer:user,

    seller:card.seller,

    status:'pending',

    createdAt:Date.now()

  });

  notificationsData.push({

    id:'n'+Date.now(),

    user:card.seller,

    text:`${user} möchte ${card.player} kaufen.`,

    read:false,

    createdAt:Date.now()

  });

/* =========================================================
   ACCEPT / DECLINE
========================================================= */

function acceptRequest(id){

  const request =
    requests.find(r=>r.id===id);

  if(!request || request.seller!==user)
    return;

  request.status='accepted';

  const card =
    cards.find(c=>c.id===request.cardId);

  if(card){

    card.sold=true;
    card.soldTo=request.buyer;

  }

  requests.forEach(function(r){

    if(
      r.cardId===request.cardId &&
      r.id!==id &&
      r.status==='pending'
    ){

      r.status='declined';

    }

  });

  wallets[user] =
    (wallets[user]||0)+request.price;

  notificationsData.push({

    id:'n'+Date.now(),

    user:request.buyer,

    text:`Deine Kaufanfrage für ${request.player} wurde angenommen.`,

    read:false,

    createdAt:Date.now()

  });

  saveData(KEY.req,requests);
  saveData(KEY.cards,cards);
  saveData(KEY.wallet,wallets);
  saveData(KEY.not,notificationsData);

  toast('Verkauf angenommen.');

  renderAll();

}


function declineRequest(id){

  const request =
    requests.find(r=>r.id===id);

  if(!request || request.seller!==user)
    return;

  request.status='declined';

  saveData(KEY.req,requests);

  toast('Anfrage abgelehnt.');

  renderAll();

}

        </button>

function saveProfileChanges(){

  const newName =
    document
      .getElementById('editUsername')
      .value
      .trim();

  const newBio =
    document
      .getElementById('editBio')
      .value
      .trim();

  if(!newName){

    toast('Benutzername darf nicht leer sein.');

    return;

  }

  const oldName=user;

  if(
    newName!==oldName &&
    accounts.some(
      a=>a.username.toLowerCase()===newName.toLowerCase()
    )
  ){

    toast('Benutzername bereits vergeben.');

    return;

  }

  cards.forEach(function(c){

    if(c.seller===oldName)
      c.seller=newName;

  });

  requests.forEach(function(r){

    if(r.buyer===oldName)
      r.buyer=newName;

    if(r.seller===oldName)
      r.seller=newName;

  });

  messages.forEach(function(m){

    if(m.from===oldName)
      m.from=newName;

    if(m.to===oldName)
      m.to=newName;

  });

  ratings.forEach(function(r){

    if(r.seller===oldName)
      r.seller=newName;

    if(r.buyer===oldName)
      r.buyer=newName;

  });

  notificationsData.forEach(function(n){

    if(n.user===oldName)
      n.user=newName;

  });

  wallets[newName]=wallets[oldName]||0;

  if(newName!==oldName)
    delete wallets[oldName];

  const account =
    accounts.find(
      a=>a.username===oldName
    );

  if(account){

    account.username=newName;
    account.bio=newBio;

  }

  user=newName;

  profile={
    username:newName,
    bio:newBio||'Fußballkarten-Sammler'
  };

  localStorage.setItem(
    KEY.user,
    user
  );

  saveData(KEY.profile,profile);
  saveData(KEY.cards,cards);
  saveData(KEY.req,requests);
  saveData(KEY.msg,messages);
  saveData(KEY.rating,ratings);
  saveData(KEY.not,notificationsData);
  saveData(KEY.accounts,accounts);
  saveData(KEY.wallet,wallets);

  closeModal();

  toast('Profil gespeichert.');

  renderAll();

}

========================================================= */

function previewImage(event){

  const file =
    event.target.files?.[0];

  if(!file)
    return;

  const reader =
    new FileReader();

  reader.onload=function(e){

    const preview =
      document.getElementById('imagePreview');

    preview.src=e.target.result;

    preview.style.display='block';

    document.getElementById(
      'uploadText'
    ).style.display='none';

  };

  reader.readAsDataURL(file);

}


function createCard(){

  const player =
    document
      .getElementById('playerInput')
      .value
      .trim();

  const club =
    document
      .getElementById('clubInput')
      .value
      .trim();

  const price =
    +document
      .getElementById('priceInput')
      .value;

  const condition =
    document
      .getElementById('conditionInput')
      .value;

  const description =
    document
      .getElementById('descriptionInput')
      .value
      .trim();

  const preview =
    document
      .getElementById('imagePreview');

  if(!player || !club || !price){

    toast('Spieler, Verein und Preis ausfüllen.');

    return;

  }

  if(
    !preview.src ||
    preview.style.display==='none'
  ){

    toast('Bitte zuerst ein Bild auswählen.');

    return;

  }

  cards.unshift({

    id:'card'+Date.now(),

    player:player,

    club:club,

    price:price,

    condition:condition,

    description:description,

    image:preview.src,

    seller:user,

    createdAt:Date.now(),

    views:0,

    sold:false

  });

  saveData(KEY.cards,cards);

  document.getElementById('playerInput').value='';
  document.getElementById('clubInput').value='';
  document.getElementById('priceInput').value='';
  document.getElementById('descriptionInput').value='';

  preview.src='';
  preview.style.display='none';

  document.getElementById(
    'uploadText'
  ).style.display='block';

  document.getElementById(
    'imageInput'
  ).value='';

  toast('Karte eingestellt 🎉');

  go('home');

}


/* =========================================================
   DELETE CARD
========================================================= */

function deleteCard(id){

  const card =
    cards.find(c=>c.id===id);

  if(!card || card.seller!==user)
    return;

  if(!confirm('Karte wirklich löschen?'))
    return;

  cards =
    cards.filter(
      c=>c.id!==id
    );

  favorites =
    favorites.filter(
      x=>x!==id
    );

  saveData(KEY.cards,cards);
  saveData(KEY.fav,favorites);

  toast('Karte gelöscht.');

  go('home');

}

    requests.filter(

    'profileRating'
  ).textContent =
    average===null
    ? 'Noch keine Bewertung'
    : `★ ${average.toFixed(1)} · ${ownRatings.length} Bewertungen`;

function renderMessages(){

    [
      ...new Set(
        messages

    'messageList'

          messages
            .filter(
              m=>m.from===person ||
                 m.to===person

            .sort(
              (a,b)=>b.createdAt-a.createdAt
            );

        const last =
          conversation[0];

        const unread =
          messages.filter(
            m=>
              m.from===person &&
              m.to===user &&
              !m.read
          ).length;

        return `

          <div
            class="item"
            onclick="openChat('${esc(person)}')"
            style="cursor:pointer"
          >

            <div class="itemLeft">

              <div class="avatar">
                ${esc(person[0]?.toUpperCase()||'P')}
              </div>

              <div>

                <b>
                  ${esc(person)}
                </b>

                <p class="muted">
                  ${esc(last?.text||'')}
                </p>

              </div>

            </div>

            ${
              unread
              ? `
                <span class="status accepted">
                  ${unread} neu
                </span>
              `
              : ''
            }

          </div>

        `;

      }).join('')
    : `
      <div class="empty">
        Noch keine Nachrichten.
      </div>
    `;

}

/* =========================================================
   MODAL
========================================================= */

function openModal(title,html){

  document.getElementById(
    'modalTitle'
  ).textContent=title;

  document.getElementById(
    'modalContent'
  ).innerHTML=html;

  document.getElementById(
    'modal'
  ).classList.add('show');

}


function closeModal(event){

  if(
    event &&
    event.target!==event.currentTarget
  )
    return;

  document.getElementById(
    'modal'
  ).classList.remove('show');

}
