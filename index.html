<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cards</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --panel:#111;
  --panel2:#171717;
  --panel3:#202020;
  --text:#fff;
  --muted:#a1a1aa;
  --border:#292929;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   HEADER
========================= */

header{
  background:#050505;
  border-bottom:1px solid #202020;
  padding:20px 18px;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.logo h1{
  margin:0;
  font-size:25px;
}

.logo p{
  margin:3px 0 0;
  color:#888;
  font-size:13px;
}

/* =========================
   PROFILE TOP
========================= */

.profile-bar{
  background:#0d0d0d;
  border-bottom:1px solid #242424;
  position:sticky;
  top:0;
  z-index:1000;
}

.profile-inner{
  max-width:1250px;
  margin:auto;
  min-height:65px;
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-spacer{
  flex:1;
}

.profile-user{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-weight:bold;
}

.profile-edit-btn{
  border:1px solid #333;
  background:#181818;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.profile-edit-btn:hover{
  background:#252525;
}

/* =========================
   SEARCH
========================= */

.search-area{
  background:#0b0b0b;
  padding:18px;
  border-bottom:1px solid #1d1d1d;
}

.search-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  gap:10px;
}

.search-box{
  flex:1;
  background:#171717;
  border:1px solid #303030;
  color:#fff;
  padding:14px 16px;
  border-radius:13px;
  font-size:16px;
  outline:none;
}

.search-box:focus{
  border-color:#666;
}

.search-box::placeholder{
  color:#777;
}

/* =========================
   CONTAINER
========================= */

.container{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

/* =========================
   NAVIGATION
========================= */

.navigation{
  position:sticky;
  top:65px;
  z-index:900;
  display:flex;
  gap:8px;
  padding:12px 0;
  margin-bottom:20px;
  background:var(--bg);
  overflow-x:auto;
  scrollbar-width:none;
}

.navigation::-webkit-scrollbar{
  display:none;
}

.navigation button{
  position:relative;
  border:1px solid #292929;
  background:#151515;
  color:#aaa;
  padding:12px 16px;
  border-radius:12px;
  font-weight:bold;
  white-space:nowrap;
  cursor:pointer;
  transition:.18s;
}

.navigation button:hover{
  background:#222;
  color:#fff;
}

.navigation button.active{
  background:#fff;
  color:#000;
  border-color:#fff;
}

.badge{
  position:absolute;
  top:-7px;
  right:-5px;
  min-width:20px;
  height:20px;
  padding:2px 6px;
  border-radius:20px;
  background:#ef4444;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #080808;
}

/* =========================
   PAGES
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.page-title h2{
  margin:0;
}

/* =========================
   SELL
========================= */

.sell{
  background:linear-gradient(145deg,#171717,#0e0e0e);
  border:1px solid #292929;
  border-radius:20px;
  padding:22px;
  margin-bottom:20px;
}

.sell h2{
  margin:0 0 6px;
}

.sell p{
  color:#999;
  margin-top:0;
}

.sell-form{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:18px;
}

.input{
  width:100%;
  background:#080808;
  border:1px solid #303030;
  color:#fff;
  padding:13px;
  border-radius:11px;
  outline:none;
}

.input:focus{
  border-color:#777;
}

.photo-input{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  color:#000;
  border-radius:11px;
  padding:13px;
  font-weight:bold;
  cursor:pointer;
  min-height:46px;
}

.photo-input input{
  display:none;
}

.sell-button{
  border:none;
  border-radius:11px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
  padding:13px;
}

.sell-button:hover{
  background:#ddd;
}

/* =========================
   CARDS
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
}

.card{
  position:relative;
  background:#111;
  border:1px solid #252525;
  border-radius:18px;
  padding:12px;
  overflow:hidden;
  transition:.18s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#444;
}

.card-image{
  width:100%;
  height:220px;
  background:#1a1a1a;
  border-radius:13px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.new-badge{
  position:absolute;
  top:9px;
  left:9px;
  background:#fff;
  color:#000;
  font-size:11px;
  font-weight:bold;
  padding:6px 8px;
  border-radius:8px;
  z-index:2;
}

.sold-badge{
  position:absolute;
  top:9px;
  right:9px;
  background:#ef4444;
  color:#fff;
  font-size:11px;
  font-weight:bold;
  padding:6px 8px;
  border-radius:8px;
  z-index:2;
}

.card h3{
  margin:12px 2px 4px;
  font-size:17px;
}

.info{
  color:#999;
  margin:6px 2px;
  font-size:14px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin:10px 2px;
}

.card-actions{
  display:grid;
  gap:7px;
  margin-top:10px;
}

.card button{
  width:100%;
  border:none;
  border-radius:9px;
  padding:10px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.card button:hover{
  background:#ddd;
}

.card button.gray{
  background:#242424;
  color:#fff;
}

.card button.gray:hover{
  background:#303030;
}

.card button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.favorite-row{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:13px;
  margin-top:10px;
}

/* =========================
   REQUESTS
========================= */

.request-list{
  display:grid;
  gap:12px;
}

.request{
  background:#111;
  border:1px solid #292929;
  border-radius:17px;
  padding:16px;
}

.request-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.request-image{
  width:90px;
  height:90px;
  object-fit:contain;
  background:#1c1c1c;
  border-radius:12px;
  flex-shrink:0;
}

.request-info{
  flex:1;
}

.request-info h3{
  margin:0 0 7px;
}

.request-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.accept-btn,
.reject-btn,
.rate-btn{
  border:none;
  padding:11px 15px;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
  flex:1;
}

.accept-btn{
  background:#16a34a;
}

.reject-btn{
  background:#dc2626;
}

.rate-btn{
  background:#fff;
  color:#000;
}

.status{
  display:inline-block;
  padding:6px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  margin-top:5px;
}

.status.open{
  background:#332b15;
  color:#facc15;
}

.status.accepted{
  background:#102d1b;
  color:#4ade80;
}

.status.rejected{
  background:#321717;
  color:#f87171;
}

/* =========================
   PROFILE PAGE
========================= */

.seller-profile{
  background:#111;
  border:1px solid #292929;
  border-radius:20px;
  padding:22px;
}

.seller-header{
  display:flex;
  align-items:center;
  gap:15px;
}

.big-avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
  overflow:hidden;
}

.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.rating{
  font-size:20px;
  margin-top:7px;
}

.seller-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:20px;
}

.seller-stat{
  background:#1a1a1a;
  border:1px solid #292929;
  border-radius:13px;
  padding:15px;
  text-align:center;
}

.seller-stat strong{
  display:block;
  font-size:22px;
}

.seller-stat span{
  color:#888;
  font-size:12px;
}

.rating-stars{
  display:flex;
  justify-content:center;
  gap:6px;
  margin:15px 0;
}

.rating-stars button{
  border:none;
  background:#222;
  color:#fff;
  border-radius:8px;
  padding:8px;
  font-size:19px;
  cursor:pointer;
}

.rating-stars button.selected{
  background:#594d18;
}

/* =========================
   EMPTY
========================= */

.empty{
  background:#111;
  border:1px solid #292929;
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:#888;
}

/* =========================
   PROFILE MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:18px;
}

.modal-box{
  width:100%;
  max-width:430px;
  background:#111;
  border:1px solid #333;
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.modal-box h2{
  margin-top:0;
}

.modal-buttons{
  display:grid;
  gap:8px;
  margin-top:12px;
}

.modal-primary{
  border:none;
  background:#fff;
  color:#000;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.modal-secondary{
  border:none;
  background:#252525;
  color:#fff;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.profile-photo-label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100px;
  border:1px dashed #555;
  border-radius:14px;
  background:#171717;
  cursor:pointer;
  margin-bottom:12px;
  color:#bbb;
  text-align:center;
}

.profile-photo-label input{
  display:none;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  padding:35px 15px;
  color:#666;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

  .cards{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}

@media(max-width:800px){

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .sell-form{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  header{
    padding:15px;
  }

  .header-inner{
    gap:10px;
  }

  .logo h1{
    font-size:21px;
  }

  .logo p{
    display:none;
  }

  .profile-inner{
    padding:8px 12px;
  }

  .profile-name{
    display:none;
  }

  .profile-edit-btn{
    padding:8px 10px;
  }

  .navigation{
    top:57px;
    margin-bottom:13px;
  }

  .container{
    padding:13px;
  }

  .sell{
    padding:16px;
  }

  .sell-form{
    grid-template-columns:1fr;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:9px;
    border-radius:15px;
  }

  .card-image{
    height:175px;
  }

  .card h3{
    font-size:15px;
  }

  .price{
    font-size:18px;
  }

  .card button{
    font-size:12px;
    padding:9px 5px;
  }

  .request-top{
    align-items:flex-start;
  }

  .request-image{
    width:75px;
    height:75px;
  }

  .request-actions{
    flex-direction:column;
  }

  .seller-stats{
    grid-template-columns:1fr;
  }

}

@media(max-width:380px){

  .cards{
    grid-template-columns:1fr;
  }

  .card-image{
    height:230px;
  }

}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">⚽</div>
      <div>
        <h1>Pixel Cards</h1>
        <p>Der Marktplatz für Fußballkarten</p>
      </div>
    </div>
  </div>
</header>

<!-- =========================
     PROFIL OBEN RECHTS
========================= -->

<div class="profile-bar">

  <div class="profile-inner">

    <div class="profile-spacer"></div>

    <div
      class="profile-user"
      onclick="openOwnProfile()"
    >

      <div id="avatar" class="avatar">?</div>

      <span id="profileName" class="profile-name">
        Kein Benutzer
      </span>

    </div>

    <button
      class="profile-edit-btn"
      onclick="openProfileEditor()"
    >
      ✏️ Profil
    </button>

  </div>

</div>

<!-- =========================
     SUCHE
========================= -->

<div class="search-area">

  <div class="search-inner">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 Spieler, Verein oder Karte suchen..."
    >

  </div>

</div>

<div class="container">

<!-- =========================
     VERKAUFEN
========================= -->

<div class="sell">

  <h2>🎟️ Karte verkaufen</h2>

  <p>
    Stelle deine Fußballkarte schnell und einfach ein.
  </p>

  <form id="sellForm" class="sell-form">

    <input
      id="player"
      class="input"
      type="text"
      placeholder="Spieler"
      required
    >

    <input
      id="club"
      class="input"
      type="text"
      placeholder="Verein"
      required
    >

    <input
      id="price"
      class="input"
      type="number"
      min="0"
      step="0.01"
      placeholder="Preis in €"
      required
    >

    <label class="photo-input">
      📷 Foto hinzufügen
      <input
        id="image"
        type="file"
        accept="image/*"
        required
      >
    </label>

    <button
      class="sell-button"
      type="submit"
    >
      ➕ Karte einstellen
    </button>

  </form>

</div>

<!-- =========================
     NAVIGATION
========================= -->

<div class="navigation">

  <button
    id="navCards"
    class="active"
    onclick="showPage('cardsPage','navCards')"
  >
    🔥 Karten
  </button>

  <button
    id="navFavorites"
    onclick="showPage('favoritesPage','navFavorites')"
  >
    ❤️ Favoriten
    <span
      id="favoriteBadge"
      class="badge"
      style="display:none"
    >0</span>
  </button>

  <button
    id="navMine"
    onclick="showPage('minePage','navMine')"
  >
    🃏 Meine Karten
  </button>

  <button
    id="navRequests"
    onclick="showPage('requestsPage','navRequests')"
  >
    📩 Anfragen
    <span
      id="requestBadge"
      class="badge"
      style="display:none"
    >0</span>
  </button>

  <button
    id="navProfile"
    onclick="showPage('profilePage','navProfile')"
  >
    👤 Profil
  </button>

</div>

<!-- =========================
     KARTEN
========================= -->

<section id="cardsPage" class="page active">

  <div class="page-title">
    <h2>🔥 Aktuelle Karten</h2>
  </div>

  <div id="cards" class="cards"></div>

</section>

<!-- =========================
     FAVORITEN
========================= -->

<section id="favoritesPage" class="page">

  <div class="page-title">
    <h2 id="favoriteTitle">
      ❤️ Favoriten (0)
    </h2>
  </div>

  <div
    id="favoriteCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     MEINE KARTEN
========================= -->

<section id="minePage" class="page">

  <div class="page-title">
    <h2>🃏 Meine Karten</h2>
  </div>

  <div
    id="myCards"
    class="cards"
  ></div>

</section>

<!-- =========================
     ANFRAGEN
========================= -->

<section id="requestsPage" class="page">

  <div class="page-title">
    <h2 id="requestTitle">
      📩 Meine Kaufanfragen (0)
    </h2>
  </div>

  <div
    id="purchaseRequests"
    class="request-list"
  ></div>

  <br>

  <div class="page-title">
    <h2 id="sellerRequestTitle">
      📥 Anfragen für meine Karten (0)
    </h2>
  </div>

  <div
    id="sellerRequests"
    class="request-list"
  ></div>

</section>

<!-- =========================
     PROFIL
========================= -->

<section id="profilePage" class="page">

  <div class="page-title">
    <h2>👤 Verkäuferprofil</h2>
  </div>

  <div
    id="profileBox"
    class="seller-profile"
  ></div>

</section>

</div>

<footer>
  © 2026 Pixel Cards
</footer>

<script>

/* =========================================================
   DATEN
========================================================= */

function getUsername(){

  return localStorage.getItem("pixelUsername") || "";

}

function getProfileImage(){

  return localStorage.getItem("pixelProfileImage") || "";

}

function getCards(){

  try{
    return JSON.parse(
      localStorage.getItem("footballCards")
    ) || [];
  }catch(e){
    return [];
  }

}

function getRequests(){

  try{
    return JSON.parse(
      localStorage.getItem("purchaseRequests")
    ) || [];
  }catch(e){
    return [];
  }

}

function getFavorites(){

  try{
    return JSON.parse(
      localStorage.getItem("favoriteCards")
    ) || [];
  }catch(e){
    return [];
  }

}

function getFavoriteUsers(){

  try{
    return JSON.parse(
      localStorage.getItem("favoriteUsers")
    ) || {};
  }catch(e){
    return {};
  }

}

function getRatings(){

  try{
    return JSON.parse(
      localStorage.getItem("sellerRatings")
    ) || {};
  }catch(e){
    return {};
  }

}

function saveData(key,data){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}


/* =========================================================
   PROFIL
========================================================= */

function updateProfile(){

  const name=getUsername();

  const avatar=document.getElementById("avatar");

  document.getElementById("profileName").textContent=
    name || "Kein Benutzer";

  const image=getProfileImage();

  if(image){

    avatar.innerHTML=
      `<img src="${image}" alt="Profilbild">`;

  }else{

    avatar.textContent=
      name
      ? name.charAt(0).toUpperCase()
      : "?";

  }

}


function saveUsername(){

  const input=
    document.getElementById("profileUsernameInput");

  if(!input) return;

  const name=input.value.trim();

  if(!name){

    alert("Bitte gib einen Benutzernamen ein.");
    return;

  }

  const oldName=getUsername();

  localStorage.setItem(
    "pixelUsername",
    name
  );

  /*
   * Bestehende Karten werden bewusst NICHT
   * automatisch umbenannt. Dadurch bleiben
   * die bisherigen Daten stabil.
   */

  updateProfile();
  loadAll();

  if(oldName && oldName!==name){

    alert(
      "👤 Benutzername geändert zu: "+name
    );

  }else{

    alert("👤 Profil gespeichert!");

  }

}


function openProfileEditor(){

  const overlay=document.createElement("div");

  overlay.className="modal";

function showPage(pageId,buttonId){

  document.querySelectorAll(".page")
    .forEach(page=>{

    document.getElementById(pageId);

  if(page){
    page.classList.add("active");

    document.getElementById(buttonId);

  if(button){
    button.classList.add("active");

}

function isFavorite(cardId){

  const username=getUsername();

  if(!username) return false;

  return getFavorites().some(item=>
    item.id===cardId &&
    item.favoriteBy===username
  );

}


function getFavoriteCount(cardId){

  const users=getFavoriteUsers();

  if(!Array.isArray(users[cardId])){
    return 0;
  }

  return users[cardId].length;

}


function toggleFavorite(cardId){

  const username=getUsername();

  if(!username){

    alert(
      "👤 Bitte zuerst einen Benutzernamen festlegen."
    );

    return;

  }

  const cards=getCards();

  const card=
    cards.find(c=>c.id===cardId);

  if(!card) return;

  if(card.owner===username){

    alert(
      "🚫 Deine eigene Karte kannst du nicht favorisieren."
    );

    return;

  }

  let favorites=getFavorites();

  const existingIndex=
    favorites.findIndex(item=>
      item.id===cardId &&
      item.favoriteBy===username
    );

  let users=getFavoriteUsers();

  if(!Array.isArray(users[cardId])){
    users[cardId]=[];
  }

  if(existingIndex!==-1){

    favorites.splice(
      existingIndex,
      1
    );

    users[cardId]=
      users[cardId].filter(
        user=>user!==username
      );

  }else{

    favorites.push({
      id:cardId,
      favoriteBy:username
    });

    if(
      !users[cardId]
        .includes(username)
    ){

      users[cardId].push(username);

    }

  }

  saveData(
    "favoriteCards",
    favorites
  );

  saveData(
    "favoriteUsers",
    users
  );

  loadAll();

}

function createCard(card,box){

  const username=getUsername();

  const favorite=
    isFavorite(card.id);

  const favoriteCount=
    getFavoriteCount(card.id);

  const requests=getRequests();

  const myRequest=
    requests.find(request=>
      request.cardId===card.id &&
      request.buyer===username &&
      (
        request.status==="pending" ||
        request.status==="accepted"
      )
    );

  const item=
    document.createElement("div");

  item.className="card";

  const isNew=
    card.createdAt &&
    Date.now()-
      new Date(card.createdAt).getTime()
      <
      1000*60*60*24*3;

  let badges="";

  if(isNew && !card.sold){

    badges+=
      `<span class="new-badge">
        NEU
      </span>`;

  }

  if(card.sold){

    badges+=
      `<span class="sold-badge">
        VERKAUFT
      </span>`;

  }

  let buyButton="";

  if(card.owner===username){

    buyButton=
      `<button
        class="gray"
        onclick="ownCardMessage()"
      >
        🚫 Deine Karte
      </button>`;

  }else if(!username){

    buyButton=
      `<button
        onclick="needUsername()"
      >
        🛒 Kaufen
      </button>`;

  }else if(card.sold===true){

    buyButton=
      `<button
        class="gray"
        disabled
      >
        ❌ Verkauft
      </button>`;

  }else if(myRequest){

    if(
      myRequest.status==="accepted"
    ){

      buyButton=
        `<button
          class="gray"
          disabled
        >
          ✅ Angenommen
        </button>`;

    }else{

      buyButton=
        `<button
          class="gray"
          disabled
        >
          🕐 Anfrage offen
        </button>`;

    }

  }else{

    buyButton=
      `<button
        onclick="buyCard('${card.id}')"
      >
        🛒 Kaufen
      </button>`;

  }

  let favoriteButton="";

  if(card.owner===username){

    favoriteButton=
      `<button
        class="gray"
        disabled
      >
        🚫 Eigene Karte
      </button>`;

  }else{

    favoriteButton=
      `<button
        class="gray"
        onclick="toggleFavorite('${card.id}')"
      >
        ${
          favorite
          ? "❤️ Favorisiert"
          : "♡ Favorit"
        }
      </button>`;

  }

  item.innerHTML=`

    <div class="card-image">

      ${badges}

      <img
        src="${card.image}"
        alt="${escapeHTML(card.player)}"
      >

    </div>

    <h3>
      ${escapeHTML(card.player)}
    </h3>

    <p class="info">
      ${escapeHTML(card.club)}
    </p>

    <p class="price">
      ${escapeHTML(String(card.price))} €
    </p>

    <div class="favorite-row">

      <span>
        ❤️ ${favoriteCount}
        ${
          favoriteCount===1
          ? "Favorit"
          : "Favoriten"
        }
      </span>

    </div>

    <div class="card-actions">

      <button
        onclick="showCard('${card.id}')"
      >
        👀 Karte ansehen
      </button>

      ${buyButton}

      ${favoriteButton}

      <button
        class="gray"
        onclick="openSellerProfile('${escapeAttribute(card.owner||"")}')"
      >
        👤 Profil ansehen
      </button>

    </div>

  `;

  box.appendChild(item);

}

========================================================= */

function ownCardMessage(){

  alert(
    "🚫 Du kannst deine eigene Karte nicht kaufen."
  );

}


function needUsername(){

  openProfileEditor();

}


function buyCard(cardId){

  const username=getUsername();

  if(!username){

    needUsername();
    return;

  }

  const cards=getCards();

  const card=
    cards.find(c=>c.id===cardId);

  if(!card) return;

  if(card.owner===username){

    ownCardMessage();
    return;

  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const requests=getRequests();

  const existing=
    requests.find(request=>
      request.cardId===cardId &&
      request.buyer===username &&
      (
        request.status==="pending" ||
        request.status==="accepted"
      )
    );

  if(existing){

    alert(
      "🕐 Du hast diese Karte bereits angefragt."
    );

    return;

  }

  const confirmed=confirm(
    "Möchtest du diese Karte kaufen?\n\n"+
    card.player+
    " – "+
    card.club+
    "\n\nPreis: "+
    card.price+
    " €"
  );

  if(!confirmed) return;

  requests.push({

    id:
      Date.now()+
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    cardId:card.id,
    player:card.player,
    club:card.club,
    price:card.price,
    image:card.image,

    buyer:username,
    seller:card.owner,

    status:"pending",

    createdAt:
      new Date().toISOString()

  });

  saveData(
    "purchaseRequests",
    requests
  );

  updateRequestBadge();

  loadAll();

  alert(
    "📩 Kaufanfrage wurde gesendet!"
  );

}

/* =========================================================
   ANNEHMEN
========================================================= */

function acceptRequest(requestId){

  const username=getUsername();

  const requests=getRequests();

  const request=
    requests.find(
      r=>r.id===requestId
    );

  if(!request) return;

  if(request.seller!==username){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage annehmen."
    );

    return;

  }

  if(request.status!=="pending"){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const cards=getCards();

  const card=
    cards.find(
      c=>c.id===request.cardId
    );

  if(!card){

    alert(
      "❌ Die Karte wurde nicht gefunden."
    );

    return;

  }

  if(card.sold===true){

    alert(
      "❌ Diese Karte wurde bereits verkauft."
    );

    return;

  }

  const confirmed=confirm(
    "Möchtest du die Anfrage von "+
    request.buyer+
    " annehmen?"
  );

  if(!confirmed) return;

  request.status="accepted";

  card.sold=true;
  card.soldTo=request.buyer;

  requests.forEach(other=>{

    if(
      other.cardId===request.cardId &&
      other.id!==request.id &&
      other.status==="pending"
    ){

      other.status="rejected";

    }

  });

  saveData(
    "footballCards",
    cards
  );

  saveData(
    "purchaseRequests",
    requests
  );

  loadAll();

  alert(
    "🟢 Anfrage angenommen!"
  );

}

   ABLEHNEN
========================================================= */

function rejectRequest(requestId){

  const username=getUsername();

  const requests=getRequests();

  const request=
    requests.find(
      r=>r.id===requestId
    );

  if(!request) return;

  if(request.seller!==username){

    alert(
      "🚫 Nur der Besitzer der Karte kann diese Anfrage ablehnen."
    );

    return;

  }

  if(request.status!=="pending"){

    alert(
      "Diese Anfrage wurde bereits bearbeitet."
    );

    return;

  }

  const confirmed=confirm(
    "Möchtest du die Anfrage von "+
    request.buyer+
    " wirklich ablehnen?"
  );

  if(!confirmed) return;

  request.status="rejected";

  saveData(
    "purchaseRequests",
    requests
  );

  loadAll();

  alert(
    "🔴 Anfrage abgelehnt."
  );

}

function deleteCard(cardId){

  const username=getUsername();

  let cards=getCards();

  const card=
    cards.find(
      c=>c.id===cardId
    );

  if(!card) return;

  if(card.owner!==username){

    alert(
      "🚫 Du kannst diese Karte nicht löschen."
    );

    return;

  }

  if(
    !confirm(
      "Möchtest du diese Karte wirklich löschen?"
    )
  ){

    return;

  }

  cards=
    cards.filter(
      c=>c.id!==cardId
    );

  saveData(
    "footballCards",
    cards
  );

  let favorites=
    getFavorites()
      .filter(
        item=>item.id!==cardId
      );

  saveData(
    "favoriteCards",
    favorites
  );

  const users=
    getFavoriteUsers();

  delete users[cardId];

  saveData(
    "favoriteUsers",
    users
  );

  loadAll();

}

function loadSellerProfile(seller){

  const box=
    document.getElementById(
      "profileBox"
    );

  const cards=
    getCards().filter(
      card=>card.owner===seller
    );

  const soldCards=
    cards.filter(
      card=>card.sold===true
    );

  const ratings=
    getRatings();

  const sellerRatings=
    Array.isArray(ratings[seller])
    ? ratings[seller]
    : [];

  let average=0;

  if(sellerRatings.length){

    average=
      sellerRatings.reduce(
        (sum,item)=>
          sum+
          Number(item.stars||0),
        0
      )
      /
      sellerRatings.length;

  }

  const rounded=
    Math.round(average);

  const stars=
    rounded>0
    ? "⭐".repeat(rounded)
    : "Noch keine Bewertungen";

  const profileImage=
    seller===getUsername()
    ? getProfileImage()
    : "";

  box.innerHTML=`

    <div class="seller-header">

      <div class="big-avatar">

        ${
          profileImage
          ? `<img
               src="${profileImage}"
               alt="Profilbild"
             >`
          : escapeHTML(
              seller.charAt(0)
                .toUpperCase()
            )
        }

      </div>

      <div>

        <h2>
          ${escapeHTML(seller)}
        </h2>

        <div class="rating">
          ${stars}
        </div>

        <p class="info">
          ${sellerRatings.length}
          ${
            sellerRatings.length===1
            ? "Bewertung"
            : "Bewertungen"
          }
        </p>

      </div>

    </div>

    <div class="seller-stats">

      <div class="seller-stat">
        <strong>
          ${soldCards.length}
        </strong>
        <span>Verkauft</span>
      </div>

      <div class="seller-stat">
        <strong>
          ${cards.length}
        </strong>
        <span>Angebote</span>
      </div>

      <div class="seller-stat">
        <strong>
          ${average
            ? average.toFixed(1)
            : "-"
          }
        </strong>
        <span>Bewertung</span>
      </div>

    </div>

    <br>

    <h2>
      🏆 Angebote
    </h2>

    <div
      id="sellerOffers"
      class="cards"
    ></div>

  `;

  const offers=
    document.getElementById(
      "sellerOffers"
    );

  if(!cards.length){

    offers.innerHTML=
      `<div class="empty">
        Keine Angebote vorhanden.
      </div>`;

    return;

  }

  cards.forEach(card=>{
    createCard(card,offers);
  });

}


/* =========================================================
   BEWERTUNGEN
========================================================= */

function openRating(requestId){

  const requests=getRequests();

  const request=
    requests.find(
      r=>r.id===requestId
    );

  if(!request) return;

  const username=getUsername();

  if(request.buyer!==username){

    alert(
      "🚫 Nur der Käufer kann diese Bewertung abgeben."
    );

    return;

  }

  if(request.status!=="accepted"){

    alert(
      "⭐ Bewerten kannst du erst nach einer angenommenen Anfrage."
    );

    return;

  }

  const ratings=getRatings();

  if(!Array.isArray(
    ratings[request.seller]
  )){

    ratings[request.seller]=[];

  }

  if(
    ratings[request.seller].some(
      rating=>
        rating.requestId===requestId
    )
  ){

    alert(
      "⭐ Du hast diesen Verkäufer bereits bewertet."
    );

    return;

  }

  const overlay=
    document.createElement("div");

  overlay.className="modal";

  overlay.innerHTML=`

    <div class="modal-box">

      <h2>
        ⭐ Verkäufer bewerten
      </h2>

      <p class="info">
        Wie war deine Erfahrung mit
        <strong>
          ${escapeHTML(request.seller)}
        </strong>?
      </p>

      <div
        id="ratingStars"
        class="rating-stars"
      >

        <button data-stars="1">
          ⭐
        </button>

        <button data-stars="2">
          ⭐⭐
        </button>

        <button data-stars="3">
          ⭐⭐⭐
        </button>

        <button data-stars="4">
          ⭐⭐⭐⭐
        </button>

        <button data-stars="5">
          ⭐⭐⭐⭐⭐
        </button>

      </div>

      <div class="modal-buttons">

        <button
          id="submitRating"
          class="modal-primary"
          disabled
        >
          ⭐ Bewertung speichern
        </button>

        <button
          id="cancelRating"
          class="modal-secondary"
        >
          Abbrechen
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  let selected=0;

  const starButtons=
    overlay.querySelectorAll(
      "#ratingStars button"
    );

  starButtons.forEach(button=>{

    button.onclick=()=>{

      selected=
        Number(
          button.dataset.stars
        );

      starButtons.forEach(btn=>{

        btn.classList.toggle(
          "selected",
          Number(
            btn.dataset.stars
          )===selected
        );

      });

      overlay.querySelector(
        "#submitRating"
      ).disabled=false;

    };

  });

  overlay.querySelector(
    "#cancelRating"
  ).onclick=()=>{
    overlay.remove();
  };

  overlay.querySelector(
    "#submitRating"
  ).onclick=()=>{

    if(
      selected<1 ||
      selected>5
    ){

      return;

    }

    const currentRatings=
      getRatings();

    if(
      !Array.isArray(
        currentRatings[request.seller]
      )
    ){

      currentRatings[request.seller]=[];

    }

    if(
      currentRatings[request.seller]
        .some(
          rating=>
            rating.requestId===requestId
        )
    ){

      alert(
        "⭐ Bereits bewertet."
      );

      overlay.remove();

      return;

    }

    currentRatings[
      request.seller
    ].push({

      requestId:request.id,
      buyer:username,
      stars:selected,
      createdAt:
        new Date().toISOString()

    });

    saveData(
      "sellerRatings",
      currentRatings
    );

    overlay.remove();

    loadAll();

    alert(
      "⭐ Bewertung gespeichert!"
    );

  };

}

function showCard(cardId){

  const card=
    getCards().find(
      c=>c.id===cardId
    );

  if(!card) return;

  const overlay=
    document.createElement("div");

  overlay.className="modal";

  const favoriteCount=
    getFavoriteCount(card.id);

  overlay.innerHTML=`

    <div
      class="modal-box"
      style="
        max-height:90vh;
        overflow:auto;
      "
    >

      <img
        src="${card.image}"
        alt="${escapeHTML(card.player)}"
        style="
          width:100%;
          max-height:350px;
          object-fit:contain;
          border-radius:14px;
          background:#181818;
        "
      >

      <h2>
        ${escapeHTML(card.player)}
      </h2>

      <p class="info">
        ${escapeHTML(card.club)}
      </p>

      <p class="price">
        ${escapeHTML(String(card.price))} €
      </p>

      <p class="info">
        ❤️ ${favoriteCount}
        ${
          favoriteCount===1
          ? "Favorit"
          : "Favoriten"
        }
      </p>

      <div class="modal-buttons">

        <button
          class="modal-primary"
          id="closeCard"
        >
          Schließen
        </button>

      </div>

    </div>

  `;

  document.body.appendChild(
    overlay
  );

  overlay.querySelector(
    "#closeCard"
  ).onclick=()=>{
    overlay.remove();
  };

}


/* =========================================================
   VERKAUFEN
========================================================= */

document
  .getElementById("sellForm")
  .addEventListener(
    "submit",
    function(event){

      event.preventDefault();

      const username=
        getUsername();

      if(!username){

        alert(
          "👤 Bitte zuerst ein Profil erstellen."
        );

        openProfileEditor();

        return;

      }

      const player=
        document.getElementById(
          "player"
        ).value.trim();

      const club=
        document.getElementById(
          "club"
        ).value.trim();

      const price=
        document.getElementById(
          "price"
        ).value;

      const file=
        document.getElementById(
          "image"
        ).files[0];

      if(!file){

        alert(
          "📷 Bitte füge ein Foto hinzu."
        );

        return;

      }

      const reader=
        new FileReader();

      reader.onload=function(){

        const image=
          new Image();

        image.onload=function(){

          const canvas=
            document.createElement(
              "canvas"
            );

          const max=700;

          let width=image.width;
          let height=image.height;

          if(
            width>height &&
            width>max
          ){

            height=
              height*max/width;

            width=max;

          }else if(
            height>max
          ){

            width=
              width*max/height;

            height=max;

          }

          canvas.width=width;
          canvas.height=height;

          const ctx=
            canvas.getContext("2d");

          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );

          const imageData=
            canvas.toDataURL(
              "image/jpeg",
              .6
            );

          const cards=getCards();

          cards.unshift({

            id:
              Date.now()+
              "-" +
              Math.random()
                .toString(36)
                .substring(2),

            player:player,
            club:club,
            price:price,
            image:imageData,

            owner:username,

            sold:false,
            soldTo:null,

            createdAt:
              new Date().toISOString()

          });

          try{

            saveData(
              "footballCards",
              cards
            );

          }catch(error){

            alert(
              "Der Speicher ist voll. Bitte lösche zuerst Karten."
            );

            return;

          }

          document
            .getElementById(
              "sellForm"
            )
            .reset();

          loadAll();

          alert(
            "🎉 Deine Karte wurde eingestellt!"
          );

        };

        image.src=
          reader.result;

      };

      reader.readAsDataURL(file);

    }
  );

/* =========================================================
   SICHERHEIT
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value){

  return String(value)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}
